[package]
name = "oxy-metric-monitoring"
description = "Time-series anomaly detection over the semantic-model metric tree"
version.workspace = true
documentation.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
agentic-analytics = { workspace = true }
async-trait = { workspace = true }
augurs-core = { workspace = true }
augurs-ets = { workspace = true, features = ["mstl"] }
augurs-mstl = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
chrono-tz = { workspace = true }
entity = { workspace = true }
humantime = { workspace = true }
oxy-airlayer-compat = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v5"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
