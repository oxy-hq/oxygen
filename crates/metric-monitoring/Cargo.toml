[package]
name = "oxy-metric-monitoring"
description = "Time-series anomaly detection over the semantic-model metric tree"
version.workspace = true
documentation.workspace = true
publish.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
agentic-analytics = { workspace = true }
agentic-core = { workspace = true }      # `TaskSpec`: the delivery task's spec
agentic-runtime = { workspace = true }   # the delivery task's run row and queue row (`notify::enqueue`)
async-trait = { workspace = true }
augurs-core = { workspace = true }
augurs-ets = { workspace = true, features = ["mstl"] }
augurs-mstl = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
chrono-tz = { workspace = true }
entity = { workspace = true }
oxy-airlayer-compat = { workspace = true }
oxy-shared = { workspace = true }   # `duration_opt`, the freshness format
sea-orm = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v5"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# `metric_tree_fit_panel_tests` (from oxy-app's `tests/platform`, decompose
# T-small): runs the panel query on `example_new`'s CSVs through DuckDB, and
# serializes its `set_current_dir`s.
duckdb = { workspace = true }
oxy-semantic = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
