[package]
name = "oxy-previews"
version.workspace = true
authors.workspace = true
description = "Workspace previews' rows: the registry (`workspace_previews`), the preview schemas' registry and DDL, the namespace, the Airway sample sources, the request pin, the read-only table, and the preview run queue with its sweep and the custom-app preview settle. Below the workspace runtime, the workspace middleware, the compile worker and the previews surface (oxy-api-previews); no routes (internal-docs/domain-boundaries.md, End state: no oxy-app)"
documentation.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
# `preview::SandboxSource`: a QuickBooks sample's sandbox company.
agentic-airway = { workspace = true }
# `TaskSpec` and its retry policy: the change check, a compare and a sample
# are queued tasks.
agentic-core = { workspace = true }
# The task kinds the queue seeds (`PREVIEW_AIRWAY_SAMPLE`, ...).
agentic-pipeline = { workspace = true }
# `TaskScope` and the run/queue CRUD the sweep reads.
agentic-runtime = { workspace = true }
# `preview_sql` (the namespace, the refusal, the shadow-map registry) and the
# token broker the schema DDL mints a Writer through.
airhouse = { workspace = true, features = ["admin", "preview-registry"] }
entity = { workspace = true }
# `database::client::establish_connection`: the pin reads the registry.
oxy = { workspace = true }
# `sql_kind`, re-exported at `previews::sql_kind`; `pods::role_manifest::
# pattern_matches`, which the read-only table matches routes with.
oxy-app-core = { workspace = true }
# `staging_pin::check_pinnable` (the pin) and `automation_run::settle` (the
# custom-app preview settle).
oxy-custom-apps = { workspace = true }
# `role_guards::may_preview`: only staff may pin a request to a preview.
oxy-server-authz = { workspace = true }

async-trait = { workspace = true }
chrono = { workspace = true }
# The DuckDB double of the schema DDL (`ddl_duckdb`).
duckdb = { workspace = true }
http = { workspace = true }
regex = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { workspace = true }
tracing = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
serial_test = { workspace = true }

[lints]
workspace = true
