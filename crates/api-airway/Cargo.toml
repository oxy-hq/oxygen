[package]
name = "oxy-api-airway"
version.workspace = true
authors.workspace = true
# Editing this crate re-runs oxy-route-catalog's build script (it watches this
# tree; see crates/route-catalog/build_route_catalog.rs) and rebuilds only
# oxy-server, which mounts it.
description = "Airway's HTTP surface: the boundary-backed pipeline listing, the sp_api marketplace list, and source-report uploads into the S3 landing zone file-based sources read. A sibling crate mounted by oxy-server"
documentation.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
# No oxy-app in the shipped graph (decompose R1, 2026-11-23): the guards come
# from oxy-server-authz, the workspace extractor from oxy-workspace-runtime, and
# the AdminSection seam and pod roles from oxy-app-core. Its route-role test
# moved up to oxy-server (decompose TR), so not even a dev-dependency remains.
oxy-app-core = { workspace = true }  # AppState (the router state type), seams::AdminSection, pods::role_manifest
oxy-server-authz = { workspace = true }  # Action, role_guards, staff::{scope, org_filter}, workspace_role
oxy-workspace-runtime = { workspace = true }  # request::workspace_context::WorkspaceManagerReadOnly
oxy = { workspace = true }
oxy-shared = { workspace = true }
# Report validation runs the real airway source over the bytes, and the upload
# zone is derived by the same function the pipeline run uses.
agentic-airway = { workspace = true }
# The single-flight lease reads and releases (`leases`), through the pipeline
# facade.
agentic-pipeline = { workspace = true }
entity = { workspace = true }
oxy-auth = { workspace = true }
sea-orm = { workspace = true }

axum = { workspace = true, features = ["multipart"] }
base64 = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
tokio = { workspace = true }
aws-config = { workspace = true, features = ["behavior-version-latest"] }
aws-sdk-s3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# The shared harness installs the platform port (`ProcessPlatformDb::install`)
# per test database, as oxy-server does at boot.
oxy-platform = { workspace = true }
# The in-source DB tests' harness (`oxy_test_utils::db`) takes the runtime
# migrator from here; nothing in `src/` needs it since `oxy airway` left.
# `migration` is for the integration group's per-test harness below.
migration = { workspace = true }
agentic-runtime = { workspace = true }
# The integration group (`tests/integration/`) reuses the shared per-test
# database harness (`crates/test-utils/harness/mod.rs`, included by `#[path]`),
# as `oxy-api-automations`' does, so it needs that harness's dependencies too.
airhouse = { workspace = true }
oxy-oltp = { workspace = true }
oxy-cameras = { workspace = true }
url = { workspace = true }
tempfile = { workspace = true }
oxy-test-utils = { workspace = true }
serde_yaml = { workspace = true }
oxy-authz = { workspace = true }   # the platform-scope cases build a bounded grant
tower = { workspace = true, features = ["util"] }   # `oneshot` in the admin mount test
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }

[lints]
workspace = true
