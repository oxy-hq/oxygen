[package]
name = "oxy-api-airway"
version.workspace = true
authors.workspace = true
# Editing this crate re-runs oxy-route-catalog's build script (it watches this
# tree; see crates/route-catalog/build_route_catalog.rs) but does NOT rebuild
# oxy-app — the catalog was moved above it for exactly that reason.
description = "Airway's HTTP surface: the boundary-backed pipeline listing, the sp_api marketplace list, and source-report uploads into the S3 landing zone file-based sources read. A sibling crate mounted by oxy-server"
documentation.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
# The only oxy-app dependency, through `oxy_app::surface` only: the guards and
# workspace extractors, the staff console's admin_db / admin_scope / roles, and
# the AdminSection seam type. oxy-app never depends back on this crate.
# default-features off so a `--no-default-features` build of oxy-server keeps
# dropping V8.
oxy-app = { path = "../app", default-features = false }
oxy-app-core = { workspace = true }  # AppState (the router state type)
oxy = { workspace = true }
oxy-shared = { workspace = true }
# Report validation runs the real airway source over the bytes, and the upload
# zone is derived by the same function the pipeline run uses.
agentic-airway = { workspace = true }
# The single-flight lease reads and releases (`leases`), through the pipeline
# facade.
agentic-pipeline = { workspace = true }
entity = { workspace = true }
oxy-auth = { workspace = true }
sea-orm = { workspace = true }

axum = { workspace = true, features = ["multipart"] }
base64 = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
tokio = { workspace = true }
aws-config = { workspace = true, features = ["behavior-version-latest"] }
aws-sdk-s3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# The in-source DB tests' harness (`oxy_test_utils::db`) takes the runtime
# migrator from here; nothing in `src/` needs it since `oxy airway` left.
# `migration` is for the integration group's per-test harness below.
migration = { workspace = true }
agentic-runtime = { workspace = true }
# The integration group (`tests/integration/`) reuses oxy-app's per-test
# database harness (`crates/app/tests/common/mod.rs`, included by `#[path]`),
# as `oxy-api-automations`' does, so it needs that harness's dependencies too.
airhouse = { workspace = true }
oxy-oltp = { workspace = true }
oxy-cameras = { workspace = true }
url = { workspace = true }
tempfile = { workspace = true }
oxy-test-utils = { workspace = true }
serde_yaml = { workspace = true }
oxy-authz = { workspace = true }   # the platform-scope cases build a bounded grant
tower = { workspace = true, features = ["util"] }   # `oneshot` in the admin mount test
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }

[lints]
workspace = true
