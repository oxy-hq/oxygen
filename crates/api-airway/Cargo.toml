[package]
name = "oxy-api-airway"
version.workspace = true
authors.workspace = true
# Editing this crate re-runs oxy-route-catalog's build script (it watches this
# tree; see crates/route-catalog/build_route_catalog.rs) but does NOT rebuild
# oxy-app — the catalog was moved above it for exactly that reason.
description = "Airway's HTTP surface: the boundary-backed pipeline listing, the sp_api marketplace list, and source-report uploads into the S3 landing zone file-based sources read. A sibling crate mounted by oxy-server"
documentation.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
# The only oxy-app dependency, through `oxy_app::surface` only: the guards and
# workspace extractors, the staff console's admin_db / admin_scope / roles, the
# AdminSection seam type, and the workspace runtime `oxy airway` builds its
# project context from. oxy-app never depends back on this crate.
# default-features off so a `--no-default-features` build of oxy-server keeps
# dropping V8.
oxy-app = { path = "../app", default-features = false }
oxy-app-core = { workspace = true }  # AppState (the router state type)
oxy = { workspace = true }
oxy-shared = { workspace = true }
# Report validation runs the real airway source over the bytes, and the upload
# zone is derived by the same function the pipeline run uses.
agentic-airway = { workspace = true }
# `oxy airway run` / `backfill` / `coverage` drive the pipeline facade and the
# runtime's run tables directly, as the command did in oxy-app.
agentic-pipeline = { workspace = true }
agentic-runtime = { workspace = true }
entity = { workspace = true }
migration = { workspace = true }
oxy-auth = { workspace = true }
sea-orm = { workspace = true }

axum = { workspace = true, features = ["multipart"] }
base64 = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive", "env"] }
minijinja = { workspace = true, features = ["loader"] }
thiserror = { workspace = true }
tokio = { workspace = true }
aws-config = { workspace = true, features = ["behavior-version-latest"] }
aws-sdk-s3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
serde_yaml = { workspace = true }
oxy-authz = { workspace = true }   # the platform-scope cases build a bounded grant
tower = { workspace = true, features = ["util"] }   # `oneshot` in the admin mount test
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
# oxy-app's in-source DB harness (`server/test_support.rs`), included by path:
# its lock-retry jitter.
rand = { workspace = true }

[lints]
workspace = true
