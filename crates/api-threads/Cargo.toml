[package]
name = "oxy-api-threads"
version.workspace = true
authors.workspace = true
# Editing this crate re-runs oxy-route-catalog's build script (it watches this
# tree; see crates/route-catalog/build_route_catalog.rs) but does NOT rebuild
# oxy-app — the catalog was moved above it for exactly that reason.
description = "The conversation surface: a workspace's threads, their logs, artifacts, charts and result files, the agent listing, and org chat with its cross-replica delivery — a sibling crate mounted by oxy-server"
documentation.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
# What this surface still takes from oxy-app, through `oxy_app::surface`: the
# admin and background seams, and `bare_app_state` in tests. oxy-app never
# depends back on this crate. default-features off so a `--no-default-features`
# build of oxy-server keeps dropping V8.
oxy-app = { path = "../app", default-features = false }
# The workspace-context extractors and the runtime artifact mirror the chart and
# result-file reads fall back to.
oxy-workspace-runtime = { workspace = true }
oxy-app-core = { workspace = true }      # AppState
oxy-shared = { workspace = true }        # fleet_role::RouteRoleDecl
oxy-auth = { workspace = true }          # AuthenticatedUserExtractor
# The operator check on reading another user's thread asks the `PlatformOps`
# ring, the same crate the other surfaces ask.
oxy-server-authz = { workspace = true }
oxy = { workspace = true }
# Deleting a thread refuses while a run is live on it (`thread_has_live_run`).
agentic-runtime = { workspace = true }
entity = { workspace = true }
arrow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
parquet = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
# Chat: the SSE stream and the delivery listener's own `LISTEN` connection.
async-stream = { workspace = true }
futures = { workspace = true }
tokio-postgres = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true, features = ["uuid", "chrono", "axum_extras"] }
utoipa-axum = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# The integration group (`tests/integration/`) reuses oxy-app's per-test
# database harness (`crates/app/tests/common/mod.rs`, included by `#[path]`),
# so it needs that harness's dependencies too. Dev-only: nothing here ships.
migration = { workspace = true }
airhouse = { workspace = true }
oxy-oltp = { workspace = true }
oxy-cameras = { workspace = true }
async-trait = { workspace = true }
url = { workspace = true }
tempfile = { workspace = true }
oxy-test-utils = { workspace = true }    # tests/common takes its Postgres from here
agentic-pipeline = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
