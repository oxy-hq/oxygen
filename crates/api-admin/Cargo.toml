[package]
name = "oxy-api-admin"
version.workspace = true
authors.workspace = true
# Editing this crate re-runs oxy-route-catalog's build script (it watches this
# tree; see crates/route-catalog/build_route_catalog.rs) but does NOT rebuild
# oxy-app: oxy-app never depends on it.
description = "The staff console's own surface: the cross-context staff machinery no tenant context owns, starting with the durable task fleet's operator console (/api/admin/internal-jobs) — a sibling crate mounted by oxy-server"
documentation.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
# What this surface takes from oxy-app, all through `oxy_app::surface`: the seam
# types (`AdminNest`, `AdminSection`), the capability it names (`Action`), the pod
# placement (`roles::RouteRole`) and who may act as an org (`assume::may_act_as`,
# which oxy-app's own org and workspace context call too). oxy-app never depends
# back on this crate.
# default-features off so a `--no-default-features` build of oxy-server keeps
# dropping V8.
oxy-app = { path = "../app", default-features = false }
oxy-app-core = { workspace = true }     # AppState, admin_db (connect, db_err, error_body), audit, pagination
oxy = { workspace = true }              # database client (the audit log's and the grant table's connect)
oxy-custom-apps = { workspace = true }  # storage::s3, the client the audit anchor is read with
entity = { workspace = true }           # the audit_events row, the app_admins and app_admin_scope_orgs rows
tracing = { workspace = true }
oxy-auth = { workspace = true }         # the authenticated-user extractor
oxy-server-authz = { workspace = true } # staff::{scope, delegation, stored_grant}, the grant fences; globals' grant cache; assume_liveness, the platform facts
oxy-authz = { workspace = true }        # PlatformRole, Scope, may_delegate (the grant table's bound)
oxy-feature-flags = { workspace = true } # the flag runtime the feature-flag routes read and write (registry, store, cache, evaluate)
oxy-shared = { workspace = true }       # fleet_role: the org flag read's FleetOk row
serde_with = { workspace = true }       # double_option: a PATCH's absent vs null targeting
agentic-runtime = { workspace = true }  # RetentionConfig, DurableTransport (reaper, retention)
axum = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# The staff-scope cases (moved from oxy-app's `platform` group with the
# handlers, admin split PR 7) reuse oxy-app's per-test harness
# (`#[path]`-included from crates/app/tests/common), which clones a per-run
# template database and needs every migrator `Schema::All` can apply — the
# same list as oxy-api-identity — and the staff-scope fixture, included the
# same way (`entity` for its rows).
migration = { workspace = true }
airhouse = { workspace = true }
oxy-oltp = { workspace = true }
agentic-pipeline = { workspace = true }
oxy-cameras = { workspace = true }
tempfile = { workspace = true }
url = { workspace = true }
oxy-test-utils = { workspace = true }   # tests/common takes its Postgres from here
agentic-core = { workspace = true }     # the TaskSpec the cases enqueue
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
