[package]
name = "agentic-llm"
description = "Shared LLM provider abstraction for agentic domains"
version.workspace = true
documentation.workspace = true
publish.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
agentic-core = { workspace = true }
oxy-shared = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
# Pictures travel as base64 on every provider's wire (`images`).
base64 = { workspace = true }
futures-core = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tokio-stream = { workspace = true }
tracing = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
tracing-subscriber = { workspace = true }
# A provider on a loopback port: the request body each one is sent for a
# message with pictures (`images::http_tests`).
wiremock = { workspace = true }

[lints]
workspace = true
