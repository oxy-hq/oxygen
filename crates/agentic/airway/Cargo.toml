[package]
name = "agentic-airway"
description = "Airway ELT pipeline runtime for the agentic framework"
version.workspace = true
documentation.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
agentic-core = { workspace = true }
agentic-runtime = { workspace = true }

# Airway engine itself. Pinned by rev in the workspace Cargo.toml so
# updates are explicit — matches how airform-* and airlayer are pinned.
airway = { workspace = true }

# SeaORM for the airway_* extension entities + migrator. Backs the
# `AirwayPgStateStore` impl of `airway::StateStore`.
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
# Leaf crate: sea-orm + sea-orm-migration + tracing only. Not a platform crate,
# so this does not breach the "no platform deps" rule above.
oxy-migration-tolerance = { workspace = true }
chrono = { workspace = true, features = ["serde"] }

# Standard cohort
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
minijinja = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
# Not dev-only: `report_validation` writes the bytes it is handed to a temp file
# because the airway source reads paths, not buffers. Ephemeral and per-process,
# so it does not make a caller node-local.
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
agentic-runtime = { workspace = true }
sea-orm-migration = { workspace = true }
# Test-only: `migrate_shared_test_db` runs the central migrator ahead of
# RuntimeMigrator so this crate's fixtures don't fight other agentic test
# binaries for migration order on the shared test database (see
# oxy-test-utils::migration for the rationale). This is a dev-dependency
# only — src/ still never depends on a platform crate.
oxy-test-utils = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
testcontainers = { workspace = true, features = [
    "blocking",
    "reusable-containers",
] }
testcontainers-modules = { workspace = true, features = ["postgres"] }
