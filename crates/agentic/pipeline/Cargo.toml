[package]
name = "agentic-pipeline"
description = "High-level API for starting and driving agentic pipelines"
version = "0.5.31"
documentation.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
agentic-airway = { workspace = true }
agentic-analytics = { workspace = true }
agentic-builder = { workspace = true }
agentic-connector = { workspace = true, features = [
    "duckdb",
    "postgres",
    "clickhouse",
    "snowflake",
    "bigquery",
] }
agentic-core = { workspace = true }
agentic-llm = { workspace = true }
agentic-runtime = { workspace = true }
agentic-automation = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
entity = { workspace = true }
futures = { workspace = true }
# Google service-account auth for the `google_sheets` airway source: sign an
# RS256 JWT (jsonwebtoken) and exchange it for an access token (reqwest).
jsonwebtoken = { workspace = true }
reqwest = { workspace = true, features = ["form", "json"] }
serde_yaml = { workspace = true }

sea-orm = { workspace = true }
serde = { workspace = true }
# Structural transient-error matching only (`db_transient`), mirroring
# `crates/platform/src/db/client.rs`. Already in the tree via sea-orm's
# `sqlx-postgres`; this declares the direct use rather than adding a build.
sqlx = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# `migrate_shared_test_db` — central-then-runtime migration ordering shared
# with agentic-runtime / agentic-airway fixtures. See oxy-test-utils::migration.
# The central `migration` crate is reached only through this helper: no test
# here names it, so it is not a direct dependency.
oxy-test-utils = { workspace = true }
tempfile = { workspace = true }
testcontainers = { workspace = true, features = ["blocking", "reusable-containers"] }
testcontainers-modules = { workspace = true, features = ["postgres"] }
oxy-airlayer-compat = { workspace = true }
# Engine types (StateStore trait, PipelineState/Schema) for the run-scoped store
# e2e — `AirwayRunScopedStateStore` implements `airway::StateStore`.
airway = { workspace = true }
