[package]
name = "oxy-app-core"
version.workspace = true
authors.workspace = true
description = "Shared seam for the oxy-app HTTP layer: audit trail, serve-mode detection, org and custom-app subdomain dispatch, and member-role authorization"
documentation.workspace = true
publish.workspace = true
edition.workspace = true

[features]
# `agent_fixture`: a sandbox-agent credential for tests. Dev-dependencies only.
test-fixtures = []

[dependencies]
oxy = { workspace = true }
oxy-auth = { workspace = true }
oxy-compile = { workspace = true }
oxy-git = { workspace = true }
oxy-shared = { workspace = true }
oxy-authz = { workspace = true }
oxy-telemetry = { workspace = true }
entity = { workspace = true }

# AppState field types (lifted here so the router + surface crates can hold it):
oxy-observability = { workspace = true }
agentic-semantic = { workspace = true }
agentic-http = { workspace = true }
oxy-airlayer-compat = { workspace = true }

# `function_seam`: the custom-app function seam traits name these. Both are
# already in this crate's graph through `oxy`.
agentic-connector = { workspace = true }
agentic-pipeline = { workspace = true }

# `sql_kind`: the workspace-preview statement classifier (airhouse's `sql-rules`
# is_read_only and the same sqlparser version, so both read one AST).
airhouse = { workspace = true, features = ["sql-rules"] }
sqlparser = { workspace = true, features = ["visitor"] }

# `customer_runs` and `llm_usage`: the customer-run predicate and the token rate table.
agentic-llm = { workspace = true }
agentic-runtime = { workspace = true }

# `notifications`: the write path (inbox content in the org's OLTP store, the
# queued delivery task) and the default notification email template.
agentic-core = { workspace = true }
oxy-oltp = { workspace = true }
handlebars = { workspace = true }
once_cell = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }

async-trait = { workspace = true }
axum = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
lru = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
serde_yaml = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
