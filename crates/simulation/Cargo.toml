[package]
name = "oxy-simulation"
description = "Declared worlds with a known truth, run forward against the semantic layer"
version.workspace = true
documentation.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
chrono = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
statrs = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tempfile = { workspace = true }

# One integration target, modules inside — a new top-level `tests/*.rs`
# would add another multi-hundred-MB link to every full run.
[[test]]
name = "integration"
path = "tests/integration/main.rs"
