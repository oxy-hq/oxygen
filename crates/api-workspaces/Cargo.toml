[package]
name = "oxy-api-workspaces"
version.workspace = true
authors.workspace = true
# Editing this crate re-runs oxy-route-catalog's build script (it watches this
# tree; see crates/route-catalog/build_route_catalog.rs) but does NOT rebuild
# oxy-app — the catalog was moved above it for exactly that reason.
description = "The workspaces surface: an org's workspace list, rename and delete, a workspace's metadata, members and role overrides, the Oxy-staff lockdown and the app integrations listing — a sibling crate mounted by oxy-server"
documentation.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
# No oxy-app: the guards, extractors and middlewares come from the crates
# below it (R1, 2026-11-23).
# The workspace-context and workspace extractors and the Factory-access
# extractor.
oxy-workspace-runtime = { workspace = true }
oxy-app-core = { workspace = true }      # AppState, the audit writer and RequestActor
oxy-shared = { workspace = true }        # fleet_role::RouteRoleDecl
oxy-auth = { workspace = true }          # AuthenticatedUserExtractor
# The rename, role-override and lockdown doors (`enforce_for`), and the model.
oxy-server-authz = { workspace = true }
oxy = { workspace = true }
oxy-git = { workspace = true }           # git mode, HEAD, the detached label
# The lockdown flushes the custom-app access cache it feeds.
oxy-custom-apps = { workspace = true }
# A deleted workspace's schedules (`scheduler::cleanup_workspace_schedules`).
agentic-pipeline = { workspace = true }
# A deleted workspace's Airhouse tenant record, and a member's broker grants.
airhouse = { workspace = true, features = ["admin"] }
entity = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }           # the list fans the per-workspace reads out
hex = { workspace = true }               # the local-mode storage key
reqwest = { workspace = true }           # StatusCode, as the handlers spell it
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true, features = ["uuid", "chrono", "axum_extras"] }
utoipa-axum = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# The integration group (`tests/integration/`) reuses oxy-app's per-test
# database harness (`crates/app/tests/common/mod.rs`, included by `#[path]`),
# so it needs that harness's dependencies too. Dev-only: nothing here ships.
migration = { workspace = true }
oxy-oltp = { workspace = true }
oxy-cameras = { workspace = true }
agentic-runtime = { workspace = true }
async-trait = { workspace = true }
url = { workspace = true }
tempfile = { workspace = true }
oxy-test-utils = { workspace = true }    # tests/common takes its Postgres from here
serial_test = { workspace = true }       # meta_canary flips a process-global probe
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
