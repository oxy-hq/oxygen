[package]
name = "oxy-api-identity"
version.workspace = true
authors.workspace = true
# Editing this crate re-runs oxy-route-catalog's build script (it watches this
# tree; see crates/route-catalog/build_route_catalog.rs) but does NOT rebuild
# oxy-app — the catalog was moved above it for exactly that reason.
description = "Identity HTTP surface (sign-in, the user routes, personal tokens, legacy API keys, org API access, oxyc login, OIDC exchange, leak response) — a sibling crate mounted by oxy-server"
documentation.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
# What this surface still takes from oxy-app, through `oxy_app::surface`: the
# seam types (`AdminSection`, `GlobalTickSeam`, `TickPass`), and in tests
# `bare_app_state` and the demo seed's persona emails. The role guards, the
# org middlewares, the session plumbing every sign-in path shares and the
# staff-scope fence come from oxy-app-core and oxy-server-authz directly. The
# lifecycle audit is oxy-identity's. oxy-app never depends back on this crate. default-features off so a
# `--no-default-features` build of oxy-server keeps dropping V8.
oxy-app = { path = "../app", default-features = false }
oxy-app-core = { workspace = true }  # AppState, the audit writer, the emails
oxy-feature-flags = { workspace = true }  # the reads `/auth/config` reports
oxy-identity = { workspace = true }  # the token lifecycle audit
oxy-custom-apps = { workspace = true }  # GitHub's OIDC signing keys
oxy = { workspace = true }           # database client
oxy-auth = { workspace = true }      # the token, key and OIDC primitives
oxy-authz = { workspace = true }
oxy-server-authz = { workspace = true }
oxy-shared = { workspace = true }    # OxyError, fleet_role::RouteRoleDecl
oxy-telemetry = { workspace = true } # the OIDC exchange's rejection metric
entity = { workspace = true }

axum = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
garde = { workspace = true, features = ["full"] }
governor = { workspace = true }
handlebars = { workspace = true }  # the magic-link email
hex = { workspace = true }
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"] }
once_cell = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
utoipa = { workspace = true, features = ["uuid", "chrono", "axum_extras"] }
utoipa-axum = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
oxy-app-core = { workspace = true, features = ["test-fixtures"] }
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true, features = ["util"] }
# The DB-backed integration tests (the user directory's, moved from oxy-app
# with the handlers in the admin split, PR 5) reuse oxy-app's harness
# (`#[path]`-included from crates/app/tests/common), which clones a per-run
# template database and needs every migrator `Schema::All` can apply — same
# list as oxy-api-frontline.
migration = { workspace = true }
airhouse = { workspace = true }
oxy-oltp = { workspace = true }
agentic-runtime = { workspace = true }
agentic-pipeline = { workspace = true }
oxy-cameras = { workspace = true }
tempfile = { workspace = true }
oxy-test-utils = { workspace = true }      # tests/common takes its Postgres from here

[lints]
workspace = true
