[package]
name = "oxy-api-metric-monitoring"
version.workspace = true
authors.workspace = true
# Editing this crate re-runs oxy-route-catalog's build script (it watches this
# tree; see crates/route-catalog/build_route_catalog.rs) and rebuilds only
# oxy-server, which mounts it.
description = "The metric-monitoring HTTP surface (the IDE's metric tree and the anomaly inbox) — a sibling crate mounted by oxy-server"
documentation.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
# No oxy-app dependency (decompose R1, 2026-11-23): the platform runtime comes
# from the crates that hold it, and oxy-app never depends on this crate.
oxy-app-core = { workspace = true }            # AppState, write_hold, preagg_context, PreaggCacheCtx, seams::TaskSeam
oxy-server-authz = { workspace = true }        # EffectiveWorkspaceRole
oxy-workspace-runtime = { workspace = true }   # the workspace extractors, the metric-tree executor and the core the customer-app twins share
oxy-metric-monitoring = { workspace = true }   # the computation: detection, scan, the tree's pure half
oxy-airlayer-compat = { workspace = true }
oxy-semantic = { workspace = true }
oxy-world-model = { workspace = true }         # the one instance-scope rule (`instance_scope_filters`)
oxy-auth = { workspace = true }
oxy-shared = { workspace = true }              # fleet_role::RouteRoleDecl
oxy = { workspace = true }
entity = { workspace = true }
agentic-analytics = { workspace = true }       # the `MetricTreeRunner` trait, anomaly periods
agentic-http = { workspace = true }            # `AgenticState`, the anomaly handlers' database handle
agentic-runtime = { workspace = true }         # the manual scan's run row; `TaskExecutor`
agentic-core = { workspace = true }            # the delivery task's spec and outcome
async-trait = { workspace = true }
futures = { workspace = true }
tokio-util = { workspace = true }
oxy-slack = { workspace = true }               # the org's Slack installation (insights delivery)
oxy-slack-client = { workspace = true }        # the channel post
axum = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# The integration group (`tests/integration/`) reuses the shared per-test
# database harness (`crates/test-utils/harness/mod.rs`, included by `#[path]`),
# so it needs that harness's dependencies too. Dev-only: nothing here ships.
migration = { workspace = true }
agentic-pipeline = { workspace = true }  # the harness runs its migrators
oxy-cameras = { workspace = true }       # ...and the cameras migrator
airhouse = { workspace = true }
oxy-oltp = { workspace = true }
oxy-test-utils = { workspace = true }
url = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
wiremock = { workspace = true }          # the insights delivery's Slack, mocked

[lints]
workspace = true
