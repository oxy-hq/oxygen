[package]
name = "oxy-api-operating-graph"
version.workspace = true
authors.workspace = true
# Editing this crate re-runs oxy-route-catalog's build script (it watches this
# tree; see crates/route-catalog/build_route_catalog.rs) but does NOT rebuild
# oxy-app — the catalog was moved above it for exactly that reason.
description = "Operating-graph HTTP surface (locations, positions, assignments, work items) — a sibling crate mounted by oxy-server"
documentation.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
# No oxy-app here (decompose R1 S10): the role guards are oxy-server-authz's
# and the org middlewares oxy-app-core's. Only the route_roles test reaches
# oxy-app (see [dev-dependencies]).
oxy-app-core = { workspace = true }  # AppState (router state), the audit writer, the graph's pure half, org middlewares
oxy-server-authz = { workspace = true }  # OrgAdmin / OrgMemberStrict role guards
oxy = { workspace = true }           # database client
oxy-auth = { workspace = true }      # AuthenticatedUserExtractor
oxy-shared = { workspace = true }    # fleet_role::RouteRoleDecl
entity = { workspace = true }

axum = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }   # a location's timezone is validated as an IANA name
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# The route_roles test installs oxy-app's real router declarations beside this
# crate's (`install_route_declarations_for_tests_with`), so it proves these
# routes win against the router's patterns. default-features off so V8 stays out.
oxy-app = { path = "../app", default-features = false }
# The DB-backed integration tests reuse oxy-app's harness (`#[path]`-included
# from crates/app/tests/common), which clones a per-run template database and
# needs every migrator `Schema::All` can apply.
oxy-custom-apps = { workspace = true }     # operating_graph: the `ctx.org` directory reads
migration = { workspace = true }
airhouse = { workspace = true }
oxy-oltp = { workspace = true }
agentic-runtime = { workspace = true }
agentic-pipeline = { workspace = true }      # tests/common
agentic-semantic = { workspace = true }      # operating_graph: the binding's semantic-layer fixture
oxy-airlayer-compat = { workspace = true }   # operating_graph: the same fixture's schema types
oxy-cameras = { workspace = true }
tempfile = { workspace = true }
url = { workspace = true }
oxy-test-utils = { workspace = true }      # tests/common takes its Postgres from here
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
