[package]
name = "oxy-api-tenancy"
version.workspace = true
authors.workspace = true
# Editing this crate re-runs oxy-route-catalog's build script (it watches this
# tree; see crates/route-catalog/build_route_catalog.rs) and rebuilds only
# oxy-server, which mounts it.
description = "Tenancy HTTP surface — org onboarding (workspace create/demo/import, readiness, uploads) and the partner console — mounted by oxy-server"
documentation.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
oxy-app-core = { workspace = true }     # AppState (router state), the admin seam (AdminSection) + the audit reader
oxy-workspace-health = { workspace = true } # the partner console's health rollup
oxy-tenancy = { workspace = true }      # org teams / app-access grants
oxy-custom-apps = { workspace = true }  # publish_authz (consent_enabled), the caches write_access flushes
oxy-server-authz = { workspace = true } # partner_authz, partner_allows, assume_liveness, enforce_for
oxy-billing = { workspace = true }      # billing_service (seat sync after a member joins or leaves)
oxy-compile-runtime = { workspace = true } # enqueue_import_compile (GitHub import)
oxy-workspace-runtime = { workspace = true } # WorkspacePath, WorkspaceManagerReadOnly, workspace_middleware
oxy-authz = { workspace = true }        # Action/Resource rings (app_mgmt access checks)
oxy = { workspace = true }
oxy-auth = { workspace = true }
oxy-shared = { workspace = true }       # fleet_role::RouteRoleDecl
oxy-project = { workspace = true }
oxy-git = { workspace = true }
oxy-llm = { workspace = true }          # validate_provider_key (test-llm-key)
entity = { workspace = true }
axum = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }            # tokio::spawn (fire-and-forget invite email) + #[tokio::test]
tracing = { workspace = true }
# Tenancy's own: org slugs, invitation email, OLTP branch cleanup on org delete,
# Airhouse credential revocation on member removal, workspace provisioning.
airhouse = { workspace = true, features = ["import"] }
# Scratch files for uploads and the demo dataset on their way into Airhouse.
tempfile = { workspace = true }
agentic-pipeline = { workspace = true }
oxy-oltp = { workspace = true }
email_address = { workspace = true }
handlebars = { workspace = true }
once_cell = { workspace = true }
slugify = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
utoipa = { workspace = true }              # OpenAPI for the documented handlers
utoipa-axum = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# No oxy-app, not even here: the route-role tests moved up to oxy-server
# (decompose TR).
tower = { workspace = true, features = ["util"] }
# The DB-backed integration tests reuse the shared harness (`#[path]`-included
# from crates/test-utils/harness), which clones a per-run template database and
# needs every migrator `Schema::All` can apply — same list as oxy-api-frontline.
migration = { workspace = true }
agentic-runtime = { workspace = true }
oxy-cameras = { workspace = true }
url = { workspace = true }
# In-process stand-in for the tenant in `onboarding/airhouse_tests.rs`.
duckdb = { workspace = true }
async-trait = { workspace = true }
serde_yaml = { workspace = true }
oxy-test-utils = { workspace = true }      # the harness takes its Postgres from here

[lints]
workspace = true
