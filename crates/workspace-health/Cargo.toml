[package]
name = "oxy-workspace-health"
version.workspace = true
authors.workspace = true
description = "Workspace health — the cross-tenant rollup, the evaluator, reconciliation and smoke-test verdicts, Slack alerting and the per-workspace eval pass. The live runners and the admin routes are oxy-api-workspace-health's."
documentation.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
# No oxy-app: the live runners that need its project context are
# oxy-api-workspace-health's, behind the `ReconcileRunner` / `SmokeRunner` seams.
oxy = { workspace = true }                   # health_check config, Toast integration model
oxy-app-core = { workspace = true }          # compiled_reader
oxy-airlayer-compat = { workspace = true }   # semantic query requests
oxy-metric-monitoring = { workspace = true } # duration/week-start config shared with monitors
oxy-observability = { workspace = true }     # custom-app availability burn rate
oxy-shared = { workspace = true }
oxy-slack-client = { workspace = true }
agentic-core = { workspace = true }          # query result cells
entity = { workspace = true }

async-trait = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
humantime = { workspace = true }
minijinja = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# The in-source DB tests share oxy-app's harness (`#[path]`-included), which
# runs the central and runtime migrators against `OXY_DATABASE_URL`.
migration = { workspace = true }
rand = { workspace = true }             # the harness's lock-retry jitter
agentic-runtime = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }

[lints]
workspace = true
