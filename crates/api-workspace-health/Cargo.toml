[package]
name = "oxy-api-workspace-health"
version.workspace = true
authors.workspace = true
# Editing this crate re-runs oxy-route-catalog's build script (it watches this
# tree; see crates/route-catalog/build_route_catalog.rs) and rebuilds only
# oxy-server, which mounts it.
description = "Workspace health HTTP surface — the staff console's rollup, eval trigger and history routes, the health_eval_workspace task executor, and the live reconcile and smoke runners — a sibling crate mounted by oxy-server"
documentation.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
# No oxy-app dependency: everything comes from the crates below it, and
# oxy-server mounts this crate.
oxy-server-authz = { workspace = true }       # the admin scope fence, `Action`
oxy-workspace-runtime = { workspace = true }  # the project context the live runners build
oxy-app-core = { workspace = true }        # AppState
oxy-workspace-health = { workspace = true }
oxy = { workspace = true }                 # health_check config, Toast integration model, secrets
oxy-airlayer-compat = { workspace = true }
oxy-auth = { workspace = true }            # AuthenticatedUserExtractor
oxy-shared = { workspace = true }
entity = { workspace = true }
agentic-core = { workspace = true }
agentic-runtime = { workspace = true }     # the task executor
agentic-pipeline = { workspace = true }    # the eval enqueue, platform/project contexts
agentic-analytics = { workspace = true }   # the measure runner a semantic operand runs on

async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
humantime = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# The shared harness installs the platform port (`ProcessPlatformDb::install`)
# per test database, as oxy-server does at boot.
oxy-platform = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
serde_yaml = { workspace = true }
# Two harnesses: the in-source DB tests' (`oxy_test_utils::db`, the central and
# runtime migrators against `OXY_DATABASE_URL`) and the integration tests'
# (`crates/test-utils/harness`, included by path, which clones a per-run template
# database and needs every migrator `Schema::All` can apply — same list as
# oxy-api-tenancy).
migration = { workspace = true }
oxy-cameras = { workspace = true }
airhouse = { workspace = true }
oxy-oltp = { workspace = true }
tempfile = { workspace = true }
url = { workspace = true }
oxy-test-utils = { workspace = true }      # the in-source DB harness; the harness takes its Postgres from here

[lints]
workspace = true
