[package]
name = "oxy-api-slack"
version.workspace = true
authors.workspace = true
# Editing this crate re-runs oxy-route-catalog's build script (it watches this
# tree; see crates/route-catalog/build_route_catalog.rs) but does NOT rebuild
# oxy-app — the catalog was moved above it for exactly that reason.
description = "The Slack integration's HTTP surface and bot (install, webhooks, OAuth callback, account linking, Socket Mode, the agent runs a message starts) — a sibling crate mounted by oxy-server"
documentation.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
# What this surface takes from oxy-app, all through `oxy_app::surface`: the
# OrgAdmin role guard, the org middlewares, the workspace runtime
# (`OxyProjectContext`) and the runtime-artifact S3 mirror. oxy-app never
# depends back on this crate. default-features off so a `--no-default-features`
# build of oxy-server keeps dropping V8.
oxy-app = { path = "../app", default-features = false }
oxy-app-core = { workspace = true }  # AppState, compiled_reader, PreaggCacheCtx
oxy-slack = { workspace = true }     # config, installations, user links (shared with notifications)
oxy-slack-client = { workspace = true }
oxy = { workspace = true }
oxy-auth = { workspace = true }      # OptionalAuthenticatedUser on the link landing page
oxy-shared = { workspace = true }    # OxyError, fleet_role::RouteRoleDecl
entity = { workspace = true }
agentic-analytics = { workspace = true }
agentic-core = { workspace = true }
agentic-pipeline = { workspace = true }

async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true, features = ["std"] }
chrono = { workspace = true, features = ["serde"] }
futures = { workspace = true }
headless_chrome = { workspace = true }  # chart PNGs for Slack
hex = { workspace = true }
hmac = { workspace = true }          # Slack request signatures
rand = { workspace = true }
reqwest = { workspace = true, features = ["stream", "form", "query", "json"] }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }  # Socket Mode
tracing = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
