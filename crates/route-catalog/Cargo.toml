[package]
name = "oxy-route-catalog"
version.workspace = true
authors.workspace = true
description = "The generated HTTP route table `GET /api/_catalog` serves. Sits above oxy-app and every surface crate, so editing a surface re-runs this build script instead of oxy-app's (internal-docs/domain-boundaries.md S7)"
documentation.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
# The `GeneratedRoute` / `RouteCatalog` types live in oxy-app and the handler in
# oxy-server (`core_routes`); this crate only owns the generated data and the
# tests that read it.
oxy-app = { path = "../app", default-features = false }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# The sandbox-agent refusal tables the console owns (`custom_apps_agent_refusal`).
oxy-api-custom-apps = { path = "../api-custom-apps", default-features = false }
# The workspace-seam route roles the server composes (`oxy-server`
# `surface_seams`), so `factory_routes` can say which pod serves every
# customer route, the surfaces' included.
oxy-api-tenancy = { path = "../api-tenancy", default-features = false }
oxy-api-airway = { path = "../api-airway", default-features = false }
oxy-api-experiment = { path = "../api-experiment" }
oxy-api-world-model = { path = "../api-world-model" }
oxy-api-metric-monitoring = { path = "../api-metric-monitoring" }
oxy-api-observability = { path = "../api-observability" }
oxy-api-automations = { path = "../api-automations" }
oxy-api-workspace-config = { path = "../api-workspace-config" }
oxy-api-identity = { path = "../api-identity" }
axum = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
