[package]
name = "oxy-route-catalog"
version.workspace = true
authors.workspace = true
description = "The generated HTTP route table `GET /api/_catalog` serves, and its types. Its build script reads oxy-server and every surface crate without depending on them, so editing a surface re-runs this build script instead of rebuilding them (internal-docs/domain-boundaries.md S7)"
documentation.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
# The `GeneratedRoute` / `RouteCatalog` types and the generated data live here
# (decompose RC, 2026-11-23), the handler in oxy-server (`core_routes`).
# No oxy-app-core: `describe` takes each route's role from its caller
# (`oxy_server::role_manifest::describe_route`), so the route-role registry
# stays in oxy-app-core and this crate does not depend on it.
serde = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# No oxy-app (decompose RT, 2026-11-23): the tests that build the real router
# (`token_grant_scope`, `factory_routes`' two `served_declarations` tests and
# `describe_reports_the_fleet_role`)
# went up to oxy-server's integration group, and the rest read lower crates.
# The sandbox agent token's route allow-list (`sandbox_reach`: `SANDBOX_ALLOWED`,
# `PUBLIC_ROUTES`, `sandbox_admits`), walked against the generated table.
oxy-custom-apps = { path = "../custom-apps" }
# The sandbox-agent refusal tables the console owns (`custom_apps_agent_refusal`).
oxy-api-custom-apps = { path = "../api-custom-apps", default-features = false }
# The authority model the sandbox-agent stack tests ask (`allows`, re-exported
# from oxy-authz), whose owner-or-app-admin door they also read as source.
oxy-server-authz = { workspace = true }
# The two Factory lists (`factory_access::routes`), walked against the table.
oxy-workspace-runtime = { workspace = true }
# The preview guard's two lists (`read_only::{ALLOWED, REFUSED}`).
oxy-previews = { workspace = true }
# `fleet_role::pattern_matches`, which the factory and preview tests match
# routes with.
oxy-shared = { workspace = true }
axum = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
