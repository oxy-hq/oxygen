[package]
name = "oxy-api-custom-apps"
version.workspace = true
authors.workspace = true
# Editing this crate re-runs oxy-route-catalog's build script (it watches this
# tree; see crates/route-catalog/build_route_catalog.rs) and rebuilds only
# oxy-server, which mounts it.
description = "Custom Apps HTTP surface: the /customer-apps bundle route, health, logs and the browser beacon, the Oxy Functions host and V8 runtime, publish and promote, sandboxes, secrets, migrations and the staff console — a sibling crate mounted by oxy-server"
documentation.workspace = true
publish.workspace = true
edition.workspace = true

[features]
default = ["custom-app-functions"]
# The V8-isolate runtime for Oxy Functions. On by default so `oxy serve --local`
# runs the real runtime (design doc §11.8); `--no-default-features` drops V8 and
# the Functions endpoints go inert. oxy-server forwards this feature, and every
# crate that depends on this one sets `default-features = false`, so the switch
# is one place.
custom-app-functions = ["deno_core", "deno_error"]

[dependencies]
# The platform's own Airhouse clients (event log copy, table tracker).
oxy-cameras = { workspace = true }
# `data_plane`: the query routes' OpenAPI operations and request/response schemas.
utoipa = { workspace = true, features = ["uuid", "chrono", "axum_extras"] }
utoipa-axum = { workspace = true }
indexmap = { workspace = true }  # `data_plane::query`: column order in a result row
# No oxy-app (decompose SD, 2026-11-24): the demo seed hands what it knows
# into the example-apps seam (`DemoSeedFacts`), and the seed itself and the
# router helpers its tests drive are oxy-server's (a dev-dependency, below).
# What oxy-app's prelude used to hand on, imported from the crates that own it:
oxy-workspace-runtime = { workspace = true } # the semantic boundary, gates, metric-tree executor, queued runs
oxy-compile-runtime = { workspace = true }   # the lazy compile enqueue
oxy-previews = { workspace = true }          # the preview run queue, namespace and sources
oxy-app-core = { workspace = true }       # AppState, the agent-token body, the function seam traits
oxy-feature-flags = { workspace = true }  # `ctx.events.publish` asks the org's `app_events` flag first
oxy-metric-monitoring = { workspace = true } # the metric-tree twins' request shapes, baseline reads and budget
agentic-analytics = { workspace = true }     # `MetricTreeRunner`, the trait the metric-tree twins drive the runner through
oxy-semantic = { workspace = true }          # the metric tree's pure ops: build, subtree, sensitivity, predict
oxy-custom-apps = { workspace = true }    # the serve resolver, build store, caches, usage queue
oxy-usage-report = { workspace = true }   # platform facts: the customer-run predicate, the token rates, the week
oxy = { workspace = true }                # database client
oxy-auth = { workspace = true }           # credentials and the token kinds
oxy-authz = { workspace = true }
oxy-observability = { workspace = true }  # the serving SLI and the log store
oxy-server-authz = { workspace = true }   # Caller
oxy-shared = { workspace = true }         # RouteRoleDecl, the request id
oxy-telemetry = { workspace = true }
entity = { workspace = true }

axum = { workspace = true }
lru = { workspace = true }
parking_lot = { workspace = true }
chrono = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
# `raw_value`: the change stream relay keeps each row-image value as its JSON
# lexeme, so a wide `numeric` keeps every digit (`oltp_changes::relay::render`).
serde_json = { workspace = true, features = ["raw_value"] }
# Applies the build's source maps to a browser error's stack (`sourcemap`).
sourcemap = "9"
tokio = { workspace = true }
tracing = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true }

# ── what the functions host, publish, sandboxes, secrets, migrations and the
# console brought with them (they were oxy-app's) ─────────────────────────────
deno_core = { workspace = true, optional = true }
deno_error = { workspace = true, optional = true }
agentic-connector = { workspace = true, features = [
    "duckdb",
    "postgres",
    "clickhouse",
    "snowflake",
    "bigquery",
    "mysql",
    "domo",
] }
airhouse = { workspace = true, features = ["connector", "rest", "sql-rules", "preview-sql", "preview-registry"] }
sqlparser = { workspace = true, features = ["visitor"] }
oxy-oltp = { workspace = true }
agentic-core = { workspace = true }
agentic-pipeline = { workspace = true }
agentic-automation = { workspace = true }
# `AirwayPipelineSpec`: the admin data-flow view reads each compiled pipeline
# the way the worker does. Already in the graph through agentic-pipeline.
agentic-airway = { workspace = true }
agentic-runtime = { workspace = true }
agentic-semantic = { workspace = true }
oxy-airlayer-compat = { workspace = true }
oxy-billing = { workspace = true }
oxy-tenancy = { workspace = true }
oxy-identity = { workspace = true }
oxy-slack-client = { workspace = true }
migration = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json"] }
log = { workspace = true }
reqwest = { workspace = true, features = ["stream", "form", "query", "json"] }
clickhouse = { workspace = true, features = ["rustls-tls"] }
arrow = { workspace = true, features = ["json"] }
parquet = { workspace = true }
duckdb = { workspace = true }
tempfile = { workspace = true }
tokio-util = { workspace = true }
tokio-postgres = { workspace = true }
include_dir = { workspace = true }
constant_time_eq = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
jsonschema = { workspace = true }  # app events: schema check and payload validation (no remote $ref)
tar = { workspace = true }
flate2 = { workspace = true }
base64 = { workspace = true, features = ["std"] }
regex = { workspace = true }
serde_urlencoded = { workspace = true }
slugify = { workspace = true }
url = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls", "postgres"] }
backoff = { workspace = true, features = ["tokio"] }
sentry = { workspace = true }
dirs = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
brotli = { workspace = true }
# `new_agentic_state`, the AgenticState the integration tests build.
agentic-http = { workspace = true }
# `usage_fixtures`: an in-memory stand-in for a workspace's Airhouse and a fixed
# usage history, for the tests of the Activity tab's reads and the backfill.
oxy-custom-apps = { workspace = true, features = ["test-fixtures"] }
tower = { workspace = true, features = ["util"] }
# The router the integration tests drive (`oxy_server::router::{api_router,
# external_auth_layers, flat_api_surface}` and
# `router::middlewares::app_publish_token_scope`), up from oxy-app's
# `surface::testing` in decompose LIFT, and the demo seed their fixtures build
# on (`oxy_server::dev::seed::fixture`, up from oxy-app in decompose SD; it is
# compiled only with `dev-tools`). A dev-dependency cycle Cargo allows.
# default-features off so the test build does not turn on oxy-server's V8
# forwarding (`custom-app-functions`).
oxy-server = { path = "../server", default-features = false, features = ["dev-tools"] }
# The integration tests reuse the shared harness (`#[path]`-included from
# crates/test-utils/harness), which clones a per-run template database and needs
# every migrator `Schema::All` can apply.
oxy-app-core = { workspace = true, features = ["test-fixtures"] }
tokio = { workspace = true, features = ["test-util"] }
serial_test = { workspace = true }
# The in-source DB tests' harness (`oxy_test_utils::db`).
oxy-test-utils = { workspace = true }
oxy-compile = { workspace = true }
# `sentry::test::with_captured_events` for the custom-app surface tag tests.
sentry = { workspace = true, features = ["test"] }
wiremock = { workspace = true }
testcontainers = { workspace = true, features = [
    "blocking",
    "reusable-containers",
] }
testcontainers-modules = { workspace = true, features = ["postgres", "clickhouse"] }

[lints]
workspace = true
