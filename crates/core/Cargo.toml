[package]
name = "oxy"
version.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
# Override workspace exclude to prevent rebuilds from runtime-generated files
exclude = [
  # Runtime-generated directories that should not trigger rebuilds
  "demo_project/.db/",
  "demo_project/.databases/",
  "demo_project/.checkpoint/",
  "demo_project/.oxy_state/",
  "demo_project/consistency-test-results.json",
  "examples/.db/",
  "examples/.databases/",
  "examples/.checkpoint/",
  "examples/.oxy_state/",
  "examples/consistency-test-results.json",
  ".db-*/",
  ".databases/",
  ".checkpoint/",
  ".oxy_state/",
  "output/",
  "*.log",
  "postgres_data/",
]

[dependencies]
aes-gcm = { workspace = true }
anyhow = { workspace = true }
arrow = { workspace = true, features = [
  "json",
  "ipc",
] } # arrow version has to comply with duckdb version
assert_cmd = { workspace = true }
aws-config = { workspace = true, features = ["behavior-version-latest"] }
aws-credential-types = { workspace = true }
aws-sigv4 = { workspace = true }
async-openai = { workspace = true, features = [
  "byot",
  "chat-completion-types",
  "response-types",
  "_api",
  "responses",
  "chat-completion",
  "embedding-types",
  "embedding",
] }
async-stream = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, features = ["macros", "http2"] }
base64 = { workspace = true }
bollard = { workspace = true }
chrono = { workspace = true }
chrono-english = { workspace = true }
clap = { workspace = true, features = ["derive"] }
clickhouse = { workspace = true, features = ["rustls-tls"] }
colored = { workspace = true }
connectorx = { workspace = true, features = [
  "dst_arrow",
  "src_bigquery",
  "src_postgres",
  "src_mysql",
] }
csv = { workspace = true }
dirs = { workspace = true }
duckdb = { workspace = true }
entity = { workspace = true }
oxy-compile = { workspace = true }
lru = { workspace = true }
omni = { workspace = true }
oxy-looker = { workspace = true }
oxy-observability = { workspace = true }
# oxy-config moved back into core/src/config to avoid circular dependency
# The concrete LLM provider crates (anthropic/gemini/ollama/openai) are no longer
# a direct dependency: the eval judge now reaches the agentic LLM stack through
# agentic-pipeline, and the config schema types live in oxy-llm.
oxy-git = { workspace = true }
oxy-llm = { workspace = true }
oxy-semantic = { workspace = true }
oxy-shared = { workspace = true }
oxy-telemetry = { workspace = true }
oxy-oltp = { workspace = true }
oxy-platform = { workspace = true }
# Cannot add higher-level crates (e.g. agentic-* domain crates) here
# due to circular dependency: they depend on oxy, so oxy cannot depend
# on them. Use them via the CLI crate instead.
oxy-auth = { workspace = true }
airhouse = { workspace = true, features = ["admin"] }
enum_dispatch = { workspace = true }
futures = { workspace = true }
garde = { workspace = true, features = ["full"] }
glob = { workspace = true }
home = { workspace = true }
humantime = { workspace = true }
indoc = { workspace = true }
itertools = { workspace = true }
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"] }
lazy_static = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
minijinja = { workspace = true, features = ["loader"] }
once_cell = { workspace = true }
predicates = { workspace = true }
rand = { workspace = true }
schemars = { workspace = true, features = ["derive", "impl_json_schema"] }
scopeguard = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_arrow = { workspace = true, features = ["arrow-58"] }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
slugify = { workspace = true }
syntect = { workspace = true }
tabled = { workspace = true }
terminal-light = { workspace = true }
terminal_size = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = [
  "fs",
  "cors",
  "trace",
  "timeout",
  "compression-gzip",
] }
tqdm = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
reqwest = { workspace = true, features = ["json"] }
secrecy = { workspace = true }
snowflake-api = { workspace = true }
rmcp = { workspace = true, features = [
  "server",
  "transport-sse-server",
  "transport-io",
] }
serde_with = { workspace = true }
# we use chrono::DateTimeWithTimeZone, which is not currently supported by utoipa
# need to use this until this PR is released https://github.com/juhaku/utoipa/pull/1367
utoipa = { workspace = true, features = ["uuid", "chrono", "axum_extras"] }
regex = { workspace = true }
url = { workspace = true }
gcp-bigquery-client = { workspace = true }
fehler = { workspace = true }
sqlparser = { workspace = true }
# NOT a stale pin: this is connectorx's own sqlparser, used only to implement
# its `Dialect` trait in connector/connectorx/bigquery.rs. It must track
# connectorx (0.4.5 -> `^0.37`), not the workspace `sqlparser` above.
sqlparser_connectorx = { package = "sqlparser", version = "0.37" }
backoff = { workspace = true, features = ["tokio"] }
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls", "postgres"] }
semver = { workspace = true }
rustls = { workspace = true, features = ["aws_lc_rs"] }
parquet = { workspace = true } # needs to be the same with arrow version
short-uuid = { workspace = true }
indexmap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
  "env-filter",
  "fmt",
  "json",
] }
tracing-log = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
serde_yaml = { workspace = true }
urlencoding = { workspace = true }
tempfile = { workspace = true }
xxhash-rust = { workspace = true, features = ["xxh3"] }
aho-corasick = { workspace = true }
rkyv = { workspace = true, features = ["bytecheck"] }
sentry = { workspace = true }
df-interchange = { workspace = true, features = ["arrow_54", "arrow_58"] }

[dev-dependencies]
tempfile = { workspace = true }
serial_test = { workspace = true }
oxy-test-utils = { workspace = true }
# `sentry::test::with_captured_events_options`, so the before_send tests run an
# event through the real client options instead of a hand-built approximation.
sentry = { workspace = true, features = ["test"] }
# Only for the listing tests that assert a pruned path is greppable at DEBUG —
# a silent prune is the failure they exist to catch, so the assertion has to
# read what was actually logged.
tracing-subscriber = { workspace = true }

[lib]
name = "oxy"
crate-type = ["cdylib", "rlib"]

[features]
default = []
