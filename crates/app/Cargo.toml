[package]
name = "oxy-app"
version.workspace = true
authors.workspace = true
description = "Oxy Application - CLI and HTTP server"
documentation.workspace = true
publish.workspace = true
edition.workspace = true

# The `oxy` binary lives in the `oxy-server` crate (the composition root that
# mounts the API surfaces); oxy-app is a library only.
#
# For the optional dev-dynamic-linking fast loop, oxy-app is NOT itself a dylib
# (that would build a ~1.4 GB dylib on every release/CI build). Instead the thin
# `oxy-app-dylib` crate re-exports it as a dylib, pulled in only by oxy-server's
# `dev-dynamic` feature. See `just dev-backend-dyn`.

# The V8-isolate runtime for Oxy Functions (`custom-app-functions`) is a feature
# of `oxy-api-custom-apps` now, with the functions host; oxy-app links no V8.

[features]
# `oxy dev seed | compile` (`cli::commands::dev`) and the hidden top-level
# `oxy seed` alias. Off here; `oxy-server`'s default `dev-tools` turns it on, and
# the release build (`--no-default-features`) leaves it off, so a shipped binary
# cannot seed. internal-docs/oxy-cli-to-oxyc.md, "Dev tooling (class d)".
dev-tools = []

[dependencies]
# Core functionality
oxy = { workspace = true }
oxy-observability = { workspace = true }
oxy-shared = { workspace = true }
oxy-telemetry = { workspace = true }
oxy-workspace-fs = { workspace = true }
agentic-airway = { workspace = true }
agentic-analytics = { workspace = true }
agentic-connector = { workspace = true, features = [
    "duckdb",
    "postgres",
    "clickhouse",
    "snowflake",
    "bigquery",
    "mysql",
    "domo",
] }
# `preview-sql`: the rewrite and verifier that keep a workspace preview's
# Airhouse writes in its own schemas. Enabled here (not only where it is used)
# so the workspace test run builds airhouse with it and runs its I1 tests.
# `import`: `oxy dev seed` loads the demo workspace's data files into its tenant.
airhouse = { workspace = true, features = ["connector", "rest", "sql-rules", "preview-sql", "preview-registry", "import"] }
oxy-oltp = { workspace = true }
agentic-core = { workspace = true }
agentic-http = { workspace = true }
agentic-pipeline = { workspace = true }
agentic-runtime = { workspace = true }
agentic-semantic = { workspace = true }
agentic-automation = { workspace = true }
oxy-airlayer-compat = { workspace = true }
oxy-auth = { workspace = true }
oxy-app-core = { workspace = true }
oxy-workspace-runtime = { workspace = true }
oxy-tenancy = { workspace = true }
oxy-custom-apps = { workspace = true }
oxy-authz = { workspace = true }
oxy-server-authz = { workspace = true }
oxy-billing = { workspace = true }
oxy-cameras = { workspace = true }
oxy-compile = { workspace = true }
# The compile boundary's runtime half (`git`, `config_gate`, `oltp`,
# `maintenance`), re-exported at `server::compile_*`.
oxy-compile-runtime = { workspace = true }
# Workspace previews' rows (registry, DDL, namespace, sources, pin, run queue),
# re-exported at `server::previews::*`.
oxy-previews = { workspace = true }
oxy-preagg = { workspace = true }
# The feature-flag runtime's domain half; its HTTP half is `oxy-api-admin`'s.
oxy-feature-flags = { workspace = true }
oxy-project = { workspace = true }
oxy-semantic = { workspace = true }
oxy-metric-monitoring = { workspace = true }
entity = { workspace = true }

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

# Validation
schemars = { workspace = true, features = ["derive", "impl_json_schema"] }

# Error handling
anyhow = { workspace = true }

# Logging/Tracing
tracing = { workspace = true }

# Web framework
axum = { workspace = true, features = ["multipart"] }
tower = { workspace = true }
tower-http = { workspace = true, features = ["cors", "trace", "timeout", "compression-br", "compression-gzip"] }
utoipa = { workspace = true, features = ["uuid", "chrono", "axum_extras"] }
utoipa-axum = { workspace = true }

# CLI
clap = { workspace = true, features = ["derive", "env"] }

# Database
sea-orm = { workspace = true }

# Data processing
duckdb = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
tempfile = { workspace = true }
minijinja = { workspace = true, features = ["loader"] }
tokio-util = { workspace = true }
# Only for the AsyncMessage variant the chat listener matches on; the
# connection itself is minted by agentic-runtime, which owns the TLS and IAM
# decisions a listener must not make for itself.
tokio-postgres = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true, features = ["std"] }
regex = { workspace = true }
glob = { workspace = true }
url = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls", "postgres"] }
sentry = { workspace = true }

# Database migration
migration = { workspace = true }

# Other dependencies from core that might be needed
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[build-dependencies]
chrono = { workspace = true }

[dev-dependencies]
# `routing::base_boundary` parses oxy-app's own sources to resolve `use` trees and
# `super::` paths exactly; a line scanner misreads nested-brace imports.
syn = { workspace = true, features = ["full", "parsing", "visit", "printing"] }
# `usage_fixtures`: an in-memory stand-in for a workspace's Airhouse and a fixed
# usage history, for the report's two-store test.
oxy-custom-apps = { workspace = true, features = ["test-fixtures"] }
oxy-app-core = { workspace = true, features = ["test-fixtures"] }
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
# `platform::compile_from_git`'s fixture packs a commit tarball (the unpack
# itself is `oxy-compile-runtime`'s since 2026-11-21).
tar = { workspace = true }
flate2 = { workspace = true }
assert_cmd = { workspace = true }
serial_test = { workspace = true }
oxy-test-utils = { workspace = true }
tower = { workspace = true, features = ["util"] }
# `sentry::test::with_captured_events` for the custom-app surface tag tests.
sentry = { workspace = true, features = ["test"] }
wiremock = { workspace = true }

[lints]
workspace = true
