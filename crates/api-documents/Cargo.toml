[package]
name = "oxy-api-documents"
version.workspace = true
authors.workspace = true
# Editing this crate re-runs oxy-route-catalog's build script (it watches this
# tree; see crates/route-catalog/build_route_catalog.rs) but does NOT rebuild
# oxy-app — the catalog was moved above it for exactly that reason.
description = "Document-library HTTP surface (folders, documents, immutable versions, visibility, search, ask) — a sibling crate mounted by oxy-server"
documentation.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
# No oxy-app here (decompose R1 S10): the org middlewares + assume-role check
# are oxy-app-core's, `OrgAdmin` is oxy-server-authz's, the project-context
# builder is oxy-workspace-runtime's. Its route-role test moved up to
# oxy-server (decompose TR), so not even a dev-dependency remains.
oxy-app-core = { workspace = true }       # AppState (router state) + pagination
oxy-custom-apps = { workspace = true }    # the custom-app S3 silo (bucket, presigner)
oxy = { workspace = true }                # database client
oxy-auth = { workspace = true }           # AuthenticatedUserExtractor
oxy-server-authz = { workspace = true }   # Caller + the OrgAdmin guard
oxy-workspace-runtime = { workspace = true } # build_project_context (the ask agent)
oxy-shared = { workspace = true }         # OxyError + fleet_role::RouteRoleDecl
agentic-pipeline = { workspace = true }   # run_agentic_answer + PlatformContext (ask)
entity = { workspace = true }

async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# The integration group (`tests/integration/`) reuses oxy-app's per-test
# database harness (`crates/test-utils/harness/mod.rs`, included by `#[path]`),
# so it needs that harness's dependencies too. Dev-only: nothing here ships.
agentic-runtime = { workspace = true }       # the harness runs the runtime migrator
migration = { workspace = true }
airhouse = { workspace = true }
oxy-cameras = { workspace = true }
oxy-oltp = { workspace = true }
reqwest = { workspace = true }             # document_storage: PUT/GET the presigned URLs
tempfile = { workspace = true }
url = { workspace = true }
oxy-test-utils = { workspace = true }      # the harness takes its Postgres from here
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
