[package]
name = "oxy-platform"
description = "Platform glue: database connection pooling + encrypted org secret store"
version.workspace = true
documentation.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
# Errors + entity types are platform-shared.
oxy-shared = { workspace = true }
entity = { workspace = true }
# The pool health monitor publishes its occupancy and probe timings into the
# metrics sources. oxy-telemetry depends only on oxy-shared, so this adds no
# cycle and no agentic reach.
oxy-telemetry = { workspace = true }

# Database
sea-orm = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls", "postgres"] }
# agentic-runtime contributes the ListenerConfigFactory type used by the
# task-router's dedicated LISTEN connection. The platform crate owns the
# factory implementations (password + IAM) because it already owns the
# IAM token mint + the env-var contract — keeping these here avoids
# inverting the dependency direction.
agentic-runtime = { workspace = true }
tokio-postgres = { workspace = true }

# Encryption
aes-gcm = { workspace = true }
base64 = { workspace = true }

# AWS RDS IAM auth
aws-config = { workspace = true, features = ["behavior-version-latest"] }
aws-credential-types = { workspace = true }
aws-sigv4 = { workspace = true }
url = { workspace = true }

# Async + utilities
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tracing = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
