[package]
name = "oxy-platform"
description = "Platform glue: database connection pooling + encrypted org secret store"
version.workspace = true
documentation.workspace = true
publish.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
# Errors + entity types are platform-shared.
oxy-shared = { workspace = true }
entity = { workspace = true }
# The pool health monitor records its probe timings and failures through the
# OpenTelemetry API's global meter (`db::pool_metrics`), not through
# oxy-telemetry, which installs the provider at boot. Its gauges are atomics in
# `oxy_shared::db_pool_metrics`.
opentelemetry = { workspace = true }

# Database
sea-orm = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls", "postgres"] }
# The task-router's LISTEN connection factory (password + IAM) lives here
# because this crate owns the IAM token mint + the env-var contract. It is
# typed without agentic-runtime: platform never imports agentic
# (internal-docs/domain-boundaries.md L2).
tokio-postgres = { workspace = true }

# Encryption
aes-gcm = { workspace = true }
base64 = { workspace = true }
# Key fingerprints in the boot check's messages (`secrets::key_check`).
sha2 = { workspace = true }

# AWS RDS IAM auth
aws-config = { workspace = true, features = ["behavior-version-latest"] }
aws-credential-types = { workspace = true }
aws-sigv4 = { workspace = true }
url = { workspace = true }
# The master key, sealed by KMS and stored in `server_keys`
# (`secrets::master_key`).
aws-sdk-kms = { workspace = true }

# Async + utilities
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tracing = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# `db::pool_metrics`' test installs the real metrics provider and renders it.
oxy-telemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
serial_test = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
