[package]
name = "oxy-api-frontline"
version.workspace = true
authors.workspace = true
# Editing this crate re-runs oxy-route-catalog's build script (it watches this
# tree; see crates/route-catalog/build_route_catalog.rs) and rebuilds only
# oxy-server, which mounts it.
description = "Frontline HTTP surface (PIN sign-in, kiosk binding, worker enrolment) — a sibling crate mounted by oxy-server"
documentation.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
# No oxy-app, not even as a dev-dependency (its route-role test moved up to
# oxy-server in decompose TR). The OrgAdmin role guard, the org
# middlewares and the session-cookie + token helpers come from
# oxy-server-authz and oxy-app-core. The operating-graph assignment writes and
# reads are oxy-app-core's; the org_teams audit row's name is oxy-tenancy's and
# this crate writes it (access_audit). oxy-app never
# depends back on this crate.
oxy-app-core = { workspace = true }  # AppState (router state) + the audit writer
oxy-tenancy = { workspace = true }
oxy-custom-apps = { workspace = true }  # invalidate_access_cache
oxy = { workspace = true }           # database client
oxy-auth = { workspace = true }      # AuthenticatedUserExtractor + the PIN primitives
oxy-server-authz = { workspace = true } # Caller: the actor with the credential they used
oxy-shared = { workspace = true }    # OxyError, fleet_role::RouteRoleDecl
entity = { workspace = true }

axum = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
futures = { workspace = true }
# The DB-backed integration tests reuse the shared harness (`#[path]`-included
# from crates/test-utils/harness), which clones a per-run template database and
# needs every migrator `Schema::All` can apply.
migration = { workspace = true }
airhouse = { workspace = true }
oxy-oltp = { workspace = true }
agentic-runtime = { workspace = true }
agentic-pipeline = { workspace = true }
oxy-cameras = { workspace = true }
tempfile = { workspace = true }
url = { workspace = true }
oxy-test-utils = { workspace = true }      # the harness takes its Postgres from here

[lints]
workspace = true
