[package]
name = "oxy-compile"
version.workspace = true
authors.workspace = true
description = "Compile boundary — walks a workspace and writes parsed YAML/SQL into the compile-boundary Postgres schema"
documentation.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
aws-config.workspace = true
aws-sdk-s3.workspace = true
chrono.workspace = true
entity.workspace = true
futures.workspace = true
hex.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
slugify = { workspace = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "sync"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }
glob = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tempfile = { workspace = true }
# Dev-only: `discover` reports every drop at DEBUG, and
# `a_dropped_file_is_reported_at_debug_rather_than_vanishing` asserts that
# rather than trusting the call by inspection.
tracing-subscriber = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
