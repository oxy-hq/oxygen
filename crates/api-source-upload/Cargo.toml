[package]
name = "oxy-api-source-upload"
version.workspace = true
authors.workspace = true
# Editing this crate re-runs oxy-route-catalog's build script (it watches this
# tree; see crates/route-catalog/build_route_catalog.rs) but does NOT rebuild
# oxy-app — the catalog was moved above it for exactly that reason.
description = "Source-report upload HTTP surface (validated writes into the S3 landing zone file-based airway sources read) — a sibling crate mounted by oxy-server"
documentation.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# The only oxy-app dependency: the `WorkspaceEditor` guard and the
# `WorkspaceManagerReadOnly` extractor. oxy-app never depends back on this
# crate. default-features off so a `--no-default-features` build of oxy-server
# keeps dropping V8.
oxy-app = { path = "../app", default-features = false }
oxy-app-core = { workspace = true }  # AppState (the router state type)
oxy = { workspace = true }
oxy-shared = { workspace = true }
# Report validation runs the real airway source over the bytes, and the upload
# zone is derived by the same function the pipeline run uses.
agentic-airway = { workspace = true }

axum = { workspace = true, features = ["multipart"] }
aws-config = { workspace = true, features = ["behavior-version-latest"] }
aws-sdk-s3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[lints]
workspace = true
