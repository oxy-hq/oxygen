[package]
name = "oxy-policy-engine"
version.workspace = true
authors.workspace = true
description = "Policy engine prototype: a Rust host boots a policy script (TypeScript, compiled ahead of time) under deno_core, reads policies from the org OLTP database (ctx.oltp) through an op, audits decisions through another, and syncs policy_overrides to Parquet through DuckDB"
documentation.workspace = true
publish.workspace = true
edition.workspace = true

[[bin]]
name = "policy-engine"
path = "src/main.rs"

[dependencies]
deno_core = { workspace = true }
deno_error = { workspace = true }
duckdb = { workspace = true }
oxy-oltp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true, features = ["postgres"] }

[lints]
workspace = true
