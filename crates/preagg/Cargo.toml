[package]
name = "oxy-preagg"
version.workspace = true
authors.workspace = true
description = "The pre-aggregation runtime's domain half: deciding a rollup is stale, rebuilding it (CTAS, pull, manifest, cache), retracting it, the builder-generation sweep and the cycle that drives them (the post-promote nudge is `oxy-compile-runtime`'s `preagg_promote`). Below oxy-server; no routes (internal-docs/domain-boundaries.md, End state: no oxy-app)"
documentation.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
# `WorkspaceContext`: the one call the runtime makes on a workspace (`get_connector`).
agentic-automation = { workspace = true }
agentic-connector = { workspace = true }
agentic-core = { workspace = true }
# `RefreshKeyCache`, the Layer-1 refresh-key cache a cycle threads through.
agentic-semantic = { workspace = true }
oxy-airlayer-compat = { workspace = true }
# `preagg_ledger` and `preagg_blob`: the cache's node-local and cross-node halves.
oxy-compile = { workspace = true }
oxy-shared = { workspace = true }

async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# `CancellationToken`: a cycle stops spawning rebuilds once its task is cancelled.
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
serde_yaml = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
