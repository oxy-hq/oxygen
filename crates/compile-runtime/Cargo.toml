[package]
name = "oxy-compile-runtime"
version.workspace = true
authors.workspace = true
description = "The compile boundary's runtime half: the periodic branch check, the push webhook's reconciler, the env pins and the automatic compile enqueue (`reconcile`), the branch compile a person waits on and its status read (`request`), fetch and unpack a commit for a compile with no working copy (`git`), the config.yml gate (`config_gate`), apply-then-promote for a revision with OLTP schemas (`oltp`) and the revisions reaper and retention loop (`maintenance`), and the compile task's worker (`worker`). Below oxy-server, above oxy-compile, oxy-app-core and oxy-preagg; a previewed branch's change check goes out through `ports::PreviewChangeCheck`; no routes (internal-docs/domain-boundaries.md, End state: no oxy-app)"
documentation.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
# `TaskSpec` and its retry policy: a commit compile is a queued task.
agentic-core = { workspace = true }
# `worker`: the health and pre-aggregation schedule reconciles after a promote.
agentic-pipeline = { workspace = true }
# `COMPILE_GIT_SOURCE_TYPE` and `TaskScope`: the task's run stamp and scope.
agentic-runtime = { workspace = true }
entity = { workspace = true }
# The strict `Config` type the gate deserialises, and the GitHub client.
oxy = { workspace = true }
# `process_role` and `workspace_repo_facts`.
oxy-app-core = { workspace = true }
oxy-compile = { workspace = true }
# `request`: the working-copy fallback reads a branch's head and worktree.
oxy-git = { workspace = true }
# `manifest::is_safe_relative_path`: an unpacked entry's path check.
oxy-custom-apps = { workspace = true }
# The config gate's rollout flags (`cache`, `rollout`).
oxy-feature-flags = { workspace = true }
# `migrator`: apply a revision's OLTP schemas before it is promoted.
oxy-oltp = { workspace = true }
# `worker`: the post-promote rollup nudge (`promote`).
oxy-preagg = { workspace = true }
oxy-shared = { workspace = true }
oxy-telemetry = { workspace = true }

# `reconcile`: the env pinner's seam impl.
async-trait = { workspace = true }
# `reconcile`: the timestamps the branch check and the enqueue backoff read.
chrono = { workspace = true }
# `reconcile`: the lazy-compile throttle's per-workspace map.
dashmap = { workspace = true }
flate2 = { workspace = true }
# `request::Refusal::status`: the status code a route answers a refusal with.
# The `http` types only (what `axum::http` re-exports), no web framework, as
# oxy-tenancy and oxy-custom-apps take it.
http = { workspace = true }
reqwest = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# `worker`'s DB-backed tests: the shared test database (`db`) with the runtime
# migrator.
oxy-test-utils = { workspace = true }
# `worker`'s test of the previews hand-off: its `ports::PreviewChangeCheck`
# double makes the previews' enqueue, as the production adapter does.
oxy-previews = { workspace = true }

[lints]
workspace = true
