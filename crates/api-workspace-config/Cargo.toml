[package]
name = "oxy-api-workspace-config"
version.workspace = true
authors.workspace = true
# Editing this crate re-runs oxy-route-catalog's build script (it watches this
# tree; see crates/route-catalog/build_route_catalog.rs) but does NOT rebuild
# oxy-app — the catalog was moved above it for exactly that reason.
description = "The workspace's own configured resources: its databases (list, schema, introspection) and its project secrets — a sibling crate mounted by oxy-server"
documentation.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
# No oxy-app here: everything comes from the crates below it (R1,
# 2026-11-23). It stays a dev-dependency for the demo seed below.
oxy-server-authz = { workspace = true }      # the `WorkspaceAdmin` guard, EffectiveWorkspaceRole
# The workspace-context extractors, and the connector builder the schema
# route introspects through.
oxy-workspace-runtime = { workspace = true }
oxy-app-core = { workspace = true }      # AppState, RequestActor
oxy-shared = { workspace = true }        # fleet_role::RouteRoleDecl, OxyError
oxy = { workspace = true }               # SecretManagerService, the database inspector
oxy-auth = { workspace = true }          # AuthenticatedUserExtractor
oxy-custom-apps = { workspace = true }   # an app secret's scope and its audit
oxy-identity = { workspace = true }      # the created-by email lookup
oxy-looker = { workspace = true }        # the Looker client the credentials check signs in with
# The OAuth connects (`integrations`, out of oxy-app 2026-11-21): the state
# row (`quickbooks_oauth_states`), the vendor's token exchange and the nonce.
entity = { workspace = true }
sea-orm = { workspace = true }
reqwest = { workspace = true }
urlencoding = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
garde = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true, features = ["uuid", "chrono", "axum_extras"] }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# The demo seed (`oxy_app::surface::seed`, the CLI seed's tables) that
# `tests/integration/tenant_secrets.rs` builds its org from. default-features
# off so V8 stays out of the test build too.
oxy-app = { path = "../app", default-features = false }
# The integration group (`tests/integration/`) reuses oxy-app's per-test
# database harness (`crates/app/tests/common/mod.rs`, included by `#[path]`),
# so it needs that harness's dependencies too. Dev-only: nothing here ships.
migration = { workspace = true }
airhouse = { workspace = true }
oxy-oltp = { workspace = true }
oxy-cameras = { workspace = true }
agentic-runtime = { workspace = true }
agentic-pipeline = { workspace = true }
url = { workspace = true }
tempfile = { workspace = true }
oxy-test-utils = { workspace = true }    # tests/common takes its Postgres from here
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
