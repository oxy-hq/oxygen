[package]
name = "oxy-server"
version.workspace = true
authors.workspace = true
description = "Oxy server binary: the composition root that mounts the API surfaces and runs the oxy CLI / HTTP server"
documentation.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "oxy"
path = "src/main.rs"

[features]
default = ["custom-app-functions"]
# Forwards to oxy-app's V8 (deno_core) Oxy Functions runtime. On by default so a
# plain build runs the real runtime; `--no-default-features` drops V8 (Functions
# endpoints go inert) for the fast local loop — see `.cargo/config.toml` bf/rf.
custom-app-functions = ["oxy-app/custom-app-functions"]

# Dev-only fast build loop: link oxy-app dynamically (see `oxy-app-dylib` +
# `just dev-backend-dyn`). Pulls in the dylib shim so `main.rs`'s guarded
# `extern crate oxy_app_dylib` forces it into the link. NEVER enabled by
# CI/release, so the ~1.4 GB dylib is never built there.
dev-dynamic = ["dep:oxy-app-dylib"]

[dependencies]
# oxy-app is the library this binary drives; default-features off so the feature
# forwarding above is the single switch for the V8 runtime. Not a workspace dep
# (only this crate consumes it), so it is a direct path dependency.
oxy-app = { path = "../app", default-features = false }
oxy-api-github = { path = "../api-github" }
oxy-api-tenancy = { path = "../api-tenancy" }
oxy-api-documents = { path = "../api-documents" }
oxy-api-frontline = { path = "../api-frontline" }
oxy-route-catalog = { path = "../route-catalog" }
oxy-api-source-upload = { path = "../api-source-upload" }
# Dev-dynamic-linking shim, pulled in only by the `dev-dynamic` feature above.
oxy-app-dylib = { path = "../app-dylib", optional = true }
oxy = { workspace = true }
oxy-observability = { workspace = true }
oxy-telemetry = { workspace = true }

axum = { workspace = true }
dotenv = { workspace = true }
human-panic = { workspace = true }
libc = { workspace = true }
once_cell = { workspace = true }
rustls = { workspace = true }
sentry = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# `sentry::test::with_captured_events`, so the event filter below is pinned
# against what sentry-tracing actually does rather than against a reading of it.
sentry = { workspace = true, features = ["test"] }
# The API-token suite (`tests/integration/token_auth`) drives the served flat
# tree, oxy-app's routes and the surfaces' together, which only this crate can
# compose. It reuses oxy-app's harness (`#[path]`-included from
# crates/app/tests/common), which clones a per-run template database and needs
# every migrator `Schema::All` can apply — the same list as oxy-api-tenancy.
oxy-auth = { workspace = true }
oxy-authz = { workspace = true }
oxy-app-core = { workspace = true }
oxy-oltp = { workspace = true }
oxy-billing = { workspace = true }
oxy-cameras = { workspace = true }
airhouse = { workspace = true, features = ["connector", "rest", "sql-rules", "preview-sql"] }
agentic-pipeline = { workspace = true }
agentic-runtime = { workspace = true }
entity = { workspace = true }
migration = { workspace = true }
chrono = { workspace = true }
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"] }
sea-orm = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }
url = { workspace = true }
uuid = { workspace = true }
testcontainers = { workspace = true, features = [
    "blocking",
    "reusable-containers",
] }
testcontainers-modules = { workspace = true, features = ["postgres", "clickhouse"] }
# `served_router_tests`: build `api_router` (ServeMode, its shutdown token) and
# drive it with `oneshot`.
tokio-util = { workspace = true }

[lints]
workspace = true
