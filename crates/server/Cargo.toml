[package]
name = "oxy-server"
version.workspace = true
authors.workspace = true
description = "Oxy server binary: the composition root that mounts the API surfaces and runs the oxy CLI / HTTP server"
documentation.workspace = true
publish.workspace = true
edition.workspace = true

# Everything the binary runs, as `oxy_server` (decompose LT, 2026-11-23): an
# integration test cannot import a bin, so the code a test outside this crate
# must build lives in the library, behind a thin `main.rs`. `doctest = false`
# keeps the doc comments uncompiled, as they were in the binary.
[lib]
path = "src/lib.rs"
doctest = false

# The command name and the artifact stay `oxy`.
[[bin]]
name = "oxy"
path = "src/main.rs"

[features]
default = ["custom-app-functions", "dev-tools"]
# Forwards to oxy-api-custom-apps' V8 (deno_core) Oxy Functions runtime. On by
# default so a plain build runs the real runtime; `--no-default-features` drops V8
# (Functions endpoints go inert) for the fast local loop — see `.cargo/config.toml`
# bf/rf.
custom-app-functions = ["oxy-api-custom-apps/custom-app-functions"]

# `oxy dev seed | compile | test` (and, for one release, the hidden top-level
# `oxy seed` / `oxy test` aliases): dev tooling that writes demo rows straight
# into a database. On by default, so debug builds, `just up`, CI's agentic job
# and the fleet image have it; the release build
# (`.github/actions/build-oxy-cli`) passes `--no-default-features --features
# custom-app-functions`, so a shipped binary cannot seed. `oxy dev test` is
# oxy-api-eval's command, registered only under this feature (`src/dev.rs`);
# the crate itself is linked in every build for its eval-run routes and task.
# The seed itself (`src/dev/seed`, up from oxy-app in decompose SD) is this
# crate's, and the dependencies only it uses come with the feature.
dev-tools = [
    "oxy-app/dev-tools",
    "dep:agentic-analytics",
    "dep:oxy-authz",
    "dep:serde_yaml",
]

[dependencies]
# oxy-app is the library this binary drives; default-features off so the feature
# forwarding above is the single switch for the V8 runtime. Not a workspace dep
# (only this crate consumes it), so it is a direct path dependency.
oxy-app = { path = "../app", default-features = false }
oxy-api-admin = { path = "../api-admin" }
oxy-api-billing = { path = "../api-billing" }
oxy-api-github = { path = "../api-github" }
oxy-api-tenancy = { path = "../api-tenancy" }
oxy-api-documents = { path = "../api-documents" }
oxy-api-frontline = { path = "../api-frontline" }
oxy-api-identity = { path = "../api-identity" }
oxy-api-operating-graph = { path = "../api-operating-graph" }
# default-features off so the `custom-app-functions` feature above is the one switch for V8.
oxy-api-custom-apps = { path = "../api-custom-apps", default-features = false }
oxy-custom-apps = { workspace = true }
oxy-app-core = { workspace = true }
oxy-workspace-runtime = { workspace = true }
# `serve`'s boot jobs (`commands::serve_background`): the camera-fleet loops and
# compile-boundary maintenance, started by `serve` since decompose BL-W.
oxy-cameras = { workspace = true }
oxy-compile-runtime = { workspace = true }
# The background drivers (`src/drivers`, up from `oxy-app` in decompose BL1):
# the periodic tick's claim and monitor bootstrap read `entity` rows and stamp
# `chrono` times, the global driver sweeps the preview queue (`oxy-previews`),
# the monitor bootstrap is `oxy-metric-monitoring`'s, the audit anchor writes to
# S3, and the dead Stripe seat reconciler calls `oxy-billing`.
entity = { workspace = true }
chrono = { workspace = true }
oxy-previews = { workspace = true }
oxy-metric-monitoring = { workspace = true }
aws-sdk-s3 = { workspace = true }
oxy-billing = { workspace = true }
# The feature-flag cache `serve` and `worker` load at boot.
oxy-feature-flags = { workspace = true }
# The router assembly (`src/router`, `src/admin`, `role_manifest`,
# `role_middleware`), up from `oxy-app` in decompose LIFT: the OLTP and
# Airhouse mounts (`oxy-oltp`), the capability guards and `Caller`
# (`oxy-server-authz`), local mode's refresh-key cache (`agentic-semantic`) and
# its `/setup` writes (`oxy-project`), and the route-declaration stubs
# (`async-trait`).
oxy-oltp = { workspace = true }
oxy-server-authz = { workspace = true }
agentic-semantic = { workspace = true }
oxy-project = { workspace = true }
async-trait = { workspace = true }
oxy-route-catalog = { path = "../route-catalog" }
# `oxy dev seed` (`src/dev/seed`, `dev-tools` only): the demo threads' run
# metadata (`agentic-analytics`), the staff grants' roles (`oxy-authz`) and the
# LLM-key copy's `config.yml` read (`serde_yaml`).
agentic-analytics = { workspace = true, optional = true }
oxy-authz = { workspace = true, optional = true }
serde_yaml = { workspace = true, optional = true }
oxy-api-airway = { path = "../api-airway" }
oxy-api-experiment = { path = "../api-experiment" }
oxy-api-notifications = { path = "../api-notifications" }
oxy-api-slack = { path = "../api-slack", default-features = false }
oxy-api-world-model = { path = "../api-world-model" }
oxy-api-metric-monitoring = { path = "../api-metric-monitoring" }
oxy-api-observability = { path = "../api-observability" }
oxy-api-automations = { path = "../api-automations" }
oxy-api-workspace-config = { path = "../api-workspace-config" }
oxy-api-previews = { path = "../api-previews" }
oxy-api-workspace-health = { path = "../api-workspace-health" }
oxy-api-threads = { path = "../api-threads" }
oxy-api-workspaces = { path = "../api-workspaces" }
oxy-api-semantic = { path = "../api-semantic" }
# The eval context: the eval-run routes and `eval_run` task (`oxyc evals run`),
# in every build, and `oxy dev test`, registered only with `dev-tools` (S10).
oxy-api-eval = { path = "../api-eval" }
oxy-cli-shim = { path = "../cli-shim" }
oxy = { workspace = true }
oxy-observability = { workspace = true }
oxy-telemetry = { workspace = true }

axum = { workspace = true }
# The long-lived commands (`src/commands`): `serve`'s listener, SPA embed and
# Swagger UI; `worker`'s runtime; `start`'s Airhouse and Docker bring-up.
agentic-runtime = { workspace = true }
agentic-http = { workspace = true }
agentic-pipeline = { workspace = true }
# `import`: `oxy dev seed` loads the demo workspace's data files into its
# tenant (`src/dev/seed/seed_airhouse.rs`; oxy-app's until decompose SD).
airhouse = { workspace = true, features = ["connector", "rest", "sql-rules", "preview-sql", "import"] }
axum-server = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
include_dir = { workspace = true }
mime_guess = { workspace = true }
oxy-auth = { workspace = true }
oxy-shared = { workspace = true }
sea-orm = { workspace = true }
# The health probes and route discovery (`core_routes`): their bodies, their
# OpenAPI operations and the probes' share of the served document.
serde = { workspace = true }
serde_json = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
tokio-util = { workspace = true }
tower-serve-static = { workspace = true }
url = { workspace = true }
utoipa-swagger-ui = { workspace = true, features = ["axum"] }
dotenv = { workspace = true }
human-panic = { workspace = true }
libc = { workspace = true }
once_cell = { workspace = true }
# `admission`: the per-workspace in-flight table and its request ids.
dashmap = { workspace = true }
uuid = { workspace = true }
rustls = { workspace = true }
sentry = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
# The custom-app mount's compression layer (`custom_apps_seams`), and the
# router's CORS and timeout layers (`router`; `trace` came with them from
# oxy-app's declaration, which this replaces).
tower-http = { workspace = true, features = ["cors", "trace", "timeout", "compression-br", "compression-gzip"] }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# `sentry::test::with_captured_events`, so the event filter below is pinned
# against what sentry-tracing actually does rather than against a reading of it.
sentry = { workspace = true, features = ["test"] }
# The API-token suite (`tests/integration/token_auth`) drives the served flat
# tree, oxy-app's routes and the surfaces' together, which only this crate can
# compose. It reuses oxy-app's harness (`#[path]`-included from
# crates/app/tests/common), which clones a per-run template database and needs
# every migrator `Schema::All` can apply — the same list as oxy-api-tenancy.
oxy-authz = { workspace = true }
agentic-core = { workspace = true }
migration = { workspace = true }
# The drivers' in-source tests: the monitor config parses (`serde_yaml`).
serde_yaml = { workspace = true }
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"] }
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }
oxy-test-utils = { workspace = true }      # tests/common takes its Postgres from here
# `console_test_notification` and `notification_function_action`: the
# notification tests that span the custom-app and notifications surfaces (a
# surface may not depend on another, not even for tests), with the org-store
# fixture (`oltp_fx`) and a gzipped bundle to publish.
futures = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
# `routing::fleet_canary` (up from oxy-app's `tests/routing` in decompose LIFT)
# serializes the cases that flip the process-global workspace-fs probe.
serial_test = { workspace = true }
# `compile` (from oxy-app's `tests/platform`, decompose T-small): the two
# ignored `oxy compile` smoke tests drive the binary.
assert_cmd = { workspace = true }

[lints]
workspace = true
