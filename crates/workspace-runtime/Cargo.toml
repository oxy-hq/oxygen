[package]
name = "oxy-workspace-runtime"
version.workspace = true
authors.workspace = true
description = "The workspace runtime: what builds and runs an OxyProjectContext, below oxy-server and above oxy-app-core. Started with the leaves (the Airhouse connection pool, ctx.airhouse, typed-stream sinks, the runtime-artifact S3 mirror); the rest of oxy-app's agentic_wiring follows (internal-docs/domain-boundaries.md, End state: no oxy-app)"
documentation.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
# `metric_tree_runner`: the `MetricTreeRunner` port it fills.
agentic-analytics = { workspace = true }
# `project_ctx`: `WorkspaceContext`, the automation port `OxyProjectContext`
# fills beside `ProjectContext`.
agentic-automation = { workspace = true }
agentic-connector = { workspace = true }
agentic-core = { workspace = true }
# `ThreadOwnerLookup` and `AnalyticsMetricSink`, the ports the two adapters fill.
agentic-pipeline = { workspace = true }
# `compile_dispatcher` and `preagg_executor`: the worker's `ExecutingTask` and
# `TaskExecutor`.
agentic-runtime = { workspace = true }
# `connector`: the pooled `AirhouseConnector`. `admin`: the token broker, the
# wire endpoint and `UserRole`, which `ctx.airhouse` mints its credential with.
# `preview-sql`: the preview namespace, its rewrite and verifier
# (`preview_airhouse`).
airhouse = { workspace = true, features = ["connector", "admin", "preview-sql"] }
# `metric_tree_runner`: the refresh-key cache the preagg short-circuit reads.
agentic-semantic = { workspace = true }
entity = { workspace = true }
# `WorkspaceManager`, `DiskSlot` and `DatabaseType`.
oxy = { workspace = true }
# `config::airhouse_pool`: the live-connection ceiling's one source of truth.
oxy-app-core = { workspace = true }
# `request`: the authorization port the workspace middleware enforces through
# (`AuthzEnforcer`, the caller it carries, the token-ceiling caps and
# `EffectiveWorkspaceRole`), held on `AppState.authz` (C4b, 2026-11-28).
contracts-authz = { workspace = true }
# `request::factory_access`: the Factory decision (`oxy_authz::factory`).
oxy-authz = { workspace = true }
# `request::workspace_context`: the authenticated caller the workspace
# middleware authorizes, and the credential it arrived with.
oxy-auth = { workspace = true }
# `blob_store`: the runtime-artifact S3 mirror.
oxy-compile = { workspace = true }
# `scan_source`: a scan miss enqueues the lazy compile (`reconcile::enqueue`),
# and so does `semantic_boundary` on a diskless replica.
oxy-compile-runtime = { workspace = true }
# `project_ctx`: the React runtime flag an agent run reads.
oxy-feature-flags = { workspace = true }
# `compile_dispatcher`: the branch worktree a staging compile reads.
oxy-git = { workspace = true }
# `metric_tree_*`: the semantic engine, the layer and the metric-tree ops.
oxy-airlayer-compat = { workspace = true }
# `metric_tree_*`: the metric-tree series, scenario and projection domain.
oxy-metric-monitoring = { workspace = true }
oxy-observability = { workspace = true }
# `resolver`: the read-only analyst connection a `type: oltp` database
# translates to (`connector`).
oxy-oltp = { workspace = true }
# `preagg_executor`: the cycle it drives, the manifest lock and the worker
# config.
oxy-preagg = { workspace = true }
# The preview schemas' DDL (`ddl`, `ddl_airhouse`, `ddl_duckdb`) the preview
# connector and its DuckDB double send.
oxy-previews = { workspace = true }
# `metric_tree_exec`: the metric tree a projection validates against.
oxy-semantic = { workspace = true }
oxy-shared = { workspace = true }
# `metric_tree_exec`: the world model's instance-scope rule.
oxy-world-model = { workspace = true }

arrow = { workspace = true }
async-trait = { workspace = true }
# `sql_http`: the SQL execute's HTTP answer.
axum = { workspace = true }
# `airhouse_duckdb`: the DuckDB connection the preview stand-in runs on.
duckdb = { workspace = true }
# `metric_tree_*`: dates and the trailing windows.
chrono = { workspace = true }
# `project_ctx`: the workspace timezone an agent run is told.
chrono-tz = { workspace = true }
futures = { workspace = true }
# `result_cache`: the data plane's bounded short-TTL cache.
lru = { workspace = true }
parking_lot = { workspace = true }
parquet = { workspace = true }
# `metric_tree_exec`: the projection's per-series fits run in parallel.
rayon = { workspace = true }
sea-orm = { workspace = true }
# `semantic_boundary`: the request's hub, carried onto the blocking pool that
# parses the semantic model.
sentry = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `project_ctx`: an agent's and an automation's YAML, read from the compiled
# row or the working copy.
serde_yaml = { workspace = true }
tokio = { workspace = true }
# `preagg_executor`: the cycle's cancellation token.
tokio-util = { workspace = true }
tracing = { workspace = true }
# `connector`: the percent-encoded userinfo of a pgwire DSN.
urlencoding = { workspace = true }
# `preview_ctx`: the empty materialised context root a preview agent reads.
tempfile = { workspace = true }
# `preview_ctx`: `PreviewError`.
thiserror = { workspace = true }
# `sql_exec`/`sql_http`: the request and response schemas.
utoipa = { workspace = true, features = ["uuid"] }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# `metric_tree_runner`'s preagg-read test writes its parquet fixture.
duckdb = { workspace = true }
# `preagg_workspace`'s DB-backed tests: the shared test database (`db`) with
# the runtime migrator (`agentic-runtime`, a normal dependency since W4), and
# `connector`'s workspace fixtures.
oxy-test-utils = { workspace = true }
# (`tempfile`: a normal dependency since W5.)
# `preview_airhouse`'s session tests run on a paused clock.
tokio = { workspace = true, features = ["test-util"] }
# (`string_literal`'s tests build their `DatabaseType` fixtures from YAML:
# `serde_yaml`, a normal dependency since W4.)
#
# `tests/integration` (decompose R, 2026-11-24): the group that takes oxy-app's
# database-backed integration tests. It `#[path]`-includes the shared harness
# (`crates/test-utils/harness`), which clones a per-run template database and
# needs every migrator `Schema::All` can apply: `migration` and `oxy-cameras`
# here, the agentic and airhouse ones through normal dependencies. None of these
# depends on this crate (its reverse dependencies are the api-* crates,
# route-catalog and oxy-server), so there is no cycle.
migration = { workspace = true }
oxy-cameras = { workspace = true }
# The harness's OLTP admin URL rewrite (`url::Url`).
url = { workspace = true }
# R-b..R-d add the dev-dependencies their moved tests name, in the PR that
# moves them.
# `airhouse_lifecycle` mounts the `/airhouse/me/*` handlers, which are
# `oxy-api-data-plane`'s (out of airhouse's old `rest` feature). A dev-dependency
# only, so the T3 -> T3 edge is exempt from the tier check.
oxy-api-data-plane = { path = "../api-data-plane" }
# The broker and provisioner tests decode the tokens they mint.
base64 = { workspace = true, features = ["std"] }
# The broker and provisioner take the platform port; these tests hand them the
# production one (`oxy_platform::ProcessPlatformDb`), as oxy-server does.
oxy-platform = { workspace = true }
# `airhouse_pool_poison` parses the pgwire DSN it poisons.
tokio-postgres = { workspace = true }
# The route tests drive a router with `ServiceExt::oneshot`. (`sentry`'s `test`
# feature and `oxy-telemetry` went with `sentry_surface_gate` to
# `oxy-api-custom-apps`, beside the gate it drives: depth stage C, A2.)
tower = { workspace = true, features = ["util"] }
# A `wiremock` Airhouse admin API.
wiremock = { workspace = true }
# The compile cluster (decompose R-b). `airway_compile_boundary` parses the
# pipeline spec it compiles; `airway_fleet_control` drives the Airway fleet
# routes; `feature_flag_refresh` checks the billing gate an unloaded flag cache
# turns off.
agentic-airway = { workspace = true }
# `agentic-http` too for R-d: `run_routes_workspace_scope`,
# `coordinator_any_replica`, `analytics_run_thread_access` and `queued_chat_run`
# mount the agentic routes (`router`, `automation_router`, `airway_router`).
agentic-http = { workspace = true }
oxy-billing = { workspace = true }
# `compile_from_git`'s harness support packs a commit tarball (the unpack itself
# is `oxy-compile-runtime`'s).
flate2 = { workspace = true }
tar = { workspace = true }
# (`oxy-authz`, which `authz_loader_differential` checks the loaded facts
# against: a normal dependency since C4b.)
#
# Enforcement itself, for the tests only (C4b, 2026-11-28: `src/` enforces
# through `contracts-authz`). `authz_loader_differential` drives `loader` and
# the wrapper `Caller`, `admin_staff_scope` drives `staff::scope`, and
# `factory_access`'s unit tests hand the gate the shipped enforcer.
oxy-server-authz = { workspace = true }
# (`frontline_app_grant`, which drove the gate's frontline decision and needed
# `oxy-custom-apps` and `oxy-tenancy`, moved to `oxy-api-custom-apps`' group
# beside the gate it tests: D6, 2026-11-27.)

[lints]
workspace = true
