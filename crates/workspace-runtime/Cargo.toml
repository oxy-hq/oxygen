[package]
name = "oxy-workspace-runtime"
version.workspace = true
authors.workspace = true
description = "The workspace runtime: what builds and runs an OxyProjectContext, below oxy-app and above oxy-app-core. Started with the leaves (the Airhouse connection pool, ctx.airhouse, typed-stream sinks, the runtime-artifact S3 mirror); the rest of oxy-app's agentic_wiring follows (internal-docs/domain-boundaries.md, End state: no oxy-app)"
documentation.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
# `metric_tree_runner`: the `MetricTreeRunner` port it fills.
agentic-analytics = { workspace = true }
agentic-connector = { workspace = true }
agentic-core = { workspace = true }
# `ThreadOwnerLookup` and `AnalyticsMetricSink`, the ports the two adapters fill.
agentic-pipeline = { workspace = true }
# `connector`: the pooled `AirhouseConnector`. `admin`: the token broker, the
# wire endpoint and `UserRole`, which `ctx.airhouse` mints its credential with.
# `preview-sql`: the preview namespace, its rewrite and verifier
# (`preview_airhouse`).
airhouse = { workspace = true, features = ["connector", "admin", "preview-sql"] }
# `metric_tree_runner`: the refresh-key cache the preagg short-circuit reads.
agentic-semantic = { workspace = true }
entity = { workspace = true }
# `WorkspaceManager`, `DiskSlot` and `DatabaseType`.
oxy = { workspace = true }
# `config::airhouse_pool`: the live-connection ceiling's one source of truth.
oxy-app-core = { workspace = true }
# `blob_store`: the runtime-artifact S3 mirror.
oxy-compile = { workspace = true }
# `scan_source`: a scan miss enqueues the lazy compile (`reconcile::enqueue`).
oxy-compile-runtime = { workspace = true }
# `metric_tree_*`: the semantic engine, the layer and the metric-tree ops.
oxy-airlayer-compat = { workspace = true }
# `metric_tree_*`: the metric-tree series, scenario and projection domain.
oxy-metric-monitoring = { workspace = true }
oxy-observability = { workspace = true }
# `resolver`: the read-only analyst connection a `type: oltp` database
# translates to (`connector`).
oxy-oltp = { workspace = true }
# The preview schemas' DDL (`ddl`, `ddl_airhouse`, `ddl_duckdb`) the preview
# connector and its DuckDB double send.
oxy-previews = { workspace = true }
# `metric_tree_exec`: the metric tree a projection validates against.
oxy-semantic = { workspace = true }
oxy-shared = { workspace = true }
# `metric_tree_exec`: the world model's instance-scope rule.
oxy-world-model = { workspace = true }

arrow = { workspace = true }
async-trait = { workspace = true }
# `sql_http`: the SQL execute's HTTP answer.
axum = { workspace = true }
# `airhouse_duckdb`: the DuckDB connection the preview stand-in runs on.
duckdb = { workspace = true }
# `metric_tree_*`: dates and the trailing windows.
chrono = { workspace = true }
futures = { workspace = true }
parquet = { workspace = true }
# `metric_tree_exec`: the projection's per-series fits run in parallel.
rayon = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# `connector`: the percent-encoded userinfo of a pgwire DSN.
urlencoding = { workspace = true }
# `sql_exec`/`sql_http`: the request and response schemas.
utoipa = { workspace = true, features = ["uuid"] }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# `metric_tree_runner`'s preagg-read test writes its parquet fixture.
duckdb = { workspace = true }
# `preagg_workspace`'s DB-backed tests: the shared test database (`db`) with
# the runtime migrator, and `connector`'s workspace fixtures.
agentic-runtime = { workspace = true }
oxy-test-utils = { workspace = true }
tempfile = { workspace = true }
# `preview_airhouse`'s session tests run on a paused clock.
tokio = { workspace = true, features = ["test-util"] }
# `string_literal`'s tests build their `DatabaseType` fixtures from YAML.
serde_yaml = { workspace = true }

[lints]
workspace = true
