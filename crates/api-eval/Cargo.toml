[package]
name = "oxy-api-eval"
version.workspace = true
authors.workspace = true
description = "The eval context: LLM-as-judge evals over .test.yml files. The `oxy dev test` command (dev tooling: oxy-server registers it only with its dev-tools feature; internal-docs/domain-boundaries.md S10) and the eval-run routes plus their `eval_run` task kind that `oxyc evals run` calls, mounted by oxy-server"
documentation.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
# The only oxy-app dependency, through `oxy_app::surface` only: the engine builds
# its runs on `surface::workspace_runtime::OxyProjectContext`. oxy-app never
# depends back on this crate. default-features off so a
# `--no-default-features` build of oxy-server keeps dropping V8.
oxy-app = { path = "../app", default-features = false }
oxy-app-core = { workspace = true }        # AppState
oxy = { workspace = true }
oxy-auth = { workspace = true }            # AuthenticatedUserExtractor
oxy-shared = { workspace = true }
entity = { workspace = true }              # WorkspaceRole on the queued payload
agentic-analytics = { workspace = true }
agentic-connector = { workspace = true }
agentic-core = { workspace = true }
agentic-pipeline = { workspace = true }
agentic-runtime = { workspace = true }     # the run row, the queue, the task executor

anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
enum_dispatch = { workspace = true }
futures = { workspace = true }
indexmap = { workspace = true }
indicatif = { workspace = true }
itertools = { workspace = true }
minijinja = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strip-ansi-escapes = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[lints]
workspace = true

[dev-dependencies]
serde_yaml = { workspace = true }
