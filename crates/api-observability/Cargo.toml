[package]
name = "oxy-api-observability"
version.workspace = true
authors.workspace = true
# Editing this crate re-runs oxy-route-catalog's build script (it watches this
# tree; see crates/route-catalog/build_route_catalog.rs) but does NOT rebuild
# oxy-app — the catalog was moved above it for exactly that reason.
description = "The tenant-facing observability console's HTTP surface (traces, metric usage, execution analytics) — a sibling crate mounted by oxy-server"
documentation.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
# `oxy-app`, for the `admin/` section only (added 2026-11-16 with Admin →
# Observability). The tenant handlers still take nothing of oxy-app's — they
# read `AppState` (`oxy-app-core`) and the observability store it carries — but
# a staff-console section cannot be oxy-app-free: `AdminSection` is oxy-app's
# type, and the staff-scope fence (`admin_scope`) and the console's
# connect-on-demand DB handle (`admin_db`) are oxy-app's too. Deciding a
# bounded grant's reach by hand instead would violate the one rule authz has,
# so this crate waits for oxy-app rather than reimplementing the fence. Nothing
# depends back on this crate, so the catalog note above still holds.
oxy-app = { path = "../app", default-features = false }
oxy-app-core = { workspace = true }            # AppState and its observability store
oxy-observability = { workspace = true }       # WorkspaceScope, the store's row types
oxy = { workspace = true }                     # oxy::metrics / oxy::execution_analytics response shapes
oxy-shared = { workspace = true }              # fleet_role::RouteRoleDecl
oxy-auth = { workspace = true }                # AuthenticatedUserExtractor, for the admin section
# The storage meter's decided algorithm — `storage::metering::time_weighted_average_bytes`,
# the one definition of what a GB-month is. The I/O is batched here (one
# statement over the fleet rather than two per org); the arithmetic is not
# re-implemented, because two copies would eventually disagree about an app
# created mid-period. Free in the graph: `oxy-app`, already a dependency above,
# pulls this crate.
oxy-custom-apps = { workspace = true }
oxy-usage-report = { workspace = true }   # `llm_usage`, the token columns and the rate table
# The admin section's cost rollup reads Postgres directly (`agentic_runs` ×
# `agentic_run_events`), priced by `oxy_usage_report::llm_usage`.
sea-orm = { workspace = true }
# The fleet list reads the current and the prior window side by side.
futures = { workspace = true }
chrono = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true, features = ["uuid", "chrono", "axum_extras"] }
uuid = { workspace = true }
# The cluster map's 2-D projection (PCA over intent embeddings). Moved here from
# oxy-app with `traces.rs`, their only user.
linfa = { workspace = true }
linfa-reduction = { workspace = true }
ndarray = { workspace = true, features = ["rayon"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# Tests only: `surface::bare_app_state` and `surface::roles::declared_role_in`.
# default-features off so the test build does not drag V8 in either.
oxy-app = { path = "../app", default-features = false }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
# The integration group (`tests/integration/`, added with Admin → Metrics in the
# admin split) reuses oxy-app's per-test database harness
# (`crates/app/tests/common/mod.rs`) and the `admin_staff_scope` fixture, both
# included by `#[path]`, so it needs their dependencies too — the same list as
# oxy-api-threads'. Dev-only: nothing here ships.
migration = { workspace = true }
airhouse = { workspace = true }
oxy-oltp = { workspace = true }
oxy-cameras = { workspace = true }
async-trait = { workspace = true }
url = { workspace = true }
tempfile = { workspace = true }
oxy-test-utils = { workspace = true }    # tests/common takes its Postgres from here
agentic-pipeline = { workspace = true }
agentic-runtime = { workspace = true }   # the LLM runs the llm-usage case seeds
entity = { workspace = true }            # the fixture's rows

[lints]
workspace = true
