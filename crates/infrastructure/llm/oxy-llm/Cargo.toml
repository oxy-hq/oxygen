[package]
name = "oxy-llm"
version.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# Config schema types (configs.rs) and the key-validation probes (validation.rs)
# both live in this crate, so it no longer depends on any provider crate — the
# LLM runtime is agentic-llm. `reqwest` backs the key-validation probes.
oxy-shared = { workspace = true }
reqwest = { workspace = true }
schemars = { workspace = true, features = ["derive"] }
serde = { workspace = true }
serde_with = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
wiremock = { workspace = true }
