[package]
name = "oxy-llm"
version.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# oxy-anthropic / oxy-openai are still needed for the key-validation probes
# (validation.rs). Config schema types now live in this crate (configs.rs), so
# oxy-gemini / oxy-ollama are no longer dependencies.
oxy-anthropic = { workspace = true }
oxy-openai = { workspace = true }
oxy-shared = { workspace = true }
schemars = { workspace = true, features = ["derive"] }
serde = { workspace = true }
serde_with = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
