[package]
name = "oxy-api-world-model"
version.workspace = true
authors.workspace = true
# Editing this crate re-runs oxy-route-catalog's build script (it watches this
# tree; see crates/route-catalog/build_route_catalog.rs) but does NOT rebuild
# oxy-app — the catalog was moved above it for exactly that reason.
description = "The world-model app's HTTP surface (live event feed, foot traffic, competitors, the LLM proxy) — a sibling crate mounted by oxy-server"
documentation.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
# What this surface takes from oxy-app, all through `oxy_app::surface`: the
# workspace extractors and the background seam type. oxy-app never depends back
# on this crate. default-features off so a `--no-default-features` build of
# oxy-server keeps dropping V8.
oxy-app = { path = "../app", default-features = false }
oxy-app-core = { workspace = true }     # AppState
oxy-world-model = { workspace = true }  # the live feed's write half
oxy-cameras = { workspace = true }      # the camera-domain event sink
oxy = { workspace = true }
oxy-shared = { workspace = true }       # fleet_role::RouteRoleDecl
entity = { workspace = true }
agentic-core = { workspace = true }
agentic-llm = { workspace = true }
agentic-pipeline = { workspace = true }
async-stream = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
dashmap = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# The integration group (`tests/integration/`) reuses oxy-app's per-test
# database harness (`crates/app/tests/common/mod.rs`, included by `#[path]`),
# so it needs that harness's dependencies too. Dev-only: nothing here ships.
agentic-runtime = { workspace = true }   # tests/common runs the runtime migrator
migration = { workspace = true }
airhouse = { workspace = true }
oxy-oltp = { workspace = true }
url = { workspace = true }
tempfile = { workspace = true }
oxy-test-utils = { workspace = true }    # tests/common takes its Postgres from here
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }

[lints]
workspace = true
