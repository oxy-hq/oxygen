[package]
name = "oxy-api-world-model"
version.workspace = true
authors.workspace = true
# Editing this crate re-runs oxy-route-catalog's build script (it watches this
# tree; see crates/route-catalog/build_route_catalog.rs) but does NOT rebuild
# oxy-app — the catalog was moved above it for exactly that reason.
description = "The world-model app's HTTP surface (live event feed, foot traffic, competitors, the LLM proxy) and the IDE's World Model Graph and peer cohorts — a sibling crate mounted by oxy-server"
documentation.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
# No dependency on oxy-app (dropped in decompose R1): everything this surface
# took through oxy-app's surface module comes from the crates below that hold it.
oxy-app-core = { workspace = true }     # AppState, the background seam, PreaggCacheCtx, servability, the write hold
# The workspace extractors and caches, the scan source, the semantic boundary,
# the SQL and metric-tree executors the graph and cohort reads run on.
oxy-workspace-runtime = { workspace = true }
oxy-server-authz = { workspace = true } # EffectiveWorkspaceRole
oxy-world-model = { workspace = true }  # the live feed's write half; the graph + cohort cores
oxy-custom-apps = { workspace = true }  # the customer-app twins: the viewer's reach (`reach::reach_for_viewer`)
oxy-airlayer-compat = { workspace = true }
oxy-auth = { workspace = true }
agentic-semantic = { workspace = true }
oxy-cameras = { workspace = true }      # the camera-domain event sink
oxy = { workspace = true }
oxy-shared = { workspace = true }       # fleet_role::RouteRoleDecl
entity = { workspace = true }
agentic-core = { workspace = true }
agentic-connector = { workspace = true }  # `WorkspaceWarehouse` holds the platform's connector
async-trait = { workspace = true }
sentry = { workspace = true }            # the cohort twin carries the request's hub onto the blocking pool
agentic-llm = { workspace = true }
agentic-pipeline = { workspace = true }
async-stream = { workspace = true }
axum = { workspace = true }
# The Toast webhook's signature check (`toast_webhook`, out of oxy-app 2026-11-15).
base64 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
dashmap = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# The integration group (`tests/integration/`) reuses oxy-app's per-test
# database harness (`crates/test-utils/harness/mod.rs`, included by `#[path]`),
# so it needs that harness's dependencies too. Dev-only: nothing here ships.
agentic-runtime = { workspace = true }   # the harness runs the runtime migrator
migration = { workspace = true }
airhouse = { workspace = true }
oxy-oltp = { workspace = true }
url = { workspace = true }
tempfile = { workspace = true }
oxy-compile = { workspace = true }       # world_model_diskless compiles a workspace, then deletes it
oxy-compile-runtime = { workspace = true }  # diskless_fixture's runtime config gate
oxy-test-utils = { workspace = true }    # the harness takes its Postgres from here
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }  # the public twins' mount test drives the router

[lints]
workspace = true
