[package]
name = "oxy-telemetry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Platform telemetry: OTLP export of traces + logs to the cluster OTel collector (ClickStack / HyperDX), the structured log format, HTTP request spans and W3C trace propagation"

[dependencies]
oxy-shared = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
http = { workspace = true }
libc = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
opentelemetry-http = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
# For `sentry_filter::sentry_tracing_layer` — the Sentry layer's construction
# lives beside the rules it installs, so a test can pin that the filter is
# actually attached. Already in the tree via `oxy-shared`, so this costs no
# extra build.
sentry = { workspace = true }
serde_json = { workspace = true }
tower-http = { workspace = true, features = ["trace"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json", "registry"] }

[dev-dependencies]
# `compression-br` for the test pinning where `record_error_body` must sit
# relative to a `CompressionLayer`.
tower-http = { workspace = true, features = ["trace", "compression-br"] }
# `testing` turns on the in-memory span exporter the http_trace tests assert
# against — a real OTLP round-trip would need a collector on the test host.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { workspace = true, features = ["util"] }
# `sentry::test::with_captured_events` for the tests pinning that the shipped
# Sentry tracing layer really carries the custom-app event filter.
sentry = { workspace = true, features = ["test"] }
