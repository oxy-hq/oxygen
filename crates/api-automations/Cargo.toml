[package]
name = "oxy-api-automations"
version.workspace = true
authors.workspace = true
# Editing this crate re-runs oxy-route-catalog's build script (it watches this
# tree; see crates/route-catalog/build_route_catalog.rs) and rebuilds only
# oxy-server, which mounts it.
description = "The automations surface: the compile-boundary automation listing and the agentic scheduler's schedule CRUD, run-now and backfill — a sibling crate mounted by oxy-server"
documentation.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
# No oxy-app: everything comes from the crates below it (R1, 2026-11-23).
oxy-server-authz = { workspace = true }  # the `WorkspaceAdmin` guard
# The `WorkspaceManagerReadOnly` extractor (the automation listing reads the
# compile boundary through it), and the tests' `OxyProjectContext`.
oxy-workspace-runtime = { workspace = true }
oxy-app-core = { workspace = true }      # AppState
oxy-shared = { workspace = true }        # fleet_role::RouteRoleDecl
oxy-auth = { workspace = true }          # AuthenticatedUserExtractor
# The scheduler itself and the run rows a manual fire writes. The schedule
# handlers left `agentic-http` for oxy-app because they need `WorkspaceAdmin`;
# they still take the `AgenticState` extension oxy-server layers over the
# workspace seam, which they name through `agentic-runtime`.
agentic-pipeline = { workspace = true }
agentic-runtime = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# The shared harness installs the platform port (`ProcessPlatformDb::install`)
# per test database, as oxy-server does at boot.
oxy-platform = { workspace = true }
# The integration group (`tests/integration/`) reuses the shared per-test
# database harness (`crates/test-utils/harness/mod.rs`, included by `#[path]`),
# so it needs that harness's dependencies too. Dev-only: nothing here ships.
agentic-http = { workspace = true }      # `new_agentic_state`, the test AgenticState
migration = { workspace = true }
airhouse = { workspace = true }
oxy-oltp = { workspace = true }
oxy-cameras = { workspace = true }
oxy = { workspace = true }               # the run-now test's PlatformContext workspace
entity = { workspace = true }
async-trait = { workspace = true }
url = { workspace = true }
tempfile = { workspace = true }
chrono = { workspace = true }
oxy-test-utils = { workspace = true }    # the harness takes its Postgres from here
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tokio-util = { workspace = true }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
