# Excluded from the workspace (see root Cargo.toml `exclude`) so `--workspace`
# never builds its dylib — hence concrete values here instead of `.workspace`
# inheritance (an excluded package is not a member and cannot inherit). Being
# excluded, this crate is also skipped by `cargo fmt --all --check` and
# `cargo clippy --workspace` in CI — the intended trade for never building the
# dylib there; keep it trivially small so that doesn't matter.
[package]
name = "oxy-app-dylib"
# 0.0.0 on purpose: the release version bumper only walks workspace members, so a
# real version here would silently drift. This crate is never published or version-resolved.
version = "0.0.0"
authors = ["oxy engineers"]
description = "Dev-only dynamic-linking shim: re-exports oxy-app as a dylib so `oxy-server --features dev-dynamic` links the ~1.4 GB of heavy deps once and relinks the binary cheaply on each edit. Never built by normal/release builds."
edition = "2024"
publish = false
rust-version = "1.98.1"

# Own (empty) workspace root, so cargo stops walking up here. From a worktree
# under `.claude/worktrees/` the walk reached the outer checkout's Cargo.toml,
# and `cargo fmt --all` died in `cargo metadata`. A cargo call made inside this
# directory therefore writes its own Cargo.lock and target/ — both gitignored.
[workspace]

[lib]
# The whole point: emit a dylib that statically absorbs oxy-app + its heavy deps,
# so the binary links against it dynamically instead of re-doing a ~1 GB static
# link every edit. Only built when oxy-server enables `dev-dynamic`.
crate-type = ["dylib"]

[dependencies]
# default-features off so this dev-only shim never independently forces V8
# (custom-app-functions) onto oxy-app; oxy-server's own
# `custom-app-functions = ["oxy-app/custom-app-functions"]` is the single switch
# that enables it for the default dynamic build. (oxy-server + oxy-api-github set
# the same, so `--no-default-features` drops V8 across the whole binary graph.)
oxy-app = { path = "../app", default-features = false }
