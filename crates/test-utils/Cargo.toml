[package]
name = "oxy-test-utils"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Test utilities, fixtures, and mocks for Oxy"

[dependencies]
# Async support
tokio = { workspace = true, features = [
    "test-util",
    "macros",
    "rt-multi-thread",
] }

# HTTP mocking
wiremock = { workspace = true }

# Fixtures and temporary directories
tempfile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

# Serial test execution (re-exported for convenience)
serial_test = { workspace = true }

# `migration` module: shared central-then-runtime migration ordering for
# integration test fixtures that share one Postgres database. See
# src/migration.rs for why the order is load-bearing.
#
# Central `migration` is named here; the runtime and domain migrators are
# *injected* as type parameters. This crate is a platform crate — `oxy` and
# `oxy-app` dev-depend on it — and platform crates must never depend on an
# `agentic-*` crate (internal-docs/backend-architecture.md).
migration = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[lints]
workspace = true
