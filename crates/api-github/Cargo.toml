[package]
name = "oxy-api-github"
version.workspace = true
authors.workspace = true
# Editing this crate re-runs oxy-route-catalog's build script (it watches this
# tree; see crates/route-catalog/build_route_catalog.rs) but does NOT rebuild
# oxy-app — the catalog was moved above it for exactly that reason.
description = "GitHub OAuth + git-namespace HTTP surface — a sibling crate mounted by oxy-server"
documentation.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
# Production code no longer imports oxy-app (decompose R1 S10): the route
# mount's org-scoped inner middleware (org_middleware + subscription_guard) is
# oxy-app-core's, and the webhook hands a verified push to
# oxy-compile-runtime's `reconcile::push`. Auth is inherited from the seam's
# apply_middleware, not re-applied here. Only the tests still reach oxy-app
# (`bare_app_state`); this entry goes once that lands in oxy-app-core (R0).
# oxy-app never depends back on this crate.
#
# default-features off (github doesn't use custom-app-functions/V8): so a
# `--no-default-features` build of oxy-server actually drops V8, github no longer
# forces it on via resolver-v2 unification. oxy-server's own
# `custom-app-functions` feature is the single switch that turns it back on for
# the default build. In a `--workspace` build oxy-server (default) unifies V8 on,
# so github still builds there.
oxy-app = { path = "../app", default-features = false }
oxy-app-core = { workspace = true }     # AppState (the router state type), org middlewares
oxy-compile-runtime = { workspace = true } # reconcile::push: the webhook's compile hand-off
oxy-server-authz = { workspace = true } # enforce_for, Action, Resource, OrgContextExtractor
oxy = { workspace = true }              # database client, github core (git client / app auth)
oxy-auth = { workspace = true }         # AuthenticatedUserExtractor
oxy-shared = { workspace = true }       # fleet_role::RouteRoleDecl (the webhook's public declaration)
entity = { workspace = true }

axum = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }       # the webhook's push payload
uuid = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
constant_time_eq = { workspace = true }
urlencoding = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tokio = { workspace = true }
tower = { workspace = true, features = ["util"] }
url = { workspace = true }
# GitHub is mocked at the HTTP boundary (`GITHUB_API_URL`), never called.
wiremock = { workspace = true }
# The DB-backed integration tests reuse oxy-app's harness (`#[path]`-included
# from crates/app/tests/common), which clones a per-run template database and
# needs every migrator `Schema::All` can apply — same list as oxy-api-frontline.
migration = { workspace = true }
airhouse = { workspace = true }
oxy-oltp = { workspace = true }
agentic-runtime = { workspace = true }
agentic-pipeline = { workspace = true }
oxy-cameras = { workspace = true }
tempfile = { workspace = true }
oxy-test-utils = { workspace = true }      # tests/common takes its Postgres from here

[lints]
workspace = true
