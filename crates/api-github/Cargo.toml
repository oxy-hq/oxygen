[package]
name = "oxy-api-github"
version.workspace = true
authors.workspace = true
# NOTE: oxy-app does not depend on this crate, but its route-catalog build
# script watches this tree, so editing it still triggers an oxy-app rebuild.
# See crates/app/build_route_catalog.rs (DOC_DIRS / SOURCE_DIRS).
description = "GitHub OAuth + git-namespace HTTP surface — a sibling crate mounted by oxy-server"
documentation.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# The route mount re-applies the org-scoped inner middleware (org_middleware +
# subscription_guard) that live in oxy-app; auth is inherited from the seam's
# apply_middleware, not re-applied here. This is the only oxy-app dependency, and
# oxy-app never depends back on this crate (the whole point of the extraction).
#
# default-features off (github doesn't use custom-app-functions/V8): so a
# `--no-default-features` build of oxy-server actually drops V8, github no longer
# forces it on via resolver-v2 unification. oxy-server's own
# `custom-app-functions` feature is the single switch that turns it back on for
# the default build. In a `--workspace` build oxy-server (default) unifies V8 on,
# so github still builds there.
oxy-app = { path = "../app", default-features = false }
oxy-app-core = { workspace = true }     # AppState (the router state type)
oxy-server-authz = { workspace = true } # enforce_for, Action, Resource, OrgContextExtractor
oxy = { workspace = true }              # database client, github core (git client / app auth)
oxy-auth = { workspace = true }         # AuthenticatedUserExtractor
entity = { workspace = true }

axum = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
constant_time_eq = { workspace = true }
urlencoding = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }
