[package]
name = "oxy-api-previews"
version.workspace = true
authors.workspace = true
# Editing this crate does NOT rebuild oxy-app: oxy-app never depends on it.
description = "Workspace previews' surface (staff open a branch on the real product): the /{workspace_id}/previews routes, the change check, compares, Airway samples, schema drops, the run sweep and maintenance — a sibling crate mounted by oxy-server"
documentation.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
# What this surface still takes from oxy-app, through `oxy_app::surface`: the
# seam types (`AdminNest`, `BackgroundSeam`, `TaskSeam`) and the tests'
# `bare_app_state`, until they move down to oxy-app-core (decompose R0).
# oxy-app never depends back on this crate. default-features off so a
# `--no-default-features` build of oxy-server keeps dropping V8.
oxy-app = { path = "../app", default-features = false }
# The preview platform the runs execute on (the preview Airhouse and context,
# the run resolver, the workspace middleware and SQL execution).
oxy-workspace-runtime = { workspace = true }
# The compile request, the commit compile and the revision-in-use clause.
oxy-compile-runtime = { workspace = true }
# The promoted revision the change check compares against.
oxy-preagg = { workspace = true }
# The previews' rows (registry, DDL, namespace, sources, pin, the run queue),
# below oxy-app since 2026-11-22.
oxy-previews = { workspace = true }
oxy-app-core = { workspace = true }     # AppState, default_branch, the role manifest
oxy = { workspace = true }
oxy-auth = { workspace = true }
oxy-server-authz = { workspace = true } # staff::scope, the compile console's grant fences, role guards, Action
oxy-shared = { workspace = true }       # fleet_role::RouteRoleDecl
oxy-compile = { workspace = true }
oxy-git = { workspace = true }
oxy-cameras = { workspace = true }
entity = { workspace = true }
airhouse = { workspace = true }
agentic-airway = { workspace = true }
agentic-automation = { workspace = true }
agentic-connector = { workspace = true }
agentic-core = { workspace = true }
agentic-pipeline = { workspace = true }
agentic-runtime = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
futures = { workspace = true }
regex = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# The in-source DB tests' harness (`oxy_test_utils::db`) and the integration group's per-test harness (`crates/app/tests/common`, by
# `#[path]`, which clones a per-run template database and needs every migrator
# `Schema::All` can apply), plus what the moved previews tests drive: a DuckDB
# stand-in for Airhouse, a `wiremock` GitHub, the router.
migration = { workspace = true }
duckdb = { workspace = true }
serial_test = { workspace = true }
oxy-app-core = { workspace = true, features = ["test-fixtures"] }
oxy-test-utils = { workspace = true }
oxy-oltp = { workspace = true }
url = { workspace = true }
tempfile = { workspace = true }
flate2 = { workspace = true }
wiremock = { workspace = true }
tar = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
serde_yaml = { workspace = true }
urlencoding = { workspace = true }
tower = { workspace = true, features = ["util"] }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }

[lints]
workspace = true
