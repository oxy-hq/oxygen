name: Review metrics

# The weekly code review report (scripts/review/metrics.ts): coverage, what findings
# led to, cost, and fixes that changed lines an earlier review let through. The report
# lands in the job summary and an artifact, and its headline is posted to Slack in
# #oxy-code-review-metrics.

on:
  schedule:
    - cron: "0 2 * * 1" # Mondays 02:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: "Window, in days, of merged PRs to report on"
        required: false
        default: "7"

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  report:
    if: ${{ github.repository == 'oxy-hq/oxygen-internal' }}
    runs-on: ${{ github.repository == 'oxy-hq/oxygen-internal' && 'warp-ubuntu-latest-arm64-2x' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      # Full history: the escaped-bug trace blames fix commits back to earlier PRs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 26

      - name: Build the report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAYS: ${{ inputs.days || '7' }}
        run: node scripts/review/metrics.ts --days "$DAYS" --out "$RUNNER_TEMP/review-metrics"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v7
        with:
          name: review-metrics
          path: ${{ runner.temp }}/review-metrics
          retention-days: 90

      - name: Post to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: oxy-code-review-metrics
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          "${GITHUB_WORKSPACE}/.github/scripts/slack-post.sh" "$(cat "$RUNNER_TEMP/review-metrics/slack.txt")
          Full report: ${RUN_URL}"
