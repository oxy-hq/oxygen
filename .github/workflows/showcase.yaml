name: Release showcase (preview a PR)

# One PR's release picture, taken ahead of its release because someone asked:
# to see what the thread will show, or to work out why a PR gets no picture.
# Design and failure policy: internal-docs/release-showcase.md.
#
# Nothing starts this but a person. Pictures are taken by the release that
# ships a PR (showcase-release.yaml), which plans and captures each one itself.
# This ran on every PR push until 2026-10: in five days 106 runs started, 19
# paid the model, and one produced a picture — of a PR that had not shipped.
#
#   gh workflow run showcase.yaml -f pr=<N>
#
# It boots main's image with the PR's web-app built in front, seeds it, then: a
# no-model filter drops a PR that cannot have a screen to show, a planner reads
# the rest, the agentic runner follows the steps, and a judge must agree the
# screen it ends on shows the change before anything is kept.
#
# The output is the `showcase-pr-<N>` artifact — plan, screenshot, video — and
# one PR comment saying what was shown. It is for whoever asked: a release
# reads none of it, and plans every PR itself. To carry a preview that looked
# right into the release, say what to show in a `## Showcase` section of the
# PR's description.
#
# Spend is capped hard: SHOWCASE_BUDGET_USD per run. Every model call must fit
# its worst case in what is left before it is made, so a run stops AT the cap,
# never past it.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to preview. Uses main's image; an open PR's web-app is built in front of it.
        type: number
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  showcase:
    name: Preview the showcase
    if: github.repository == 'oxy-hq/oxygen-internal'
    runs-on: warp-ubuntu-latest-arm64-4x
    timeout-minutes: 30
    concurrency:
      group: showcase-${{ inputs.pr }}
      cancel-in-progress: true
    env:
      PR: ${{ inputs.pr }}
      GH_TOKEN: ${{ github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OXY_DATABASE_URL: postgresql://admin:password@localhost:5432/default
      # SHOWCASE_USER in tests/showcase/types.ts: a Global Admin, the highest role
      # that can still enter the product — OXY_OWNER would be higher, but
      # OwnerRedirect sends a Global Owner from every workspace page to the admin
      # billing queue. OXY_GLOBAL_ADMINS also makes `oxy seed` give it the Local
      # org and its Demo workspace, and a release build honours only
      # OXY_DEV_LOGIN_EMAILS.
      OXY_GLOBAL_ADMINS: showcase-staff@oxy.test
      OXY_DEV_LOGIN_EMAILS: showcase-staff@oxy.test
      MAGIC_LINK_LOCAL_TEST: "true"
      OXY_APP_EMAIL_LOCAL_TEST: "1"
      SHOWCASE_OUT: ${{ github.workspace }}/showcase-out
      SHOWCASE_BUDGET_USD: "0.50"
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: default
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d default" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      # An open PR is checked out as its merge ref — the PR on top of main —
      # and a merged one as the dispatched ref, which already contains it.
      # Never the PR's own head: a branch cut before this tooling existed has
      # none of it to run. `inputs.pr` is typed a number, so the ref cannot
      # carry anything else.
      - name: Pick the checkout
        id: ref
        run: |
          state="$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json state --jq .state)"
          echo "PR #${PR} is ${state}"
          if [ "$state" = "OPEN" ]; then echo "ref=refs/pull/${PR}/merge" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Set up pnpm, Node, and Playwright
        uses: ./.github/actions/setup-web-app-test-env
        with:
          install-playwright: "true"

      # Seconds, no server, no model: the agentic runner's selector reads must
      # leave the model's aria-refs valid, and labelled inputs must record a
      # durable selector. The unit suite has no browser; this job has one.
      - name: Runner self-check (browser)
        working-directory: web-app
        run: node --import tsx tests/agentic/runner/selectors.browser-check.ts

      # No boot, no model. `action`: capture (boot and spend), refresh (only
      # correct a stale comment), or none.
      - name: Has this PR anything to show?
        id: detect
        working-directory: web-app
        run: pnpm exec tsx tests/showcase/cli.ts detect --pr "$PR" --out "$SHOWCASE_OUT"

      - name: Install ffmpeg and psql
        if: steps.detect.outputs.action == 'capture'
        run: |
          missing=()
          command -v ffmpeg >/dev/null || missing+=(ffmpeg)
          command -v psql >/dev/null || missing+=(postgresql-client)
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends "${missing[@]}"
          fi

      # Main's image serves the API and this checkout's web-app is built in
      # front of it. A PR's own Rust changes are therefore not in a preview —
      # there is no build of them here — and are in the release's picture.
      - name: Boot and seed oxy
        if: steps.detect.outputs.action == 'capture'
        run: scripts/ci/showcase-boot.sh image ghcr.io/oxy-hq/oxygen:main-latest --spa-checkout

      - name: Plan and capture
        id: capture
        if: steps.detect.outputs.action == 'capture'
        working-directory: web-app
        run: pnpm exec tsx tests/showcase/cli.ts pr --pr "$PR" --out "$SHOWCASE_OUT"

      - name: Upload the record
        if: steps.capture.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: showcase-pr-${{ inputs.pr }}
          path: ${{ env.SHOWCASE_OUT }}/
          retention-days: 30
          if-no-files-found: error

      # After the upload: the comment's pointer names an artifact that exists.
      - name: Comment on the PR
        if: steps.capture.outcome == 'success' || steps.detect.outputs.action == 'refresh'
        working-directory: web-app
        run: pnpm exec tsx tests/showcase/cli.ts comment --pr "$PR" --out "$SHOWCASE_OUT"

      - name: Stop oxy
        if: always() && steps.detect.outputs.action == 'capture'
        run: scripts/ci/showcase-boot.sh stop

      - name: Upload logs
        if: always() && steps.detect.outputs.action == 'capture'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: showcase-logs-pr-${{ inputs.pr }}
          path: ${{ runner.temp }}/showcase-logs/
          retention-days: 7
          if-no-files-found: ignore
