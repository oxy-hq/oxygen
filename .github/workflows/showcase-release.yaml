name: Release showcase (prod)

# Pictures under a prod release announcement. Design and failure policy:
# internal-docs/release-showcase.md.
#
# oxy-hq/infrastructure's oxy-prod-announce.yaml posts the "going live" message
# to #product-releases-prod, then sends a `release-showcase` repository_dispatch
# carrying the message's channel and ts, the image prod now runs, and the
# oxygen-internal range it covers. A repository_dispatch, not a
# workflow_dispatch, because the oxyhelper app infra signs in with holds
# contents:write here but not actions:write — and the first is all
# POST /dispatches asks for. workflow_dispatch stays for a person re-posting a
# release by hand; both arrive as the same five values.
#
# This boots THAT image — the build customers get — seeds it, and for each
# feature and fix the release shipped: a no-model filter drops the ones with no
# screen, a planner reads the rest and says what to show, the agentic runner
# follows the steps, and a judge must agree the screen it ends on shows the
# change. What it accepts is posted as a reply in the announcement's thread.
# This is the only place a picture is taken: nothing runs when a PR is pushed,
# and nothing a by-hand preview (showcase.yaml) left is read here.
#
# It can never delay or undo the announcement: that is already posted, and
# every PR here ends as a row in this run's summary saying what happened to it.
#
# Spend is capped hard per PR (SHOWCASE_FEATURE_BUDGET_USD) inside a cap for
# the whole release (SHOWCASE_RELEASE_BUDGET_USD), features before fixes. A PR
# with no screen costs nothing; one the planner calls not visual costs cents.
#
# `dry_run` (by hand only) captures and posts nothing — no Slack reply, no PR
# comment — and leaves the pictures in the run's artifact: what a release
# would show, before it is one.

on:
  # client_payload: image_tag, from_ref, to_ref, channel, thread_ts — the
  # inputs below, under the same names.
  repository_dispatch:
    types: [release-showcase]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag of ghcr.io/oxy-hq/oxygen prod now runs, e.g. main-1a8c22d or 0.5.153.
        type: string
        required: true
      from_ref:
        description: oxygen-internal commit prod ran before.
        type: string
        required: true
      to_ref:
        description: oxygen-internal commit prod runs now.
        type: string
        required: true
      channel:
        description: Channel ID (C…) of the announcement.
        type: string
        required: true
      thread_ts:
        description: The announcement's ts — replies go in its thread.
        type: string
        required: true
      dry_run:
        description: Capture, but post nothing to Slack or to the PRs. The pictures are in the run's artifact.
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pull-requests: write

defaults:
  run:
    shell: bash

concurrency:
  group: showcase-release-${{ inputs.thread_ts || github.event.client_payload.thread_ts }}
  cancel-in-progress: false

jobs:
  showcase:
    name: Showcase the release
    if: github.repository == 'oxy-hq/oxygen-internal'
    runs-on: warp-ubuntu-latest-arm64-4x
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      OXY_DATABASE_URL: postgresql://admin:password@localhost:5432/default
      # SHOWCASE_USER in tests/showcase/types.ts: a Global Admin, the highest role
      # that can still enter the product — OXY_OWNER would be higher, but
      # OwnerRedirect sends a Global Owner from every workspace page to the admin
      # billing queue. OXY_GLOBAL_ADMINS also makes `oxy seed` give it the Local
      # org and its Demo workspace, and a release build honours only
      # OXY_DEV_LOGIN_EMAILS.
      OXY_GLOBAL_ADMINS: showcase-staff@oxy.test
      OXY_DEV_LOGIN_EMAILS: showcase-staff@oxy.test
      MAGIC_LINK_LOCAL_TEST: "true"
      OXY_APP_EMAIL_LOCAL_TEST: "1"
      SHOWCASE_OUT: ${{ github.workspace }}/showcase-out
      # One PR: its plan, its capture, and one corrected plan when at least
      # half is left. The release: about four real captures and the planner's
      # "not visual" on everything else in a large release.
      SHOWCASE_FEATURE_BUDGET_USD: "0.50"
      SHOWCASE_RELEASE_BUDGET_USD: "2.00"
      # The release's own demo data and web-app source, not main's (see the
      # second checkout): the planner reads routes and screens as they shipped.
      SHOWCASE_EXAMPLES: ${{ github.workspace }}/release-src/examples
      SHOWCASE_SOURCE_ROOT: ${{ github.workspace }}/release-src
      # `inputs` is empty on a repository_dispatch, so each falls through to
      # the payload.
      IMAGE_TAG: ${{ inputs.image_tag || github.event.client_payload.image_tag }}
      FROM_REF: ${{ inputs.from_ref || github.event.client_payload.from_ref }}
      TO_REF: ${{ inputs.to_ref || github.event.client_payload.to_ref }}
      CHANNEL: ${{ inputs.channel || github.event.client_payload.channel }}
      THREAD_TS: ${{ inputs.thread_ts || github.event.client_payload.thread_ts }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: default
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d default" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      # Dispatch inputs and payload fields are free text: shape-check every one
      # before any is used in a ref, an image name or a path.
      - name: Check inputs
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9._-]{1,128}$ ]] || fail "image_tag '$IMAGE_TAG' is not a tag"
          [[ "$FROM_REF" =~ ^[0-9a-f]{7,40}$ ]] || fail "from_ref is not a commit sha"
          [[ "$TO_REF" =~ ^[0-9a-f]{7,40}$ ]] || fail "to_ref is not a commit sha"
          [[ "$CHANNEL" =~ ^[CG][A-Z0-9]{6,}$ ]] || fail "channel is not a channel ID"
          [[ "$THREAD_TS" =~ ^[0-9]{10}\.[0-9]{6}$ ]] || fail "thread_ts is not a Slack ts"

      # Before anything is booted or paid for. A bot that cannot upload files
      # captures every feature and then posts none of them: a green run under
      # an empty thread. auth.test names the token's scopes in a header, so
      # the missing one is known up front — and this run goes red saying so.
      # No header at all proves nothing, and is let through.
      - name: Can the bot post pictures?
        if: inputs.dry_run != true
        run: |
          fail() { echo "::error::$1"; echo "**Nothing was posted.** $1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          [ -n "${SLACK_BOT_TOKEN:-}" ] || fail "SLACK_BOT_TOKEN is not set for this repository."
          hdr="$(mktemp)"
          body="$(curl -sS --max-time 20 -D "$hdr" -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" https://slack.com/api/auth.test || true)"
          if [ "$(jq -r '.ok // false' <<<"$body" 2>/dev/null)" != "true" ]; then
            fail "Slack refused the bot token: $(jq -r '.error // "no answer"' <<<"$body" 2>/dev/null || echo "no answer")."
          fi
          scopes="$(awk 'tolower($0) ~ /^x-oauth-scopes:/ { sub(/^[^:]*:[ \t]*/, ""); print; exit }' "$hdr" | tr -d '\r ')"
          echo "bot scopes: ${scopes:-<not reported>}"
          if [ -n "$scopes" ] && [[ ",${scopes}," != *",files:write,"* ]]; then
            fail "The Slack bot cannot upload files: it needs the files:write scope and has ${scopes}. Add files:write to the app, reinstall it to the workspace, then re-run this job."
          fi

      # The tooling from the default branch, so a release cut before this
      # workflow existed still gets it; the demo data and the web-app source
      # the planner reads from the release itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TO_REF }}
          path: release-src
          sparse-checkout: |
            examples
            web-app/src

      - name: Set up pnpm, Node, and Playwright
        uses: ./.github/actions/setup-web-app-test-env
        with:
          install-playwright: "true"

      # Seconds, no server, no model: the agentic runner's selector reads must
      # leave the model's aria-refs valid, and labelled inputs must record a
      # durable selector. A runner that fails either records nothing it can
      # replay, so this stops the job before a capture is paid for.
      - name: Runner self-check (browser)
        working-directory: web-app
        run: node --import tsx tests/agentic/runner/selectors.browser-check.ts

      - name: Install ffmpeg and psql
        run: |
          missing=()
          command -v ffmpeg >/dev/null || missing+=(ffmpeg)
          command -v psql >/dev/null || missing+=(postgresql-client)
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends "${missing[@]}"
          fi

      - name: Boot and seed the released image
        run: scripts/ci/showcase-boot.sh image "ghcr.io/oxy-hq/oxygen:${IMAGE_TAG}"

      # No token is a dry run to the CLI: it captures, says what it would have
      # posted, and writes no PR comment. The CLI takes its credentials out of
      # its own environment before it reads a PR (tests/showcase/credentials.ts):
      # a step is model output over PR text, and the runner types any ${NAME} a
      # step carries.
      - name: Capture and post
        working-directory: web-app
        env:
          SLACK_BOT_TOKEN: ${{ inputs.dry_run != true && secrets.SLACK_BOT_TOKEN || '' }}
        run: |
          pnpm exec tsx tests/showcase/cli.ts release \
            --from "$FROM_REF" --to "$TO_REF" --out "$SHOWCASE_OUT" \
            --channel "$CHANNEL" --thread-ts "$THREAD_TS"

      - name: Upload what was captured
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: showcase-release-${{ env.IMAGE_TAG }}
          path: ${{ env.SHOWCASE_OUT }}/
          retention-days: 30
          if-no-files-found: ignore

      - name: Stop oxy
        if: always()
        run: scripts/ci/showcase-boot.sh stop

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: showcase-release-logs-${{ env.IMAGE_TAG }}
          path: ${{ runner.temp }}/showcase-logs/
          retention-days: 7
          if-no-files-found: ignore
