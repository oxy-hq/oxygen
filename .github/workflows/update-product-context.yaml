name: Update Product Context

on:
  schedule:
    - cron: "0 8 * * 1" # Every Monday at 15:00 Vietnam time (08:00 UTC)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  update-product-context:
    if: ${{ github.repository == 'oxy-hq/oxygen-internal' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        name: Create GitHub App Token
        id: app-token
        with:
          client-id: ${{ vars.ARGO_APP_CLIENT_ID }}
          private-key: ${{ secrets.ARGO_APP_PRIVATE_KEY }}
          repositories: |
            oxygen-internal
            oxygen-content

      - name: Checkout oxygen-internal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token }}

      - name: Checkout oxygen-content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: oxy-hq/oxygen-content
          token: ${{ steps.app-token.outputs.token }}
          path: oxygen-content
          fetch-depth: 1

      - uses: ./.github/actions/git-identity
        with:
          app-slug: ${{ steps.app-token.outputs.app-slug }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Update product context from changelogs
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh pr
            create:*),Bash(gh pr list:*),Bash(date:*),Bash(ls:*),Bash(wc:*)"
          prompt: |
            You are maintaining `product-context.md` in oxy-hq/oxygen-internal.
            This file is injected into every Claude API call. Its ONLY job is to
            clarify things a coding agent CANNOT cheaply retrieve by reading the
            code: renamed concepts, confusing distinctions between similar
            features, product intent for bug triage, and a few counterintuitive
            gotchas. It is NOT a feature catalog and NOT a changelog.

            ## Guiding principle

            Every line must earn its place by being something an agent could not
            find in a minute by grepping the codebase. Before adding anything,
            ask: "Could an agent retrieve this from the code?" If yes, do NOT add
            it. Prefer a short, dense file over a complete one. Treat ~12,000
            characters as a soft budget and ~20,000 as a hard ceiling (check with
            `wc -c product-context.md`); if an edit would push past the budget,
            prune lower-value lines to make room rather than letting the file
            grow. A net-negative diff is a perfectly good outcome.

            ## Steps

            ### Step 1 — Read existing context

            Read `product-context.md` and note its sections and terse tone.

            ### Step 2 — Read the 10 most recent changelogs

            1. Glob `oxygen-content/changelog/*.mdx`.
            2. Sort by filename (date-based) and read the 10 most recent.
            3. From them, extract ONLY: renamed or removed concepts; new
               confusing distinctions between similar features; new deployment
               modes or auth changes; genuinely non-obvious cross-cutting
               conventions; and counterintuitive, high-cost gotchas (footguns you
               could not guess). Ignore routine features, UI polish, and anything
               an agent would discover by reading the relevant module.

            ### Step 3 — Decide edits (add, rewrite, AND prune)

            - ADD a fact only if it passes the "couldn't grep it" test above and
              is not already covered.
            - REWRITE lines a changelog renamed or made stale.
            - PRUNE aggressively. Remove lines that describe obvious default
              behavior, merely restate how a feature works, duplicate another
              line, have become retrievable, or read like a changelog entry.
              Pruning to stay lean is expected, not a violation.

            Do NOT:
            - Turn this into a feature catalog or paste changelog prose verbatim.
            - Add version numbers, dates, file paths, crate names, or internal
              function names — keep it product-level and evergreen.
            - Add obvious behavior ("a list paginates", "Save appears when there
              are unsaved changes", "a spinner shows while loading").

            ### Step 4 — Edit product-context.md

            Make targeted edits that preserve the existing section structure and
            terse tone. Keep each entry to one or two sentences.

            ### Step 5 — Commit and create PR

            1. Check for changes: `git diff --stat product-context.md`
            2. If no changes, stop here — the document is already up to date.
            3. If changes exist:
               - Create a new branch: `git checkout -b update-product-context/$(date +%Y-%m-%d)`
               - Stage and commit: `git add product-context.md`
               - Commit with message: "docs: update product-context.md from recent changelogs"
               - Push: `git push -u origin HEAD`
               - Create a PR:
                 ```
                 gh pr create --repo oxy-hq/oxygen-internal \
                   --title "docs: update product-context.md from recent changelogs" \
                   --body "Weekly automated update of product-context.md from the 10 most recent entries in oxygen-content/changelog/. This file is a lean clarifier — things an agent can't retrieve from the code, not a feature catalog — so the diff may prune as well as add.

            **Review before merging** — verify that new lines are non-obvious and non-retrievable, and that any pruned lines were genuinely low-value."
                 ```
