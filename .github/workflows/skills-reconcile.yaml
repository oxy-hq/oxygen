name: Skills reconcile

# Keeps the builder's knowledge cards under crates/agentic/builder/knowledge/
# aligned with the platform skills they condense, in sdk/cli/skills/ (the same
# files skills-publish.yaml publishes to oxy-hq/skills). "Drift" means a skill
# changed after the card was last re-condensed from it.
#
# Two jobs, gated on event type:
#
# - `check` (pull_request): runs scripts/check-skills-drift.sh and posts the
#   table to $GITHUB_STEP_SUMMARY. Always exits 0 — a PR that edits a skill
#   is expected to leave its card behind; the reconcile job catches it up.
#
# - `reconcile` (after each Skills publish run + weekly cron + manual):
#   drives anthropics/claude-code-action@v1 through detect → re-condense →
#   record hash → re-sync templates → verify → open PR. Never auto-merges;
#   the cards are opinionated prose and review-by-default is the design.
#
# The sources used to live in oxy-hq/skills and arrived by repository_dispatch.
# They moved into this repo so a skill changes in the same PR as the behaviour
# it describes; the drift check became a local content-hash comparison and the
# cross-repo checkout went away.
#
# See:
#   - crates/agentic/builder/knowledge/README.md (drift + provenance)
#   - scripts/check-skills-drift.sh (the check)
#   - scripts/sync-skills.sh        (verbatim template vendoring)

on:
  schedule:
    - cron: "0 10 * * 1" # Mon 10:00 UTC (safety net)
  workflow_dispatch:
  # After each publish, which runs on every merge to main that touches the skills.
  # Not `push`: claude-code-action runs a prompt only on workflow_dispatch,
  # repository_dispatch, schedule and workflow_run, and fails any other event with
  # "Unsupported event type" before it reads one.
  workflow_run:
    workflows: ["Skills publish"]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - "crates/agentic/builder/knowledge/**"
      - "sdk/cli/skills/**"
      - "scripts/check-skills-drift.sh"
      - "scripts/sync-skills.sh"
      - ".github/workflows/skills-reconcile.yaml"

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  check:
    if: github.event_name == 'pull_request' && github.repository == 'oxy-hq/oxygen-internal'
    runs-on: ${{ github.repository == 'oxy-hq/oxygen-internal' && 'warp-ubuntu-latest-arm64-2x' || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run skills drift check
        run: |
          set +e
          OUT=$(bash scripts/check-skills-drift.sh 2>&1)
          STATUS=$?
          echo "$OUT"
          {
            echo "## Skills drift report"
            echo
            echo '```'
            echo "$OUT"
            echo '```'
            if [ "$STATUS" -eq 0 ]; then
              echo
              echo "All knowledge cards are current with \`sdk/cli/skills/\`."
            elif [ "$STATUS" -eq 1 ]; then
              echo
              echo "Drift detected. The reconcile job re-condenses behind cards after"
              echo "this merges; see \`crates/agentic/builder/knowledge/README.md\` to"
              echo "resolve it in this PR instead."
            else
              echo
              echo "Drift script failed with exit ${STATUS} (infrastructure error)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # Informational only — the PR isn't blocked by drift.
          exit 0

  reconcile:
    if: github.event_name != 'pull_request' && github.repository == 'oxy-hq/oxygen-internal'
    runs-on: ${{ github.repository == 'oxy-hq/oxygen-internal' && 'warp-ubuntu-latest-arm64-2x' || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        name: Create GitHub App Token
        id: app-token
        with:
          client-id: ${{ vars.ARGO_APP_CLIENT_ID }}
          private-key: ${{ secrets.ARGO_APP_PRIVATE_KEY }}
          # Write access to oxygen-internal, for the branch and the PR.
          repositories: oxygen-internal

      - name: Checkout oxygen-internal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token }}

      - uses: ./.github/actions/git-identity
        with:
          app-slug: ${{ steps.app-token.outputs.app-slug }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Reconcile skills drift
        uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          # A push by the Argo App (e.g. a merged reconcile PR) has `oxyhelper[bot]`
          # as its actor; allow it past claude-code-action's bot gate. Matched with
          # a trailing `[bot]` stripped, so `oxyhelper` is enough.
          allowed_bots: "oxyhelper"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --allowedTools
            "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh pr create:*),Bash(gh pr list:*),Bash(./scripts/sync-skills.sh),Bash(./scripts/check-skills-drift.sh),Bash(./scripts/check-skills-drift.sh *),Bash(date:*),Bash(ls:*)"
          prompt: |
            You are reconciling the builder agent's knowledge cards with the
            platform skills they condense. Both live in this repository. When
            a skill changed after its card was last re-condensed, refresh the
            card to absorb the change, then open a PR for human review.

            ## Layout

            - `sdk/cli/skills/<skill>/` — the platform skills: the source of
              truth, published to oxy-hq/skills and shipped in @oxy-hq/cli.
            - `crates/agentic/builder/knowledge/*-reference.md` — authored
              cards. Each carries YAML frontmatter:

              ```yaml
              ---
              source:
                - sdk/cli/skills/<skill>/SKILL.md
                - sdk/cli/skills/<skill>/references/quick-reference.md
              reconciled-hash: <hash the drift script printed>
              ---
              ```

            - `crates/agentic/builder/knowledge/*.yml` — verbatim templates,
              copied from the skills by `./scripts/sync-skills.sh`.

            ## Steps

            ### Step 1 — Detect drift

            Run `./scripts/check-skills-drift.sh`. It prints a status table:
            - exit `0` — everything current → STOP, no commit, no PR.
            - exit `1` — something is BEHIND → continue.
            - exit `2` — broken setup (e.g. a listed source no longer exists) →
              STOP and surface the error in the workflow log.

            ### Step 2 — For each BEHIND card

            1. Read the card and every file in its `source:` list.
            2. Rewrite the card so it condenses what the sources say NOW: add
               new rules, tables and examples; remove anything the sources no
               longer say or now contradict. The sources are code-verified;
               where the card disagrees with them, the sources win.
            3. **Preserve local-only sections.** Some content is specific to
               the builder (the `lookup_reference` tool, onboarding-only
               orchestration, flags like `skip_interpreting`). Keep it.
            4. **Keep the card under ~200 lines.** If it would grow well past
               that, say so in the PR body.
            5. Set `reconciled-hash:` to the value printed by
               `./scripts/check-skills-drift.sh --hash crates/agentic/builder/knowledge/<card>`.
               Do not change `source:` unless a source file was renamed; if it
               was, say so in the PR body.

            ### Step 3 — Refresh templates

            If any template row is BEHIND, run `./scripts/sync-skills.sh`.

            ### Step 4 — Verify

            Re-run `./scripts/check-skills-drift.sh`; it must exit `0`. If it
            does not, STOP with a clear diagnostic — never open a PR with a
            still-broken state.

            ### Step 5 — Check for an existing reconcile PR

            ```bash
            EXISTING=$(gh pr list --repo oxy-hq/oxygen-internal \
                       --search "head:skills-reconcile/" \
                       --state open --json number --jq '.[0].number // empty')
            ```

            If `$EXISTING` is non-empty, STOP — do not open a duplicate. Print
            the existing PR number so a human can fold the new changes in.

            ### Step 6 — Commit and open PR

            ```bash
            BRANCH="skills-reconcile/$(date -u +%Y-%m-%d)"
            git checkout -b "${BRANCH}"
            git add crates/agentic/builder/knowledge/
            git commit -m "chore: reconcile builder knowledge cards with sdk/cli/skills"
            git push -u origin "${BRANCH}"
            ```

            Open the PR with `gh pr create --repo oxy-hq/oxygen-internal`,
            title `chore: reconcile builder knowledge cards with sdk/cli/skills`.
            The body lists each reconciled card, which sources changed, and the
            substance of what the card now says differently, and notes that it
            awaits human review — these cards are the builder's system prompt.

            DO NOT merge the PR. DO NOT enable auto-merge.

            ## Constraints

            - No broad shell access. Allowed bash patterns are limited to
              `git`, `gh pr create`, `gh pr list`, the two scripts under
              `./scripts/`, `date`, and `ls`.
            - Don't push to any branch other than the
              `skills-reconcile/<date>` branch you created.
            - Don't merge the PR.
            - Don't add or remove `source:` paths in card frontmatter
              unless a source file was renamed; if it was, surface that
              clearly in the PR body.
            - Edit nothing outside `crates/agentic/builder/knowledge/` — not
              the skills (they are the source of truth) and not the scripts.
