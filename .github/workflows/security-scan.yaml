name: Security Scan

# Pull requests and pushes to main on oxygen-internal only. The public
# oxy-hq/oxygen mirror gets no scan of its own: every commit it receives was
# scanned here first. The push run also seeds the Trivy binary cache on main,
# the only ref every PR can restore from (see .github/actions/setup-trivy).
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "internal-docs/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "internal-docs/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  vulnerability-scan:
    name: Trivy Dependency Vulnerability Scan
    if: |
      (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/')) &&
      github.repository == 'oxy-hq/oxygen-internal'
    runs-on: warp-ubuntu-latest-arm64-2x
    # Trivy fs scan of the repo; a stuck DB download shouldn't bill > 20m.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-trivy

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "0"
          # JSON, rendered below into counts and a fixable-first table.
          format: json
          output: trivy-vuln-results.json

      - name: Publish vulnerability results to workflow summary
        if: always()
        run: |
          python3 scripts/ci/trivy-summary.py trivy-vuln-results.json --kind vuln \
            --title "Dependency vulnerabilities (CRITICAL, HIGH)" >> "$GITHUB_STEP_SUMMARY"

  secret-scan:
    name: Trivy Secret Scan
    if: |
      (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/')) &&
      github.repository == 'oxy-hq/oxygen-internal'
    runs-on: warp-ubuntu-latest-arm64-2x
    # Secret scan of the tree; bounded well under 15m.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-trivy

      - name: Run Trivy secret scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "1"
          # localhost+2-key.pem is a mkcert local-dev TLS cert (not a real secret).
          # .env.example files contain placeholder values, not real credentials.
          skip-files: "localhost+2-key.pem,localhost+2.pem,**/.env.example"
          trivyignores: .trivyignore.yaml
          # JSON, rendered below as file / line / rule — never the match.
          format: json
          output: trivy-secret-results.json

      - name: Publish secret scan results to workflow summary
        if: always()
        run: |
          python3 scripts/ci/trivy-summary.py trivy-secret-results.json --kind secret \
            --title "Secret scan" >> "$GITHUB_STEP_SUMMARY"
