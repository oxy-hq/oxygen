name: Claude Code Review

# The automated PR review: scripts/review/review.ts, described in
# internal-docs/code-review.md. A general pass and up to three focused lenses run in
# parallel under one dollar cap, a verifier tries to refute each candidate, and the
# result is one summary comment (edited in place on every push) and inline comments for
# should-fix and blocking findings. The `review-gate` status is not set here: this job
# runs the PR's own code, so it holds no status permission. review-gate.yaml, which runs
# from the default branch, sets it when this run finishes.
#
# No path filter. The allowlist this replaced (rs/ts/tsx/css/js/jsx) meant workflows,
# dependency manifests, SQL and the Markdown that steers agents were never reviewed.
# Lockfiles, generated files and binaries are skipped inside the script instead, so a
# PR that touches only those still gets a `review-gate` status.
#
# Runs with the repo's own GITHUB_TOKEN and the Agent SDK rather than
# claude-code-action: that action refuses to run when this file differs from the
# default branch, which silently skipped every stacked PR whose branch carried an
# older copy while its check stayed green.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  claude-review:
    # Release PRs are not skipped here: the script reads their diff and posts "not
    # reviewed" only for the release app's pure version bump (RELEASE_AUTOMATION).
    if: ${{ github.event.pull_request.draft == false && github.repository ==
      'oxy-hq/oxygen-internal' }}
    runs-on: ${{ github.repository == 'oxy-hq/oxygen-internal' && 'warp-ubuntu-latest-arm64-2x' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The PR head, not the merge commit: findings and inline comments carry
          # head line numbers. Full history: merge base, incremental diffs, blame.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # Node before the search kit, so its global `ast-grep` lands on this Node's PATH.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          run_install: false
          package_json_file: scripts/review/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: scripts/review/pnpm-lock.yaml

      - uses: ./.github/actions/claude-search-tools

      - name: Install the reviewer
        working-directory: scripts/review
        run: pnpm install --prod --frozen-lockfile --prefer-offline

      # The dollar cap lives in scripts/review/config.ts (BUDGET); a run that reaches
      # it says so on the PR and fails `review-gate`. Raise it on purpose, never to make
      # a red check go away.
      - name: Review
        timeout-minutes: 25
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/review/review.ts --pr "$PR" --post --require-key
