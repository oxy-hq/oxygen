name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "**.rs"
      - "**.ts"
      - "**.tsx"
      - "**.css"
      - "**.js"
      - "**.jsx"

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write
  actions: read

jobs:
  claude-review:
    if: ${{ github.event.pull_request.draft == false && github.repository ==
      'oxy-hq/oxygen-internal' && !startsWith(github.head_ref, 'release/') }}
    runs-on: ubuntu-latest
    # Agent-driven PR review; cap the LLM loop so a stuck turn can't run away.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history, not depth 1: `detect_changes_tool` diffs against a git
          # base (`HEAD~1` by default, the PR base here), and on a shallow clone
          # that base doesn't exist — the tool then reports no changes, which
          # reads as a clean PR rather than a broken checkout.
          fetch-depth: 0

      # Same search kit a reviewer has locally, so CLAUDE.md's routing table means
      # the same thing here. A diff review is the case it pays for most: the graph
      # answers "what breaks if this changes", and "which handlers in this module
      # skip the audit call" is one ast-grep query — where a text search for
      # `audit::` also matches every comment discussing auditing.
      - uses: ./.github/actions/claude-search-tools

      # Everything the bot posts from here on belongs to *this* review (the
      # progress tracker included); the collapse step below only touches what
      # predates this mark.
      - id: mark
        run: echo "since=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            SCOPE — this PR's diff, and what its own changes can break.

            In scope: the lines this PR adds or modifies, plus their direct side
            effects — callers and callees of changed code, and the persisted,
            wire, or config contracts those edits can violate. Read as much
            surrounding code as you need to judge those lines, but every finding
            must be *caused by this diff*: name the changed line it comes from.

            Out of scope, however true it may be:
            - pre-existing bugs, debt, or style in code this PR did not touch
            - "while you're here" refactors, renames, or extra abstraction
            - features, tests, or docs the PR never set out to add
            - repo-wide patterns the PR merely happens to follow

            At most one trailing line, `Out of scope (FYI): …`, for something
            genuinely serious you noticed outside the diff. Never as a finding,
            never a reason to withhold LGTM.

            This review re-runs on every push. Reaching for new, unrelated code
            after the author fixes what you flagged is what makes a PR never
            converge — each round invents fresh demands and the author can never
            finish. When a push only addresses earlier findings, check those and
            whether the fixes introduced new defects, then stop.

            Within that scope, focus on:
            - Correctness and potential bugs
            - Security implications
            - Performance considerations
            - Conflicts with existing repo guidance (root and crate-local
              CLAUDE.md, internal-docs)

            Post one summary via `gh pr comment` with:
            - one-line verdict: `LGTM` / `LGTM with nits` / `Needs changes` / `Blocking`
            - concise bullets with file:line references
            - for each finding: why it matters + concrete fix suggestion

            If no actionable issues remain, post `No actionable issues found`.

            Do not post inline review comments.
            Only post findings you can defend from the diff and existing repo guidance.

            Wrap issue/PR refs, `@mentions`, and SHAs in backticks
            (e.g. `#1234`, `oxy-hq/oxy-internal#1234`) — bare refs create
            noisy cross-links.

          claude_args: |
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(ast-grep:*),Bash(jq:*)"

      # Keep one live review comment per PR. Every push re-runs the review, so
      # without this the PR accumulates a stack of stale verdicts and readers
      # can't tell which one still applies. Minimize (not delete) so the history
      # stays readable behind GitHub's "show resolved" fold.
      - name: Collapse superseded Claude comments
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SINCE: ${{ steps.mark.outputs.since }}
        run: |
          set -euo pipefail
          owner="${REPO%/*}"
          name="${REPO#*/}"

          gh api graphql -f query='
            query($owner:String!, $name:String!, $pr:Int!) {
              repository(owner:$owner, name:$name) {
                pullRequest(number:$pr) {
                  comments(last:100) {
                    nodes { id createdAt isMinimized author { login __typename } }
                  }
                }
              }
            }' -f owner="$owner" -f name="$name" -F pr="$PR" > comments.json

          # Bot-authored, not already collapsed, and older than this run — so the
          # comments this run just posted survive and only their predecessors fold.
          #
          # Match the login WITHOUT the `[bot]` suffix. That suffix is a REST-API
          # convention; GraphQL's `Bot` type returns the bare `claude`, so a
          # `^claude\[bot\]$` regex here matches nothing and the whole step
          # no-ops while still exiting green. `__typename` carries the "is a bot"
          # half of the test, so the login only has to name WHICH bot; the
          # optional group keeps it correct if GitHub ever spells it either way.
          ids=$(jq -r --arg since "$SINCE" '
            .data.repository.pullRequest.comments.nodes[]
            | select(.isMinimized == false)
            | select(.createdAt < $since)
            | select(.author.__typename == "Bot")
            | select(.author.login | test("^(claude|github-actions)(\\[bot\\])?$"))
            | .id' comments.json)

          # Say what was found. The bug above was invisible precisely because an
          # empty match list is indistinguishable from "nothing to collapse".
          echo "Found $(printf '%s' "$ids" | grep -c . || true) superseded comment(s) to minimize."

          for id in $ids; do
            echo "Minimizing $id"
            gh api graphql -f query='
              mutation($id:ID!) {
                minimizeComment(input:{subjectId:$id, classifier:OUTDATED}) {
                  minimizedComment { isMinimized }
                }
              }' -F id="$id"
          done
