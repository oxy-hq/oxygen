name: Changesets

on:
  workflow_call:
    outputs:
      oxy:
        value: ${{ jobs.changesets.outputs.oxy }}
      web-app:
        value: ${{ jobs.changesets.outputs.web-app }}
      sdk:
        value: ${{ jobs.changesets.outputs.sdk }}
      ci-scripts:
        value: ${{ jobs.changesets.outputs.ci-scripts }}
      ci-counter:
        value: ${{ jobs.changesets.outputs.ci-counter }}
      canary-zoo:
        value: ${{ jobs.changesets.outputs.canary-zoo }}
      custom-app-canary:
        value: ${{ jobs.changesets.outputs.custom-app-canary }}
      docker:
        value: ${{ jobs.changesets.outputs.docker }}
      changes:
        value: ${{ jobs.changesets.outputs.changes }}

permissions:
  contents: write
  actions: read
  pull-requests: read

defaults:
  run:
    shell: bash

jobs:
  changesets:
    runs-on: ${{ github.repository == 'oxy-hq/oxygen-internal' && 'ubuntu-slim' ||
      'ubuntu-latest' }}
    # Checkout + a paths-filter diff; completes in ~20s.
    timeout-minutes: 10
    outputs:
      changes: ${{ steps.changes.outputs.changes }}
      oxy: ${{ steps.changes.outputs.oxy }}
      web-app: ${{ steps.changes.outputs.web-app }}
      sdk: ${{ steps.changes.outputs.sdk }}
      ci-scripts: ${{ steps.changes.outputs.ci-scripts }}
      ci-counter: ${{ steps.changes.outputs.ci-counter }}
      canary-zoo: ${{ steps.changes.outputs.canary-zoo }}
      custom-app-canary: ${{ steps.changes.outputs.custom-app-canary }}
      docker: ${{ steps.changes.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: changes
        with:
          filters: |
            oxy:
              - "crates/**"
              - "**/Cargo.toml"
              - "**/Cargo.lock"
            # web-app and the roots it shares with everything else in the pnpm
            # workspace.
            #
            # `sdk/**` USED to be listed here, because for a while this filter
            # gated every JS job and an sdk change ran no CI at all — that is
            # how the create-oxy-app templates drifted three majors behind what
            # web-app ships without anything going red. The `sdk` filter below
            # covers that properly now, so keeping `sdk/**` here would only
            # mean an sdk-only PR still waiting on Format web, Build web,
            # Web unit tests and Scaffold templates for nothing.
            #
            # ONE JOB STILL NEEDS BOTH: `templates` (ci.yaml) really does build
            # @oxy-hq/sdk, vite-plugin and create-oxy-app, so it is gated on
            # `web-app == true || sdk == true`. Removing `sdk/**` from here
            # without that second edit would have stopped gating it on an sdk
            # change — the exact regression this note exists to prevent.
            web-app:
              - "web-app/**"
              - "scripts/ci/verify-templates.mjs"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "package.json"
              - "turbo.json"
              - "biome.json"
            # The pnpm packages under sdk/, gated on their own so an
            # sdk-only change does not drag the whole web-app pipeline in and,
            # more importantly, so the reverse cannot happen either: the sdk
            # job below is BLOCKING, and hanging it off `web-app` would have
            # meant a web-app-only PR waiting on it for nothing.
            #
            # The shared roots are listed because they really do change these
            # packages: a lockfile bump moves their dependency tree, biome.json
            # decides whether their source lints, and turbo.json/package.json
            # decide how they build.
            sdk:
              - "sdk/**"
              # The job's own gate and the file it derives from. Without these,
              # a change to `verify-sdk-scripts.mjs` — or to the `ci.yaml` steps
              # it reads its requirements out of — does not run the job it is
              # about.
              #
              # BY NAME, not `scripts/ci/**`: that glob also matches
              # `verify-templates.mjs`, which is the `web-app` filter's entry
              # above and has nothing to do with this job — a templates-only
              # change would run a blocking job for nothing. Naming them is
              # what `web-app` already does one filter up.
              - "scripts/ci/verify-sdk-scripts.mjs"
              - "scripts/ci/verify-cli-package.mjs"
              # `ci.yaml` is listed HERE and not on `web-app`, though both jobs
              # live in it, because this one DERIVES from it: the gate reads
              # which scripts the steps run. "its steps are in the file" would
              # apply to every job and gate nothing.
              - ".github/workflows/ci.yaml"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "package.json"
              - "turbo.json"
              - "biome.json"
            # TWO filters for the CI-plumbing jobs, because two consumers need
            # two different scopes.
            #
            # `ci-scripts` gates the FORMATTER. Each entry is something that
            # decides whether a file gets formatted: the scripts Biome is
            # configured to see, the two configs that decide what it does, and
            # the workflows that run and gate it. The extensions mirror lint-staged's
            # globs — the gate must match what actually hands a file over, or a
            # file is configured as covered while nothing ever formats it.
            ci-scripts:
              # Every extension lint-staged hands to Biome, not just the JS set:
              # `.lintstagedrc.js` also claims {css,json,html}, and biome.json's
              # `.github/scripts/**` include is extension-agnostic — so a future
              # `.github/scripts/foo.json` would be covered and ungated. Scoped
              # rather than `**` because `ownership_analysis.py` lives here and
              # matches none of those globs: a Python-only diff would spend a
              # checkout and a pnpm install to format nothing.
              - ".github/scripts/**/*.{js,mjs,ts,tsx,css,json,html}"
              # Biome's ROOT includes, mirrored as globs rather than enumerated.
              # `biome.json` lists `*.json`, `*.js`, `*.ts`, and neither its
              # globs nor paths-filter's cross `/` — so these match root-level
              # files only, exactly the set Biome sees. Enumerating them instead
              # kept coming up one file short (`.lintstagedrc.js`, `biome.json`,
              # then `package.json` / `turbo.json` / `commitlint.config.js`,
              # then `skills-lock.json`); a glob closes it, and a root config
              # added tomorrow is gated the day it lands.
              - "*.json"
              - "*.js"
              - "*.ts"
              # Named explicitly because the matchers may disagree about a
              # leading dot. Biome's `*.json` DOES match one (verified — a probe
              # `.zzz.json` at root was picked up by `biome check .`); bare
              # picomatch does not, though paths-filter passes `dot`, so the
              # globs above may already cover these. Naming them is the reading
              # that is correct either way, and both are Biome-covered.
              - ".lintstagedrc.js"
              - ".mcp.json"
              # And where the job is defined, and where these filters are.
              - ".github/workflows/ci.yaml"
              - ".github/workflows/changesets.yaml"
            # `ci-counter` gates the two RATCHETS. The counter itself is the
            # only file they consume; the other entries are where their logic
            # and their gating live. Folding it into `ci-scripts` would run a
            # typecheck ratchet for an unrelated script; folding it into
            # `web-app` (which gates four jobs) would run an ARM `pnpm build`
            # and the USD-priced agentic suite to exercise a shell precondition.
            ci-counter:
              - ".github/scripts/count-test-files.mjs"
              # The counter is 47 lines; the ratchet shell that CONSUMES it is
              # ~50 lines per job and lives in ci.yaml, so a change to the gate
              # itself has to run the gate. This branch is the evidence: nearly
              # every recent commit edits ci.yaml, and they exercised these jobs
              # only because the PR diff also contains `web-app/**` —
              # paths-filter diffs base…head, not the last push, so the gap is
              # invisible here and live for the next PR.
              - ".github/workflows/ci.yaml"
              # And this file: a diff that edits only these filters decides
              # which jobs run, so it has to run them. Self-reference is the
              # fixed point, not a regress — once listed, editing it matches.
              - ".github/workflows/changesets.yaml"
            # `canary-zoo` gates the drift check between the zoo fixture and
            # the canary's bundled copy of it. The copy exists because an Oxy
            # Function bundle cannot read outside itself, so the two files are
            # kept byte-identical by hand
            # (`scripts/data-shapes/sync-canary-zoo.mjs`).
            #
            # `functions/shape-zoo-sync.test.ts` asserts exactly this too, but
            # platform-canary carries its own `pnpm-workspace.yaml`, so it is
            # outside the root workspace that `vitest` and `lint:ts` walk. The
            # two ci.yaml jobs this gates are the only things that run it:
            # `canary-zoo` (shell, no install) and `canary-tests` (the canary's
            # own vitest files and tsc projects, from its own lockfile).
            canary-zoo:
              - "fixtures/data-shapes/**"
              - "customer-apps/examples/platform-canary/**"
              # And where the job is defined, and where these filters are —
              # the same self-reference the two filters above document.
              - ".github/workflows/ci.yaml"
              - ".github/workflows/changesets.yaml"
            # `custom-app-canary` gates checkpoint 1 of the custom-app guard
            # (`custom-app-canary` in ci.yaml): the PR's own server publishes
            # the PR's own platform canary with the PR's own SDK and `oxyc`, and
            # runs its checks against real engines. Listed: the custom-app
            # surface a published app runs through (serving, publish, functions,
            # secrets, storage, the routers that mount them, subdomain dispatch,
            # auth), the engines its steps write (the warehouse connectors,
            # Airhouse, per-org OLTP), everything under sdk/ (the SDK the canary
            # compiles against, the Vite plugin that builds it, the `oxyc` that
            # publishes and checks it), the canary and the zoo fixture it
            # bundles, the script, and the two workflow files, as above.
            #
            # The job takes the binary `cargo-check-and-test` uploads when the
            # `oxy` filter fired, and builds `oxy-server` itself when it did not
            # (a PR matching only sdk/, the canary or the fixture) — see the
            # job's comment for that fork and what it costs.
            custom-app-canary:
              - "crates/app/src/server/api/custom_apps*"
              - "crates/app/src/server/api/custom_apps*/**"
              - "crates/app/src/server/router/**"
              - "crates/app-core/**"
              - "crates/auth/**"
              - "crates/agentic/connector/**"
              - "crates/airhouse/**"
              - "crates/oltp/**"
              - "sdk/**"
              - "customer-apps/examples/platform-canary/**"
              - "fixtures/data-shapes/**"
              - "scripts/ci/platform-canary-checkpoint.mjs"
              - "scripts/ci/platform-canary-checkpoint.test.mjs"
              - ".github/workflows/ci.yaml"
              - ".github/workflows/changesets.yaml"
            docker:
              - "Dockerfile*"
              - ".dockerignore"
              - "docker-compose.yml"
