name: Skills publish

# Publishes Oxy's platform skills to the public oxy-hq/skills repository.
#
# `sdk/cli/skills/` is the ONE source of the skills an agent needs to build on
# Oxy (custom apps, semantic models, agents, automations, Airway, data apps,
# evals, oxyc). It already ships inside @oxy-hq/cli for `oxyc skills install`;
# this puts the same files where every other installer looks:
#
#   npx skills add oxy-hq/skills                 (Claude Code, Cursor, Codex, …)
#   /plugin marketplace add oxy-hq/skills         (Claude Code plugin `oxy@oxy-hq`)
#
# On every merge to main that touches the skills, `sdk/cli/scripts/skills-repo.mjs
# render` rewrites the public repo's managed paths — `skills/`, `.claude-plugin/`,
# `README.md` — and this job pushes the result straight to its main. Everything
# else in that repo (LICENSE, its own workflows) is left alone. The render refuses
# a bundle any Agent Skills reader would reject, so a bad skill fails here, loudly,
# rather than installing as five skills out of six.
#
# The plugin carries no `version`, so Claude Code versions it by commit: each push
# here is an update for everyone who installed it.
#
# PREREQUISITE: the Argo GitHub App must be installed on oxy-hq/skills with
# Contents: write. Its main has no rule but no-deletion / no-force-push, so a
# fast-forward push needs nothing else.

on:
  push:
    branches: [main]
    paths:
      - "sdk/cli/skills/**"
      - "sdk/cli/scripts/skills-repo.mjs"
      - ".github/workflows/skills-publish.yaml"
  workflow_dispatch:

concurrency:
  group: skills-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish oxy-hq/skills
    # main only, dispatch included: a run from a branch would publish that branch's skills.
    if: github.repository == 'oxy-hq/oxygen-internal' && github.ref == 'refs/heads/main'
    runs-on: ${{ github.repository == 'oxy-hq/oxygen-internal' && 'warp-ubuntu-latest-arm64-2x' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "pnpm"

      # The render needs only `yaml`, which is a dependency of sdk/cli.
      - name: Install sdk/cli dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --filter ./sdk/cli

      - name: Check the bundle installs everywhere
        run: node sdk/cli/scripts/skills-repo.mjs check

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          client-id: ${{ vars.ARGO_APP_CLIENT_ID }}
          private-key: ${{ secrets.ARGO_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          repositories: skills

      - name: Check out oxy-hq/skills
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: oxy-hq/skills
          token: ${{ steps.app-token.outputs.token }}
          path: skills-public

      - uses: ./.github/actions/git-identity
        with:
          app-slug: ${{ steps.app-token.outputs.app-slug }}
          token: ${{ steps.app-token.outputs.token }}
          path: skills-public

      - name: Render and push
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node sdk/cli/scripts/skills-repo.mjs render skills-public --source-sha "$SOURCE_SHA"
          cd skills-public
          git add -A skills .claude-plugin README.md
          if git diff --cached --quiet; then
            echo "oxy-hq/skills already matches sdk/cli/skills @ ${SOURCE_SHA::12}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --stat
          git commit -q -m "sync: sdk/cli/skills @ oxy-hq/oxygen-internal@${SOURCE_SHA::12}"
          git push origin HEAD:main
          {
            echo "Published sdk/cli/skills @ \`${SOURCE_SHA::12}\` to oxy-hq/skills:"
            echo
            echo '```'
            git show --stat --format='%h %s' HEAD
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
