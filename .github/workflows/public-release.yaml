name: Public Release

on:
  # Stable releases (tag push) and Edge builds (main push)
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
    branches:
      - main
    paths-ignore:
      - "docs/**"

  # Manual dispatch with options
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "edge"
        type: choice
        options:
          - stable
          - edge
      tag:
        description: "Tag/version for stable release (required for stable)"
        required: false
        default: ""
      build_docker:
        description: "Build and publish Docker image"
        required: false
        default: true
        type: boolean

env:
  CARGO_TERM_COLOR: always
  # Compiles the standalone `oxyc` binaries (job build-oxyc).
  BUN_VERSION: 1.4.0
  MACOSX_DEPLOYMENT_TARGET: "12.0"

defaults:
  run:
    shell: bash

permissions:
  contents: write
  actions: read
  packages: write
  pull-requests: read
  attestations: write
  id-token: write
  security-events: write

jobs:
  # ============================================================================
  # Job 1: Determine build type and set all conditional flags
  # ============================================================================
  determine-build-type:
    if: |
      github.repository == 'oxy-hq/oxygen' &&
      !(github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        startsWith(github.event.head_commit.message, 'chore: release'))
    name: Determine Build Type
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      channel: ${{ steps.config.outputs.channel }}
      version: ${{ steps.config.outputs.version }}
      display_name: ${{ steps.config.outputs.display_name }}
      should_build: ${{ steps.config.outputs.should_build }}
      should_build_docker: ${{ steps.config.outputs.should_build_docker }}
      release_repo: ${{ steps.config.outputs.release_repo }}
      needs_changesets: ${{ steps.config.outputs.needs_changesets }}
      is_stable: ${{ steps.config.outputs.is_stable }}
      short_sha: ${{ steps.config.outputs.short_sha }}
      current_date: ${{ steps.config.outputs.current_date }}
    steps:
      - name: Determine configuration
        id: config
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          CURRENT_DATE=$(date -u +'%Y%m%d')
          BUILD_DOCKER="${{ github.event_name == 'workflow_dispatch' && inputs.build_docker == false && 'false' || 'true' }}"
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "current_date=${CURRENT_DATE}" >> $GITHUB_OUTPUT

          # Determine channel based on trigger
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/* ]]; then
            # Tag push = stable release
            CHANNEL="stable"
            VERSION="${{ github.ref_name }}"
            DISPLAY_NAME="Release ${VERSION}"
            SHOULD_BUILD="true"
            RELEASE_REPO="oxy-hq/oxygen"
            NEEDS_CHANGESETS="false"
            IS_STABLE="true"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.release_type }}" == "stable" ]]; then
            # Manual stable release
            CHANNEL="stable"
            VERSION="${{ inputs.tag }}"
            if [ -z "$VERSION" ]; then
              echo "::error::Tag is required for stable release"
              exit 1
            fi
            DISPLAY_NAME="Release ${VERSION}"
            SHOULD_BUILD="true"
            RELEASE_REPO="oxy-hq/oxygen"
            NEEDS_CHANGESETS="false"
            IS_STABLE="true"
          else
            # Push to main or manual edge — defer to changesets.
            #
            # "Edge" here is the NIGHTLY CLI CHANNEL and nothing else: VERSION is
            # the GitHub release tag in oxy-hq/oxygen-nightly, installed from
            # nightly.oxy.tech. It is not a docker tag — the image from this same
            # build is `main-<sha>` (see the tag step below). The two used to share
            # the name and it was never the same artifact.
            CHANNEL="edge"
            VERSION="edge-${SHORT_SHA}"
            DISPLAY_NAME="Edge Build ${SHORT_SHA}"
            SHOULD_BUILD="defer"
            NEEDS_CHANGESETS="true"
            RELEASE_REPO="oxy-hq/oxygen-nightly"
            IS_STABLE="false"
          fi

          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "display_name=${DISPLAY_NAME}" >> $GITHUB_OUTPUT
          echo "should_build=${SHOULD_BUILD}" >> $GITHUB_OUTPUT
          echo "should_build_docker=${BUILD_DOCKER}" >> $GITHUB_OUTPUT
          echo "release_repo=${RELEASE_REPO}" >> $GITHUB_OUTPUT
          echo "needs_changesets=${NEEDS_CHANGESETS}" >> $GITHUB_OUTPUT
          echo "is_stable=${IS_STABLE}" >> $GITHUB_OUTPUT

          {
            echo "### Build Configuration"
            echo "| Setting | Value |"
            echo "|---------|-------|"
            echo "| Channel | ${CHANNEL} |"
            echo "| Version | ${VERSION} |"
            echo "| Release Repo | ${RELEASE_REPO} |"
            echo "| Build Docker | ${BUILD_DOCKER} |"
            echo "| Needs Changesets | ${NEEDS_CHANGESETS} |"
          } >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Job 2: Changesets (for edge builds only)
  # ============================================================================
  changesets:
    name: Changesets
    needs: [determine-build-type]
    if: needs.determine-build-type.outputs.needs_changesets == 'true'
    uses: ./.github/workflows/changesets.yaml

  # ============================================================================
  # Shared condition: should we run the build pipeline?
  # Stable/manual releases: always.
  # Edge: only if a relevant changeset is detected.
  # ============================================================================

  # ============================================================================
  # Job 3: Build web-app once (shared across all CLI targets)
  # ============================================================================
  build-web-app:
    name: Build web-app
    needs: [determine-build-type, changesets]
    if: |
      always() &&
      needs.determine-build-type.result == 'success' &&
      (needs.determine-build-type.outputs.should_build == 'true' ||
       (needs.changesets.result == 'success' &&
        (needs.changesets.outputs.oxy == 'true' ||
         needs.changesets.outputs.web-app == 'true' ||
         needs.changesets.outputs.docker == 'true')))
    runs-on: ubuntu-latest
    # Production web-app build; 30m covers a cold turbo/Vite build.
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          ref: ${{ needs.determine-build-type.outputs.is_stable == 'true' &&
            needs.determine-build-type.outputs.version || github.sha }}

      - uses: pnpm/action-setup@v6.0.9
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "pnpm"

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm store cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Cache TypeScript build info
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            web-app/tsconfig.app.tsbuildinfo
            web-app/tsconfig.node.tsbuildinfo
          key:
            typescript-${{ runner.os }}-${{ hashFiles('web-app/tsconfig*.json',
            'web-app/src/**/*.ts', 'web-app/src/**/*.tsx') }}
          restore-keys: |
            typescript-${{ runner.os }}-

      - name: Cache Vite
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: web-app/node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml',
            'web-app/vite.config.*') }}
          restore-keys: |
            vite-${{ runner.os }}-

      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('web-app/**',
            '**/pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies & Build web-app
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          # Sentry `oxy-web`, stable releases only: an edge build has no X.Y.Z to
          # name its release. Empty values keep the bundle dark and the build
          # map-free (web-app/vite.config.ts UPLOAD_SOURCEMAPS), which is also what
          # a repo without these secrets gets. No environment here: one image
          # serves staging then prod, so web-app/src/sentry.ts reads it from the
          # host. This workflow runs only in oxy-hq/oxygen; the secrets live there.
          VITE_SENTRY_DSN: ${{ needs.determine-build-type.outputs.is_stable == 'true' &&
            secrets.VITE_SENTRY_DSN || '' }}
          VITE_SENTRY_RELEASE: ${{ needs.determine-build-type.outputs.is_stable == 'true' &&
            format('oxy@{0}', needs.determine-build-type.outputs.version) || '' }}
          SENTRY_AUTH_TOKEN: ${{ needs.determine-build-type.outputs.is_stable == 'true' &&
            secrets.SENTRY_AUTH_TOKEN || '' }}
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm build

      - name: Upload web-app dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-app-dist
          path: web-app/dist/
          if-no-files-found: error
          retention-days: 1

  # ============================================================================
  # Job 4a: Build Linux CLI (x86_64 + arm64)
  #
  # Split from the macOS build so the Docker image build (which only consumes
  # the Linux binaries) can start as soon as these finish, without waiting on
  # the slower macOS job. The shared per-target build steps live in the
  # ./.github/actions/build-oxy-cli composite action.
  # ============================================================================
  build-cli-linux:
    name: Build ${{ needs.determine-build-type.outputs.channel }} CLI for ${{
      matrix.job.target }}
    needs: [determine-build-type, build-web-app]
    if: |
      always() &&
      needs.determine-build-type.result == 'success' &&
      needs.build-web-app.result == 'success'
    runs-on: ${{ matrix.job.os }}
    # Release-mode cross-compile of the oxy CLI; 90m for a cold release build.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        job:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            generate_schema: "true"
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            generate_schema: "false"
    steps:
      # Checkout must run before the local composite action can be resolved.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          ref: ${{ needs.determine-build-type.outputs.is_stable == 'true' &&
            needs.determine-build-type.outputs.version || github.sha }}

      - name: Build oxy CLI
        uses: ./.github/actions/build-oxy-cli
        with:
          target: ${{ matrix.job.target }}
          generate_schema: ${{ matrix.job.generate_schema }}
          cache_os: ${{ matrix.job.os }}
          app_client_id: ${{ vars.ARGO_APP_CLIENT_ID }}
          app_private_key: ${{ secrets.ARGO_APP_PRIVATE_KEY }}
          repo_owner: ${{ github.repository_owner }}

  # ============================================================================
  # Job 4b: Build macOS CLI (Apple Silicon)
  #
  # Runs in parallel with build-cli-linux but is not on the Docker critical
  # path — only the release job waits for it.
  # ============================================================================
  build-cli-macos:
    name: Build ${{ needs.determine-build-type.outputs.channel }} CLI for
      aarch64-apple-darwin
    needs: [determine-build-type, build-web-app]
    if: |
      always() &&
      needs.determine-build-type.result == 'success' &&
      needs.build-web-app.result == 'success'
    runs-on: macos-latest
    # Release-mode build of the macOS CLI; 90m for a cold release build.
    timeout-minutes: 90
    steps:
      # Checkout must run before the local composite action can be resolved.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          ref: ${{ needs.determine-build-type.outputs.is_stable == 'true' &&
            needs.determine-build-type.outputs.version || github.sha }}

      - name: Build oxy CLI
        uses: ./.github/actions/build-oxy-cli
        with:
          target: aarch64-apple-darwin
          generate_schema: "false"
          cache_os: macos-latest
          app_client_id: ${{ vars.ARGO_APP_CLIENT_ID }}
          app_private_key: ${{ secrets.ARGO_APP_PRIVATE_KEY }}
          repo_owner: ${{ github.repository_owner }}

  # ============================================================================
  # Job 4b: Build oxyc (the TypeScript CLI)
  # ============================================================================
  build-oxyc:
    name: Build ${{ needs.determine-build-type.outputs.channel }} oxyc
    needs: [determine-build-type]
    if: |
      always() &&
      needs.determine-build-type.result == 'success'
    runs-on: ubuntu-latest
    # One job, not a matrix: `bun build --compile` cross-compiles every target
    # from a single host in seconds, so there is nothing to parallelise.
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          ref: ${{ needs.determine-build-type.outputs.is_stable == 'true' &&
            needs.determine-build-type.outputs.version || github.sha }}

      - uses: pnpm/action-setup@v6.0.9
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "pnpm"

      # Pinned via npm rather than a third-party action: bun is only needed to
      # compile the release binaries, so it stays out of the lockfile and off
      # every other job's critical path.
      - name: Install Bun
        run: npm install --global bun@${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --filter "./sdk/cli..."

      # Compiles `template/`, `skills/` and `json-schemas/` INTO each binary
      # (scripts/embed-assets.mjs), which is what makes the curl install a
      # single self-contained file.
      - name: Build standalone binaries
        run: pnpm --filter @oxy-hq/cli run build:binary

      # RUN ONE, because nothing else ever does. Every test in the package
      # executes on Node, and `locate.ts` prefers a package on disk whenever one
      # exists — so `extractEmbeddedAssets()`, the thing that makes the curl
      # install work at all, runs in exactly this configuration and nowhere
      # else. Compiling, checksumming and releasing an artifact no one has
      # started is how a resolution difference under `bun build --compile`
      # reaches a customer's `curl | bash` instead of this log.
      #
      # Only the host target can be executed here; the other three are
      # cross-compiled and share the bundle, so this covers the bundling and
      # the Bun runtime, not each platform.
      - name: Smoke-test the compiled binary
        working-directory: sdk/cli/binaries
        env:
          BIN: ./oxyc-x86_64-unknown-linux-gnu
        run: |
          set -euo pipefail
          chmod +x "$BIN"
          "$BIN" --version
          "$BIN" exit-codes > /dev/null
          "$BIN" routes --help > /dev/null

          # A HOME of its own: `skills list` resolves `~/.claude/skills`, and a
          # smoke test must not read or write the runner's real one.
          export HOME="$(mktemp -d)"
          # THE ASSERTION IS ON THE OUTPUT, not the exit code. `skills list`
          # with nothing to list warns and still exits 0 — deliberately, a
          # listing that finds nothing is not a failure — so an exit-code check
          # alone passes on a build whose assets never unpacked. Naming a skill
          # is what proves extraction ran. One command covers all three asset
          # directories: `extractEmbeddedAssets` refuses to publish a tree
          # missing any of them (`looksComplete`).
          "$BIN" skills list | tee /dev/stderr | grep -q 'oxy-cli'

      - name: Checksums
        working-directory: sdk/cli/binaries
        run: |
          for f in oxyc-*; do
            sha256sum "$f" | tee "SHA256SUM-$f.txt"
          done

      - name: Upload oxyc binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-oxyc
          path: |
            sdk/cli/binaries/oxyc-*
            sdk/cli/binaries/SHA256SUM-oxyc-*.txt
          if-no-files-found: error
          retention-days: 7

  # ============================================================================
  # Job 5: Release CLI
  # ============================================================================
  release-cli:
    name: Release ${{ needs.determine-build-type.outputs.channel }} CLI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [determine-build-type, build-cli-linux, build-cli-macos, build-oxyc]
    # Concurrency: Lock releases per channel and version/ref; queue (don't cancel)
    # so commits release in push order.
    concurrency:
      group: >-
        ${{ startsWith(github.ref, 'refs/tags/') && format('release-stable-{0}', github.ref_name) ||
            'release-edge-main' }}
      cancel-in-progress: false
    if: |
      always() &&
      needs.determine-build-type.result == 'success' &&
      needs.build-cli-linux.result == 'success' &&
      needs.build-cli-macos.result == 'success' &&
      needs.build-oxyc.result == 'success'
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        name: Create GitHub App Token
        id: app-token
        with:
          client-id: ${{ vars.ARGO_APP_CLIENT_ID }}
          private-key: ${{ secrets.ARGO_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            oxygen
            oxygen-internal
            oxygen-nightly

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Stable releases need full history for git-cliff release notes.
          # Edge releases only need HEAD.
          fetch-depth: ${{ needs.determine-build-type.outputs.is_stable == 'true' && 0 || 1 }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Download release assets from artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          pattern: cli-*
          merge-multiple: true

      - name: Combine checksums and ensure executables
        run: |
          cat artifacts/SHA256SUM-oxy-*.txt artifacts/SHA256SUM-oxyc-*.txt \
            | tee artifacts/SHA256SUMS.txt
          chmod +x artifacts/oxy-* artifacts/oxyc-*

      - name: Get commit message
        id: commit-msg
        run: |
          {
            echo "message<<EOF"
            git log -1 --pretty=format:'%s' ${{ github.sha }}
            echo ""
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Install git-cliff (stable only)
        if: needs.determine-build-type.outputs.is_stable == 'true'
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: git-cliff

      - name: Generate release notes (stable only)
        if: needs.determine-build-type.outputs.is_stable == 'true'
        run: git cliff --current -o /tmp/release-notes.md

      - name: Create stable release
        if: needs.determine-build-type.outputs.is_stable == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          draft: false
          prerelease: true
          tag_name: ${{ needs.determine-build-type.outputs.version }}
          body_path: /tmp/release-notes.md
          files: |
            artifacts/oxy-*
            artifacts/oxyc-*
            artifacts/SHA256SUM-*.txt
            artifacts/SHA256SUMS.txt
            artifacts/*.json
            artifacts/*.whl
          fail_on_unmatched_files: false

      - name: Create edge release
        if: needs.determine-build-type.outputs.is_stable == 'false'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          draft: false
          repository: ${{ needs.determine-build-type.outputs.release_repo }}
          prerelease: false
          make_latest: true
          tag_name: ${{ needs.determine-build-type.outputs.version }}
          name: ${{ needs.determine-build-type.outputs.display_name }} (${{
            needs.determine-build-type.outputs.version }})
          files: |
            artifacts/oxy-*
            artifacts/oxyc-*
            artifacts/*.json
          fail_on_unmatched_files: false
          body: |
            Channel: ${{ needs.determine-build-type.outputs.channel }}
            Date: ${{ needs.determine-build-type.outputs.current_date }}
            Commit: [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            Message: ${{ steps.commit-msg.outputs.message }}
            Tag: ${{ needs.determine-build-type.outputs.version }}
            To install latest:
            `bash <(curl --proto '=https' --tlsv1.2 -LsSf https://nightly.oxy.tech)`
            To install this exact build:
            `OXY_VERSION=${{ needs.determine-build-type.outputs.version }} bash <(curl --proto '=https' --tlsv1.2 -LsSf https://nightly.oxy.tech)`

  # ============================================================================
  # Job 6: Build and Publish Docker Images (linux/amd64 + linux/arm64)
  # ============================================================================
  # Can the stable image be a RETAG rather than a rebuild?
  #
  # Under the deploy train (oxygen-internal internal-docs/deploy-pipeline.md) a
  # release is cut from a commit whose `main-<sha>` image has already served prod,
  # so building `X.Y.Z` from the same source produces a second artifact to trust
  # for no reason — and costs ~55 minutes on the critical path. When the tag's
  # commit has a `main-` image, `X.Y.Z` and `latest` are made to point at that
  # exact digest instead.
  #
  # It FALLS BACK to building, on purpose: a hotfix tagged on an `X.Y.x` branch
  # never had a `main-` image because that branch is not main. Publishing must keep
  # working there, so an absent digest is a build, not an error.
  resolve-stable-digest:
    name: Resolve the stable digest
    needs: [determine-build-type]
    if: needs.determine-build-type.outputs.is_stable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      retag_from: ${{ steps.probe.outputs.retag_from }}
    steps:
      - name: Look for main-<sha> on ghcr
        id: probe
        env:
          SHORT_SHA: ${{ needs.determine-build-type.outputs.short_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository_owner }}/oxygen"
          PULL=$(curl -fsS -u "x:${GH_TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${{ github.repository_owner }}/oxygen:pull" \
            | jq -r .token)
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -I \
            -H "Authorization: Bearer ${PULL}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/${{ github.repository_owner }}/oxygen/manifests/main-${SHORT_SHA}")
          if [[ "$CODE" == "200" ]]; then
            echo "retag_from=main-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "::notice::${IMAGE}:main-${SHORT_SHA} exists; the stable image will be a retag, not a rebuild"
          else
            echo "retag_from=" >> "$GITHUB_OUTPUT"
            echo "::notice::no main-${SHORT_SHA} on ghcr (HTTP ${CODE}); building the stable image"
          fi

  build-docker-images:
    name: Build ${{ needs.determine-build-type.outputs.channel }} Docker for ${{
      matrix.arch }}
    # Only depends on the Linux binaries — Docker images consume just the two
    # linux/amd64 + linux/arm64 builds, so it must not wait for the macOS job.
    needs: [determine-build-type, build-cli-linux, resolve-stable-digest]
    if: |
      always() &&
      needs.build-cli-linux.result == 'success' &&
      needs.determine-build-type.outputs.should_build_docker == 'true' &&
      needs.resolve-stable-digest.outputs.retag_from == ''
    concurrency:
      group: docker-${{ needs.determine-build-type.outputs.channel }}-${{
        matrix.arch }}
      cancel-in-progress: false
    runs-on: ${{ matrix.runner }}
    # Docker image build + push (binaries are prebuilt); 45m headroom.
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: linux/amd64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            arch_tag: amd64
          - arch: linux/arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            arch_tag: arm64
    steps:
      - name: Checkout Dockerfile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          ref: ${{ needs.determine-build-type.outputs.is_stable == 'true' &&
            needs.determine-build-type.outputs.version || github.sha }}
          sparse-checkout: |
            Dockerfile.prebuilt
            .dockerignore
          sparse-checkout-cone-mode: false

      - name: Download pre-built binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cli-${{ matrix.rust_target }}
          path: artifacts

      - name: Prepare binary for Docker build
        run: |
          cp artifacts/oxy-${{ matrix.rust_target }} oxy
          chmod +x oxy

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: meta
        run: |
          VERSION="${{ needs.determine-build-type.outputs.version }}"
          CHANNEL="${{ needs.determine-build-type.outputs.channel }}"
          SHORT_SHA="${{ needs.determine-build-type.outputs.short_sha }}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/oxygen"
          ARCH="${{ matrix.arch_tag }}"

          if [ "$CHANNEL" = "stable" ]; then
            TAGS="${IMAGE}:${VERSION}-${ARCH},${IMAGE}:latest-${ARCH}"
          else
            # Two names for the main build, both saying `main`:
            #   main-<sha>   what promote.yaml pins (internal-docs/deploy-pipeline.md)
            #   main-latest  a convenience for `docker run`; NOTHING may pin it
            # `edge-<sha>` and `edge-latest` were a third and fourth name for the
            # same digest, from before `main-` existed. "Edge" survives only as the
            # nightly CLI channel, which is a different artifact.
            TAGS="${IMAGE}:main-${SHORT_SHA}-${ARCH}"
            TAGS="${TAGS},${IMAGE}:main-latest-${ARCH}"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.prebuilt
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: BINARY_PATH=oxy
          provenance: false

  # ============================================================================
  # Job 7: Trivy Docker Image Security Scan
  # ============================================================================
  trivy-image-scan:
    name: Trivy Docker Image Scan
    needs: [determine-build-type, build-docker-images]
    if: |
      always() &&
      needs.build-docker-images.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image to scan
        id: image
        run: |
          VERSION="${{ needs.determine-build-type.outputs.version }}"
          CHANNEL="${{ needs.determine-build-type.outputs.channel }}"
          SHORT_SHA="${{ needs.determine-build-type.outputs.short_sha }}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/oxygen"

          if [ "$CHANNEL" = "stable" ]; then
            echo "ref=${IMAGE}:${VERSION}-amd64" >> $GITHUB_OUTPUT
          else
            echo "ref=${IMAGE}:main-${SHORT_SHA}-amd64" >> $GITHUB_OUTPUT
          fi

      - name: Run Trivy vulnerability scanner (image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          output: trivy-image-results.txt
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Publish image scan results to workflow summary
        if: always()
        run: |
          if [[ -s trivy-image-results.txt ]]; then
            {
              echo "### Docker Image Vulnerability Scan"
              echo "<details><summary>Click to expand</summary>"
              echo ""
              echo '```'
              cat trivy-image-results.txt
              echo '```'
              echo "</details>"
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "### Docker Image Vulnerability Scan" >> $GITHUB_STEP_SUMMARY
            echo "No CRITICAL or HIGH vulnerabilities found." >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # Job 8: Create and Push Multi-Arch Manifests
  # ============================================================================
  create-manifests:
    name: Create ${{ needs.determine-build-type.outputs.channel }} manifest
    needs: [determine-build-type, build-docker-images, resolve-stable-digest]
    concurrency:
      group: manifest-${{ needs.determine-build-type.outputs.channel }}
      cancel-in-progress: false
    # Either the arch builds succeeded, or there is a digest to retag and they
    # were skipped for that reason.
    if: |
      always() &&
      (needs.build-docker-images.result == 'success' ||
       needs.resolve-stable-digest.outputs.retag_from != '')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Keyless: Sigstore mints a short-lived certificate against this workflow's
      # GitHub OIDC identity, so there is no key to hold or rotate. The same
      # pattern edge-image.yaml already uses for the camera image.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Create and push multi-arch manifests
        run: |
          set -euo pipefail
          VERSION="${{ needs.determine-build-type.outputs.version }}"
          CHANNEL="${{ needs.determine-build-type.outputs.channel }}"
          SHORT_SHA="${{ needs.determine-build-type.outputs.short_sha }}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/oxygen"
          RETAG_FROM="${{ needs.resolve-stable-digest.outputs.retag_from }}"

          # The certificate identity a signature from this workflow carries. A
          # `main-<sha>` is signed by a push to main and by nothing else, which is
          # all promote.yaml accepts — so the edge path verifies against exactly
          # that, and an image promote would refuse (a dispatch from a branch or
          # a tag) fails HERE instead of reaching ghcr as a "built and signed"
          # marker. A stable build also runs on an X.Y.x hotfix TAG push, so its
          # own check accepts tags as well.
          ID_PREFIX="^https://github\\.com/${{ github.repository }}/\\.github/workflows/public-release\\.yaml@refs/"
          MAIN_IDENTITY="${ID_PREFIX}heads/main\$"
          RELEASE_IDENTITY="${ID_PREFIX}(heads/main|tags/.+)\$"
          OIDC_ISSUER="https://token.actions.githubusercontent.com"

          # Every helper below checks each step itself, explicitly. Some run as
          # `$(…)`, and bash IGNORES `set -e` inside a command substitution — so
          # a failed step would fall through and hand the caller a digest anyway,
          # and the caller would publish `main-<sha>`, the tag promote.yaml reads
          # as "built AND signed", over bytes nobody signed. A stubbed harness
          # showed exactly that before this was written this way.

          # The manifest-list digest REF resolves to, on stdout.
          digest_of() {
            local digest
            digest=$(docker buildx imagetools inspect "$1" \
              --format '{{json .Manifest}}' | jq -r .digest)
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] \
              || { echo "::error::no digest for $1" >&2; exit 1; }
            echo "$digest"
          }

          # Assemble the multi-arch list from SRC-amd64 + SRC-arm64 under the
          # scratch tag STAGING, and print its digest. STAGING is a `build-…`
          # tag: this job's workspace, where a list is assembled and signed
          # BEFORE any name a consumer reads points at it. Nothing reads a
          # `build-` tag — promote.ts looks up exactly `main-<sha>`,
          # public-image-bump exactly `X.Y.Z`, the image updaters match
          # `^\d+\.\d+\.\d+$` — and they are left behind on purpose: buildx has
          # no delete, and a stale one is inert.
          assemble() {
            local staging="$1" src="$2"
            docker manifest create "${IMAGE}:${staging}" \
              "${IMAGE}:${src}-amd64" "${IMAGE}:${src}-arm64" >&2 \
              || { echo "::error::could not assemble ${IMAGE}:${staging} from ${src}-{amd64,arm64}" >&2; exit 1; }
            docker manifest push "${IMAGE}:${staging}" >&2 \
              || { echo "::error::could not push ${IMAGE}:${staging}" >&2; exit 1; }
            digest_of "${IMAGE}:${staging}" || exit 1
          }

          # Sign DIGEST, then verify it against IDENTITY the way a consumer will
          # — so a change to this workflow's identity (a rename, a moved file)
          # fails HERE, before an unverifiable image reaches promote.yaml.
          sign_and_verify() {
            local digest="$1" identity="$2"
            cosign sign --yes "${IMAGE}@${digest}" >&2 \
              || { echo "::error::cosign sign failed for ${IMAGE}@${digest}" >&2; exit 1; }
            cosign verify \
              --certificate-identity-regexp "$identity" \
              --certificate-oidc-issuer "$OIDC_ISSUER" \
              "${IMAGE}@${digest}" > /dev/null \
              || { echo "::error::cosign verify failed for ${IMAGE}@${digest} (want ${identity})" >&2; exit 1; }
            echo "🔏 Signed and verified ${IMAGE}@${digest}" >&2
          }

          # Point TAG at DIGEST, then read TAG back and require exactly DIGEST.
          # A single-source `imagetools create` from an index is expected to copy
          # the index as-is; this is where that is CHECKED rather than assumed,
          # because a tool that re-wrapped it would mint a new digest carrying no
          # signature under a name that promises one. Each path runs it on its
          # `build-` scratch tag first, so a tool that breaks the expectation
          # fails before any name a consumer reads has moved.
          publish_digest() {
            local tag="$1" digest="$2" got
            docker buildx imagetools create -t "${IMAGE}:${tag}" "${IMAGE}@${digest}" \
              || { echo "::error::could not tag ${IMAGE}:${tag}" >&2; exit 1; }
            got=$(digest_of "${IMAGE}:${tag}") || exit 1
            [[ "$got" == "$digest" ]] \
              || { echo "::error::${IMAGE}:${tag} resolves to ${got}, not ${digest}; refusing to go on" >&2; exit 1; }
            echo "✅ Published ${IMAGE}:${tag} → ${digest}"
          }

          if [ -n "$RETAG_FROM" ]; then
            # One digest, two more names. `imagetools create` copies the manifest
            # list by reference — nothing is pulled, nothing is rebuilt, and the
            # bytes customers are served are byte-identical to the ones prod ran.
            #
            # From the DIGEST, resolved once, never the tag: `main-<sha>` is a
            # tag, and a tag can move between the probe and here.
            SRC_DIGEST=$(digest_of "${IMAGE}:${RETAG_FROM}") || exit 1
            # A main image is signed by main. Every image built before signing
            # started is legitimately unsigned, and the release must not be
            # refused for that — so "no valid signature at all" warns. A valid
            # signature from anyone ELSE is a different claim about these bytes,
            # and fails. The second verify accepts any identity from any issuer:
            # it asks only "is there a signature here", never "is it ours".
            if cosign verify \
                --certificate-identity-regexp "$MAIN_IDENTITY" \
                --certificate-oidc-issuer "$OIDC_ISSUER" \
                "${IMAGE}@${SRC_DIGEST}" > /dev/null; then
              echo "🔏 ${IMAGE}:${RETAG_FROM} (${SRC_DIGEST}) is signed by this workflow on main"
            elif cosign verify \
                --certificate-identity-regexp '.*' \
                --certificate-oidc-issuer-regexp '.*' \
                "${IMAGE}@${SRC_DIGEST}" > /dev/null 2>&1; then
              echo "::error::${IMAGE}:${RETAG_FROM} (${SRC_DIGEST}) is signed, but not by public-release.yaml on main; not releasing it"
              exit 1
            else
              echo "::warning::${IMAGE}:${RETAG_FROM} (${SRC_DIGEST}) carries no signature (built before signing started); releasing it unsigned"
            fi
            publish_digest "build-${VERSION}" "$SRC_DIGEST"
            publish_digest "latest" "$SRC_DIGEST"
            publish_digest "${VERSION}" "$SRC_DIGEST"
          elif [ "$CHANNEL" = "stable" ]; then
            # The build fallback — a hotfix tagged on an X.Y.x branch, which has
            # no `main-` image to retag. Assembled from the per-VERSION arch tags
            # (never `latest-<arch>`, which the next stable build overwrites),
            # signed, and only THEN given public names — `X.Y.Z` last, since that
            # is the one public-image-bump waits for.
            DIGEST=$(assemble "build-${VERSION}" "${VERSION}") || exit 1
            sign_and_verify "$DIGEST" "$RELEASE_IDENTITY"
            publish_digest "build-${VERSION}" "$DIGEST"
            publish_digest "latest" "$DIGEST"
            publish_digest "${VERSION}" "$DIGEST"
          else
            # Assembled from the per-SHA arch tags, which only this commit's
            # build writes. Not from `main-latest-<arch>`: the arch builds run in
            # their own concurrency group, so an overlapping run, a "re-run failed
            # jobs", or an edge dispatch from a branch can move those under this
            # job — and `main-<sha>` would then name another commit's bytes,
            # signed under main's identity.
            DIGEST=$(assemble "build-main-${SHORT_SHA}" "main-${SHORT_SHA}") || exit 1
            sign_and_verify "$DIGEST" "$MAIN_IDENTITY"
            publish_digest "build-main-${SHORT_SHA}" "$DIGEST"
            publish_digest "main-latest" "$DIGEST"
            # `main-<sha>` LAST, deliberately: promote.yaml treats its presence on
            # ghcr as "this build finished AND is signed", so nothing may come
            # after it, and it may only ever name a digest that was just signed.
            publish_digest "main-${SHORT_SHA}" "$DIGEST"
          fi

  # ============================================================================
  # Job 8b: Wake the promote reconciler in oxygen-internal
  # ============================================================================
  #
  # Latency only. `promote.yaml` runs on a 15-minute schedule and re-derives
  # everything from scratch, so a lost dispatch costs minutes, never correctness —
  # which is why this job never fails the release and needs no retry.
  notify-promote:
    name: Notify promote
    needs: [determine-build-type, create-manifests]
    if: |
      always() &&
      needs.create-manifests.result == 'success' &&
      needs.determine-build-type.outputs.is_stable == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch image-published
        continue-on-error: true
        env:
          # Same secret the release checks hop on, and the same reason: a mirror
          # workflow cannot reach oxygen-internal with its own GITHUB_TOKEN.
          GH_TOKEN: ${{ secrets.CHECKS_DISPATCH_TOKEN }}
          SHORT_SHA: ${{ needs.determine-build-type.outputs.short_sha }}
        run: |
          set -uo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::warning::CHECKS_DISPATCH_TOKEN is not set; the promote reconciler will pick this up on its next scheduled pass"
            exit 0
          fi
          gh api /repos/oxy-hq/oxygen-internal/dispatches \
            -f event_type=image-published \
            -F "client_payload[sha]=${SHORT_SHA}" \
            || echo "::warning::dispatch failed; the scheduled pass will pick main-${SHORT_SHA} up"

  # ============================================================================
  # Job 9: Create Deployment Summary
  # ============================================================================
  deployment-summary:
    name: Create Deployment Summary
    needs: [determine-build-type, create-manifests]
    if: |
      always() &&
      needs.create-manifests.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create deployment summary
        run: |
          VERSION="${{ needs.determine-build-type.outputs.version }}"
          CHANNEL="${{ needs.determine-build-type.outputs.channel }}"

          if [ "$CHANNEL" = "stable" ]; then
            TAG="${VERSION}"
          else
            TAG="main-latest"
          fi

          cat >> $GITHUB_STEP_SUMMARY << EOF
          # Docker Images Published

          ### Oxygen Runtime
          - **Image:** \`ghcr.io/${{ github.repository_owner }}/oxygen:${TAG}\`
          - **Architectures:** linux/amd64, linux/arm64
          - **Pull:**
            \`\`\`bash
            docker pull ghcr.io/${{ github.repository_owner }}/oxygen:${TAG}
            \`\`\`

          ---
          **Channel:** \`${CHANNEL}\`
          **Version:** \`${VERSION}\`
          **Built from:** \`${{ github.sha }}\`
          **Workflow:** [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF
