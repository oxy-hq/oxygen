name: Coverage

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "internal-docs/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_LOG: debug
  # line-tables-only debug: sufficient for llvm-cov, ~60% smaller than default debug = 2
  CARGO_PROFILE_DEV_DEBUG: "1"
  # Disable incremental compilation in CI: it only helps warm local rebuilds and
  # otherwise just bloats the target dir / cache. (Overrides .cargo/config.toml.)
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: bash

jobs:
  changesets:
    uses: ./.github/workflows/changesets.yaml
    if: github.repository == 'oxy-hq/oxygen'
    name: Changesets
    permissions:
      contents: write
      actions: read
      pull-requests: read

  coverage:
    name: Code Coverage
    needs: [changesets]
    # Only run on oxy-hq/oxygen main branch and when oxy code has changed
    if:
      github.repository == 'oxy-hq/oxygen' && github.ref == 'refs/heads/main' &&
      needs.changesets.outputs.oxy == 'true'
    runs-on: "ubuntu-latest"
    # Full workspace build under llvm-cov instrumentation + nextest is the
    # heaviest job here; 60m bounds a cold instrumented build and a hung test.
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BIGQUERY_SAMPLE_KEY: ${{ secrets.BIGQUERY_SAMPLE_KEY }}
      GEMINI_API_KEY: "empty"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: default
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d default" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      # - name: Free disk space
      #   uses: jlumbroso/free-disk-space@main
      #   with:
      #     tool-cache: false
      #     android: true
      #     dotnet: true
      #     haskell: true
      #     large-packages: true
      #     docker-images: true
      #     swap-storage: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Collect Workflow Telemetry
        uses: cilium/workflow-telemetry-action@b1a318f80a08acede58027afe1455d037379966f # v2.2.0
        with:
          comment_on_pr: false

      - uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1
        if: runner.os == 'Linux'
        with:
          make-default: true

      - name: Prep Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - name: Install cargo tools
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: nextest,cargo-llvm-cov

      - name: Prep cargo cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: coverage

      # Use apt instead of arduino/setup-protoc to avoid GitHub release rate limits / outages.
      - name: Install Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Run coverage
        env:
          OXY_DATABASE_URL: "postgresql://admin:password@localhost:5432/default"
          OXY_BIN: "${{ github.workspace }}/target/llvm-cov-target/debug/oxy"
        run: |
          touch examples/bigquery-sample.key
          echo $BIGQUERY_SAMPLE_KEY > examples/bigquery-sample.key

          # Run migrations using the instrumented binary; the same (default dev)
          # build is reused by the nextest step below to avoid double compilation.
          cargo llvm-cov run -- migrate

          # Run tests reusing the instrumented build from above (--no-clean preserves migrate profraw)
          cargo llvm-cov nextest --workspace --no-clean --lcov --output-path lcov.info --no-fail-fast

          # Print coverage summary
          cargo llvm-cov report --summary-only

          ./target/llvm-cov-target/debug/oxy gen-config-schema --check

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@5cbfd81b66ca5d10c19b062c04de0199c215fb6e # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: lcov.info
