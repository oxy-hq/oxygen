name: Open source oxy
on:
  push:
    branches:
      - main
      - "[0-9]+.[0-9]+.x"
  pull_request_target:
    branches:
      - main
      - "[0-9]+.[0-9]+.x"

permissions:
  contents: write
  actions: read
  pull-requests: read

# One mirror push at a time per branch. Two merges seconds apart used to race:
# both runs migrated the same pending commits, the second push was rejected
# ("fetch first"), and when the loser was the later commit's run that commit
# stayed unmirrored — so no image was built for it — until the next push.
# Queued, the second run starts after the first and migrates whatever is left;
# with nothing left, copybara reports a no-op, which the action treats as a
# pass. A run that is still waiting when a newer one arrives is cancelled, and
# the newer one carries its commits. PR runs get a group each.
concurrency:
  group: opensource-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

jobs:
  move-code:
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    if: ${{ ((github.event_name == 'push' && github.repository ==
      'oxy-hq/oxygen-internal') || (github.event_name == 'pull_request_target'
      && github.repository == 'oxy-hq/oxygen' && github.actor !=
      'dependabot[bot]' )) }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        name: Create GitHub App Token
        id: app-token
        with:
          client-id: ${{ vars.ARGO_APP_CLIENT_ID }}
          private-key: ${{ secrets.ARGO_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            oxygen-internal
            oxygen
      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug
          }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch || github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}
      - uses: luong-komorebi/copybara-action@23338326f08acbfe8eb564431c91b81837ea3e17 # ft/sync-pull-request-title
        with:
          ssh_key: ${{ secrets.OXY_SSH_KEY }}
          access_token: ${{ steps.app-token.outputs.token }}
          sot_branch: ${{ github.ref_name }}
          destination_branch: ${{ github.ref_name }}
          sot_repo: oxy-hq/oxygen-internal
          destination_repo: oxy-hq/oxygen
          push_exclude: >-
            internal-docs/**
            scripts/airhouse/**
            .env.airhouse
            .env.clickhouse
            **/.env
          # pr_move: |-
          #   crates/core/dist||oss/dist||**
          committer: "${{ steps.app-token.outputs.app-slug }}[bot] <${{
            steps.get-user-id.outputs.user-id }}+${{
            steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>"
