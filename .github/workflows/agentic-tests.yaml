name: Agentic browser tests

# Runs the agent-driven YAML browser tests under
# `web-app/tests/agentic/flows/`. Two entry points:
#
#   - `workflow_call`: invoked by `ci.yaml` after `cargo-check-and-test`
#     has uploaded the prebuilt oxy binary as an artifact. Inherits the
#     run's artifact scope so the matrix can download the binary
#     directly.
#
#   - `workflow_dispatch`: standalone runs against an existing prebuilt
#     binary uploaded by an earlier CI run on the same branch. Set
#     `oxy_binary_run_id` to that run's id (numeric). Use this entry
#     point to iterate on flow YAML or runner code without re-triggering
#     the rest of the CI matrix.

on:
  workflow_call:
    inputs:
      binary_artifact:
        description: Name of the prebuilt oxy binary artifact uploaded by the caller workflow.
        type: string
        default: oxy-binary-ci
      flow_bucket:
        description: Which flow bucket to run (one bucket name, or `all`).
        type: string
        default: all
      oxy_binary_run_id:
        description: If non-empty, download the binary from this run instead of the current run. Empty default works for ci.yaml's pass-through.
        type: string
        default: ""
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      OPENAI_API_KEY:
        required: false
      BIGQUERY_SAMPLE_KEY:
        required: false

  workflow_dispatch:
    inputs:
      flow_bucket:
        description: Which flow bucket to run (one or all).
        type: choice
        options:
          - all
          - builder
          - semantic
          - ask-agent
          - threads
          - ide
          - metric-tree
        default: all
      oxy_binary_run_id:
        description: Run id of an earlier CI workflow on this branch whose `oxy-binary-ci` artifact should be downloaded. Required for standalone runs.
        type: string
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  # Resolve the matrix from a single source of truth (the inline JSON
  # below) and filter by `flow_bucket`. We can't filter the matrix via a
  # job-level `if:` because the `matrix` context isn't available there.
  resolve-matrix:
    # oxygen-internal only, and the guard has to live HERE rather than only in
    # `ci.yaml`'s caller job: this file is independently `workflow_dispatch`-able,
    # so on the public mirror it would otherwise present a Run-workflow button
    # that burns ANTHROPIC_API_KEY budget and then fails on a missing warp
    # runner. Guarding the first job is enough to stop the matrix — a skipped
    # `needs` skips its dependents — but `agentic-tests` repeats it so neither
    # job's guard depends on the other still being wired this way.
    if: github.repository == 'oxy-hq/oxygen-internal'
    runs-on: ubuntu-latest
    # Just emits the bucket matrix JSON; sub-second work — deliberately not a
    # warp runner, since it runs no tests.
    timeout-minutes: 10
    outputs:
      flows: ${{ steps.resolve.outputs.flows }}
    steps:
      - id: resolve
        env:
          FLOW_BUCKET: ${{ inputs.flow_bucket }}
        run: |
          # One bucket per product domain; flows in a bucket share a
          # backend mode (the runner refuses a mixed-mode invocation).
          # `cloud` is enterprise mode, the production path and every
          # bucket's mode: `oxy serve --enterprise` with `demo_project/`
          # seeded as the Demo workspace, driven on the public port (3000)
          # signed in as flow@oxy.local. `local` is the legacy no-auth
          # `--local` mode; keep a bucket on it only for a flow that tests
          # legacy local mode itself.
          #
          # FULL FILENAMES, not bare names. The runner selects a flow whose
          # filename CONTAINS a positional argument (runner/cli.ts, `globs`),
          # so a bucket naming `chat-ask` also ran `chat-ask-fleet` — a flow
          # that exists to prove the serve-to-ide proxy carries an analytics
          # run, silently executed here against a single process where there
          # is no proxy at all. It failed, and the failure said nothing about
          # the product. Adding a flow whose name extends an existing one
          # widens that bucket without touching this file; the suffix stops it.
          ALL='[
            {"name":"builder","flows":"builder-edits-app.flow.test.yml","mode":"cloud","port":3000},
            {"name":"semantic","flows":"semantic-builder-ask.flow.test.yml","mode":"cloud","port":3000},
            {"name":"ask-agent","flows":"chat-ask.flow.test.yml chat-panel-agent-switch.flow.test.yml","mode":"cloud","port":3000},
            {"name":"threads","flows":"threads-list.flow.test.yml","mode":"cloud","port":3000},
            {"name":"ide","flows":"ide-save.flow.test.yml","mode":"cloud","port":3000},
            {"name":"metric-tree","flows":"metric-tree.flow.test.yml metric-tree-scenario.flow.test.yml","mode":"cloud","port":3000}
          ]'
          if [ -z "$FLOW_BUCKET" ] || [ "$FLOW_BUCKET" = "all" ]; then
            FLOWS=$(echo "$ALL" | jq -c .)
          else
            FLOWS=$(echo "$ALL" | jq -c --arg b "$FLOW_BUCKET" '[.[] | select(.name == $b)]')
            if [ "$FLOWS" = "[]" ]; then
              echo "::error::Unknown flow_bucket: $FLOW_BUCKET"
              exit 1
            fi
          fi
          echo "flows=$FLOWS" >> "$GITHUB_OUTPUT"

  agentic-tests:
    name: agentic / ${{ matrix.flow.name }}
    needs: [resolve-matrix]
    # See `resolve-matrix` — oxygen-internal only. A plain boolean `if:` does not
    # override the implicit skip-when-a-need-is-skipped, so this narrows the job
    # without loosening the dependency.
    if: github.repository == 'oxy-hq/oxygen-internal'
    # Must match the binary's architecture (cargo-check-and-test builds
    # `oxy-binary-ci` on `warp-ubuntu-latest-arm64-4x` in this repo).
    # Running on x86_64 ubuntu-latest produced an ENOEXEC fallback to
    # /bin/sh that surfaced as "Syntax error: Unterminated quoted string".
    runs-on: ${{ github.repository == 'oxy-hq/oxygen-internal' && 'warp-ubuntu-latest-arm64-4x' || 'ubuntu-latest' }}
    # `continue-on-error: true` while we calibrate cost + reliability on
    # the matrix. Flip to false once the suite has ≥3 consecutive green
    # main-branch runs.
    continue-on-error: true
    # 25 for the flows + up to 10 for `oxy seed` (it compiles and promotes
    # every seeded workspace) + the 4-minute health wait and setup, so a slow
    # seed cannot push the flows into the job wall before artifacts upload.
    timeout-minutes: 45
    concurrency:
      group: agentic-${{ matrix.flow.name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        flow: ${{ fromJson(needs.resolve-matrix.outputs.flows) }}
    env:
      OXY_DATABASE_URL: postgresql://admin:password@localhost:5432/default
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BIGQUERY_SAMPLE_KEY: ${{ secrets.BIGQUERY_SAMPLE_KEY }}
      GEMINI_API_KEY: "empty"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DOMO_DEVELOPER_TOKEN: "empty"
      OXY_BASE_URL: http://localhost:${{ matrix.flow.port }}
      OXY_HEALTH_URL: http://localhost:${{ matrix.flow.port }}/api/health
      # Enterprise mode signs the browser in through dev-login (runner/session.ts).
      # The explicit allow-list is the only one a CI server honours; it names
      # just the flow identity, which the seed binds as Owner of `local`.
      OXY_DEV_LOGIN_EMAILS: flow@oxy.local
      # Never send real email from a test server.
      MAGIC_LINK_LOCAL_TEST: "true"
      OXY_APP_EMAIL_LOCAL_TEST: "1"

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: default
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d default" --health-interval 10s
          --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # The Demo workspace IS `demo_project/` inside this checkout, so the IDE
      # sees this checkout's git state — and a `pull_request` checkout is a
      # detached HEAD. The server labels that `HEAD@<sha>`
      # (`get_current_branch`), the IDE sends the label back as `?branch=` on
      # every branch-aware request, and the workspace middleware answers 400
      # because `@` is not a branch character (`validate_branch_name`). Nothing
      # on screen says so: the editor opens empty and a save leaves the Save
      # button up, the Metric Tree renders an error instead of the graph, the
      # Explorer lists no fields. That is what the ide, metric-tree and
      # semantic buckets failed on from the day they moved to enterprise mode;
      # the buckets that never enter the IDE send no branch and passed.
      #
      # A named, non-default branch is the state a developer's checkout is in
      # when these flows pass locally: the IDE reads and writes the working
      # copy. Not `main` — a save on a protected branch forks a feature branch
      # into a worktree of this whole repository, and a default-branch read
      # serves the revision the seed compiled rather than what a flow just
      # wrote. `-C` so a `push` to main and a dispatch land where a PR does.
      # The runner refuses a detached workspace up front (runner/session.ts),
      # so dropping this step fails with that sentence, not with six timeouts.
      - name: Put the checkout on a named branch
        run: git switch -C agentic-ci

      # Empty `oxy_binary_run_id` means the artifact lives in the
      # current run (workflow_call from ci.yaml). A non-empty value
      # routes the composite action through cross-run download with the
      # provided token (standalone workflow_dispatch).
      - name: Download oxy binary
        uses: ./.github/actions/download-oxy-binary
        with:
          artifact-name: ${{ inputs.binary_artifact || 'oxy-binary-ci' }}
          run-id: ${{ inputs.oxy_binary_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up web-app test environment
        uses: ./.github/actions/setup-web-app-test-env

      # Fail loudly if the secret is missing rather than letting the
      # runner exit 2 deep inside the matrix.
      - name: Verify ANTHROPIC_API_KEY is set
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set on this repo. Add it in repo settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "ANTHROPIC_API_KEY length: ${#ANTHROPIC_API_KEY}"

      # Enterprise mode, the production path — the same boot the custom-app
      # canary job uses: service Postgres plus `oxy serve --enterprise`, with
      # the state dir outside the checkout. Seeded below, after migrations.
      - name: Start Oxy backend (enterprise mode)
        if: matrix.flow.mode == 'cloud'
        run: |
          mkdir -p web-app/tests/agentic/.logs "$RUNNER_TEMP/oxy-state"
          echo "OXY_STATE_DIR=$RUNNER_TEMP/oxy-state" >> "$GITHUB_ENV"
          OXY_STATE_DIR="$RUNNER_TEMP/oxy-state" \
            nohup oxy serve --enterprise > web-app/tests/agentic/.logs/backend.log 2>&1 &
          echo $! > /tmp/oxy-server.pid

      # Legacy no-auth mode. No bucket uses it; kept for a flow that tests
      # `--local` itself.
      - name: Start Oxy backend (legacy local mode)
        if: matrix.flow.mode == 'local'
        working-directory: demo_project
        run: |
          mkdir -p ../web-app/tests/agentic/.logs
          nohup oxy serve --local --enterprise > ../web-app/tests/agentic/.logs/backend.log 2>&1 &
          echo $! > /tmp/oxy-server.pid

      - name: Wait for backend health
        id: wait-backend
        run: |
          # Generous timeout — cold binary + first-boot migrations
          # take longer than the e2e job's local-mode boot.
          for i in {1..120}; do
            curl -k -s "$OXY_HEALTH_URL" > /dev/null 2>&1 && break
            [ "$i" -eq 120 ] && {
              echo "::error::Backend did not become healthy within 240s"
              tail -n 200 web-app/tests/agentic/.logs/backend.log || true
              exit 1
            }
            sleep 2
          done
          echo "Backend healthy at $OXY_HEALTH_URL"

      # The fixture the flows are authored against, as the `local` org's Demo
      # workspace: `oxy seed` writes the rows, binds OXY_GLOBAL_ADMINS (the
      # flow identity, for THIS process only — exported to the server it would
      # make the identity staff) as Owner, stores ANTHROPIC_API_KEY as a
      # workspace secret (--llm-keys), and compiles + promotes every seeded
      # workspace. Same fixture the runner seeds locally (runner/backend.ts).
      - name: Seed the Demo workspace
        if: matrix.flow.mode == 'cloud'
        id: seed
        timeout-minutes: 10
        run: |
          set -o pipefail
          OXY_GLOBAL_ADMINS=flow@oxy.local \
            oxy seed --workspace-path "$GITHUB_WORKSPACE/demo_project" --llm-keys \
            2>&1 | tee web-app/tests/agentic/.logs/seed.log | tail -n 40

      # Per-bucket action-cache. The exact key hashes every flow YAML
      # plus the runner files; the prefix restore-key brings in the
      # previous cache so unchanged step text still warm-replays even
      # when a sibling flow changed.
      - name: Restore agentic action cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: agentic-action-cache
        with:
          path: web-app/tests/agentic/.cache
          key: agentic-actions-${{ runner.os }}-${{ matrix.flow.name }}-${{ hashFiles('web-app/tests/agentic/flows/*.flow.test.yml', 'web-app/tests/agentic/runner/runtimes/bespoke.ts', 'web-app/tests/agentic/runner/runtimes/replay.ts', 'web-app/tests/agentic/runner/selectors.ts', 'web-app/tests/agentic/runner/tool-registry.ts', 'web-app/tests/agentic/runner/action-cache.ts') }}
          restore-keys: |
            agentic-actions-${{ runner.os }}-${{ matrix.flow.name }}-

      - name: Run agentic flows in bucket
        id: run-agentic
        timeout-minutes: 25
        working-directory: web-app
        run: |
          pnpm test:agentic ${{ matrix.flow.flows }} \
            --no-auto-backend --no-auto-frontend \
            --output ../agentic-results-${{ matrix.flow.name }}.json

      - name: Upload agentic results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agentic-results-${{ matrix.flow.name }}
          path: |
            agentic-results-${{ matrix.flow.name }}.json
            web-app/tests/agentic/.results/
            web-app/tests/agentic/.traces/
            web-app/tests/agentic/.logs/
          # Three of the four paths are dot-directories, and upload-artifact
          # skips hidden files unless told otherwise — so this artifact held
          # the results JSON and nothing else: no trace, no backend log, no
          # seed log, which is every file a red bucket is diagnosed from.
          include-hidden-files: true
          retention-days: 3

      - name: Comment on PR with healing events
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(node .github/scripts/agentic-healing-comment.mjs \
            "${{ matrix.flow.name }}" \
            web-app/tests/agentic/.results/healing.json)
          if [ -z "$BODY" ]; then
            echo "No healing events for ${{ matrix.flow.name }}"
            exit 0
          fi
          gh pr comment ${{ github.event.pull_request.number }} --body "$BODY" || true

      - name: Stop backend server
        if: always()
        run: |
          if [ -f /tmp/oxy-server.pid ]; then
            kill "$(cat /tmp/oxy-server.pid)" 2>/dev/null || true
          fi

      - name: Show backend logs on failure
        if: failure() || steps.wait-backend.outcome == 'failure'
        run: |
          if [ -f web-app/tests/agentic/.logs/backend.log ]; then
            echo "=== Backend Logs (last 200 lines) ==="
            tail -n 200 web-app/tests/agentic/.logs/backend.log
          fi
