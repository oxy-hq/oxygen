name: Agentic browser tests

# Runs the agent-driven YAML browser tests under
# `web-app/tests/agentic/flows/`. Two entry points:
#
#   - `workflow_call`: invoked by `ci.yaml` after `cargo-check-and-test`
#     has uploaded the prebuilt oxy binary as an artifact. Inherits the
#     run's artifact scope so the matrix can download the binary
#     directly.
#
#   - `workflow_dispatch`: standalone runs against an existing prebuilt
#     binary uploaded by an earlier CI run on the same branch. Set
#     `oxy_binary_run_id` to that run's id (numeric). Use this entry
#     point to iterate on flow YAML or runner code without re-triggering
#     the rest of the CI matrix.

on:
  workflow_call:
    inputs:
      binary_artifact:
        description: Name of the prebuilt oxy binary artifact uploaded by the caller workflow.
        type: string
        default: oxy-binary-ci
      flow_bucket:
        description: Which flow bucket to run (one bucket name, or `all`).
        type: string
        default: all
      oxy_binary_run_id:
        description: If non-empty, download the binary from this run instead of the current run. Empty default works for ci.yaml's pass-through.
        type: string
        default: ""
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      OPENAI_API_KEY:
        required: false
      BIGQUERY_SAMPLE_KEY:
        required: false

  workflow_dispatch:
    inputs:
      flow_bucket:
        description: Which flow bucket to run (one or all).
        type: choice
        options:
          - all
          - custom-app-console
          - pipeline
          - pipeline-admin
          - chat
        default: all
      oxy_binary_run_id:
        description: Run id of an earlier CI workflow on this branch whose `oxy-binary-ci` artifact should be downloaded. Required for standalone runs.
        type: string
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  # Resolve the matrix from a single source of truth (the inline JSON
  # below) and filter by `flow_bucket`. We can't filter the matrix via a
  # job-level `if:` because the `matrix` context isn't available there.
  resolve-matrix:
    # oxygen-internal only, and the guard has to live HERE rather than only in
    # `ci.yaml`'s caller job: this file is independently `workflow_dispatch`-able,
    # so on the public mirror it would otherwise present a Run-workflow button
    # that burns ANTHROPIC_API_KEY budget and then fails on a missing runner
    # runner. Guarding the first job is enough to stop the matrix — a skipped
    # `needs` skips its dependents — but `agentic-tests` repeats it so neither
    # job's guard depends on the other still being wired this way.
    if: github.repository == 'oxy-hq/oxygen-internal'
    runs-on: ${{ github.repository == 'oxy-hq/oxygen-internal' && 'runs-on/fleet=arm64-2x/env=ci' || 'ubuntu-latest' }}
    # Just emits the bucket matrix JSON; sub-second work, so the smallest fleet
    # shape (GitHub-hosted minutes draw on the org's Actions budget).
    timeout-minutes: 10
    outputs:
      flows: ${{ steps.resolve.outputs.flows }}
    steps:
      - id: resolve
        env:
          FLOW_BUCKET: ${{ inputs.flow_bucket }}
        run: |
          # One bucket per product domain, and the domains are the ones the
          # product is built on: the custom app (served, and its console) and
          # the data pipeline (ingestion → Airway → stores → semantic model).
          # `chat` is one demoted bucket — those surfaces still ship and are
          # still covered, they are just no longer what this matrix is for.
          # Until 2026-11-26 the whole matrix was `ask-agent` + `threads` +
          # `metric-tree`: five flows, none of them about either core, while
          # every custom-app and pipeline flow in `flows/` ran only from
          # `scripts/verify-all.sh` on someone's laptop, or had never run at
          # all.
          #
          # A bucket is (flows, seed, identity), and all three matter:
          #
          # `mode` — `cloud` is enterprise mode, the production path and every
          # bucket's mode: `oxy serve --enterprise` on the public port (3000).
          # `local` is the legacy no-auth `--local` mode; keep a bucket on it
          # only for a flow that tests legacy local mode itself.
          #
          # `seed_path` — WHICH workspace `oxy dev seed` writes as the Demo
          # workspace. This is the change that made the core testable at all:
          # `demo_project/` holds a semantic model and two automations and
          # NOTHING else — no custom app, no `.airway.yml`, no `.monitor.yml` —
          # so no custom-app or pipeline flow could ever have passed against
          # it. `examples/` (the seed's own default) holds the published
          # example apps, seven Airway pipelines and the monitors.
          #
          # `seed_flags` — `--llm-keys` stores the workspace's LLM key so an
          # agentic run can happen; `--fixtures` additionally builds
          # `local/pulse-demo`, five real builds with a seven-day release
          # history, the bad release live and seeded traffic. The console
          # bucket needs it: it is the only app in a fresh database with
          # enough history for the console to have anything to say.
          #
          # `identity` — the email the runner signs in as (`OXY_FLOW_EMAIL`,
          # runner/session.ts). The runner injects exactly ONE session per
          # invocation, so a bucket cannot mix a workspace surface with an
          # `/admin` one: `flow@oxy.local` is bound Owner of `local` by the
          # seed and is correct for app/workspace surfaces, while staff are
          # bounced off every tenant workspace into `/admin`. That is why
          # `pipeline` and `pipeline-admin` are two buckets rather than one.
          # `global-admin@oxy.local` gets its standing from a seeded
          # `app_admins` ROW (`seed_platform_grants`), not from an env var, so
          # nothing here has to make an identity staff by hand.
          #
          # FULL FILENAMES, not bare names. The runner selects a flow whose
          # filename CONTAINS a positional argument (runner/cli.ts, `globs`),
          # so a bucket naming `chat-ask` also ran `chat-ask-fleet` — a flow
          # that exists to prove the serve-to-ide proxy carries an analytics
          # run, silently executed here against a single process where there
          # is no proxy at all. It failed, and the failure said nothing about
          # the product. Adding a flow whose name extends an existing one
          # widens that bucket without touching this file; the suffix stops it.
          #
          # NO WAREHOUSE HERE, which decides three flows. `examples/config.yml`
          # declares `local` (and `training`, `local-acme`) as
          # `type: airhouse_managed`, and `oxy dev seed` loads `.db/` into that
          # tenant — but this job's only service is Postgres and the backend is
          # `oxy serve --enterprise`, so no Airhouse is running.
          # `seed_airhouse::provision_tenants` then prints `skipping Airhouse
          # tenants — no Airhouse` and returns false, and the seed step stays
          # GREEN with no data loaded. So any flow that executes a query
          # against `local` would fail here on an empty warehouse, and the
          # failure would read exactly like a product bug.
          #
          # `demo_project/config.yml` declares `local` as `type: duckdb,
          # dataset: .db/` — a file in the checkout — which is why the `chat`
          # bucket has always been able to run an analytics question here, and
          # why it keeps that fixture.
          #
          # Starting one is not a one-line change: `docker compose -f
          # docker-compose.airhouse.yml up -d` is seven containers and a GHCR
          # pull, and `oxy serve` autodetects a local Airhouse ONLY under
          # `--local` (commands/serve.rs), so the job would also have to set
          # the `AIRHOUSE_*` vars by hand for the server half.
          #
          # DELIBERATELY NOT HERE, and each for a reason that is not "we
          # forgot":
          #   customer-apps-oxy-starter-fleet, automations-run-from-list,
          #   semantic-object-detail — all three execute a query against
          #     `local`: the served app's three data panels, the automation's
          #     six `execute_sql` tasks, and the topic's Run-query button. No
          #     Airhouse, no data. `airway-pipeline-run` is unaffected (its
          #     destination is `kind: memory`, deliberately, so the pipeline
          #     runs in the UI with no warehouse infra) and so is
          #     `semantic-monitors-inbox` (it reads compiled monitor config and
          #     the anomalies table, and executes nothing).
          #   admin-workspace-health — NOTHING EVALUATES HEALTH HERE. The page
          #     reads `workspace_health_state` rows written by the health eval
          #     pass, which a `health_check:` block schedules at 10m and the
          #     global singleton worker drives; a bare `oxy serve` runs no such
          #     worker, so the table is empty and the page correctly renders
          #     "No workspaces are being evaluated." The first run failed
          #     exactly there (30s on `workspace-health-row`), and tightening
          #     the flow to accept that empty state would void it for
          #     verify-all, where health IS evaluated. The flow is right; this
          #     job is the wrong home for it.
          #   custom-app-staging-console — its own header leaves open whether
          #     the seeded app carries a distinct `staging_url` at all, and
          #     says to point the flow at an app that does rather than loosen
          #     it. A bucket cannot settle that; a person has to.
          #   admin-airway-config, admin-airhouse-fleet — their `setup:` is a
          #     `goto:/dev-login?email=e2e@oxy.tech&next=…`, which re-mints a
          #     session as an identity this server neither allows nor grants,
          #     overriding the bucket's own. They belong here once that hop
          #     comes out and the identity is the invocation's.
          #   metric-tree, metric-tree-scenario — measure modelling, not the
          #     pipeline, and $1.55 cold for the pair. They stay in
          #     `fleet-assert.sh` / `verify-all.sh`.
          #   chat-ask-fleet, the other *-fleet flows, partners-console-fleet,
          #     ide-unavailable-fleet — they assert something about a
          #     three-node fleet, which this job is not.
          ALL='[
            {"name":"custom-app-console","flows":"admin-custom-apps-lifecycle.flow.test.yml custom-app-console-health.flow.test.yml","mode":"cloud","port":3000,"seed_path":"examples","seed_flags":"--llm-keys --fixtures","identity":"global-admin@oxy.local"},
            {"name":"pipeline","flows":"airway-pipeline-run.flow.test.yml semantic-monitors-inbox.flow.test.yml","mode":"cloud","port":3000,"seed_path":"examples","seed_flags":"--llm-keys","identity":"flow@oxy.local"},
            {"name":"pipeline-admin","flows":"pipeline-data-flow.flow.test.yml","mode":"cloud","port":3000,"seed_path":"examples","seed_flags":"--llm-keys","identity":"global-admin@oxy.local"},
            {"name":"chat","flows":"chat-ask.flow.test.yml chat-panel-agent-switch.flow.test.yml threads-list.flow.test.yml","mode":"cloud","port":3000,"seed_path":"demo_project","seed_flags":"--llm-keys","identity":"flow@oxy.local"}
          ]'
          if [ -z "$FLOW_BUCKET" ] || [ "$FLOW_BUCKET" = "all" ]; then
            FLOWS=$(echo "$ALL" | jq -c .)
          else
            FLOWS=$(echo "$ALL" | jq -c --arg b "$FLOW_BUCKET" '[.[] | select(.name == $b)]')
            if [ "$FLOWS" = "[]" ]; then
              echo "::error::Unknown flow_bucket: $FLOW_BUCKET"
              exit 1
            fi
          fi
          echo "flows=$FLOWS" >> "$GITHUB_OUTPUT"

  agentic-tests:
    name: agentic / ${{ matrix.flow.name }}
    needs: [resolve-matrix]
    # See `resolve-matrix` — oxygen-internal only. A plain boolean `if:` does not
    # override the implicit skip-when-a-need-is-skipped, so this narrows the job
    # without loosening the dependency.
    if: github.repository == 'oxy-hq/oxygen-internal'
    # Must match the binary's architecture (cargo-check-and-test builds
    # `oxy-binary-ci` on GitHub-hosted `ubuntu-24.04-arm` in this repo).
    # Running on x86_64 ubuntu-latest produced an ENOEXEC fallback to
    # /bin/sh that surfaced as "Syntax error: Unterminated quoted string".
    runs-on:
      ${{ github.repository != 'oxy-hq/oxygen-internal' && 'ubuntu-latest' ||
      (vars.CI_WEB_RUNNER_4X != '' && vars.CI_WEB_RUNNER_4X_SPOT) ||
      vars.CI_WEB_RUNNER_4X || 'ubuntu-24.04-arm' }}
    # `continue-on-error: true` while we calibrate cost + reliability on
    # the matrix. Flip to false once the suite has ≥3 consecutive green
    # main-branch runs.
    continue-on-error: true
    # 25 for the flows + up to 10 for `oxy dev seed` (it compiles and promotes
    # every seeded workspace) + the 4-minute health wait and setup, so a slow
    # seed cannot push the flows into the job wall before artifacts upload.
    timeout-minutes: 45
    concurrency:
      group: agentic-${{ matrix.flow.name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        flow: ${{ fromJson(needs.resolve-matrix.outputs.flows) }}
    env:
      OXY_DATABASE_URL: postgresql://admin:password@localhost:5432/default
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BIGQUERY_SAMPLE_KEY: ${{ secrets.BIGQUERY_SAMPLE_KEY }}
      GEMINI_API_KEY: "empty"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DOMO_DEVELOPER_TOKEN: "empty"
      OXY_BASE_URL: http://localhost:${{ matrix.flow.port }}
      OXY_HEALTH_URL: http://localhost:${{ matrix.flow.port }}/api/health
      # Enterprise mode signs the browser in through dev-login (runner/session.ts).
      # The explicit allow-list is the only one a CI server honours, so it has
      # to name every identity any bucket signs in as — a bucket whose identity
      # is missing here gets a 403 from dev-login and fails before its first
      # locator, which reads like a broken page.
      #
      # `flow@oxy.local` is bound Owner of `local` by the seed (through the
      # inline `OXY_GLOBAL_ADMINS` below, which reaches the SEED process only).
      # The two staff personas are seeded `app_admins` rows, so they are staff
      # whether or not any env var says so — which is why `OXY_GLOBAL_ADMINS`
      # must stay off the SERVER's environment: there it would make
      # `flow@oxy.local` staff too, and the SPA bounces staff off every tenant
      # workspace into `/admin`.
      OXY_DEV_LOGIN_EMAILS: flow@oxy.local,global-admin@oxy.local,app-operator@oxy.local
      # The identity this bucket drives the product as (runner/session.ts).
      OXY_FLOW_EMAIL: ${{ matrix.flow.identity }}
      # Never send real email from a test server.
      MAGIC_LINK_LOCAL_TEST: "true"
      OXY_APP_EMAIL_LOCAL_TEST: "1"

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: default
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d default" --health-interval 10s
          --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # The Demo workspace IS a directory inside this checkout (`examples/` for
      # every core bucket, `demo_project/` for `chat`), so the IDE
      # sees this checkout's git state — and a `pull_request` checkout is a
      # detached HEAD. The server labels that `HEAD@<sha>`
      # (`get_current_branch`), the IDE sends the label back as `?branch=` on
      # every branch-aware request, and the workspace middleware answers 400
      # because `@` is not a branch character (`validate_branch_name`). Nothing
      # on screen says so: the editor opens empty and a save leaves the Save
      # button up, the Metric Tree renders an error instead of the graph, the
      # Explorer lists no fields. That is what the ide, metric-tree and
      # semantic buckets failed on from the day they moved to enterprise mode;
      # the buckets that never enter the IDE send no branch and passed. It
      # still matters: `pipeline` enters the IDE for the semantic flows.
      #
      # A named, non-default branch is the state a developer's checkout is in
      # when these flows pass locally: the IDE reads and writes the working
      # copy. Not `main` — a save on a protected branch forks a feature branch
      # into a worktree of this whole repository, and a default-branch read
      # serves the revision the seed compiled rather than what a flow just
      # wrote. `-C` so a `push` to main and a dispatch land where a PR does.
      # The runner refuses a detached workspace up front (runner/session.ts),
      # so dropping this step fails with that sentence, not with six timeouts.
      - name: Put the checkout on a named branch
        run: git switch -C agentic-ci

      # Empty `oxy_binary_run_id` means the artifact lives in the
      # current run (workflow_call from ci.yaml). A non-empty value
      # routes the composite action through cross-run download with the
      # provided token (standalone workflow_dispatch).
      - name: Download oxy binary
        uses: ./.github/actions/download-oxy-binary
        with:
          artifact-name: ${{ inputs.binary_artifact || 'oxy-binary-ci' }}
          run-id: ${{ inputs.oxy_binary_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up web-app test environment
        uses: ./.github/actions/setup-web-app-test-env

      # Fail loudly if the secret is missing rather than letting the
      # runner exit 2 deep inside the matrix.
      - name: Verify ANTHROPIC_API_KEY is set
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set on this repo. Add it in repo settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "ANTHROPIC_API_KEY length: ${#ANTHROPIC_API_KEY}"

      # Enterprise mode, the production path — the same boot the custom-app
      # canary job uses: service Postgres plus `oxy serve --enterprise`, with
      # the state dir outside the checkout. Seeded below, after migrations.
      - name: Start Oxy backend (enterprise mode)
        if: matrix.flow.mode == 'cloud'
        run: |
          mkdir -p web-app/tests/agentic/.logs "$RUNNER_TEMP/oxy-state"
          echo "OXY_STATE_DIR=$RUNNER_TEMP/oxy-state" >> "$GITHUB_ENV"
          OXY_STATE_DIR="$RUNNER_TEMP/oxy-state" \
            nohup oxy serve --enterprise > web-app/tests/agentic/.logs/backend.log 2>&1 &
          echo $! > /tmp/oxy-server.pid

      # Legacy no-auth mode. No bucket uses it; kept for a flow that tests
      # `--local` itself.
      - name: Start Oxy backend (legacy local mode)
        if: matrix.flow.mode == 'local'
        working-directory: demo_project
        run: |
          mkdir -p ../web-app/tests/agentic/.logs
          nohup oxy serve --local --enterprise > ../web-app/tests/agentic/.logs/backend.log 2>&1 &
          echo $! > /tmp/oxy-server.pid

      - name: Wait for backend health
        id: wait-backend
        run: |
          # Generous timeout — cold binary + first-boot migrations
          # take longer than the e2e job's local-mode boot.
          for i in {1..120}; do
            curl -k -s "$OXY_HEALTH_URL" > /dev/null 2>&1 && break
            [ "$i" -eq 120 ] && {
              echo "::error::Backend did not become healthy within 240s"
              tail -n 200 web-app/tests/agentic/.logs/backend.log || true
              exit 1
            }
            sleep 2
          done
          echo "Backend healthy at $OXY_HEALTH_URL"

      # The fixture the bucket's flows are authored against, as the `local`
      # org's Demo workspace: `oxy dev seed` writes the rows, binds
      # OXY_GLOBAL_ADMINS (`flow@oxy.local`, for THIS process only — exported
      # to the server it would make that identity staff) as Owner of `local`,
      # seeds the partner tenants and the platform grants, deploys the example
      # apps, and compiles + promotes every seeded workspace.
      #
      # WHICH workspace is the bucket's choice (`seed_path`), and the flags
      # with it (`seed_flags`) — see the matrix comment. `examples/` for every
      # bucket about the product's core, because `demo_project/` contains no
      # custom app and no pipeline to test.
      - name: Seed the Demo workspace
        if: matrix.flow.mode == 'cloud'
        id: seed
        timeout-minutes: 10
        env:
          SEED_PATH: ${{ matrix.flow.seed_path }}
          SEED_FLAGS: ${{ matrix.flow.seed_flags }}
        run: |
          set -o pipefail
          # Unquoted on purpose: SEED_FLAGS is a word list from this file, not
          # user input, and the flags have to arrive as separate argv entries.
          # shellcheck disable=SC2086
          OXY_GLOBAL_ADMINS=flow@oxy.local \
            oxy dev seed --workspace-path "$GITHUB_WORKSPACE/$SEED_PATH" $SEED_FLAGS \
            2>&1 | tee web-app/tests/agentic/.logs/seed.log | tail -n 40

      # Per-bucket action-cache. The exact key hashes every flow YAML
      # plus the runner files; the prefix restore-key brings in the
      # previous cache so unchanged step text still warm-replays even
      # when a sibling flow changed.
      - name: Restore agentic action cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: agentic-action-cache
        with:
          path: web-app/tests/agentic/.cache
          key: agentic-actions-${{ runner.os }}-${{ matrix.flow.name }}-${{ hashFiles('web-app/tests/agentic/flows/*.flow.test.yml', 'web-app/tests/agentic/runner/runtimes/bespoke.ts', 'web-app/tests/agentic/runner/runtimes/replay.ts', 'web-app/tests/agentic/runner/selectors.ts', 'web-app/tests/agentic/runner/tool-registry.ts', 'web-app/tests/agentic/runner/action-cache.ts') }}
          restore-keys: |
            agentic-actions-${{ runner.os }}-${{ matrix.flow.name }}-

      - name: Run agentic flows in bucket
        id: run-agentic
        timeout-minutes: 25
        working-directory: web-app
        run: |
          pnpm test:agentic ${{ matrix.flow.flows }} \
            --no-auto-backend --no-auto-frontend \
            --output ../agentic-results-${{ matrix.flow.name }}.json

      - name: Upload agentic results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agentic-results-${{ matrix.flow.name }}
          path: |
            agentic-results-${{ matrix.flow.name }}.json
            web-app/tests/agentic/.results/
            web-app/tests/agentic/.traces/
            web-app/tests/agentic/.logs/
          # Three of the four paths are dot-directories, and upload-artifact
          # skips hidden files unless told otherwise — so this artifact held
          # the results JSON and nothing else: no trace, no backend log, no
          # seed log, which is every file a red bucket is diagnosed from.
          include-hidden-files: true
          retention-days: 3

      - name: Comment on PR with healing events
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(node .github/scripts/agentic-healing-comment.mjs \
            "${{ matrix.flow.name }}" \
            web-app/tests/agentic/.results/healing.json)
          if [ -z "$BODY" ]; then
            echo "No healing events for ${{ matrix.flow.name }}"
            exit 0
          fi
          gh pr comment ${{ github.event.pull_request.number }} --body "$BODY" || true

      - name: Stop backend server
        if: always()
        run: |
          if [ -f /tmp/oxy-server.pid ]; then
            kill "$(cat /tmp/oxy-server.pid)" 2>/dev/null || true
          fi

      - name: Show backend logs on failure
        if: failure() || steps.wait-backend.outcome == 'failure'
        run: |
          if [ -f web-app/tests/agentic/.logs/backend.log ]; then
            echo "=== Backend Logs (last 200 lines) ==="
            tail -n 200 web-app/tests/agentic/.logs/backend.log
          fi
