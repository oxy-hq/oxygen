name: Set up Rust for CI
description: >-
  The toolchain, linker, cargo tools, private-git-dep auth, cargo cache and
  protoc that every job compiling this workspace needs, in the order they
  depend on each other. Shared by the Rust jobs in ci.yaml.

inputs:
  app-client-id:
    description: >-
      Client id of the GitHub App that may read the private cargo git deps.
      Required unless `private-git-deps` is "false".
    required: false
    default: ""
  app-private-key:
    description: Private key of that App. Required unless `private-git-deps` is "false".
    required: false
    default: ""
  private-git-deps:
    description: >-
      "false" for a job that must NOT hold the App private key, and therefore
      cannot fetch the private cargo git deps. It gets the toolchain, mold,
      protoc, the cargo tools and the cache, and nothing that mints a token.

      The reason this exists: a job that runs code it did not write must not
      hold a key that mints tokens. The runner loads every secret a job
      references into its worker process at job start, whatever a step-level
      `if` says, and these runners have passwordless sudo — so test code in
      such a job can read the key out of process memory and mint an
      installation token with every permission the App has. Scoping the token
      the job uses is no defence against that; not referencing the key is.

      A job passing "false" has to get its private deps another way, which in
      practice means a sibling job fetches them and hands over `~/.cargo`
      while this one runs with CARGO_NET_OFFLINE. See the `deps` job in
      .github/workflows/weekly-code-health.yaml.
    required: false
    default: "true"
  cache-key:
    description: rust-cache `shared-key`. One per job shape, so clippy and build artifacts never evict each other.
    required: true
  tools:
    description: taiki-e/install-action `tool` list; empty installs none.
    required: false
    default: ""
  save-cache:
    description: >-
      "false" to restore the cache without saving it on main. For a job that
      shares a `cache-key` with a job building a superset of its dependencies:
      whichever finishes first saves, so the smaller one would win and every PR
      would restore an entry missing the other's crates.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Refuse a silently unauthenticated fetch
      if: inputs.private-git-deps == 'true' && inputs.app-private-key == ''
      shell: bash
      run: |
        echo "::error::setup-rust-ci needs app-private-key, or private-git-deps: \"false\""
        exit 1

    - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
      name: Create GitHub App Token
      id: app-token
      if: inputs.private-git-deps == 'true'
      with:
        client-id: ${{ inputs.app-client-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ github.repository_owner }}
        # Fetch-only: this token just lets cargo read private git deps.
        # Scope to read-only contents so a leaked token can't push.
        permission-contents: read
        repositories: |
          airlayer
          airform
          airway-internal
          snowflake-rs

    - uses: ./.github/actions/setup-mold
      if: runner.os == 'Linux'

    - name: Prep Rust
      uses: dtolnay/rust-toolchain@1.100.0 # keep in step with rust-toolchain.toml
      with:
        components: clippy, rustfmt

    - name: Install cargo tools
      if: inputs.tools != ''
      uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
      with:
        tool: ${{ inputs.tools }}

    # Private cargo git deps live under github.com/oxy-hq/* (airway,
    # airform, airlayer, snowflake-rs). The default checkout token
    # only auths THIS repo, so a fresh `rev` bump forces an
    # unauthenticated fetch that fails with "revision not found".
    # `git-fetch-with-cli` is on (.cargo/config.toml), so cargo shells
    # out to git, which uses gh as its credential helper — no token
    # baked into a URL rewrite. This mirrors the local flow exactly:
    # `gh auth login` + `gh auth setup-git`, then cargo fetches private
    # deps for free. --with-token stores the app token in gh's config
    # so the helper resolves it on later cargo steps without re-passing
    # it. Must run before any cargo step.
    - name: Authenticate gh for private cargo git deps
      if: inputs.private-git-deps == 'true'
      shell: bash
      env:
        GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        echo "$GH_APP_TOKEN" | gh auth login --with-token
        gh auth setup-git

    - name: Prep cargo cache
      uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      with:
        shared-key: ${{ inputs.cache-key }}
        # Only main writes. A PR's entry is readable by that PR alone, yet it
        # counts against the repo's cache quota and evicts main's — the one
        # entry every PR restores from. ruff, uv, Deno and Biome do the same.
        save-if: ${{ github.ref == 'refs/heads/main' && inputs.save-cache == 'true' }}

    # protobuf is required by lance https://github.com/lancedb/lance/issues/3073
    # Use apt instead of arduino/setup-protoc to avoid GitHub release rate limits / outages.
    - name: Install Protoc
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler
        protoc --version
