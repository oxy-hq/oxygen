# Declares the self-hosted / third-party runner labels this repo uses, so
# actionlint stops reporting every one of them as "unknown".
#
# Before this file there were 46 `runner-label` findings, one per label
# occurrence, which is noise that hides signal.
#
# READ THIS BEFORE TRUSTING THE FILE: actionlint is **not run in CI**. No
# workflow, justfile recipe or hook invokes it; outside internal-docs this file
# is the only one in the repo that contains the word. It has only ever been run
# by hand (#4481). So nothing here fails a build.
#
# It also could not catch this repo's actual runner-label mistake even when run
# by hand. Nearly every `runs-on` is written as
# `${{ github.repository == 'oxy-hq/oxygen-internal' && '<label>' || 'ubuntu-latest' }}`,
# and actionlint does not check labels inside a `${{ }}` expression. Tested:
# a bare `runs-on: ubicloud-standard-2-arm` is reported, the same label inside
# that gate expression is not. #4250's stale `warp-ubuntu-latest-arm64-2x` was
# inside the expression, so a manual run would have passed it.
#
# `labels:` is empty because every label this repo once declared belongs to a
# vendor it has left, and a declaration for a label no runner answers to can
# only ever hide a mistake. Add one here only when a runner that answers to it
# exists. The RunsOn fleet labels are not here and should not be: the 4x/8x
# shapes come from repository variables, and the small shapes are strings
# inside the gate expression, so actionlint never sees either as a label.
#
# To actually catch a stale label, grep. See internal-docs/ci-runners.md.
self-hosted-runner:
  labels: []
