# yaml-language-server: $schema=../../../../json-schemas/flow-test.json
#
# Verify the apps-first Ask composer uses the default analytics agent with
# NO manual agent picker. The agent-switch dropdown was removed in the
# "streamline Ask Oxygen composer" change: ChatPanel is locked to ask-mode
# and auto-selects the workspace default agent with the picker hidden
# (AskPanel and AskForwardFallback both pass `hideAgentPicker`). So this flow
# now guards that the picker stays gone, rather than exercising a switch.
# (chat-ask covers that the auto-selected agent actually answers.)
#
# Home is the apps-first launcher; with zero published apps the ask-forward
# fallback renders the same ChatPanel composer, so the submit button is
# present while the agent selector is not.
#
# ENTRY POINT — why the Ask dock, not the home fallback directly:
# the fallback only renders when the workspace has zero published custom
# apps. `demo_project/` (the `--local` fixture) never publishes one, so the
# home page always lands on the fallback there. `examples/` (the fixture
# behind the split-fleet Docker deployment, seeded via `oxy seed` per
# docker-compose.fleet.yml's bootstrap) publishes "Oxy Starter"
# unconditionally, so Home renders the apps grid instead — confirmed by
# navigating `/` against the fleet and screenshotting the result: cards, no
# composer. That precondition is a `--local`-only fixture shape, not
# something a flow can restore without unpublishing a seeded app (out of
# scope — mutating the shared fleet workspace).
#
# The Ask dock ([data-testid=ask-dock], opened via
# [data-testid=ask-oxygen-button] in the top bar) is the OTHER caller of the
# same composer — per this file's own header comment, "AskPanel and
# AskForwardFallback both pass `hideAgentPicker`" — and the top bar renders
# on every workspace page regardless of app count (`launcher-home`'s
# ask-dock-roundtrip case already proves this). So it is reachable
# unconditionally and asserts the identical product invariant (no agent
# picker anywhere in the ask composer) without depending on the empty-apps
# precondition. See tests/agentic/canonical-prompts.md § "Chat panel" for
# the shared open-dock step reused verbatim here.

name: ask composer has no agent picker
target: chat

settings:
  runs: 1
  trace: on-failure
  cache_actions: true
  max_steps: 15

setup:
      # `/home`, not `/`. Bare `/` is deliberately exempt from OXY_PATH_PREFIX
      # (runner/backend.ts) and lands wherever the post-login dispatcher picks,
      # which is fine with one workspace and a coin flip with two. This org now
      # has two, so `/` silently ran a case against the wrong workspace. `/home`
      # is the same page on a workspace-scoped route, so the prefix applies and
      # the target is whatever OXY_PATH_PREFIX names.
  - "goto:/home"

cases:
  - name: composer renders the default agent without a picker
    tags: [chat, regression]
    steps:
      # Universal chrome — present regardless of published-app count.
      - wait_for: "selector:[data-testid=ask-oxygen-button]"

      # Verbatim from canonical-prompts.md § "Chat panel" > "Ask a question
      # via the Ask dock" (first step only) — cache_scope: shared so this
      # replays free once any flow using that prelude has recorded it.
      - act: |
          browser_click [data-testid=ask-oxygen-button] in the top bar. The
          right-side Ask dock ([data-testid=ask-dock]) opens with a composer.
        cache_scope: shared

      - wait_for: "selector:[data-testid=ask-dock]"

      # The composer inside the dock is ready once its submit button renders.
      - wait_for: "selector:[data-testid=ask-dock] [data-testid=chat-panel-submit-button]"
    expect:
      # The agent picker is intentionally hidden — the workspace default
      # analytics agent is auto-selected, so no selector should be present
      # anywhere in the dock.
      - assert: "selector [data-testid=ask-dock] [data-testid=chat-panel-submit-button] is visible"
      - assert: "selector [data-testid=ask-dock] [data-testid=agent-selector-button] is not visible"
