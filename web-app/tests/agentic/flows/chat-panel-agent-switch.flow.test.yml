# yaml-language-server: $schema=../../../../json-schemas/flow-test.json
#
# Verify the apps-first Ask composer uses the default analytics agent with
# NO manual agent picker. The agent-switch dropdown was removed in the
# "streamline Ask Oxygen composer" change: ChatPanel is locked to ask-mode
# and auto-selects the workspace default agent with the picker hidden. So
# this flow guards that the picker stays gone, rather than exercising a
# switch. (chat-ask covers that the auto-selected agent actually answers.)
#
# ENTRY POINT — the Chat page (`/threads`, pages/chat/index.tsx,
# [data-testid=chat-page]). It renders the composer as
# `<ChatPanel lockMode='ask' hideAgentPicker />`, so the invariant holds
# there. It used to be checked in the Ask dock, opened with ControlOrMeta+k;
# nothing in the chrome opens the dock any more (the rail's Chat entry and the
# top bar's Ask button went in #4385, the shortcut after them), and the home
# draws no composer, so the Chat page, reached by address, is where a person
# meets this composer. No act step: the page is loaded by `goto:` and the
# rest is waits and asserts, so the flow costs nothing once cached.

name: ask composer has no agent picker
target: chat

settings:
  runs: 1
  trace: on-failure
  cache_actions: true
  max_steps: 15

setup:
  # Workspace-scoped, so OXY_PATH_PREFIX lands it in the Demo workspace (bare `/`
  # is exempt from the prefix and lands wherever the post-login dispatcher
  # picks, runner/backend.ts).
  - "goto:/threads"

cases:
  - name: composer renders the default agent without a picker
    tags: [chat, regression]
    steps:
      # The composer is ready once its submit button renders.
      - wait_for: "selector:[data-testid=chat-page] [data-testid=chat-panel-submit-button]"

      # The default agent has been resolved: ChatPanel shows the extended-thinking
      # menu only once it has picked an analytics agent (the demo project's sole
      # agent is `analytics.agentic.yml`). Gating on it makes the picker check
      # below run after the agents have loaded, not before.
      - wait_for: "selector:[data-testid=chat-page] [data-testid=thinking-mode-trigger]"
    expect:
      # The agent picker is intentionally hidden — the workspace default
      # analytics agent is auto-selected, so no selector should be present.
      - assert: "selector [data-testid=chat-page] [data-testid=chat-panel-submit-button] is visible"
      - assert: "selector [data-testid=chat-page] [data-testid=agent-selector-button] is not visible"
