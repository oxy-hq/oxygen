# yaml-language-server: $schema=../../../../json-schemas/flow-test.json
#
# Smoke tests for the apps-first shell. Chrome is a left rail
# ([data-testid=shell-rail]) that opens and closes from its toggle
# ([data-testid=shell-rail-toggle]) plus a universal top bar
# ([data-testid=workspace-topbar]) on every workspace page outside /ide and
# /onboarding:
#   - rail-hq returns to the org home ([data-testid=customer-home]),
#   - rail-core opens Oxygen Nexus (the IDE).
# The rail has no Chat entry and the top bar no Ask button (#4385), and ⌘K /
# Ctrl+K no longer opens the right-side Ask dock ([data-testid=ask-dock]):
# nothing in the chrome opens Ask. Asking a question happens on the Chat page,
# which the chat-ask flows drive.
#
#   home-chrome         — the customer home + rail (Home / Oxygen Nexus) + top
#                         bar visible, no Chat entry and no Ask button.
#   no-ask-shortcut     — ControlOrMeta+k on the home opens no Ask dock.
#   rail-toggle         — the toggle opens the rail to show the org's name;
#                         rail-hq is the current page.
#
# The home is the customer home whatever the workspace holds: the HQ launcher and
# its zero-apps greeting went with the `apps_first_experience` flag, and with them
# the zero-published-apps precondition these cases used to need.
#
# Backend mode: enterprise mode (the default `backend_mode`): the runner starts `oxy start
# --enterprise`, seeds `demo_project/` as the `local` org's Demo workspace, signs
# in as `flow@oxy.local` and prefixes `goto:` paths with
# `/local/workspaces/<demo id>`. The runner injects that session before the
# first case, so there is no login step in the flow.

name: launcher home surfaces
target: chat

settings:
  runs: 1
  trace: on-failure
  cache_actions: true
  max_steps: 20

setup:
  # `/home` on purpose, NOT bare `/` — `applyPathPrefix` (runner/backend.ts)
  # special-cases `target === "/"` to pass it through UNPREFIXED (so `goto:/`
  # always lands on the POST-LOGIN DISPATCHER's org-default workspace,
  # ignoring OXY_FIXTURE_WORKSPACE/OXY_PATH_PREFIX entirely, however many
  # workspaces the org has). `/home` is a registered sibling route to the
  # workspace root (`<Route path='home' element={<LauncherPage />} />`,
  # web-app/src/App.tsx) rendering the identical page, but — not being the
  # literal string "/" — it DOES get prefixed, so it actually resolves inside
  # the workspace OXY_PATH_PREFIX names. Found live (2026-08-24): pointing
  # OXY_FIXTURE_WORKSPACE/OXY_PATH_PREFIX at a second, empty workspace in the
  # same org and running with `goto:/` still landed on the ORIGINAL shared
  # workspace (the dispatcher's `pickWorkspace` tie-breaks equal
  # `last_opened_at` by array order, which put the pre-existing shared
  # workspace first) — `fallback-home` timed out waiting for the ask-forward
  # greeting because the apps grid rendered instead. Switching to `goto:/home`
  # fixed it with no other change. No-op for `--local` (prefix unset) and for
  # any invocation pointed at a single-workspace org — `/home` renders the
  # same page `/` does either way.
  - "goto:/home"

cases:
  - name: home-chrome shows the customer home, rail, and top bar
    tags: [launcher, critical]
    steps:
      - wait_for: "selector:[data-testid=customer-home]"

      - act: |
          Verify the chrome is present without clicking anything —
          browser_snapshot and check for [data-testid=shell-rail],
          [data-testid=rail-hq], [data-testid=rail-core] and the top bar
          [data-testid=workspace-topbar].

    expect:
      - assert: "selector [data-testid=customer-home] is visible"
      - assert: "selector [data-testid=shell-rail] is visible"
      - assert: "selector [data-testid=rail-hq] is visible"
      - assert: "selector [data-testid=rail-core] is visible"
      - assert: "selector [data-testid=workspace-topbar] is visible"
      - assert: "selector [data-testid=rail-chat] is not visible"
      - assert: "selector [data-testid=ask-oxygen-button] is not visible"

  - name: no-ask-shortcut ControlOrMeta+k on the home opens no Ask dock
    tags: [launcher, chat, regression]
    steps:
      # The key goes in once the workspace's chrome is up: the shortcut was bound
      # by the workspace layout, so a press before it renders would pass even
      # with the binding back.
      - wait_for: "selector:[data-testid=workspace-topbar]"

      - act: |
          browser_press_key ControlOrMeta+k once, then stop. Nothing is expected
          to open (the Ask shortcut was removed): do not press it again and do
          not click anything.

    expect:
      # The dock renders nothing until it is first opened (AskDock/index.tsx),
      # so on the old binding this is the element the press would have shown.
      - assert: "selector [data-testid=ask-dock] is not visible"
      - assert: "selector [data-testid=customer-home] is visible"

  - name: rail-toggle opens the rail to name the org, with Home current
    tags: [launcher, regression]
    steps:
      - wait_for: "selector:[data-testid=shell-rail-toggle]"

      - act: |
          browser_click [data-testid=shell-rail-toggle] at the top of the left
          rail. The rail opens to 224px and narrows the page; its head shows
          the org's name ([data-testid=shell-rail-name]) and each entry shows
          its name beside its mark.

      - wait_for: "selector:[data-testid=shell-rail-name]"

    expect:
      - assert: "selector [data-testid=shell-rail] has attribute data-open=true"
      - assert: "selector [data-testid=shell-rail-name] is visible"
      - assert: "selector [data-testid=rail-hq] has attribute aria-current=page"
      - assert: "selector [data-testid=customer-home] is visible"
