# yaml-language-server: $schema=../../../../json-schemas/flow-test.json
#
# Open the IDE's Metric Tree view, confirm the workspace's measures render
# as a graph, select a measure node, and confirm the Drivers panel responds.
# Runs against the demo project's semantic model (oxymart sales measures).

name: IDE metric tree view
target: ide

settings:
  runs: 1
  trace: on-failure
  cache_actions: true
  max_steps: 20

setup:
  - "goto:/ide"

cases:
  - name: open the metric tree and inspect a measure's drivers
    tags: [ide, metric-tree]
    steps:
      - act: |
          Click [data-testid=ide-nav-semantic] — the Semantic Model icon
          button in the narrow IDE sidebar rail. The URL changes to end
          with /ide/semantic.
      - act: |
          Click the "Metric Tree" tab (role=tab, name "Metric Tree"),
          then wait for [data-testid=metric-tree-view] to be visible.
      - act: |
          Click the first measure node in the graph — measure nodes
          carry a data-testid starting with `metric-node-` (e.g.
          browser_click selector "[data-testid^=metric-node-]"). This
          selects the measure and updates the right-hand panel.
    expect:
      # `selector <sel> is visible` — the leading keyword is what makes this a
      # deterministic DOM assert (judge.ts:54). Without it the claim matches no
      # pattern and the runner fails the case with "unsupported assert pattern",
      # which is indistinguishable in the summary from the view being missing.
      # This assert had never once evaluated.
      - assert: "selector [data-testid=metric-tree-view] is visible"
      # The Definition/Drivers tab strip and the Explore/Scenario/Simulation
      # mode toggle share ONE `justify-between` header row (`ExplorePanel` in
      # `pages/ide/MetricTree/index.tsx`), so a screenshot judge sees five
      # tab-like labels in that row, not two. Asserting the toggle by testid is
      # deterministic and free; the judge below is worded non-exhaustively so
      # mounting a FOURTH mode does not read as the panel being wrong. That is
      # exactly what happened when Simulation was added as the third mode: the
      # claim was written when only Explore/Scenario existed, and the judge
      # rejected "has tabs labelled Definition and Drivers" as an exhaustive
      # list. Reserve judge for the soft half of the claim (README: "reserve
      # judge for soft semantic claims").
      - assert: "selector [data-testid=metric-tree-mode-explore] is visible"
      - judge: |
          the left side shows a graph of measure nodes, and the right-hand
          panel includes tabs labelled Definition and Drivers. Other controls
          in the same header row — an Explore / Scenario / Simulation mode
          toggle — are expected and are NOT a reason to fail this claim.
