# yaml-language-server: $schema=../../../../json-schemas/flow-test.json
#
# Ask a sales question on the Chat page and verify the analytics agent —
# `analytics` (analytics.agentic.yml), the demo project's sole agent since
# #2346 removed the classic `default.agent.yml` — returns a coherent,
# data-backed answer.
#
# The Chat page (`/threads`, pages/chat/index.tsx, [data-testid=chat-page]) is
# where a question starts. Nothing in the chrome opens the Ask dock any more:
# the rail's Chat entry and the top bar's Ask button went in #4385 and the ⌘K /
# Ctrl+K shortcut after them, so the page is reached by address. Its composer
# is the same ask-locked ChatPanel the dock used, but without
# `onThreadCreated`: submitting creates the thread and navigates to
# `/threads/<id>`, where the answer streams.

name: chat ask returns an analytics answer
target: chat

settings:
  runs: 1
  trace: on-failure
  cache_actions: true
  max_steps: 15

setup:
  # Workspace-scoped, so OXY_PATH_PREFIX lands it in the Demo workspace (bare `/`
  # is exempt from the prefix, runner/backend.ts).
  - "goto:/threads"

cases:
  - name: ask a question on the chat page and get an analytics answer
    tags: [chat, critical]
    steps:
      # The composer is ready once its submit button renders. The page has one:
      # the home draws no composer and the Ask dock is not mounted.
      - wait_for: "selector:[data-testid=chat-page] [data-testid=chat-panel-submit-button]"

      - act: |
          Submit "What were the total weekly sales by store?" on the Chat page.
          The demo project ships a single agent (`analytics`,
          analytics.agentic.yml) selected by default, so no agent-picker step
          is needed:
          1. browser_type into `[data-testid=chat-page] textarea[name=question]`:
             "What were the total weekly sales by store?"
          2. browser_click `[data-testid=chat-page] [data-testid=chat-panel-submit-button]`.
          The URL changes to /threads/<id> and the answer streams there.

      - wait_for: streaming_complete

    expect:
      # Submitting left the Chat page for the thread page (its follow-up
      # composer's send button), which the judge below cannot see in the URL.
      - assert: "selector [data-testid=chat-page] is not visible"
      - assert: "selector [data-testid=message-input-send-button] is visible"
      # The agentic analytics agent renders its result as reasoning-trace
      # steps + an interpreted answer, not a classic `execute_sql` artifact —
      # so assert on the answer via the judge.
      - judge: |
          The page shows the analytics agent's answer to the "total weekly
          sales by store" question — a coherent, data-backed result with
          per-store sales figures as a table, chart, or written summary. Fail
          if instead the page shows an error banner, or the agentic run is
          suspended awaiting input on a clarifying question (a prompt back to
          the user, not an answer).
