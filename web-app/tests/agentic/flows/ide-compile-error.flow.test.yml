# yaml-language-server: $schema=../../../../json-schemas/flow-test.json
#
# Verify Monaco surfaces SQL parse/compile errors as inline markers when
# the user types invalid SQL. Regression class: editor diagnostics —
# silent breakage on compile feedback would make every "I clicked Save"
# test pass while users couldn't actually debug their queries.
#
# Uses the existing `reset_test_file` fixture so `demo_project/test.sql`
# is empty at the start of every run.

name: IDE compile error display
target: ide

# NOT IN CI as of 2026-05-10. Oxy's IDE wraps Monaco via
# @monaco-editor/react but does NOT register a Monaco SQL diagnostic
# service — typing invalid SQL into a .sql file produces no red
# squiggles, no gutter markers, no Problems panel entries. The product
# doesn't have the behavior this flow checks for. Cold runs against
# the current product land "no diagnostic indicators visible" from the
# judge, which is correct.
#
# Re-add to `.github/workflows/ci.yaml` matrix when an SQL language
# service ships (e.g. monaco-sql-languages plugged into the file
# editor). Until then this YAML stays as a `wip` scaffold so we
# don't lose the test intent.

settings:
  runs: 1
  trace: on-failure
  cache_actions: true
  max_steps: 20

setup:
  - "reset_test_file"
  # `dGVzdC5zcWw=` is base64("test.sql"). The IDE route is
  # /ide/files/<base64>, NOT /ide/<filename> — direct navigation to the
  # base64 form opens the file in Monaco without going through the
  # file-tree click (the pattern `ide-save` uses).
  - "goto:/ide/files/dGVzdC5zcWw="

cases:
  - name: type invalid SQL and verify Monaco shows an error marker
    tags: [ide, regression, wip]
    steps:
      - wait_for: "selector:.monaco-editor"

      - act: |
          Click into the Monaco file editor and type intentionally
          malformed SQL that Monaco's SQL parser will reject. The page
          has TWO Monaco surfaces (file editor on top, SQL IDE results
          panel below) — use the file editor (the top one).

          1. browser_click selector `.monaco-editor` (Playwright's
             `.first()` resolves to the top one).
          2. browser_keyboard_type text "SELECT FROM WHERE" — definitely
             not valid SQL: missing column list, missing table name,
             trailing keyword.

          After ~500ms Monaco's SQL service should run and produce a
          diagnostic: a red squiggly underline on the offending tokens
          AND/OR a red marker in the gutter on the affected line. The
          Problems panel may also surface an entry.

      - wait_for: network_idle

    expect:
      - judge: |
          The Monaco file editor is visible with the user's invalid SQL
          text "SELECT FROM WHERE". There is a visible diagnostic
          indicator: a red squiggly underline on at least one token, OR
          a red marker in the editor gutter, OR a Problems panel entry
          listing the error. The page has not crashed; no full-page
          error banner besides the diagnostic itself.
