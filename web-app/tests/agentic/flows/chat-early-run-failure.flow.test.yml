# yaml-language-server: $schema=../../../../json-schemas/flow-test.json
#
# Pins the gotcha in `product-context.md`'s "Counterintuitive gotchas" section:
# "Every Builder/analytics/workflow SSE stream must emit a terminal event
# (done/error/cancelled) — even when it fails before the orchestrator loop
# starts (a broken .view.yml) — or the frontend hangs forever." The symptom
# is a permanent hang, not a visible error, which is why it needs its own
# assertion rather than a happy-path `streaming_complete` wait: every
# existing flow that touches analytics (chat-ask, threads-list,
# builder-edits-app) only ever exercises the SUCCESS path.
#
# HOW THE EARLY FAILURE IS PRODUCED — no fabrication, the product's own
# words. This flow breaks a REAL semantic file the SAME way a developer
# could by hand — typing invalid YAML into `sales_semantics/views/
# oxymart.view.yml` (referenced by `demo_project/analytics.agentic.yml`'s
# `context: [./sales_semantics/**/*, ...]`) via the actual Monaco editor and
# the actual Save action — then asks a question that needs the semantic
# model. This is not a synthetic error injected via a mock; it is the exact
# scenario the backend's own error copy names verbatim (confirmed live
# against a real backend before this flow was written — see below).
#
# VERIFIED MECHANISM (curl against a real `oxy start --local --enterprise`
# instance, read together with the source):
#
#   1. `POST /analytics/runs` with the broken file in place returns
#      `400` with body:
#        {"error":"Your project configuration is invalid, so this run could
#         not start: build error: semantic catalog error: failed to parse
#         semantic YAML: missing field `name` at line 2 column 1. Fix the
#         reported file (often a broken .view.yml / .topic.yml semantic
#         definition) and try again.","run_id":"<uuid>"}
#      — that "often a broken .view.yml / .topic.yml" phrase is
#      `crates/agentic/http/src/routes/run.rs:55-65`
#      (`classify_pipeline_error_message`), not this flow's invention.
#   2. `run.rs:221-233`: `create_run` calls `builder.start(&db).await`
#      SYNCHRONOUSLY, in the HTTP handler, BEFORE the
#      `tokio::spawn(agentic_pipeline::drive_with_coordinator(...))` a few
#      lines below it that IS "the orchestrator loop". A broken semantics
#      file fails `start()` (solver construction), so the spawn — the
#      orchestrator loop — never happens, matching this file's opening
#      quote word for word. The DB row is still persisted failed (`run_id`
#      returned in the body) so thread history reconciles correctly, but no
#      SSE connection is ever opened by the frontend for it (`useAnalyticsRun
#      .ts`'s `start()`, L479-503: `.then(openStream)` only runs on success;
#      `.catch` sets `state.tag = "failed"` directly off the rejected
#      promise — a hang here is structurally impossible, not just unlikely).
#   3. Independently verified `run.rs`'s OTHER anti-hang path too: opening
#      `GET /analytics/runs/<that same run_id>/events` directly (no live
#      run, nothing ever streamed) still returns one terminal SSE event
#      immediately — `id: 0 / event: error / data: {"message": "build
#      error: ...", "trace_id": "<uuid>"}` — synthesized by
#      `synth_terminal_event` (run.rs:274-338) from the run row's
#      authoritative `task_status`, exactly the mechanism the module's own
#      doc comment describes for "a run [that] dies before the orchestrator
#      loop starts (e.g. a broken semantics file fails solver
#      construction)". This flow's browser path exercises mechanism #2
#      (the more common one for a config error); #3 is the belt-and-
#      suspenders path for the rarer case where a run reaches "running"
#      before dying with nothing streamed — verified to work but not driven
#      through the browser here, since reproducing THAT specific race
#      honestly (not synthetically) would need injecting a mid-run crash,
#      not a broken file.
#
# What the UI actually does with a `400` at create time:
# `pages/thread/analytics/index.tsx:783-810` renders `state.tag ===
# "failed"` one of two ways — the calm `IdeUnavailablePanel` when
# `ideUnavailable` (a 502 carrying `x-oxy-required-role: ide`; see
# `ide-unavailable-fleet.flow.test.yml`), or the generic `ErrorAlert`
# ("Run failed") otherwise. A plain `400` config error is NOT
# `isIdeUnavailableError` (that checks for status 502 specifically), so
# this flow's failure renders the `ErrorAlert` branch with a Retry button —
# a visible, actionable terminal state, never a bare hang.
#
# ISOLATED BACKEND — deliberately NOT the docker-compose fleet.
# The default `backend_mode` (enterprise) means `oxy start --enterprise` on the
# default ports (3000 main / 3001 internal, `runner/backend.ts:112`), which
# collide with the split fleet's `oxy-fleet-serve-1`/`-2` (see
# `docker-compose.fleet.yml`) if both are up at once — `ensureBackend`
# would find the FLEET already "healthy" on :3000 and silently reuse it,
# driving this flow's Monaco edits and file-corruption against a shared
# deployment other agents may be using, over a demo_project file that
# deployment doesn't even have. Run this flow against your OWN isolated
# instance on non-default ports instead:
#
#   OXY_DEV_LOGIN_EMAILS=flow@oxy.local \
#     oxy start --enterprise --port 3100 --internal-port 3101 &
#   # wait for :3100/api/health == 200, then seed oxy start's own database:
#   OXY_DATABASE_URL=postgresql://postgres:postgres@localhost:15432/oxy \
#     OXY_GLOBAL_ADMINS=flow@oxy.local oxy seed --workspace-path demo_project --llm-keys
#   cd web-app && OXY_BASE_URL=http://localhost:3100 \
#     OXY_HEALTH_URL=http://localhost:3100/api/health \
#     pnpm test:agentic chat-early-run-failure --no-auto-backend
#
# `restore_demo_file:sales_semantics/views/oxymart.view.yml` (setup, runs
# before every case) reverts the file to its committed content — via `git
# show HEAD:demo_project/...`, so a developer's own unrelated changes
# elsewhere are untouched — so the corruption this flow's own case
# introduces never survives past the run that made it, and a fresh run
# never inherits a previous run's break.
#
# COST: one Monaco edit + save (2 act steps, same shape as `ide-save`), one
# navigation + chat submit (1 act step, no LLM tokens spent on the run
# itself — it 400s before any model call), one judge call.

name: a broken semantic file fails the run before the orchestrator loop, and the UI shows it instead of hanging
target: chat

settings:
  runs: 1
  trace: on-failure
  cache_actions: true
  max_steps: 20

# c2FsZXNfc2VtYW50aWNzL3ZpZXdzL294eW1hcnQudmlldy55bWw=
#   = base64("sales_semantics/views/oxymart.view.yml")
setup:
  - "restore_demo_file:sales_semantics/views/oxymart.view.yml"
  - "goto:/ide/files/c2FsZXNfc2VtYW50aWNzL3ZpZXdzL294eW1hcnQudmlldy55bWw="

cases:
  - name: break oxymart.view.yml, ask a question that needs it, verify a visible failure instead of a hang
    tags: [chat, ide, regression, critical]
    steps:
      # `.view.yml` files do NOT open straight into Monaco — View/index.tsx
      # wraps them in `EditorPreview` (SemanticExplorer/EditorPreview.tsx),
      # which defaults to `ViewMode.Explorer` (a structured fields UI,
      # `previewOnly=true` — Monaco isn't even mounted in that mode) unless
      # the sidebar's `filesSubViewMode` is already Files-tree mode. The
      # `ModeSwitcher` (EditorPreview.tsx / ModeSwitcher.tsx) has an
      # "Editor view" tab (`aria-label='Editor view'`, Code icon) that
      # switches to the raw Monaco editor — the same one `ide-save` and
      # `ide-compile-error` drive directly because THEIR files (`.sql`)
      # have no specialized viewer to switch out of.
      - wait_for: "selector:role=tab[name='Editor view'];timeout_ms=30000"

      - act: |
          browser_click role=tab[name='Editor view'] (the Code icon next to
          the Eye icon, top of the file panel). Switches out of the
          structured field explorer into the raw Monaco YAML editor.

      # Same gate ide-save.flow.test.yml uses — no Monaco exists until the
      # file route mounts (now that Editor view is selected).
      - wait_for: "selector:.monaco-editor;timeout_ms=30000"

      # Insert ONE line of genuinely invalid YAML — three bare colons in a
      # row. Verified offline (the runtime's own `yaml` npm package) to fail
      # to parse ("Nested mappings are not allowed in compact mappings")
      # regardless of how many leading spaces precede it, so it survives
      # Monaco's smart-indent copying the previous line's indentation.
      #
      # Two things had to be worked around to get here, both discovered by
      # actually running this flow while authoring it, not guessed:
      #
      # (1) Deliberately NOT "Meta+End then Enter" (what `ide-save` uses for
      # `test.sql`, where it doesn't matter): observed to NOT reliably reach
      # end-of-document in THIS editor — vanilla `monaco-editor` (unlike VS
      # Code proper) ships Windows/Linux-style keybindings by default and
      # does not necessarily bind a Mac "cursor to bottom" for Cmd+End, so it
      # silently did nothing and left the cursor wherever the initial click
      # landed, splicing the typed text into the middle of an existing
      # quoted string — which YAML's multi-line double-quoted-scalar
      # folding rule can absorb as VALID (if garbled) YAML, silently
      # defeating the whole point. The fix: select-all then collapse the
      # selection with a single arrow key — basic text-widget behavior, not
      # a Monaco-specific keybinding that may or may not be mapped for this
      # platform.
      #
      # (2) The first version of this corruption used an unclosed `[`
      # (verified invalid OFFLINE) — but typed live into Monaco, its
      # bracket auto-pairing feature inserted the matching `]` immediately,
      # turning "unterminated" right back into a syntactically valid
      # `[unterminated]` flow sequence. Colons are not an auto-paired
      # character in Monaco, so this version isn't silently "fixed" by the
      # editor the same way.
      - act: |
          Break the open semantic YAML file with one deliberately invalid line:
          1. browser_click selector ".monaco-editor" to focus. (`.first()`
             picks the real file editor if more than one Monaco instance is
             on the page.)
          2. browser_press_key "Meta+a" to select the entire document.
          3. browser_press_key "ArrowRight" — collapses the selection to its
             end (the true end of the document), rather than navigating
             there directly.
          4. browser_press_key "Enter".
          5. browser_keyboard_type (NOT browser_type — Monaco's hidden
             textarea breaks selector-based focus) text
             ": : : this is not valid yaml"

      # data-testid='ide-save-button' renders only while fileState ===
      # "modified" — proves the keystrokes actually landed before we try
      # to save, same reasoning ide-save.flow.test.yml documents.
      - wait_for: "selector:[data-testid=ide-save-button]"

      - act: "browser_press_key 'Meta+s'. Wait for [data-testid=ide-save-button] to disappear."

      # Hard gate the save landed before navigating away — don't just trust
      # the act's own internal wait.
      - wait_for: "selector_hidden:[data-testid=ide-save-button];timeout_ms=10000"

      # The runner prefixes browser_navigate paths with the workspace, so a
      # direct navigate is correct here (same as threads-list.flow.test.yml's
      # own step) — the IDE hides the outer rail (WorkspaceShell.tsx:43,
      # `hideRail = inIde || ...`), so there is no `[data-testid=rail-chat]`
      # to click from inside it.
      - act: |
          browser_navigate to "/threads" — the Chat page, a composer with a
          "Recent threads" history below it. Wait for the composer to render.

      - wait_for: "selector:textarea[name=question]"

      - act: |
          Submit a question that needs the now-broken semantic view:
          1. browser_type into textarea[name=question]: "What were the total weekly sales by store?"
          2. browser_click [data-testid=chat-panel-submit-button].
          The URL changes to /threads/<id>.

      # THE TERMINAL STATE, not `streaming_complete`. `POST .../analytics/
      # runs` 400s before any SSE connection opens (this file's header,
      # mechanism #2), so `useAnalyticsRun.ts`'s `start()` catch handler
      # sets `state.tag = "failed"` off the rejected promise itself — no
      # stream, no "loading state appears then stop button hides" sequence
      # for `streaming_complete` to key off. `role='alert'` is
      # ErrorAlert.tsx:29, the generic (non-ide-unavailable) failed branch.
      - wait_for: "selector:[role=alert];timeout_ms=30000"

    expect:
      # Deterministic, $0.
      - assert: "selector [role=alert] is visible"
      # A substring of the exact backend phrase (run.rs:56-58,
      # `classify_pipeline_error_message`) — proves this is genuinely the
      # semantic-catalog failure path, not a coincidentally-similar error
      # from something else going wrong in the flow. Deliberately a SHORT,
      # early substring rather than the full sentence: the message renders
      # through `<Markdown>{state.message}</Markdown>` (pages/thread/
      # analytics/index.tsx), and `text "..." is visible` (Playwright
      # `getByText`) needs its match to sit within a single rendered text
      # node — a long substring spanning where markdown might split the
      # paragraph is a real way to flake even when the words are all
      # genuinely on screen.
      - assert: "text \"semantic catalog error\" is visible"
      # Not the ide-unavailable branch — a `400` config error is not
      # `isIdeUnavailableError` (that only matches a `502` with
      # `x-oxy-required-role: ide`), so the calm restarting panel must NOT
      # be what rendered here.
      - assert: "selector [data-testid=ide-unavailable-panel] is not visible"

      - judge: |
          The page is a thread detail page (/threads/<id>). In place of a
          streamed analytics answer, it shows a clear "Run failed" error
          message mentioning the project configuration / semantic YAML
          being invalid, with a Retry action. There is NO indefinite
          loading spinner or stop button with no accompanying explanation,
          and NO blank/frozen page.

          Fail if ANY of the following is true:
          (a) a loading spinner or "streaming" indicator is still on screen
              with no error shown alongside it — this is exactly the hang
              this flow exists to catch;
          (b) the page is blank, frozen, or shows no acknowledgement that
              the run failed;
          (c) the error shown is generic/unrelated (e.g. a network error,
              a 404, an auth error) rather than a project-configuration /
              semantic-file message;
          (d) the calm "Oxygen Factory is restarting" panel is shown
              instead of an error — that panel is for the ide being
              unreachable, not a broken configuration file, and showing it
              here would mean the two failure classes are being conflated.
