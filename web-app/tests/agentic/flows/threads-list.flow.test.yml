# yaml-language-server: $schema=../../../../json-schemas/flow-test.json
#
# "Find a past conversation" on the apps-first chat surface. The bulk
# threads-management list page was removed; the Chat page (/threads) — a
# composer with a searchable "Recent threads" history below it — is its
# replacement. This flow submits a question on the Chat page, then reopens
# that thread from the history via search.
#
# Navigation note: shell v2 chrome is the left icon rail
# ([data-testid=shell-rail]); the "Chat" rail item lands on /threads. The
# Chat composer navigates to /threads/<id> on submit (it is not the in-place
# Ask dock).

name: threads list
target: threads

settings:
  runs: 1
  trace: on-failure
  cache_actions: true
  # navigate + chat submit (1 analytics run) + navigate back + search + click
  # + judge. Pad for the agentic analytics run on a single question.
  max_steps: 25

setup:
      # `/home`, not `/`. Bare `/` is deliberately exempt from OXY_PATH_PREFIX
      # (runner/backend.ts) and lands wherever the post-login dispatcher picks,
      # which is fine with one workspace and a coin flip with two. This org now
      # has two, so `/` silently ran a case against the wrong workspace. `/home`
      # is the same page on a workspace-scoped route, so the prefix applies and
      # the target is whatever OXY_PATH_PREFIX names.
  - "goto:/home"

cases:
  - name: submit on the chat page, then reopen the thread from search
    tags: [threads, regression]
    steps:
      - act: |
          browser_navigate to "/threads" — the Chat page, a composer with a
          "Recent threads" history below it. Wait for the composer to render.

      - wait_for: "selector:textarea[name=question]"

      - act: |
          Submit a question on the Chat page. The demo project ships a single
          agent (`analytics`, analytics.agentic.yml) selected by default, so
          no agent-picker step is needed:
          1. browser_type into textarea[name=question]: "What were the total weekly sales by store?"
          2. browser_click [data-testid=chat-panel-submit-button].
          The URL changes to /threads/<id> and the analytics answer streams.

      - wait_for: streaming_complete

      - act: |
          browser_navigate back to "/threads". The thread just submitted now
          appears in the searchable history ([data-testid=thread-history-list]).

      - wait_for: "selector:[data-testid=thread-history-list]"

      - act: |
          browser_type into [data-testid=thread-history-search]: "weekly".
          The list filters server-side to threads whose title or input matches.

      - wait_for: network_idle

      # The matching thread row is a [data-testid=thread-row] inside the list.
      - wait_for: "selector:[data-testid=thread-history-list] [data-testid=thread-row]"

      - act: |
          browser_click the first [data-testid=thread-row] inside
          [data-testid=thread-history-list] (a link to the thread). The URL
          changes to /threads/<id> and the conversation loads.

      # The thread detail's message input marks the routed page as loaded —
      # a hard gate that fails loudly if the click did not navigate.
      - wait_for: "selector:[data-testid=message-input-send-button]"

      # THE CONVERSATION. The send button belongs to the composer, which mounts
      # with the page shell — before the thread's history has been fetched. The
      # judge below asks for a user message AND an agent response, so gating on
      # the composer judges a spinner: that is exactly what it reported on the
      # 2026-08-19 12:05 run, and only on the warm-cache pass, where the replay
      # arrives faster than the fetch. `agent-response-text` is the rendered
      # answer itself (components/AnswerContent/index.tsx:17), so it cannot be
      # visible before there is an answer to see.
      - wait_for: "selector:[data-testid=agent-response-text];timeout_ms=60000"

    expect:
      - judge: |
          The page is on a thread detail URL (/threads/<id>) showing the past
          conversation — at least one user message about weekly sales per
          store plus one agent response. No error banner.
