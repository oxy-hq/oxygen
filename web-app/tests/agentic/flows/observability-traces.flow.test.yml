# yaml-language-server: $schema=../../../../json-schemas/flow-test.json
#
# Traces list + trace detail. Nothing covered either page before this flow —
# Observability has zero agentic browser coverage as of 2026-08-24.
#
# WHY THESE TWO ASSERTIONS ARE THE HIGH-VALUE ONES
# -------------------------------------------------
# product-context.md names two repeat footguns for this exact surface:
#   1. "Timestamps must go out as ISO-8601 UTC or the browser mis-parses
#      them — render crash, or spans collapsed to slivers."
#   2. "Trace queries need hard time/size caps — an unbounded scan once
#      took the backend offline, not merely timed out."
# Both have already bitten this codebase for real, and both have an
# in-repo regression guard:
#   - crates/observability/src/backends/clickhouse/mod.rs:36-48 `iso_utc()`
#     is "Kept in one place so every serving query renders timestamps
#     identically", with an explicit comment citing the historical
#     "Invalid time value" trace crash and the "spans don't fit the
#     waterfall" bug (a `%M` vs `%i` minute-specifier mixup that produced
#     an unparseable timestamp -> NaN offsets -> collapsed waterfall).
#     Unit-tested at mod.rs:76-100 (`iso_utc_tests`), but that only proves
#     the SQL fragment is right — it says nothing about whether the
#     frontend actually receives and parses it correctly end-to-end.
#   - crates/observability/src/backends/clickhouse/mod.rs:50-56
#     `SERVING_QUERY_TIMEOUT = 35s`, wrapping every serving query via
#     `with_query_timeout()`. Observed live in this session: a `traces
#     list` query legitimately hit "ClickHouse traces list query exceeded
#     35s query" and returned a clean 500 instead of hanging the instance
#     — the cap this footgun describes is real and fires.
#   - web-app/src/pages/ide/observability/utils/format.ts:11-25
#     `formatTimeAgo()` is explicitly "hardened against bad input" per its
#     own comment, because an unguarded `date-fns formatDistanceToNow`
#     throws `RangeError: Invalid time value` on an unparseable date and
#     render-crashes the WHOLE observability surface — again citing "the
#     trace-detail 'Invalid time value' incident" by name.
# Case 1 below confirms the happy path this hardening exists for: a real
# backend timestamp round-trips through the browser as a normal "X ago"
# string, not a crash and not the "—" fallback the hardening degrades to
# on a genuinely bad value.
#
# Case 2 (trace detail / waterfall) is where "collapsed to slivers" would
# actually be visible: web-app/src/hooks/api/traces/useTraceDetail.ts:26-99
# computes each span's `offsetMs` as `new Date(span.timestamp).getTime() -
# startMs` — if `span.timestamp` failed to parse, every span would render
# at the same NaN/0 offset and the waterfall would collapse to a single
# sliver at the left edge. Asserting on named span labels at spread-out
# positions is what would catch that; asserting only "the page loaded"
# would not.
#
# FIXTURE: real trace data generated by hand this session (no seed/fixture
# for observability exists — see tests/agentic/fixtures/reset.ts, whose
# 3-command surface cannot touch a database). Two `analytics` agent runs
# against a `demo_project`-backed workspace produced two real traces in
# ClickHouse. Those ids are recorded below for provenance ONLY — the flow
# deliberately references none of them, because a trace id belongs to the
# ClickHouse instance that produced it and does not survive a teardown.
# Anything here that needs a trace opens whichever one the list is showing.
#   - c31ee765df4d49cc83e21d3536b5fc1f — "What tables are available?
#     Answer briefly." (2 spans)
#   - a411be501817482ca7d4258e8b599717 — "Run a SQL query against the
#     oxymart view to compute total sales by store, and show me the top 5
#     stores." (12 spans: analytics.run, analytics.clarify, 5x llm.call,
#     2x analytics.tool, analytics.execute, analytics.tool_call,
#     analytics.interpret — verified via GET /traces/<id> before writing
#     this flow)
# These ids are ONLY valid against the standalone ClickHouse-backed server
# this flow was authored against (see the PR/session notes for how it was
# stood up) — this flow cannot run unmodified against the split-fleet
# Docker deployment (no ClickHouse there) or a fresh `--local`/`--clean`
# boot (no seed path populates observability data). Driving it needs
# `--no-auto-backend` + `OXY_BASE_URL` pointed at a server wired to
# ClickHouse with these two traces present.
#
# NO TESTIDS EXIST ON THIS SURFACE. Grepped
# web-app/src/pages/ide/observability/**/*.tsx per the skill's authoring
# rule — zero `data-testid` in the entire tree. This flow is entirely
# text/selector-based as a result (same shape as `ide-database-fleet` and
# `partners-console-fleet`, see their _budgets.yml notes). Adding testids
# would be the right long-term fix but is out of scope here (this session
# is restricted to authoring under tests/agentic/flows/ only).
#
# COST: zero `act` steps — every step is a deterministic wait against
# already-seeded data, so there is no LLM tool-pick loop. Cold and warm
# are both just the judge calls, same shape as `apps-data-app-charts`.

name: observability traces list and trace detail render real backend data
target: ide

settings:
  runs: 1
  trace: on-failure
  cache_actions: true
  max_steps: 10

# Shared by both cases below (setup re-runs before EACH case, per
# json-schemas/flow-test.json). Case 1 needs exactly this page; case 2
# adds one `act` step to navigate on to the specific trace it needs —
# `setup:` is flow-level and cannot vary per case, so a second `goto:`
# entry here would just be clobbered by case 2's own navigation anyway.
setup:
  - "goto:/ide/observability/traces"

cases:
  - name: traces list shows both seeded traces with valid relative timestamps
    tags: [ide, observability, traces, timestamps, regression]
    steps:
      # PageHeader title — web-app/src/pages/ide/observability/traces/index.tsx:70
      - wait_for: "selector:text=Traces;timeout_ms=45000"

      # deriveTraceRow() renders the analytics question verbatim as the card
      # title for `analytics.run` traces — traces/components/traceRow.ts:34,42.
      # Waiting on the exact question text (not a generic "trace card"
      # selector) is what proves REAL data arrived, not an empty/loading
      # state that happens to satisfy a looser wait.
      - wait_for: "selector:text=Run a SQL query against the oxymart view;timeout_ms=45000"

    expect:
      - assert: >-
          text "Run a SQL query against the oxymart view to compute total
          sales by store" is visible
      - assert: text "What tables are available? Answer briefly." is visible

      # "No traces found" is TracesList.tsx:38-51's empty state — a real
      # trace list must not also be showing it.
      - assert: "selector text=No traces found is not visible"

      # The not-configured banner (traces/index.tsx:18-43) is what renders
      # instead of the list when the ClickHouse backend is unset/stale —
      # must be absent given real data is present.
      - assert: "selector text=Observability is not configured is not visible"

      - judge: |
          The page shows a list of trace cards/rows on the Traces page,
          including one whose title is the question "Run a SQL query
          against the oxymart view..." and one whose title is "What tables
          are available? Answer briefly.". Each visible trace row shows a
          relative "time ago" timestamp (e.g. "5 minutes ago", "about 1
          hour ago") next to a clock icon.

          Fail if ANY of the following is true:
          (a) any timestamp-shaped text reads "Invalid Date", "NaN", or an
              em dash "—" where a relative time is expected — the em dash
              is specifically the degraded fallback
              formatTimeAgo() in web-app/src/pages/ide/observability/utils/
              format.ts:20-25 renders for an unparseable timestamp, so its
              presence here means a real timestamp failed to parse;
          (b) the page shows a blank white area, a React error boundary, or
              any text resembling "Something went wrong" — the historical
              crash this flow guards against was a render-time throw, not a
              graceful empty state;
          (c) the "Observability is not configured" banner or a "No traces
              found" empty state is visible instead of the two named
              traces.

  - name: trace detail renders the full 12-span waterfall, not a collapsed sliver
    tags: [ide, observability, trace-detail, timestamps, regression]
    steps:
      # setup landed on the traces LIST; navigate on to this specific
      # trace's detail page. One cheap, atomic act step (browser_navigate
      # is a direct URL tool, not a click-and-hope) rather than a second
      # top-level `setup:` entry, which would apply to case 1 too.
      # Open whatever trace the LIST is showing, rather than naming one.
      # This case used to browser_navigate to a hardcoded trace id, and that
      # id belonged to the standalone ClickHouse stack it was authored
      # against. Every later environment gets a fresh set, so the flow 404'd
      # on "Trace not found" — a failure of the fixture, reported as though
      # the product had broken. Clicking the first row is also what a user
      # does, and it needs no id to survive teardown.
      - act: |
          Click the first trace row in the traces list to open its detail
          page. Do not type a URL; click the row.

      # TraceHeader — trace/components/TraceHeader.tsx:41
      # "{spansCount} spans" is a literal count of every row returned by
      # GET /traces/<id>, independent of layout — asserting the exact
      # number (12, confirmed via the API before authoring this flow) is a
      # stronger check than "some spans rendered": a waterfall that
      # collapsed every span onto one NaN offset would still count 12 rows
      # in the DOM even though it drew them all in the same place, so this
      # assertion and the judge call below are deliberately complementary,
      # not redundant.
      # `spans` (the word) rather than "12 spans". The count is a property of
      # whichever trace this environment happens to hold, not of the product,
      # and pinning it made the flow environment-locked for no extra safety:
      # a waterfall that collapsed every span onto one offset would still
      # print the right count. The claim worth defending is spatial, and the
      # judge below is what defends it.
      - wait_for: "selector:text=spans;timeout_ms=45000"

    expect:
      - assert: text "spans" is visible

      # formatSpanLabel() maps these span names to fixed English labels —
      # utils/spans.tsx:58-66. Three labels spread across the trace's
      # timeline (early/clarify, mid/tool-call, late/interpret) so a
      # waterfall that rendered everything at the same collapsed offset is
      # still distinguishable from one that actually spread spans across
      # the 30s duration (the judge call below looks at spatial position;
      # these confirm the right CONTENT reached the DOM at all).
      # The three span labels this used to assert — "Clarify Question",
      # "Execute Tool Call", "Interpret Results" — only appear for a trace
      # produced by an analytics question. Any other trace fails them while
      # the waterfall is perfectly healthy, so the content check moves into
      # the judge, which asks for named span rows without dictating which.

      # ErrorPage — observability/components/ErrorPage.tsx:14, rendered by
      # trace/index.tsx:47-51 on a query error or missing trace.
      - assert: "selector text=Failed to load trace is not visible"

      - judge: |
          The page is a trace detail / waterfall view. It names a span count
          of at least two, and each span row carries a non-empty label.
          The timeline area shows multiple span rows at VISUALLY DIFFERENT
          horizontal positions and widths along a shared time axis (not all
          stacked at the same left edge with zero or near-zero width), with
          a duration axis showing three tick labels (0ms, a midpoint, and
          the total duration). A relative "time ago" string is visible near
          the top of the page (next to the trace id and duration).

          Fail if ANY of the following is true:
          (a0) the span count is zero or one, or any span row has no label;
          (a) every span bar in the timeline appears collapsed to the same
              tiny sliver at the left edge — this is the exact symptom the
              mod.rs comment calls "spans don't fit the waterfall", caused
              by every span computing the same (NaN or zero) time offset;
          (b) any visible timestamp-shaped text reads "Invalid Date", "NaN",
              or an em dash "—";
          (c) the page shows "Failed to load trace" or "Trace not found";
          (d) the page is blank or shows a React error boundary message.
