# yaml-language-server: $schema=../../../../json-schemas/flow-test.json
#
# Open `test.sql` from the demo project in the IDE, append a comment, save,
# and verify the save button hides. `reset_test_file` wipes test.sql to a
# clean state so reruns start consistently.

name: IDE open, edit, and save
target: ide

settings:
  runs: 1
  trace: on-failure
  cache_actions: true
  max_steps: 20

setup:
  - reset_test_file
  # Straight to the file, the way ide-compile-error already does it. `/ide`
  # redirects to the World Model (App.tsx:442, unconditional in every mode), and
  # `/ide/files` opens the tree on its Objects view — a curated list of
  # automations, agents and apps that a gitignored scratch file like `test.sql`
  # is not in. So neither entry point can reach this file by clicking, and the
  # step that tried to was buying an LLM search of the whole IDE ($1.09 on the
  # 2026-08-19 full run) for a navigation the URL states exactly.
  # dGVzdC5zcWw= is base64("test.sql").
  - "goto:/ide/files/dGVzdC5zcWw="

cases:
  - name: open test.sql, append a comment, save
    tags: [ide, critical]
    steps:
      # The editor is a child route of /ide (Files/index.tsx renders an
      # <Outlet />), so no Monaco exists until the file route mounts. Without
      # this gate the next step could click and type into a page that has no
      # editor yet — the keystrokes go nowhere, the file never becomes
      # `modified`, and the save button never renders. That failure is
      # invisible to `assert: save button is not visible` (which passes when
      # the button never appeared at all), so it surfaced only as a confusing
      # judge verdict on the content claim. Same gate `ide-compile-error` uses.
      - wait_for: "selector:.monaco-editor;timeout_ms=60000"

      - act: |
          Append '-- agentic test edit' to the open file:
          1. browser_click selector ".monaco-editor" to focus. (Page has
             TWO Monaco editors — file editor on top, SQL IDE results
             below. `.first()` picks the file editor.)
          2. browser_press_key "Meta+End" then "Enter".
          3. browser_keyboard_type (NOT browser_type — Monaco's hidden
             textarea breaks selector-based focus) text "-- agentic test edit".

      # `ide-save-button` renders only while fileState === "modified"
      # (Files/Editor/components/EditorHeader/index.tsx), so waiting for it to
      # APPEAR proves the keystrokes actually landed and dirtied the file. This
      # turns a silent "typing was lost" into a fast, named failure here rather
      # than a downstream judge verdict, and stops the save assertion below
      # from passing vacuously against a file that was never edited.
      - wait_for: "selector:[data-testid=ide-save-button]"

      # 2026-10-02 investigation: CI runs headless Chromium on Linux. Monaco's
      # save keybinding is `KeyMod.CtrlCmd | KeyCode.KeyS`, which Monaco
      # resolves to physical Ctrl on Linux/Windows and physical Cmd on
      # macOS — but a literal `Meta+s` here sends the physical Meta/Super
      # key, which matches no binding on Linux and does nothing. Checked:
      # every failing run's trace showed `Meta+s` as the key actually
      # pressed, zero save requests ever left the browser afterward, and the
      # CI runner's own trace reports `platform: linux`. The one sampled
      # passing run ALSO pressed `Meta+s` first with zero effect — it only
      # passed because the model, noticing the button was still visible,
      # fell back to clicking it directly; runs where the model didn't try
      # that fallback failed. `browser_press_key "ControlOrMeta+s"` is
      # Playwright's platform-neutral modifier (resolves to Control on
      # Linux/Windows, Meta on macOS — see `resolveSmartModifierString` in
      # playwright-core), so it exercises the real keybinding Monaco
      # registers on whatever OS the test runs on, same as a real user's
      # Ctrl/Cmd+S.
      - act: |
          Use browser_press_key with key "ControlOrMeta+s" to save. Wait for
          [data-testid=ide-save-button] to disappear.
    expect:
      - assert: "save button is not visible"
      - judge: "the editor content includes the line '-- agentic test edit'"
