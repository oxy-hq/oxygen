# yaml-language-server: $schema=../../../../json-schemas/flow-test.json
#
# End-to-end integration: the builder writes a new measure into the
# semantic model, then we verify DIRECTLY in the IDE's view explorer that
# the measure is usable — it compiles to SQL and executes against the
# warehouse — instead of asking the analytics agent.
#
# Phase 1: From /ide, open the builder via Cmd+I and ask it to add a new
#   measure `high_fuel_price_revenue` (sum of Weekly_Sales filtered to
#   Fuel_Price > 3.5) to `sales_semantics/views/oxymart.view.yml`. Leave
#   auto-approve OFF and explicitly Accept the proposed edit — the toggle is
#   unreliable to flip on warm replay (it left the edit_file suspension
#   unresolved and the measure unwritten), whereas a gated Accept click is
#   deterministic — so the file reliably lands on disk.
#
# Phase 2: Open the oxymart view in the IDE's Explorer mode, select the new
#   measure in the Fields panel, and Run the query. The query compiles to
#   SQL and executes against the DuckDB warehouse; the execution-time
#   indicator (and a results table, not an error panel) proves the
#   builder-created measure is genuinely usable.
#
# Why verify in the IDE explorer rather than via the analytics agent: the
# agentic analytics agent is a HYBRID (semantic model + raw-schema
# fallback). For a question it can answer from base columns it generates
# SQL directly and never touches the dedicated measure, so "did the agent
# use the new measure" runs only ~50–85% even when the question names the
# measure — that's the agent's nature, not a usability signal. The IDE view
# explorer compiles + runs the selected measure deterministically, which is
# exactly the "is this measure usable" check this flow exists for. The whole
# flow is deterministic (no LLM judge).
#
# Why /ide for Phase 1: the Cmd+I hotkey is registered at WorkspaceLayout
# level (App.tsx) but react-hotkeys-hook disables hotkeys while a form input
# is focused; the home page autofocuses the chat textarea and captures `i`.
# The /ide page has no autofocused input, so Meta+i fires reliably.
#
# `restore_demo_file:sales_semantics/views/oxymart.view.yml` reverts the
# view before each run so the measure doesn't compound across reruns. NOTE:
# `restore_demo_file:<rel>` always sources its content from
# `demo_project/<rel>` at HEAD (tests/agentic/fixtures/reset.ts
# `committedDemoFile()`), even when writing remotely via
# OXY_FIXTURE_WORKSPACE — it is not workspace-relative. Against the
# split-fleet deployment (fixture `examples/`) this setup step overwrites
# `examples/sales_semantics/views/oxymart.view.yml` with demo_project's
# version of the same-named file, which differs (demo_project's declares
# extra `entities:` promotion keys for its own `.world-model.yml`; the
# dimensions/measures used here are identical either way, so it did not
# affect this run's outcome, but a future file where the two fixtures
# diverge on the fields actually under test would silently get the wrong
# content). Flagging as a fixture-harness gap, not fixing here — reset.ts is
# shared across every flow that uses `restore_demo_file:`.
#
# Preconditions:
#   * $ANTHROPIC_API_KEY in the runner's environment.
#   * Docker Desktop running. Enterprise mode (default) — the runner
#     spawns `oxy start --enterprise` and seeds `demo_project/` itself.
#
# Cold cost: ~$0.30–0.60 (one builder agent run + IDE-driven steps; no
# analytics agent run and no LLM judge). Warm cost: ~$0.005.
#
# COMPILE STEP (added 2026-08-25) — between Phase 1's Accept and Phase 2's
# Explorer read there is now an explicit Compile click. This is NOT a
# workaround for a test-harness limitation; it reflects real product
# behaviour documented in `internal-docs/compile-boundary.md:13`:
# "Compiling is an explicit shipping action (no webhook, no compile-on-
# save)." The builder's `edit_file` writes only the working copy — on a
# split-fleet deployment the Explorer's Fields-panel read
# (`get_view_details`) is FleetOk and serves the compiled Postgres
# revision, which the raw disk write never touches. A real user hitting
# this exact sequence (builder edit, then straight to the Explorer) would
# see the identical stale panel; this flow's premise was that a compile
# happens implicitly, which the product deliberately does not do. The fix
# is the missing step, not a weaker assertion — clicking
# `[data-testid=ide-compile-button]` when it is present (multi-instance
# only; hidden and skipped on `--local`, where there is no boundary to
# cross). See the dated finding below for the original diagnosis this
# step resolves, and the follow-up dated entry for the fix's own result.
#
# GENUINE PRODUCT FINDING (2026-08-24, driven against the split-fleet Docker
# deployment) — this flow currently FAILS at Phase 2's wait for
# `[data-testid=semantic-field-measure-high_fuel_price_revenue]`, and it is
# not a fleet-routing bug. Evidence:
#   1. The builder run genuinely completes: the file-change suspension's
#      Accept button is clicked and disappears (verified with a cold,
#      snapshot-driven click, not a stale cache replay).
#   2. `GET /api/<ws>/files/<b64>?branch=main` — the RAW file content —
#      confirms `high_fuel_price_revenue` IS written to
#      sales_semantics/views/oxymart.view.yml on `main`, both immediately
#      after the run and 90+ seconds later.
#   3. The Explorer's Fields panel — backed by the FleetOk route
#      `GET /semantic/view/{b64}` (semantic::get_view_details) — never shows
#      it. Confirmed by direct navigation + a fresh Explorer-tab click,
#      independent of the flow's own timing: the panel still lists exactly
#      the original 20 measures.
# ROOT CAUSE (confirmed by reading the code, not just observing symptoms):
# neither write path enqueues a recompile. The builder's `edit_file`
# (crates/agentic/builder/src/tools/edit_file.rs → utils.rs
# `write_file_content`) does a plain `tokio::fs::write` with no call into
# `oxy_compile` anywhere in the crate. The interactive Monaco save handler
# (`crates/app/src/server/api/file.rs` `save_file`) is no better — for a
# `.view.yml` it only invalidates two IN-PROCESS caches
# (`SemanticLayerCacheCtx`/`SemanticEngineCacheCtx`), which is moot for a
# stateless replica and doesn't touch the compiled Postgres row either way.
# `internal-docs/compile-boundary.md` says outright: "Compiling is an
# explicit shipping action (no webhook, no compile-on-save)" — the only
# triggers in code are the IDE-only `POST /:workspace_id/compile` button, an
# admin/CLI compile command, or `compile_after_content_change` on git
# pull/reset (`crates/app/src/server/compile_trigger.rs`, called only from
# `pull_changes`/`reset_to_commit`). And `get_view_details` reads
# `Origin::Compiled` (Postgres) on the DEFAULT branch regardless of node —
# `compile-boundary.md`'s FS carve-out is IDE-only AND non-default-branch
# only — so this is not specific to a replica lacking the working copy; even
# the ide node's own Explorer reads the stale compiled row here. Left
# FAILING per this task's instructions — do not paper over a genuine
# finding by relaxing the wait or the assertions. Not independently verified
# against `--local`/demo_project in this session; the code path gives no
# reason to expect it behaves differently there, which is itself notable
# since this flow's cached actions had a 7-run success streak recorded
# against `--local` before this run — worth an explicit follow-up.
#
# FOLLOW-UP FINDING (2026-08-25) — added the Compile step described above,
# ran it live against the same fleet workspace, and it STILL fails at the
# same wait — but for a deeper, more specific reason than "no compile-on-
# save". Evidence:
#   1. `[data-testid=ide-compile-button]` never renders on this workspace at
#      all. Confirmed two ways: (a) the flow's own compile-check step took a
#      browser_snapshot and correctly found nothing to click (the model
#      behaved correctly — there was genuinely no button); (b) an
#      independent Playwright probe hitting the same
#      `/ide/files/<b64>` URL directly found `page.locator(
#      '[data-testid=ide-compile-button]').count() === 0`, with no
#      `/compile/status` network call fired at all — the button's own
#      component never mounts, this isn't a hidden-but-present state.
#   2. Root cause: `GitActions` — the parent that renders `CompileButton` —
#      returns `null` before `ActionsRow`/`CompileButton` ever mount when
#      `gitState.caps.can_switch_branch` is false
#      (web-app/src/pages/ide/Header/components/GitActions/index.tsx:17,
#      its own comment: "Workspace has no git (git_mode === 'none'); every
#      capability is false"). `GET /orgs/{org}/workspaces` confirms this
#      workspace's `git_remote` is `null` — no git remote configured — which
#      is the `git_mode: none` case; `head_sha: null` on `/compile/status`
#      is the same fact from the other endpoint. This gate is NOT mentioned
#      anywhere in `CompileButton.tsx`'s own doc comment, which lists only
#      two hide conditions (single-instance deployment; non-default branch)
#      — a third, upstream one exists that its author's comment doesn't
#      know about.
#   3. No other path exists. Grepped every call site of the compile-enqueue
#      mutation (`useEnqueueCompile` / `CompileService.enqueue`) in
#      `web-app/src`: `CompileButton.tsx` is the ONLY one. The other two
#      documented triggers (`internal-docs/compile-boundary.md`) are Admin →
#      Run compile now (staff/platform-standing only — `flow@oxy.local` is
#      an org owner with none, per this task's own setup) and CLI
#      `oxy compile` (not reachable from a browser). The agentic-browser-test
#      tool registry has no arbitrary-fetch/JS-execution tool, so an `act:`
#      step cannot route around a missing button by calling the API
#      directly either — there is no honest way to cross this boundary from
#      inside this flow, on this workspace, as this user.
# CONCLUSION: the Compile step is left in place — it is correct behaviour
# (per point 1 above: it checks for the button and clicks it when present,
# and correctly does nothing when it is genuinely absent) and will fix this
# exact gap on any git-enabled workspace. It cannot fix THIS fleet's seeded
# `examples` workspace, which has no git remote — the flow is left FAILING
# there per this task's instructions ("if it cannot [add a compile step
# honestly], say so and leave the flow failing rather than weakening it").
# The broader product finding is worth flagging on its own: a stateless
# split-fleet deployment gives a non-staff user editing a git-less
# workspace's semantic model NO way to ever ship an edit past the
# workspace's initial seed compile — not via this button, not via any other
# UI, ever — since the one manual trigger that exists requires git just to
# render.

name: builder adds measure, verify it is usable in the IDE
target: any

settings:
  runs: 1
  trace: on-failure
  cache_actions: true
  # Cold builder run can iterate many times (lookup_schema, search_files,
  # read_file, validate_project, edit_file). Pad accordingly.
  max_steps: 40

setup:
  - "restore_demo_file:sales_semantics/views/oxymart.view.yml"
  - "goto:/ide"

cases:
  - name: builder adds high_fuel_price_revenue; the IDE view explorer runs it successfully
    tags: [builder, semantic, integration, critical]
    steps:
      # === Phase 1: Builder adds a measure to the semantic model ===
      - act: |
          You are on /ide where Cmd+I opens the builder dialog. Open it and
          submit a build prompt. Do NOT touch the auto-approve toggle — leave
          it OFF; we approve the proposed edit explicitly below. (The
          auto-approve toggle is unreliable to flip on warm replay, which
          left the edit_file suspension unresolved and the measure unwritten;
          an explicit Accept click is deterministic.)

          1. browser_press_key "Meta+i". [data-testid=builder-dialog-root]
             becomes visible.
          2. browser_click [data-testid=builder-input-textarea] to focus.
          3. browser_keyboard_type (NOT browser_type) the user prompt as a
             plain-language request — the kind of thing a real user would
             write at a builder prompt, not a specification with disclaimers:

               "In the oxymart view, add a measure called high_fuel_price_revenue that sums Weekly_Sales for weeks when Fuel_Price is above 3.5."
          4. browser_press_key "Enter". URL changes to /threads/<id> and the
             builder run starts.

          Do NOT browser_snapshot mid-sequence — the snapshot summarizer
          sometimes reports the Radix-portal dialog as missing.

      # With auto-approve OFF the builder proposes the edit and SUSPENDS,
      # rendering a file-change diff with Accept/Reject buttons in the thread
      # (FileChangeDiff.tsx). Wait for the Accept button; 4-min timeout covers
      # the cold builder run (lookup_schema, search_files, validate_project,
      # edit_file) — it can run long when the machine is loaded; an isolated
      # CI runner is faster, but the headroom is cheap (a fast run hits the
      # Accept button well before the ceiling).
      - wait_for: "selector:[data-testid=file-change-accept];timeout_ms=240000"

      - act: |
          The builder proposed the measure edit (auto-approve is OFF).
          browser_click [data-testid=file-change-accept] to approve it. If the
          builder proposed more than one file edit, more than one Accept
          button may appear — click each [data-testid=file-change-accept]
          until none remain. Accepting resumes the pipeline and writes
          high_fuel_price_revenue into the view file.

      # The accept applies the edit: the suspension resolves and the measure
      # is written to the view file. Wait for the Accept button to disappear
      # — that confirms the edit landed — rather than for the whole builder
      # run to finish. The post-accept interpret/summarize turn can run long
      # and isn't needed here: the measure is already on disk once the
      # suspension resolves. (If the builder proposed more than one edit,
      # the act above accepts each, so this only fires once all are applied.)
      - wait_for: "selector_hidden:[data-testid=file-change-accept];timeout_ms=90000"

      # === Phase 2: Verify the measure is usable in the IDE view explorer ===
      # Atomic steps, each gated on a signal proving the previous action
      # landed. Warm replay fires recorded clicks back-to-back, faster than
      # the UI settles, so a compound "navigate + click + click" step races
      # an unsettled page (the run click fired while the Run button was still
      # disabled → no query → the execution-time wait timed out). One action
      # per step + a gate after each removes that race.

      - act: |
          browser_navigate
          "/ide/files/c2FsZXNfc2VtYW50aWNzL3ZpZXdzL294eW1hcnQudmlldy55bWw="
          — that path segment is base64 of
          `sales_semantics/views/oxymart.view.yml`, so this opens the oxymart
          view editor directly. Navigate by URL rather than clicking through
          the file tree (the multi-click tree expansion is timing-flaky on
          warm replay). Do NOT browser_snapshot before it settles.

      # The view opens in Editor (YAML) mode; the mode switcher (tabs
      # aria-labelled "Explorer view" / "Editor view") mounts with the view
      # editor. Gate on the Explorer tab so the click below can't race the
      # post-navigation mount.
      - wait_for: "selector:[aria-label='Explorer view'];timeout_ms=30000"

      # === Compile: ship the working-tree edit to what the Explorer reads.
      # See the file header's "COMPILE STEP" note — on a split-fleet
      # deployment `get_view_details` (the Explorer's Fields-panel read) is
      # FleetOk and serves the compiled Postgres row, not the working copy;
      # the builder's `edit_file` above only wrote the working copy. A
      # manual Compile ships that row. This step is a safe no-op on a
      # single-instance deployment (`--local`, this flow's default), where
      # the Compile button is hidden entirely (`boundary_active: false` —
      # reads already come straight from the working copy there).
      - act: |
          Take a browser_snapshot and check whether
          [data-testid=ide-compile-button] is present in the IDE header.

          IF it IS present: browser_click it. This enqueues a compile of the
          current working tree (including the measure the builder just
          wrote) to the revision the Explorer reads on a multi-instance
          deployment.
          IF it is NOT present: do nothing — this deployment has no compile
          boundary to cross, and the measure is already live.

      # Deterministic and safe on both deployment shapes. When the button
      # above was never clicked (single-instance — "Compiling…" was never on
      # screen), this resolves immediately: Playwright's `hidden` wait state
      # matches "never existed", not just "was visible, now isn't". When it
      # WAS clicked, this bounds the wait for the compile to actually land
      # before the Explorer read below — a small workspace with no git
      # remote compiles in well under a second (confirmed live,
      # 2026-08-24: 79ms), so 60s is generous headroom, not an expected wait.
      - wait_for: "selector_hidden:text=Compiling…;timeout_ms=60000"

      - act: |
          browser_click `role=tab[name='Explorer view']` to switch the view
          editor into Explorer mode; the left Fields panel then lists the
          Dimensions and Measures sections.

      # The just-added measure renders as a clickable item in the Measures
      # section once the explorer loads the (freshly edited) view.
      - wait_for: "selector:[data-testid=semantic-field-measure-high_fuel_price_revenue];timeout_ms=30000"

      - act: |
          Add the measure to the query: if the "Measures" section is
          collapsed, click its "Measures" header first so the item is visible,
          then browser_click
          [data-testid=semantic-field-measure-high_fuel_price_revenue].

      # Selecting the measure marks its sidebar item active (data-active=true)
      # and enables the Run button — it is disabled until at least one field
      # is selected (canExecuteQuery). Gate on the active state so the Run
      # click below cannot fire while the button is still disabled: that was
      # the warm-replay race that left the query unrun and timed out the
      # execution-time wait.
      - wait_for: "selector:[data-testid=semantic-field-measure-high_fuel_price_revenue][data-active=true];timeout_ms=15000"

      - act: |
          browser_click [data-testid=semantic-run-query] (the Run-query play
          button) to compile the selected measure to SQL and execute it.

      # On success the execution-time indicator renders (the query compiled
      # to SQL and executed against DuckDB). On a compile/execution failure
      # the error panel ([data-testid=semantic-query-error]) renders instead
      # and this wait times out — which is the correct "not usable" failure.
      - wait_for: "selector:[data-testid=semantic-query-execution-time];timeout_ms=90000"

    expect:
      # DETERMINISTIC usability check — no LLM judgment. The builder-created
      # measure compiled to SQL and executed against the warehouse, so the
      # execution-time indicator rendered.
      - assert: 'selector [data-testid=semantic-query-execution-time] is visible'
      # And it did not error: the error panel replaces the results table on a
      # compile/execution failure, so it must be absent.
      - assert: 'selector [data-testid=semantic-query-error] is not visible'
      # The results table rendered (a result set came back, not an error).
      - assert: 'selector [data-testid=semantic-query-results] is visible'
      # Rules out a compile that was enqueued but FAILED (distinct from the
      # single-instance "never rendered at all" case, which also satisfies
      # "is not visible"). See the Compile step's comment above.
      - assert: "selector text=Retry compile is not visible"
