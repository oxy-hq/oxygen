# yaml-language-server: $schema=../../../../json-schemas/flow-test.json
#
# Open the World Model graph and confirm the workspace's entities actually
# render, then select one and confirm its detail resolves. No existing flow
# touches this surface — `metric-tree` covers the Metric Tree tab, which is a
# different graph over different data (the product docs call out World Model /
# Context Graph / Metric Tree as three distinct surfaces).
#
# WHY THIS FLOW EXISTS — it is the OTHER half of the split fleet
# --------------------------------------------------------------
# Every other flow added alongside this one asserts a FleetOk route: a replica
# must answer it from Postgres. This one asserts the opposite classification.
# From crates/app/src/server/router/workspace.rs:
#
#   .route_ide("/semantic/world-model",                  get(...get_world_model))      L210
#   .route_ide("/semantic/world-model/instances",        get(...))                     L214
#   .route_ide("/semantic/world-model/filter-counts",    post(...))                    L222
#   .route_ide("/semantic/world-model/instance-detail",  get(...))                     L226
#
# IdeOnly. The graph is driven by `.world-model.yml`, which the compile boundary
# does not materialise (internal-docs/compile-boundary.md § "Not covered by the
# boundary"), so on a stateless replica this page only works if `enforce_role`
# reverse-proxies the request to the ide StatefulSet over OXY_IDE_UPSTREAM. That
# hop is invisible from the single all-in-one process CI runs today, where the
# files are always local and the proxy is never exercised.
#
# The failure is not a crash. web-app/src/pages/ide/WorldModel/index.tsx has
# exactly two degraded states and both look ordinary:
#   L149-155  a Spinner over "Loading world model…"   — hangs forever
#   L158-163  `error.message` or "Failed to load world model" — one grey line
# and a proxy that answers 200-with-nothing produces a graph with zero entity
# nodes, which reads as "this workspace has no world model configured". All
# three are asserted against below.
#
# FIXTURE: demo_project/.world-model.yml declares exactly four entities —
# `store_week` (L8), `store` (L44), `time_period` (L68), `economic_observation`
# (L100). Their ids go straight into the node testids, so asserting on named
# ids (not on a count, not on a prefix match) is what distinguishes "the real
# model arrived" from "something rendered".
#
# Navigation is rail-driven (`goto:/` then [data-testid=rail-core] then
# [data-testid=ide-nav-world-model]) so the flow carries no workspace path
# prefix and resolves identically in local mode and behind a cloud replica's
# org/workspace routing.
#
# COST: two act steps, no agent run, no query execution.

name: IDE world model graph renders and selects an entity
target: ide

settings:
  runs: 1
  trace: on-failure
  cache_actions: true
  # 3 act steps + waits. In line with metric-tree (20) but leaner.
  max_steps: 15

setup:
  - "goto:/"

cases:
  - name: the world model graph renders its entities and opens one
    tags: [ide, world-model, fleet, regression]
    steps:
      # data-testid='rail-core' — web-app/src/components/Shell/WorkspaceShell.tsx:84
      - wait_for: "selector:[data-testid=rail-core]"

      - act: |
          browser_click [data-testid=rail-core] — the Oxygen Factory tile in the
          left icon rail. The IDE opens.

      # data-testid='ide-nav-world-model'
      #   — web-app/src/pages/ide/Sidebar/index.tsx:117
      - wait_for: "selector:[data-testid=ide-nav-world-model];timeout_ms=60000"

      - act: |
          browser_click [data-testid=ide-nav-world-model] — the Globe icon
          button in the narrow IDE sidebar rail. The URL ends with
          /ide/world-model and the interactive map of the semantic model loads.

      # THE GRAPH READ. GET /{project}/semantic/world-model (IdeOnly — proxied
      # to the ide node from a replica). Gating on a NAMED entity id is the
      # assertion: the loading state and the error state both render instead of
      # any node, and a wrong-empty response renders a graph with no nodes at
      # all, so all three failure shapes time out here rather than passing.
      # testid template `wm-entity-${entity.id}`
      #   — web-app/src/pages/ide/WorldModel/components/WorldModelEntityNode.tsx:171
      # `store_week` is the first entity in demo_project/.world-model.yml:8.
      # Generous ceiling: on a replica this is a cross-pod hop, and the model is
      # assembled from the four sales_semantics views.
      - wait_for: "selector:[data-testid=wm-entity-store_week];timeout_ms=90000"

      - act: |
          browser_click [data-testid=wm-entity-store_week] — the "Store Week"
          entity node in the graph. Selecting it highlights the node and opens
          its detail panel on the right, listing the entity's dimensions and
          measures.

      - wait_for: network_idle

    expect:
      # Deterministic, $0. Four separate ids, so a graph that rendered one
      # placeholder node cannot pass, and a partial model is named in the
      # failure rather than averaged into a judge verdict.
      - assert: "selector [data-testid=wm-entity-store_week] is visible"
      - assert: "selector [data-testid=wm-entity-store] is visible"
      - assert: "selector [data-testid=wm-entity-time_period] is visible"
      - assert: "selector [data-testid=wm-entity-economic_observation] is visible"

      - judge: |
          The page is on /ide/world-model showing the World Model graph: several
          connected entity cards (including "Store Week"), with the Store Week
          entity selected and a detail panel on the right describing it — its
          dimensions and/or measures.

          Fail if ANY of the following is true:
          (a) the text "Loading world model…" or a spinner is still on screen —
              the read never resolved;
          (b) the text "Failed to load world model" is visible, or the page
              shows a bare error message in place of the graph;
          (c) the graph area is empty — no entity cards at all — or the page
              otherwise suggests the workspace has no world model;
          (d) any visible text contains "retry shortly", "a compile has been
              enqueued", or "needs_recompile";
          (e) any visible text contains a raw filesystem path or IO error —
              "No such file or directory", "os error", "Workspace directory not
              found", or an absolute path such as one starting "/var/lib/oxy";
          (f) any visible text reports a bad gateway, a proxy failure, or a 421
              misdirected-request error.
