# yaml-language-server: $schema=../../../../json-schemas/flow-test.json
#
# Open the Context Graph and confirm the workspace's files, semantic model, and
# databases actually assemble into one graph, then open a node and confirm its
# detail panel resolves. No existing flow covers `/context-graph` — the closest
# neighbor, `ide-world-model-graph-fleet`, exercises a DIFFERENT graph surface
# (`.world-model.yml` via one backend endpoint); the product docs call out
# World Model / Context Graph / Metric Tree as three distinct surfaces.
#
# WHY THIS IS FLEET-SENSITIVE — an AMPLIFIED version of the world-model story
# --------------------------------------------------------------------------
# Unlike world-model's single `GET /semantic/world-model` call, the Context
# Graph is assembled ENTIRELY client-side out of MANY small requests
# (web-app/src/services/api/contextGraph.ts:19-24, `getContextGraph`):
# `FileService.getFileTree` once, then `FileService.getFile` once PER matched
# project file (view/topic/agent/procedure/app/automation/sql — see
# `parseProjectFiles`, contextGraph.ts:570). Both `get_file_tree` and
# `get_file` are unconditionally `route_ide`
# (crates/app/src/server/router/workspace.rs:576-577), so on this fleet EVERY
# ONE of those ~145 individual reads is proxied to the ide node — not one
# cross-pod hop like world-model, but dozens run in parallel. Each is silently
# swallowed on failure (`contextGraph.ts` catches per-file errors and only
# `console.error`s), so a partial proxy failure would not surface as a visible
# error — it would just quietly shrink the graph. Asserting the FULL,
# NAMED category breakdown (not a bare total) is what catches that.
#
# A SECOND, DIFFERENT fleet mechanism sits right next to it, and this flow
# pins its current (verified) behavior rather than glossing over it:
# `DatabaseService.listDatabases` (-> `GET /databases`) is declared
# `route_split` (crates/app/src/server/router/workspace.rs:600-606) — GET is
# `FleetOk` by default, escalated to a proxied `IdeOnly` call only when the
# request carries a non-empty `branch` query param
# (`escalate_for_branch`, crates/app/src/server/role_middleware.rs:86-96).
# Outside the IDE, `useCurrentWorkspaceBranch.ts:55-67` sends `branchName: ""`
# ON PURPOSE ("a working copy parked on a feature branch is the IDE's
# business, and on a stateless replica the [compile] boundary is the only
# answer there is") — so `/context-graph` NEVER escalates, `GET /databases`
# is always answered locally by the replica, and `list_databases`
# (crates/app/src/server/api/database.rs:287-327) reports "could not look"
# (`datasets: null`) for every database, even ones that ARE synced. Verified
# directly against this fleet (port 3000, same workspace):
#   GET /databases?branch=      -> x-oxy-served-by: serve@...   (not proxied)
#                                   datasets: null for ALL 11 databases,
#                                   including primary_database and local.
#   GET /databases?branch=main  -> x-oxy-forwarded-via: serve@...
#                                   x-oxy-served-by: ide@...     (proxied)
#                                   primary_database: 4 datasets, real tables;
#                                   local: 2 datasets, real tables.
# Net effect, reproduced 3x live on this fleet: the Context Graph's "Tables"
# category is unconditionally ABSENT here — not degraded, not flaky, just
# never populated — while every file-derived category (Views, Entities,
# Topics, Automations, Apps, SQL Queries, Agents) hydrates fully via the
# IdeOnly file proxy above. This is the split-fleet CONTRAST worth pinning:
# two sibling calls off the same page, one always proxied (files), one never
# (databases), and the page gives the viewer no indication which is which —
# a "Tables" row simply never appears, reading as "this workspace has no
# tables" rather than "this page cannot see them from here". See
# `ide-database-fleet.flow.test.yml`'s header for the other half: the SAME
# `GET /databases` route DOES escalate and return real table data from
# `/ide/database`, because that page IS inside the IDE and sends a real
# branch — so the identical backend route behaves oppositely depending on
# which page calls it.
#
# FIXTURE: this workspace's `examples/` project (not `demo_project/` — the
# split-fleet Docker deployment is seeded from `examples/`; see
# `ide-world-model-graph-fleet.flow.test.yml`'s header and
# `tests/agentic/README.md`'s fleet section).
#
# WHY THE COUNTS ARE NOT PINNED. An earlier version of this flow asserted the
# exact totals it measured (Total Nodes 145, Total Edges 142). They were stable
# across three consecutive readings — and then went to 144 edges the moment
# another agent's builder run added a measure to a `.view.yml` in the same
# workspace. That is the fixture changing size, not the page breaking, and a
# test that goes red for it reports fixture churn as a regression. So the
# assertions below pin the SHAPE — every category present and non-empty, no
# Tables row, a named node that opens with real content — and leave the
# magnitudes free. Each category being present and non-zero is still specific:
# a partial hydrate drops whole categories, it does not shave two edges. `procedures/sql/orders_daily_rollup.sql` is a uniquely-named
# SQL Query node (unlike two nodes both literally labeled "example") used
# below as the node-click target.
#
# Run this against the fleet, never the default way — see
# `ide-world-model-graph-fleet.flow.test.yml`'s header for the same caveat:
# `backend_mode` (default: enterprise) does NOT select a fixture, it only picks what
# the runner auto-spawns when not handed a backend already (`runner/backend.ts`
# `spawnArgs`); driving the fleet means `--no-auto-backend` + `OXY_BASE_URL`.
#
# COST: two act steps (filter to SQL Queries, click one node) — no agent run,
# no query execution. The dominant cost is wall-clock, not tokens: the bulk
# per-file hydration took 18-26s across three live runs on this shared fleet.

name: context graph assembles from proxied file reads and opens a node (fleet fixture)
target: any

settings:
  runs: 1
  trace: on-failure
  cache_actions: true
  # 2 act steps + waits. The graph has no per-node testids (ReactFlow generic
  # nodes), so the filter + click steps may take a couple of extra iterations
  # to visually locate a label — in line with ide-world-model-graph-fleet (15).
  max_steps: 18

setup:
  - "goto:/context-graph"

cases:
  - name: the context graph hydrates every file-derived category and opens a SQL query node
    tags: [context-graph, compile-boundary, fleet, regression]
    steps:
      # data-testid='context-graph-container' — web-app/src/pages/context-graph/index.tsx:14
      - wait_for: "selector:[data-testid=context-graph-container]"

      # data-testid='context-graph-stats' — GraphStatsPanel.tsx:18. Only renders
      # once ALL of getFileTree + ~145 per-file GETs + listDatabases have
      # resolved (Promise.all in getContextGraph, contextGraph.ts:21-24), so
      # this is the gate for "every proxied file read made it back". Generous
      # ceiling: measured 18-26s on this shared fleet across three runs, each
      # read is an individual ide-proxy hop and this fleet runs other agents'
      # flows concurrently.
      - wait_for: "selector:[data-testid=context-graph-stats];timeout_ms=120000"

      # Focus View select (shadcn/Radix) — GraphFilterPanel.tsx:39. Filtering
      # to SQL Queries isolates the 17 sql_query nodes so the next step can
      # click one unambiguously (several other node labels repeat, e.g. two
      # unrelated nodes are both literally named "example").
      - act: |
          Filter the graph to SQL Query nodes only:
          1. browser_click [data-testid=context-graph-filter-type] (the "Focus
             View" dropdown in the top-left panel, currently showing "All
             Types"). A dropdown list opens.
          2. browser_click the option with the exact visible text "SQL
             Queries" (role=option). The graph dims every node except the 17
             SQL Query type.

      # One SQL Query node has a uniquely-readable label — `orders_daily_rollup`
      # (path `procedures/sql/orders_daily_rollup.sql`). Click it to open the
      # right-side detail panel, which independently re-fetches this file's
      # content via useFile() -> GET /files/{pathb64} — ANOTHER individual
      # IdeOnly-proxied read, this time triggered on-demand by user
      # interaction rather than the bulk initial load above.
      - act: |
          browser_click the graph node with the exact visible text
          "orders_daily_rollup" (a small pill-shaped node; it is now one of
          the few full-opacity nodes after the SQL Queries filter). A detail
          panel slides in from the right showing its title, type, path, and
          SQL contents.

      - wait_for: network_idle

    expect:
      # Deterministic, $0.
      - assert: "selector [data-testid=context-graph-container] is visible"
      - assert: "selector [data-testid=context-graph-stats] is visible"
      # ErrorAlert renders role='alert' (web-app/src/components/ui/ErrorAlert.tsx:29)
      # for BOTH the page-level "Error loading context graph" state and the
      # detail panel's "Failed to load file content" state — one selector
      # catches either degraded path.
      - assert: "selector [role=alert] is not visible"
      # Detail panel opened for the right node — PanelHeader title + Path field
      # (NodeDetailPanel.tsx), each a standalone text node so a plain
      # substring `text` assert is reliable here (unlike the stats panel's
      # label/value pairs, which sit in separate flex-split spans with no
      # literal space between them — covered by the judge call below instead).
      - assert: "text \"orders_daily_rollup\" is visible"
      - assert: "text \"procedures/sql/orders_daily_rollup.sql\" is visible"

      - judge: |
          The Context Graph Overview panel (top-left) shows a "Total Nodes"
          and a "Total Edges" figure, both greater than zero, and a row for
          EVERY one of these seven categories, each with a count of at least
          one: Views, Entities, Topics, Apps, Automations, SQL Queries,
          Agents — and NO "Tables" row at all (this workspace's databases are
          genuinely synced, but this page structurally cannot see their
          tables from a stateless replica; see this file's header). The
          right-side detail panel is open for "orders_daily_rollup", type
          "SQL Query", showing real syntax-highlighted SQL text starting with
          a comment about a "Daily order/check rollup" — not a blank/loading
          panel and not "No content available".

          Fail if ANY of the following is true:
          (a) the Overview panel is missing any of the seven named categories
              above, or any of them shows a count of zero, or either total is
              zero. Do NOT fail because a count differs from a previous run —
              the fixture is a live workspace and its size changes;
          (b) a "Tables" row IS present with a nonzero count (would mean the
              fleet behavior this flow pins has changed — update the flow,
              don't treat this as a false pass);
          (c) the detail panel shows "No content available", a spinner, or is
              not open at all;
          (d) an error banner, "Error loading context graph", or "No data
              available" is visible anywhere;
          (e) any visible text contains "retry shortly", "a compile has been
              enqueued", "needs_recompile", "Workspace directory not found",
              "No such file or directory", "os error", or an absolute
              filesystem path such as one starting "/var/lib/oxy";
          (f) the graph canvas is empty or the page is otherwise blank.

