# yaml-language-server: $schema=../../../../json-schemas/flow-test.json
#
# Open a Data App and confirm its CHARTS actually draw. This is the "view a
# chart / a saved result artifact" journey, and no existing flow asserts it —
# `builder-edits-app` starts at /apps/<id> but says so explicitly in its own
# comment: "we are NOT asserting the chart actually renders on the app page".
#
# WHY THIS IS FLEET-SENSITIVE — the page is fed by THREE routes with TWO
# different classifications (crates/app/src/server/router/workspace.rs,
# build_app_routes at L662-675):
#
#   .route_fleet("/{pathb64}/displays",     get(app::get_displays))       L666
#   .route_fleet("/{pathb64}/data-cached",  get(app::get_app_data_cached))L669
#   .route_ide  ("/{pathb64}",              get(app::get_app_data))       L663
#
# So on a stateless replica the DISPLAY definitions (which charts exist, their
# titles, axes) must come out of Postgres, while the DATA must survive the
# in-binary self-proxy hop to the ide node. A chart is the one widget where
# those two halves are visibly separable: a definition-only success draws an
# empty frame, a data-only success draws nothing at all. Asserting on the
# rendered chart is the only assertion that requires BOTH to have worked.
#
# It also pins the degraded-path UI. When the ide hop fails,
# web-app/src/components/AppPreview/AppDataState.tsx renders either
# [data-testid=ide-unavailable-panel] ("This dashboard needs Oxygen Factory,
# which is restarting") or a "Showing the last saved data" stale notice from the
# FleetOk `data-cached` route. Both are *calm, plausible* screens — a human
# reading one would blame a restart, not a routing bug. Asserting the panel is
# absent turns that quiet degrade into a failure.
#
# FIXTURE: demo_project/oxymart_dashboard.app.yml. Chosen over insights.app.yml
# because it declares `controls: []` (line 3) — no dropdowns to drive, so the
# app auto-runs on mount and the whole flow is act-free. Its `display:` list
# carries a table, two line_charts, two bar_charts and a pie_chart over the
# committed .db/oxymart.csv fixture, all via `execute_sql` against the local
# DuckDB `dataset:` directory (demo_project/config.yml). Nothing external is
# touched.
#
# COST: ZERO act steps — every step is a deterministic wait. Cold cost is one
# judge call, so cold and warm are effectively the same number.
#
# ROUTING: `/apps/<b64>` is the flat path; the runner prefixes it with
# `/<org>/workspaces/<uuid>` (OXY_PATH_PREFIX, runner/session.ts) and the launcher grid links only
# to published CUSTOM apps, not to `.app.yml` Data Apps, so there is no
# affordance to click instead (see tests/agentic/canonical-prompts.md §
# "Launcher navigation"). Driving this against a cloud replica needs the
# prefixed path; the assertions are mode-independent.

name: data app renders its charts
target: any

settings:
  runs: 1
  trace: on-failure
  cache_actions: true
  # No act steps — waits and expectations only.
  max_steps: 10

setup:
  # `b3h5bWFydF9kYXNoYm9hcmQuYXBwLnltbA==` is base64("oxymart_dashboard.app.yml").
  # Same /apps/<base64> addressing builder-edits-app uses.
  - "goto:/apps/b3h5bWFydF9kYXNoYm9hcmQuYXBwLnltbA=="

cases:
  - name: the oxymart dashboard draws its table and charts
    tags: [apps, charts, compile-boundary, fleet, critical]
    steps:
      # data-testid='app-page-root'    — web-app/src/pages/app/index.tsx:23
      - wait_for: "selector:[data-testid=app-page-root]"

      # data-testid='app-preview'      — web-app/src/components/AppPreview/index.tsx:234
      - wait_for: "selector:[data-testid=app-preview]"

      # data-testid='app-preview-loading' — .../AppPreview/index.tsx:272. Held
      # while `isInitialLoading` is true, which covers both the server fetch and
      # the client-mode DuckDB tasks. Waiting for it to CLEAR is the "spinner
      # that never resolves" assertion: seven execute_sql tasks over the CSV,
      # with headroom for a cold DuckDB open and (on a replica) the proxy hop.
      - wait_for: "selector_hidden:[data-testid=app-preview-loading];timeout_ms=180000"

      # data-testid='app-data-table-block'
      #   — web-app/src/components/AppPreview/Displays/DataTableBlock.tsx:137
      # The "Key Performance Indicators" table (`- type: table`,
      # oxymart_dashboard.app.yml). First proof that a task's RESULT SET, not
      # just its definition, made it to the browser.
      - wait_for: "selector:[data-testid=app-data-table-block];timeout_ms=60000"

      # testId='app-line-chart' — .../AppPreview/Displays/LineChart.tsx:106,
      # forwarded onto the wrapper div as data-testid by
      # .../Echarts/EchartsChart.tsx:171. "Total Monthly Sales Over Time".
      - wait_for: "selector:[data-testid=app-line-chart];timeout_ms=60000"

      # testId='app-bar-chart' — .../AppPreview/Displays/BarChart.tsx:106.
      # "Top 10 Stores by Total Sales".
      - wait_for: "selector:[data-testid=app-bar-chart];timeout_ms=60000"

      # SECOND LOADING STATE, undocumented above and not gated by anything yet:
      # `[data-testid=app-preview-loading]` only covers `isInitialLoading`
      # (AppPreview/index.tsx:266-272). Once that clears, a controls-less app
      # (`runButton && controls.length === 0`, true here — oxymart_dashboard.
      # app.yml declares no controls) can immediately kick off a second
      # `isRunning` pass, which renders an absolute-positioned overlay
      # (index.tsx:278-283) with its OWN "Loading app…" text OVER the
      # already-rendered charts — dimmed via `opacity-40`, not `display:none`,
      # so the chart testids stay Playwright-`isVisible()` under it and every
      # deterministic assert above passes while the overlay is still up. Only
      # the judge's screenshot — taken after those asserts, i.e. strictly
      # later — catches it. Measured against the fleet: two consecutive runs
      # both failed the judge on literal "Loading app…" text while every
      # assert passed, and a Playwright script that waited past this point
      # (network idle + a few seconds) screenshotted a clean, fully-opaque
      # dashboard. Reproducible here rather than merely occasional, most
      # likely because the second run's queries take the ide-proxy hop this
      # flow's own header describes ("on a replica this is a cross-pod hop"),
      # which stretches the overlay's visible window past where a same-process
      # local run usually clears it before the judge screenshots. Close the
      # race directly on the symptom rather than guessing a fixed delay.
      - wait_for: "selector_hidden:text=Loading app…;timeout_ms=60000"

    expect:
      # Structural, $0. Each names a different display kind, so a partial render
      # (definitions arrived, one data set did not) is caught rather than
      # averaged away.
      - assert: "selector [data-testid=app-data-table-block] is visible"
      - assert: "selector [data-testid=app-line-chart] is visible"
      - assert: "selector [data-testid=app-bar-chart] is visible"

      # data-testid='app-markdown-display-block'
      #   — .../AppPreview/Displays/MarkdownDisplayBlock.tsx:44. Pure definition,
      # no data: it renders from the compiled `display:` list alone. Present
      # alongside the charts above, it separates "definitions arrived" from
      # "data arrived" in the failure report.
      - assert: "selector [data-testid=app-markdown-display-block] is visible"

      # data-testid='ide-unavailable-panel'
      #   — web-app/src/components/ui/IdeUnavailablePanel.tsx:35. The degraded
      # screen. Its absence is the assertion that the data hop genuinely
      # succeeded rather than falling back.
      - assert: "selector [data-testid=ide-unavailable-panel] is not visible"

      - judge: |
          The page shows the OxyMart Sales Performance Dashboard with real
          content: a markdown heading, a key-performance-indicators table
          containing numbers, and at least two charts that have actually drawn
          plotted data (visible lines or bars with axis labels), not empty
          frames.

          Fail if ANY of the following is true:
          (a) a chart frame or axis is present but has NO plotted series in it —
              an empty chart is the display definition arriving without its
              data;
          (b) an error banner or red alert is visible, including "Error
              refreshing app", or any message about the dashboard needing
              Oxygen Factory / Oxygen Factory restarting;
          (c) a "Showing the last saved data" or otherwise stale-data notice is
              visible — that is the cached fallback, not a live render;
          (d) a loading spinner or "Loading app…" is still on screen;
          (e) any visible text contains "retry shortly", "a compile has been
              enqueued", "Workspace directory not found", "No such file or
              directory", "os error", or an absolute filesystem path;
          (f) the page is blank or shows no displays at all.
