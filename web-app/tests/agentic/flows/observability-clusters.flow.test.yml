# yaml-language-server: $schema=../../../../json-schemas/flow-test.json
#
# Cluster map page. Nothing covered it before this flow.
#
# THIS FLOW IS EXPECTED TO FAIL AGAINST THE CURRENT BUILD — read before
# weakening it back to green.
# -----------------------------------------------------------------------
# `GET /{workspace}/traces/clusters/map` is unconditionally broken. Root
# cause, found while standing up a ClickHouse-backed server to author this
# flow (crates/observability/src/backends/clickhouse/traces.rs:329-360,
# `get_cluster_map_data`):
#
#   let mut conditions = vec![format!("classified_at >= now() - INTERVAL {days} DAY")];  // L335
#   ...
#   let ca = super::iso_utc("classified_at");                                            // L342
#   let sql = format!(
#       "SELECT ... {ca} AS classified_at, ... FROM observability_intent_classifications
#        WHERE {where_clause} ORDER BY classified_at DESC LIMIT {limit}"                  // L343-356
#   );
#
# The WHERE clause is built against the RAW `classified_at` DateTime
# column, then the SELECT list aliases the STRING result of
# `formatDateTime(classified_at, ...)` back onto the exact same name,
# `classified_at`. ClickHouse's query analyzer substitutes that SELECT
# alias into the WHERE predicate wherever the bare column name appears
# (a ClickHouse-specific extension over standard SQL scoping), so the
# query actually executed is
# `formatDateTime(classified_at, ...) >= now() - INTERVAL {days} DAY` — a
# String-vs-DateTime comparison ClickHouse rejects outright:
#
#   Code: 386. DB::Exception: There is no supertype for types String,
#   DateTime ... while executing function greaterOrEquals on arguments
#   formatDateTime(__table1.classified_at, ...) String,
#   _CAST(...,'DateTime') DateTime ... (NO_COMMON_TYPE)
#
# Confirmed reproducible on every call (varied `days`/`limit`/`source`,
# same error every time — not a data-volume or timing flake). Verified via
# `GET /{workspace}/traces/clusters/map` directly with curl before writing
# this flow, and again against the live browser render below.
#
# This is the SAME anti-pattern (WHERE on a bare column name + SELECT
# aliasing `iso_utc(col) AS col` in the same query) also breaks
# `execution-analytics/executions` (see
# `observability-execution-analytics.flow.test.yml`) and silently empties
# the metric-detail "Recent Usage" section (see
# `observability-metrics.flow.test.yml`, case 2) — three independent
# surfaces sharing one root cause. Ironically, `iso_utc()` exists
# specifically as the fix for the OTHER known timestamp footgun
# (mod.rs:36-48, "Kept in one place so every serving query renders
# timestamps identically") — the helper is correct, but this call site's
# WHERE-then-alias ordering recreates a new failure mode in the process of
# avoiding the old one.
#
# THE FRONTEND DEGRADES CALMLY, not a crash: ClustersV2Page (clusters/
# index.tsx:34-43) renders an `ErrorAlert` ("Failed to load cluster data:
# Request failed with status code 500") plus a Retry button when the
# `useClusterMap` query errors. That is the "calm, plausible screen" this
# repo's own `apps-data-app-charts` flow warns about: a human reading it
# would plausibly guess "no data yet" rather than "the SQL doesn't type-
# check", so it is exactly the kind of quiet failure that needs an
# explicit assertion rather than a human glancing at the page.
#
# Per this session's instructions: do not weaken this flow's assertions to
# force green. It asserts the CORRECT behavior (real cluster data
# rendering); it is expected to fail against the current backend, and that
# failure is the finding, not a flow bug.
#
# FIXTURE / PORTABILITY: same standalone ClickHouse-backed server as the
# sibling observability flows — see that file's header for how it was
# stood up. `observability_intent_clusters` had exactly 1 seeded row when
# this was authored (one real analytics run's intent classification); the
# bug reproduces regardless of row count, since the query never gets past
# type-checking.
#
# NO TESTIDS on this page either — see observability-traces.flow.test.yml.
#
# COST: zero `act` steps, one judge call.

name: observability clusters page (expected red — cluster map query is broken)
target: ide

settings:
  runs: 1
  trace: on-failure
  cache_actions: true
  max_steps: 10

setup:
  - "goto:/ide/observability/clusters"

cases:
  - name: cluster map renders real cluster data instead of an error banner
    tags: [ide, observability, clusters, regression, known-broken]
    steps:
      # ClustersHeader — clusters/components/ClustersHeader/index.tsx.
      - wait_for: "selector:text=Clusters;timeout_ms=45000"

      # `network_idle` alone is not a safe terminal signal here: the main
      # query client's default `retry: failureCount < 3` (web-app/src/
      # main.tsx:38) retries a failed query up to 3 times with React
      # Query's default exponential backoff (~1s/2s/4s between attempts,
      # ~7-8s total), and the network genuinely goes idle in the GAPS
      # between retries. Waiting on the error text itself is the actual
      # terminal state for this broken query — confirmed necessary: an
      # earlier run of this flow that only waited on `network_idle`
      # judged the page as "stuck on a loading spinner" because the
      # screenshot landed mid-retry, before the 3rd attempt had failed.
      - wait_for: "selector:text=Failed to load cluster data;timeout_ms=20000"

    expect:
      # EXPECTED TO FAIL today: ErrorAlert renders "Failed to load cluster
      # data: ..." per clusters/index.tsx:37. See header for the exact
      # backend bug (traces.rs:329-360, NO_COMMON_TYPE on `classified_at`).
      - assert: "selector text=Failed to load cluster data is not visible"

      # EmptyState — clusters/index.tsx:66-72, rendered when the query
      # succeeds but returns zero points. Distinguishing this from the
      # error case matters: an empty result would be a genuinely different
      # (and much less serious) finding than a broken query.
      - assert: "selector text=No traces found is not visible"

      - judge: |
          The Clusters page shows real intent-cluster data: a distribution
          chart, a cluster visualization (scatter plot or grid of cluster
          cards), and/or a cluster breakdown table — not an error message
          and not an empty state.

          Fail if ANY of the following is true:
          (a) an "ErrorAlert" / "Failed to load cluster data" message is
              visible, with or without a Retry button;
          (b) the page shows "No traces found" / "No trace data available
              for the selected time range and filters";
          (c) the page is blank, stuck on a loading spinner indefinitely,
              or shows a raw error/exception message.
