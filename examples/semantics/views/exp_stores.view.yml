name: exp_stores
description: |
  The 48 stores of the experiment examples (examples/experiments/), one row per
  store. Owns the `exp_store` entity that a store experiment's `for_each` names.
  Generated by examples/scripts/gen_experiments_data.py, with the day and hour
  panels below.
datasource: local
table: exp_stores.csv

entities:
- name: exp_store
  type: primary
  description: A store in the experiment examples
  key: store_code
  label: store_name

dimensions:
- name: store_code
  type: string
  description: Store code (S01–S48); the unit name in every store experiment
  expr: store_code
- name: store_name
  type: string
  description: Store display name
  expr: store_name
- name: region
  type: string
  description: One of north / south / east / west
  expr: region

measures:
- name: store_count
  type: count
  description: Number of stores
