# Past data, what a change left behind after it ended (`switch_off` +
# `carryover_days`).
#
# Twelve stores ran a spring sale from 2026-04-06; it ended on 2026-04-20
# (`switch_off` is the first day it was off). The post window ends there (14
# days), and the carryover window reads the 14 days after it on its own, beside
# the main effect: "lingered" (significant, same way), "none measurable", or
# "pull-forward" (significant the other way: sales brought earlier, not added).
#
# `switch_off` must be the real end date. A sale stopped early but exported
# with its planned end reads the wrong days. Carryover needs one switch date
# and is refused with a synthetic control.
#
# Planted truth: +10% in-store revenue during the sale (about +270
# $/store-day), then -6% for 14 days (about -150). Expect an increase and a
# pull-forward.
experiment: spring_sale_carryover
hypothesis: "The spring sale lifted in-store revenue, and part of the lift was pulled forward"
owner: ops
for_each: exp_store

design:
  timezone: UTC
  time_dimension: exp_store_days.business_date
  assignment: observed
  waves:
    - switch_on: 2026-04-06
      switch_off: 2026-04-20
      units: [S02, S04, S09, S10, S17, S18, S20, S35, S39, S40, S43, S45]
  pre_days: 28
  post_days: 14
  carryover_days: 14

outcome:
  target: exp_store_days.instore_revenue
  direction: increase
