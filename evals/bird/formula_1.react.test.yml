# Generated by `bird.py gen-cases`; do not edit by hand.
name: "bird-react-formula_1"
target: formula_1.react.agentic.yml
settings:
  runs: 1
  grader: execution
  database: bird_formula_1
cases:
  - name: "bird-240"
    prompt: "By what percentage was Paul di Resta's fastest-lap speed in race 853 higher than in race 854? Use the speed in race 854 as the baseline and round to two decimals."
    expected_sql: "SELECT ROUND(CAST(100.0 * (MAX(CASE WHEN r.raceid = 853 THEN CAST(r.fastestlapspeed AS DECIMAL(12, 4)) END) - MAX(CASE WHEN r.raceid = 854 THEN CAST(r.fastestlapspeed AS DECIMAL(12, 4)) END)) / NULLIF(NULLIF(MAX(CASE WHEN r.raceid = 854 THEN CAST(r.fastestlapspeed AS DECIMAL(12, 4)) END), 0), 0) AS DECIMAL), 2) FROM drivers AS d JOIN results AS r ON r.driverid = d.driverid WHERE d.forename = 'Paul' AND d.surname = 'di Resta' AND r.raceid IN (853, 854)"
    tags: ["challenging", "formula_1"]
  - name: "bird-241"
    prompt: "What percentage of Lewis Hamilton's recorded race entries from 2010 onward were not victories? Round to two decimals."
    expected_sql: "SELECT ROUND(CAST(100.0 * SUM(CASE WHEN x.positionorder <> 1 THEN 1 ELSE 0 END) / NULLIF(NULLIF(COUNT(*), 0), 0) AS DECIMAL), 2) FROM results AS x JOIN drivers AS d ON d.driverid = x.driverid JOIN races AS r ON r.raceid = x.raceid WHERE d.forename = 'Lewis' AND d.surname = 'Hamilton' AND r.year >= 2010"
    tags: ["challenging", "formula_1"]
  - name: "bird-242"
    prompt: "Which driver won the most recorded races? Give their first name, last name, nationality, and highest recorded driver-standings points total."
    expected_sql: "WITH wins AS (SELECT driverid, COUNT(*) AS win_count FROM results WHERE positionorder = 1 GROUP BY driverid), winner AS (SELECT driverid FROM wins ORDER BY win_count DESC NULLS LAST, driverid NULLS FIRST LIMIT 1) SELECT d.forename, d.surname, d.nationality, (SELECT MAX(s.points) FROM driverstandings AS s WHERE s.driverid = d.driverid) FROM winner AS w JOIN drivers AS d ON d.driverid = w.driverid"
    tags: ["moderate", "formula_1"]
  - name: "bird-243"
    prompt: "In the 1988 Australian Grand Prix, by what percentage was the winner's elapsed time shorter than the last full-distance finisher's? Use the last finisher's time as denominator and round to two decimals."
    expected_sql: "WITH finished AS (SELECT x.positionorder, x.milliseconds FROM results AS x JOIN races AS r ON r.raceid = x.raceid JOIN status AS s ON s.statusid = x.statusid WHERE r.name = 'Australian Grand Prix' AND r.year = 1988 AND s.status = 'Finished' AND NOT x.milliseconds IS NULL), extremes AS (SELECT MIN(CASE WHEN positionorder = 1 THEN milliseconds END) AS winner_ms, MAX(CASE WHEN positionorder = (SELECT MAX(positionorder) FROM finished) THEN milliseconds END) AS last_ms FROM finished) SELECT ROUND(CAST(100.0 * (last_ms - winner_ms) / NULLIF(NULLIF(last_ms, 0), 0) AS DECIMAL), 2) FROM extremes"
    tags: ["challenging", "formula_1"]
  - name: "bird-244"
    prompt: "What percentage of Japanese-driver race entries from 2007 through 2009 matched their race winner's recorded lap count? Round to two decimals."
    expected_sql: "SELECT ROUND(CAST(100.0 * SUM(CASE WHEN x.laps = (SELECT y.laps FROM results AS y WHERE y.raceid = x.raceid AND y.positionorder = 1 ORDER BY y.resultid NULLS FIRST LIMIT 1) THEN 1 ELSE 0 END) / NULLIF(NULLIF(COUNT(*), 0), 0) AS DECIMAL), 2) FROM results AS x JOIN races AS r ON r.raceid = x.raceid JOIN drivers AS d ON d.driverid = x.driverid WHERE d.nationality = 'Japanese' AND r.year BETWEEN 2007 AND 2009"
    tags: ["challenging", "formula_1"]
  - name: "bird-245"
    prompt: "For each year before 1975 with recorded winner times, what was the mean race winner elapsed time in seconds? Round the exact mean to two decimal places; if it is exactly halfway, round away from zero. Order by year."
    expected_sql: "SELECT r.year, FLOOR((SUM(x.milliseconds) + 5 * COUNT(*)) / NULLIF((10 * COUNT(*)), 0)) / NULLIF(100.0, 0) FROM results AS x JOIN races AS r ON r.raceid = x.raceid WHERE r.year < 1975 AND x.positionorder = 1 AND NOT x.milliseconds IS NULL GROUP BY r.year ORDER BY r.year NULLS FIRST"
    tags: ["challenging", "formula_1"]
  - name: "bird-246"
    prompt: "From 2000 through 2005, what percentage of race results were by drivers born before 1985 who completed more than 50 laps?"
    expected_sql: "SELECT CASE WHEN (SUM(CASE WHEN EXTRACT(YEAR FROM CAST(t3.dob AS TIMESTAMP)) < '1985' AND t1.laps > 50 THEN 1 ELSE 0 END)) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((SUM(CASE WHEN EXTRACT(YEAR FROM CAST(t3.dob AS TIMESTAMP)) < '1985' AND t1.laps > 50 THEN 1 ELSE 0 END)) AS TEXT) FROM '^[[:space:]]*[+-]?([0-9]+([.][0-9]*)?|[.][0-9]+)([eE][+-]?[0-9]+)?'), '0') AS DOUBLE PRECISION) END * 100 / NULLIF(COUNT(*), 0) FROM results AS t1 INNER JOIN races AS t2 ON t1.raceid = t2.raceid INNER JOIN drivers AS t3 ON t1.driverid = t3.driverid WHERE t2.year BETWEEN 2000 AND 2005"
    tags: ["challenging", "formula_1"]
  - name: "bird-247"
    prompt: "Which constructor scored most points from Monaco Grand Prix between 1980 and 2010? List the score, name and nationality of this team."
    expected_sql: "SELECT SUM(t1.points), t2.name, t2.nationality FROM constructorresults AS t1 INNER JOIN constructors AS t2 ON t1.constructorid = t2.constructorid INNER JOIN races AS t3 ON t3.raceid = t1.raceid WHERE t3.name = 'Monaco Grand Prix' AND t3.year BETWEEN 1980 AND 2010 GROUP BY t2.name, t2.nationality ORDER BY SUM(t1.points) DESC NULLS LAST LIMIT 1"
    tags: ["challenging", "formula_1"]
  - name: "bird-248"
    prompt: "Who recorded the fastest Q3 qualifying time at Marina Bay Street Circuit in 2008? Give the driver's first and last name."
    expected_sql: "SELECT t2.forename, t2.surname FROM qualifying AS t1 INNER JOIN drivers AS t2 ON t1.driverid = t2.driverid INNER JOIN races AS t3 ON t1.raceid = t3.raceid WHERE NOT q3 IS NULL AND t3.year = 2008 AND t3.circuitid IN (SELECT circuitid FROM circuits WHERE name = 'Marina Bay Street Circuit') ORDER BY CASE WHEN (SUBSTRING(CAST(q3 AS TEXT) FROM 1 FOR POSITION(':' IN q3) - 1)) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((SUBSTRING(CAST(q3 AS TEXT) FROM 1 FOR POSITION(':' IN q3) - 1)) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END * 60 + CASE WHEN (SUBSTRING(CAST(q3 AS TEXT) FROM POSITION(':' IN q3) + 1 FOR POSITION('.' IN q3) - POSITION(':' IN q3) - 1)) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((SUBSTRING(CAST(q3 AS TEXT) FROM POSITION(':' IN q3) + 1 FOR POSITION('.' IN q3) - POSITION(':' IN q3) - 1)) AS TEXT) FROM '^[[:space:]]*[+-]?([0-9]+([.][0-9]*)?|[.][0-9]+)([eE][+-]?[0-9]+)?'), '0') AS DOUBLE PRECISION) END + CASE WHEN (SUBSTRING(CAST(q3 AS TEXT) FROM POSITION('.' IN q3) + 1)) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((SUBSTRING(CAST(q3 AS TEXT) FROM POSITION('.' IN q3) + 1)) AS TEXT) FROM '^[[:space:]]*[+-]?([0-9]+([.][0-9]*)?|[.][0-9]+)([eE][+-]?[0-9]+)?'), '0') AS DOUBLE PRECISION) END / NULLIF(1000, 0) ASC NULLS FIRST LIMIT 1"
    tags: ["challenging", "formula_1"]
  - name: "bird-249"
    prompt: "Which 20 drivers recorded the shortest single lap times in Formula 1 races? Give their full names, shortest lap first."
    expected_sql: "WITH per_driver AS (SELECT driverid, MIN(milliseconds) AS fastest_ms FROM laptimes WHERE milliseconds > 0 GROUP BY driverid) SELECT d.forename || ' ' || d.surname AS full_name FROM per_driver AS p JOIN drivers AS d ON d.driverid = p.driverid ORDER BY p.fastest_ms NULLS FIRST, d.driverid NULLS FIRST LIMIT 20"
    tags: ["challenging", "formula_1"]
  - name: "bird-250"
    prompt: "For each Formula 1 circuit in Italy with recorded laps, give the circuit name and its fastest recorded lap time in minutes:seconds.milliseconds format."
    expected_sql: "WITH ranked_laps AS (SELECT c.circuitid, c.name AS circuit_name, l.time AS lap_record, ROW_NUMBER() OVER (PARTITION BY c.circuitid ORDER BY l.milliseconds NULLS FIRST, l.raceid NULLS FIRST, l.driverid NULLS FIRST, l.lap NULLS FIRST) AS rn FROM laptimes AS l JOIN races AS r ON r.raceid = l.raceid JOIN circuits AS c ON c.circuitid = r.circuitid WHERE c.country = 'Italy' AND l.milliseconds > 0) SELECT circuit_name, lap_record FROM ranked_laps WHERE rn = 1 ORDER BY circuit_name NULLS FIRST, circuitid NULLS FIRST"
    tags: ["challenging", "formula_1"]
  - name: "bird-251"
    prompt: "I'm comparing pit stop activity at the newer Grand Prix weekends. Among the 2017 races that were not hosted in 2000, what was the average number of pit stops per race? Please take the average of all of those races and round it to two decimal places."
    expected_sql: "WITH cohort AS (SELECT raceid FROM races WHERE year = 2017 AND NOT name IN (SELECT name FROM races WHERE year = 2000)) SELECT ROUND(CAST(1.0 * (SELECT COUNT(*) FROM pitstops WHERE raceid IN (SELECT raceid FROM cohort)) / NULLIF((SELECT COUNT(*) FROM cohort), 0) AS DECIMAL), 2) AS avg_pit_stops_per_race"
    tags: ["challenging", "formula_1"]
  - name: "bird-252"
    prompt: "I'm writing a retrospective on German F1 drivers born between 1971 and 1985, and I'd like to quantify how often each of them reached the final part of qualifying. For every German driver born in 1971 through 1985 inclusive, over their entire career (every race on record), please give me their forename, surname, Wikipedia page link, date of birth, and the number of Q3 times they set. Sort the list from most Q3 times to fewest, and where two drivers have the same number, put the older one (by date of birth) first."
    expected_sql: "SELECT d.forename, d.surname, d.url, d.dob, COUNT(NULLIF(q.q3, '')) AS q3_times FROM drivers AS d LEFT JOIN qualifying AS q ON q.driverid = d.driverid WHERE d.nationality = 'German' AND EXTRACT(YEAR FROM CAST(d.dob AS TIMESTAMP)) BETWEEN '1971' AND '1985' GROUP BY d.driverid ORDER BY q3_times DESC NULLS LAST, d.dob ASC NULLS FIRST"
    tags: ["challenging", "formula_1"]
  - name: "bird-253"
    prompt: "I'm writing a retrospective on the 1995 Japanese Grand Prix and want to highlight how far off the pace the slowest qualifier was. Could you tell me who set the slowest time in the first qualifying session (Q1) of that race? For that driver (or drivers, if two share the same slowest time, please list them all), I'd like their short reference name, nationality, birthday, and their Q1 time. To be clear, I mean the race named 'Japanese Grand Prix' in the 1995 season. Nothing else needed."
    expected_sql: "WITH t AS (SELECT d.driverref AS driverref, d.nationality AS nationality, d.dob AS dob, q.q1 AS q1 FROM qualifying AS q INNER JOIN races AS r ON q.raceid = r.raceid INNER JOIN drivers AS d ON q.driverid = d.driverid WHERE r.name = 'Japanese Grand Prix' AND r.year = 1995 AND NOT q.q1 IS NULL AND q.q1 <> '') SELECT a.driverref, a.nationality, a.dob, a.q1 FROM t AS a WHERE NOT EXISTS(SELECT 1 FROM t AS b WHERE CASE WHEN (b.q1) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((b.q1) AS TEXT) FROM '^[[:space:]]*[+-]?([0-9]+([.][0-9]*)?|[.][0-9]+)([eE][+-]?[0-9]+)?'), '0') AS DOUBLE PRECISION) END > CASE WHEN (a.q1) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((a.q1) AS TEXT) FROM '^[[:space:]]*[+-]?([0-9]+([.][0-9]*)?|[.][0-9]+)([eE][+-]?[0-9]+)?'), '0') AS DOUBLE PRECISION) END OR (CASE WHEN (b.q1) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((b.q1) AS TEXT) FROM '^[[:space:]]*[+-]?([0-9]+([.][0-9]*)?|[.][0-9]+)([eE][+-]?[0-9]+)?'), '0') AS DOUBLE PRECISION) END = CASE WHEN (a.q1) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((a.q1) AS TEXT) FROM '^[[:space:]]*[+-]?([0-9]+([.][0-9]*)?|[.][0-9]+)([eE][+-]?[0-9]+)?'), '0') AS DOUBLE PRECISION) END AND b.q1 > a.q1))"
    tags: ["challenging", "formula_1"]
  - name: "bird-254"
    prompt: "For qualifying at the 1995 Japanese Grand Prix, I need the nationality of the driver who set the slowest time in Q1. If two drivers tie for the slowest Q1 time, give me each of their nationalities. I only want the nationality value(s), nothing else."
    expected_sql: "WITH t AS (SELECT d.nationality, RANK() OVER (ORDER BY CASE WHEN (REPLACE(SUBSTRING(CAST(q.q1 AS TEXT) FROM 1 FOR POSITION(':' IN q.q1)), ':', '')) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((REPLACE(SUBSTRING(CAST(q.q1 AS TEXT) FROM 1 FOR POSITION(':' IN q.q1)), ':', '')) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END DESC NULLS LAST, CASE WHEN (SUBSTRING(CAST(q.q1 AS TEXT) FROM POSITION(':' IN q.q1) + 1)) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((SUBSTRING(CAST(q.q1 AS TEXT) FROM POSITION(':' IN q.q1) + 1)) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END DESC NULLS LAST) AS rnk FROM qualifying AS q JOIN drivers AS d ON d.driverid = q.driverid JOIN races AS r ON r.raceid = q.raceid WHERE r.year = 1995 AND r.name = 'Japanese Grand Prix' AND NOT q.q1 IS NULL AND q.q1 <> '') SELECT nationality FROM t WHERE rnk = 1"
    tags: ["challenging", "formula_1"]
  - name: "bird-255"
    prompt: "Who set the fastest time in Q1 at the 1995 Japanese Grand Prix, and what was that time? Please give me the driver's forename and surname, and the Q1 time. By '1995 Japanese Grand Prix' I mean the race of the 1995 season named 'Japanese Grand Prix'. If two drivers tied for the fastest Q1 time, list them all."
    expected_sql: "SELECT d.forename, d.surname, q.q1 FROM qualifying AS q JOIN drivers AS d ON d.driverid = q.driverid JOIN races AS r ON r.raceid = q.raceid WHERE r.year = 1995 AND r.name = 'Japanese Grand Prix' AND NOT q.q1 IS NULL ORDER BY CASE WHEN (SUBSTRING(CAST(q.q1 AS TEXT) FROM 1 FOR POSITION(':' IN q.q1) - 1)) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((SUBSTRING(CAST(q.q1 AS TEXT) FROM 1 FOR POSITION(':' IN q.q1) - 1)) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END ASC NULLS FIRST, CASE WHEN (SUBSTRING(CAST(q.q1 AS TEXT) FROM POSITION(':' IN q.q1) + 1)) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((SUBSTRING(CAST(q.q1 AS TEXT) FROM POSITION(':' IN q.q1) + 1)) AS TEXT) FROM '^[[:space:]]*[+-]?([0-9]+([.][0-9]*)?|[.][0-9]+)([eE][+-]?[0-9]+)?'), '0') AS DOUBLE PRECISION) END ASC NULLS FIRST LIMIT 1"
    tags: ["challenging", "formula_1"]
  - name: "bird-256"
    prompt: "For the 2010 Formula 1 season, how many drivers did Lucas di Grassi qualify ahead of? I want a single number: the count of drivers he out-qualified over the whole season. By 'qualify ahead of' I mean recording a better qualifying position than that driver in the same race, with a lower position number being better. The 2010 season means the races held in the year 2010."
    expected_sql: "SELECT COUNT(DISTINCT t2.driverid) AS drivers_qualified_ahead_of FROM qualifying AS t1 JOIN qualifying AS t2 ON t2.raceid = t1.raceid AND t2.position > t1.position JOIN drivers AS d ON d.driverid = t1.driverid JOIN races AS r ON r.raceid = t1.raceid WHERE d.forename = 'Lucas' AND d.surname = 'di Grassi' AND r.year = 2010"
    tags: ["challenging", "formula_1"]
  - name: "bird-257"
    prompt: "I'm writing a recap of the 2017 Italian Grand Prix and want to credit the country of the quickest driver in the second qualifying session. Can you give me the nationality of the driver who set the fastest Q2 lap time in qualifying for the 2017 edition of the Italian Grand Prix? If two or more drivers tied for the fastest Q2 lap time, give me the nationality of each of them. I just need that nationality (or nationalities, in case of a tie), and nothing else."
    expected_sql: "SELECT t2.nationality FROM qualifying AS t1 INNER JOIN races AS t3 ON t3.raceid = t1.raceid INNER JOIN drivers AS t2 ON t2.driverid = t1.driverid WHERE t3.name = 'Italian Grand Prix' AND t3.year = 2017 AND NOT t1.q2 IS NULL AND t1.q2 <> '' AND t1.q2 = (SELECT MIN(q2) FROM qualifying WHERE raceid = t1.raceid AND NOT q2 IS NULL AND q2 <> '')"
    tags: ["challenging", "formula_1"]
  - name: "bird-258"
    prompt: "I'm writing an article about the Italian Grand Prix and want to know which first names recur among the drivers who finished second in that race. For every forename carried by two or more runners-up of the Italian Grand Prix across all its editions in the data, please give me one row with the forename and the number of runners-up who carried it. Order the rows from the most runners-up to the fewest, and alphabetically by forename when two forenames are tied. Leave out any forename held by only one runner-up."
    expected_sql: "SELECT d.forename AS forename, COUNT(DISTINCT d.driverid) AS runner_ups FROM races AS r INNER JOIN results AS x ON x.raceid = r.raceid INNER JOIN drivers AS d ON d.driverid = x.driverid WHERE r.name = 'Italian Grand Prix' AND x.position = 2 GROUP BY d.forename HAVING COUNT(DISTINCT d.driverid) > 1 ORDER BY runner_ups DESC NULLS LAST, d.forename NULLS FIRST"
    tags: ["challenging", "formula_1"]
  - name: "bird-259"
    prompt: "Who won the 2017 Azerbaijan Grand Prix? I'd like the winner's forename and surname, the local clock time (hours:minutes:seconds.milliseconds) at the circuit at which he crossed the finish line, and the url of his information page, so I can compare the moment the race ended with the TV coverage."
    expected_sql: "SELECT d.forename, d.surname, TO_CHAR(CAST(r.time AS TIME) + CAST('0' || res.time AS INTERVAL), 'HH24:MI:SS') || '.' || RIGHT(CAST(res.time AS TEXT), 3) AS finish_time, d.url FROM races AS r JOIN results AS res ON res.raceid = r.raceid JOIN drivers AS d ON d.driverid = res.driverid WHERE r.year = 2017 AND r.name = 'Azerbaijan Grand Prix' AND res.positionorder = 1"
    tags: ["challenging", "formula_1"]
  - name: "bird-260"
    prompt: "For the 2017 Italian Grand Prix, I'd like to identify the drivers who completed the second qualifying session (Q2) but were knocked out and did not reach Q3. Please list every such driver - no ranking, cutoff or tie-break, just all of them - showing each driver's reference name, nationality and birthday, and nothing else."
    expected_sql: "SELECT t2.driverref, t2.nationality, t2.dob FROM qualifying AS t1 INNER JOIN drivers AS t2 ON t1.driverid = t2.driverid INNER JOIN races AS r ON t1.raceid = r.raceid WHERE r.year = 2017 AND r.name = 'Italian Grand Prix' AND NOT t1.q2 IS NULL AND t1.q2 <> '' AND (t1.q3 IS NULL OR t1.q3 = '')"
    tags: ["challenging", "formula_1"]
  - name: "bird-261"
    prompt: "For the 2017 Italian Grand Prix qualifying, what is the nationality of the driver with the second fastest Q2 time? Only drivers who took part in Q2 count, and by second fastest I mean the second smallest Q2 time. If several drivers share that time, list each of their nationalities."
    expected_sql: "WITH q2times AS (SELECT d.nationality, q.q2 FROM qualifying AS q JOIN drivers AS d ON d.driverid = q.driverid JOIN races AS r ON r.raceid = q.raceid WHERE r.name = 'Italian Grand Prix' AND r.year = 2017 AND NOT q.q2 IS NULL AND q.q2 <> '') SELECT DISTINCT t.nationality FROM q2times AS t WHERE t.q2 = (SELECT MIN(q2) FROM q2times WHERE q2 > (SELECT MIN(q2) FROM q2times))"
    tags: ["challenging", "formula_1"]
  - name: "bird-262"
    prompt: "For qualifying at the 2017 Italian Grand Prix, how many drivers set a time in the second qualifying session (Q2) faster than 1:40.000? I just need the count of drivers as a single number."
    expected_sql: "SELECT COUNT(DISTINCT q.driverid) AS driver_count FROM qualifying AS q JOIN races AS r ON r.raceid = q.raceid WHERE r.year = 2017 AND r.name = 'Italian Grand Prix' AND NOT q.q2 IS NULL AND q.q2 <> '' AND q.q2 < '1:40.000'"
    tags: ["challenging", "formula_1"]
  - name: "bird-263"
    prompt: "I'm reviewing the longest service pauses in races across the sport's whole history. Which racetrack saw the longest single pit stop ever? Please give me the racetrack name, location, country, the season year of that race, and the pit stop length. Consider all seasons in the data, and if several pit stops tie for the longest, give me one row for each of them."
    expected_sql: "SELECT c.name AS racetrack, c.location, c.country, r.year AS season_year, ps.duration AS pit_stop_length FROM pitstops AS ps JOIN races AS r ON r.raceid = ps.raceid JOIN circuits AS c ON c.circuitid = r.circuitid WHERE ps.milliseconds = (SELECT MAX(milliseconds) FROM pitstops) ORDER BY c.name NULLS FIRST"
    tags: ["challenging", "formula_1"]
  - name: "bird-264"
    prompt: "I'm researching the generation of drivers born in the 1980s and want to know how much final-session qualifying that generation actually did as a whole cohort. How many Q3 lap times did a driver born between 1981 and 1991 set on average? Count every driver born in that period in the average, including any who never set a Q3 lap time. Please give me the average rounded to two decimal places."
    expected_sql: "SELECT ROUND(CAST(COUNT(q.q3 > '' OR NULL) * 1.0 / NULLIF(COUNT(DISTINCT d.driverid), 0) AS DECIMAL), 2) AS avg_q3_times_per_driver FROM drivers AS d LEFT JOIN qualifying AS q ON q.driverid = d.driverid WHERE EXTRACT(YEAR FROM CAST(d.dob AS TIMESTAMP)) BETWEEN '1981' AND '1991'"
    tags: ["challenging", "formula_1"]
  - name: "bird-265"
    prompt: "I'm profiling drivers whose first name alone doesn't identify them. Across all races in the dataset throughout Formula 1 history, how many qualifying 1 times slower than two minutes were set by drivers who share their first name with at least one other driver and who have no code? I want just that single count."
    expected_sql: "SELECT COUNT(*) AS n FROM qualifying AS q JOIN drivers AS d ON d.driverid = q.driverid WHERE d.code IS NULL AND EXISTS(SELECT 1 FROM drivers AS o WHERE o.forename = d.forename AND o.driverid <> d.driverid) AND NOT q.q1 IS NULL AND (CASE WHEN (SUBSTRING(CAST(q.q1 AS TEXT) FROM 1 FOR POSITION(':' IN q.q1) - 1)) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((SUBSTRING(CAST(q.q1 AS TEXT) FROM 1 FOR POSITION(':' IN q.q1) - 1)) AS TEXT) FROM '^[[:space:]]*[+-]?([0-9]+([.][0-9]*)?|[.][0-9]+)([eE][+-]?[0-9]+)?'), '0') AS DOUBLE PRECISION) END > 2 OR (CASE WHEN (SUBSTRING(CAST(q.q1 AS TEXT) FROM 1 FOR POSITION(':' IN q.q1) - 1)) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((SUBSTRING(CAST(q.q1 AS TEXT) FROM 1 FOR POSITION(':' IN q.q1) - 1)) AS TEXT) FROM '^[[:space:]]*[+-]?([0-9]+([.][0-9]*)?|[.][0-9]+)([eE][+-]?[0-9]+)?'), '0') AS DOUBLE PRECISION) END = 2 AND CASE WHEN (SUBSTRING(CAST(q.q1 AS TEXT) FROM POSITION(':' IN q.q1) + 1)) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((SUBSTRING(CAST(q.q1 AS TEXT) FROM POSITION(':' IN q.q1) + 1)) AS TEXT) FROM '^[[:space:]]*[+-]?([0-9]+([.][0-9]*)?|[.][0-9]+)([eE][+-]?[0-9]+)?'), '0') AS DOUBLE PRECISION) END > 0))"
    tags: ["challenging", "formula_1"]
  - name: "bird-266"
    prompt: "I'm checking how much of the championship points for drivers named Robert came from races covered by the lap-by-lap timing archive. For every driver whose forename is Robert, I need their reference name and the total points they scored in races where lap-by-lap timing data exists for that driver in that race. The totals should cover all seasons and races on record."
    expected_sql: "SELECT d.driverref AS reference_name, COALESCE(SUM(r.points), 0) AS total_points FROM drivers AS d LEFT JOIN results AS r ON r.driverid = d.driverid AND EXISTS(SELECT 1 FROM laptimes AS l WHERE l.raceid = r.raceid AND l.driverid = d.driverid) WHERE d.forename = 'Robert' GROUP BY d.driverid, d.driverref ORDER BY total_points DESC NULLS LAST, reference_name NULLS FIRST"
    tags: ["challenging", "formula_1"]
  - name: "bird-267"
    prompt: "For every edition of the French Grand Prix from the 1990 season through the most recent edition, I'd like to know which drivers set a fastest lap of the race slower than 90 seconds. For each such driver, give me the date of the edition, the driver's forename and surname, and their fastest lap time of that race in m:ss.mmm form. If several drivers in an edition clear that 90-second mark, list one row per driver. If an edition has no driver over 90 seconds, still show the edition with its date, but no driver or lap time. Please order the rows from the earliest edition date to the latest, and within an edition by driver surname alphabetically - if two drivers share the same fastest-lap time, order them by forename alphabetically."
    expected_sql: "WITH editions AS (SELECT raceid, date FROM races WHERE name = 'French Grand Prix' AND year >= 1990), best AS (SELECT raceid, driverid, MIN(milliseconds) AS best FROM laptimes GROUP BY raceid, driverid) SELECT e.date, d.forename, d.surname, lt.time FROM editions AS e LEFT JOIN best AS b ON b.raceid = e.raceid AND b.best > 90 * 1000 LEFT JOIN laptimes AS lt ON lt.raceid = b.raceid AND lt.driverid = b.driverid AND lt.milliseconds = b.best LEFT JOIN drivers AS d ON d.driverid = b.driverid ORDER BY e.date NULLS FIRST, d.surname NULLS FIRST, d.forename NULLS FIRST"
    tags: ["challenging", "formula_1"]
  - name: "bird-268"
    prompt: "I'm putting together a trivia fact about Italian drivers in Formula 1. Who holds the fastest lap time set in Q3 - the third and final part of qualifying - by an Italian driver, across the sport's entire history? Please give me the driver's forename, surname, and the fastest Q3 lap time exactly as it appears in the data. Only consider drivers who have a Q3 lap time recorded for some race, and if several Italian drivers share the exact same fastest Q3 time, list all of them."
    expected_sql: "SELECT d.forename, d.surname, q.q3 AS q3_time FROM qualifying AS q JOIN drivers AS d ON d.driverid = q.driverid WHERE d.nationality = 'Italian' AND q.q3 <> '' AND q.q3 = (SELECT MIN(q2.q3) FROM qualifying AS q2 JOIN drivers AS d2 ON d2.driverid = q2.driverid WHERE d2.nationality = 'Italian' AND q2.q3 > '')"
    tags: ["challenging", "formula_1"]
  - name: "bird-269"
    prompt: "I'm writing a piece on the new generation of British Formula 1 talent. Among British F1 drivers born after 1980, who set the fastest Q3 qualifying time, what was that time, and at which race and in which year was it set? Please give me the driver's full name, the race name, the race year, and the Q3 time. By 'born after 1980' I mean the year of birth is later than 1980. If two qualifying results tie for the fastest Q3 time, I'd like a row for each."
    expected_sql: "WITH cohort AS (SELECT q.driverid, q.raceid, q.q3 FROM drivers AS d JOIN qualifying AS q ON d.driverid = q.driverid WHERE d.nationality = 'British' AND CASE WHEN (EXTRACT(YEAR FROM CAST(d.dob AS TIMESTAMP))) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((EXTRACT(YEAR FROM CAST(d.dob AS TIMESTAMP))) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END > 1980 AND NOT q.q3 IS NULL AND TRIM(CAST(q.q3 AS TEXT)) <> '') SELECT d.forename || ' ' || d.surname AS driver_name, r.name AS race_name, r.year AS race_year, c.q3 AS q3_time FROM cohort AS c JOIN drivers AS d ON d.driverid = c.driverid JOIN races AS r ON r.raceid = c.raceid WHERE c.q3 = (SELECT MIN(q3) FROM cohort)"
    tags: ["challenging", "formula_1"]
  - name: "bird-270"
    prompt: "We're writing a piece on F1's younger generation and want a number for it: how many drivers born in 1976 or later (born from 1 January 1976 onwards) have ever set the second-fastest lap of a race at any point in the history covered by the data? I just need the single count of such drivers."
    expected_sql: "SELECT COUNT(DISTINCT t1.driverid) AS driver_count FROM results AS t1 INNER JOIN drivers AS t2 ON t1.driverid = t2.driverid WHERE EXTRACT(YEAR FROM CAST(t2.dob AS TIMESTAMP)) >= '1976' AND t1.rank = 2"
    tags: ["challenging", "formula_1"]
  - name: "bird-271"
    prompt: "Who set the fastest time in Q3 (the final qualifying session) at the 2017 Italian Grand Prix? Please give me the driver's reference name (the short identifier like 'hamilton') as the result. If two drivers set the same fastest Q3 time, give me both of their reference names."
    expected_sql: "SELECT d.driverref FROM qualifying AS q JOIN drivers AS d ON d.driverid = q.driverid JOIN races AS r ON r.raceid = q.raceid WHERE r.year = 2017 AND r.name = 'Italian Grand Prix' AND NOT q.q3 IS NULL AND q.q3 <> '' AND q.q3 = (SELECT MIN(q3) FROM qualifying WHERE raceid = q.raceid AND NOT q3 IS NULL AND q3 <> '')"
    tags: ["challenging", "formula_1"]
  - name: "bird-272"
    prompt: "Can you rank the Italian Formula 1 constructors by career points and give me the three highest-placed ones? For each, I'd like the constructor name, their career points, and their introduction website. Career points means the total of the points the constructor finished each season with (a season being one calendar year of racing). Constructors with no points still count, ranked with 0. If there are ties, they share a rank and the next rank is skipped (so 1, 1, 3), and I'd like every constructor within the top three ranks returned."
    expected_sql: "WITH season AS (SELECT cs.constructorid, cs.points, ROW_NUMBER() OVER (PARTITION BY cs.constructorid, r.year ORDER BY cs.raceid DESC NULLS LAST) AS rn FROM constructorstandings AS cs JOIN races AS r ON r.raceid = cs.raceid), career AS (SELECT constructorid, SUM(points) AS pts FROM season WHERE rn = 1 GROUP BY constructorid), ranked AS (SELECT c.name, COALESCE(cr.pts, 0) AS pts, c.url, RANK() OVER (ORDER BY COALESCE(cr.pts, 0) DESC NULLS LAST) AS rnk FROM constructors AS c LEFT JOIN career AS cr ON cr.constructorid = c.constructorid WHERE c.nationality = 'Italian') SELECT name, pts, url FROM ranked WHERE rnk <= 3 ORDER BY rnk NULLS FIRST, pts DESC NULLS LAST, name NULLS FIRST"
    tags: ["challenging", "formula_1"]
  - name: "bird-273"
    prompt: "I'm writing a piece about how the same common forenames recur across Formula 1 history. Could you tell me how many different drivers named Peter have ever won a Formula 1 race, and the same for drivers named John? Please give me one count per forename, so I can compare the two — if they turn out to be equal, just report both counts side by side. Nothing else needed."
    expected_sql: "SELECT t1.forename, COUNT(DISTINCT t1.driverid) AS winner_drivers FROM drivers AS t1 INNER JOIN results AS t2 ON t2.driverid = t1.driverid WHERE t2.positionorder = 1 AND t1.forename IN ('John', 'Peter') GROUP BY t1.forename ORDER BY t1.forename NULLS FIRST"
    tags: ["challenging", "formula_1"]
  - name: "bird-274"
    prompt: "I'm working on a story about qualifying records. Across all races, which driver set the fastest time in Q3 (the final part of qualifying)? I'd like the nationality of that driver - and if more than one driver shares the fastest Q3 time, please give me every such driver's nationality. I don't need anything else, just the nationality or nationalities."
    expected_sql: "SELECT DISTINCT d.nationality FROM qualifying AS q JOIN drivers AS d ON d.driverid = q.driverid WHERE TRIM(CAST(q.q3 AS TEXT)) = (SELECT MIN(q3) FROM qualifying WHERE NOT q3 IS NULL AND TRIM(CAST(q3 AS TEXT)) <> '')"
    tags: ["challenging", "formula_1"]
  - name: "bird-275"
    prompt: "I'm putting together a historical note on constructor nationalities in Formula 1. For each constructor nationality, how many constructors from that nationality have recorded the fastest lap of a race? Please include every nationality in the result, with a count of 0 for nationalities where no constructor has done so. Count a constructor only when it is officially credited with the quickest single lap time in a race's recorded result - don't compute lap times yourself."
    expected_sql: "SELECT c.nationality, COUNT(DISTINCT CASE WHEN r.rank = 1 THEN c.constructorid END) AS num_constructors FROM constructors AS c LEFT JOIN results AS r ON c.constructorid = r.constructorid GROUP BY c.nationality ORDER BY num_constructors DESC NULLS LAST, c.nationality NULLS FIRST"
    tags: ["challenging", "formula_1"]
  - name: "bird-276"
    prompt: "I'm studying how pit stop activity changed across the refuelling-rule change for Australia's F1 drivers. For each season from 2002 through 2013, can you give me the total number of pit stops made at the races of that season where, after the race, at least one Australian driver was placed better than 20th in the driver standings? I'd like the season year and the total pit stop count for each season. The pit stop total should cover every driver who pitted at those races, not just the Australian drivers."
    expected_sql: "WITH oz_races AS (SELECT DISTINCT r.raceid, r.year FROM races AS r INNER JOIN driverstandings AS ds ON ds.raceid = r.raceid INNER JOIN drivers AS d ON d.driverid = ds.driverid WHERE d.nationality = 'Australian' AND ds.position <= 19 AND r.year BETWEEN 2002 AND 2013) SELECT oz.year AS season, COUNT(ps.stop) AS pit_stops FROM oz_races AS oz LEFT JOIN pitstops AS ps ON ps.raceid = oz.raceid GROUP BY oz.year ORDER BY oz.year NULLS FIRST"
    tags: ["challenging", "formula_1"]
  - name: "bird-277"
    prompt: "For the 1995 season (races held in the calendar year 1995), how many drivers set a Q1 lap time of more than two minutes - i.e., strictly longer than 2:00.000? I just need the number of drivers."
    expected_sql: "SELECT COUNT(DISTINCT t1.driverid) FROM qualifying AS t1 INNER JOIN races AS t2 ON t2.raceid = t1.raceid WHERE t2.year = 1995 AND (LENGTH(CAST(t1.q1 AS TEXT)) > LENGTH(CAST('2:00.000' AS TEXT)) OR t1.q1 > '2:00.000')"
    tags: ["challenging", "formula_1"]
  - name: "bird-278"
    prompt: "For my monthly recap I need the fastest pit stop made during any F1 race held in September 2016. Please tell me the driver's full name, the pit stop time, the name of the race where it happened, the circuit name, and the circuit location. If two or more pit stops share the fastest time, list each of them with its own driver, race, circuit name and circuit location."
    expected_sql: "WITH scope AS (SELECT ps.driverid, ps.duration, ps.milliseconds, r.raceid FROM pitstops AS ps JOIN races AS r ON r.raceid = ps.raceid WHERE r.date >= '2016-09-01' AND r.date < '2016-10-01') SELECT d.forename || ' ' || d.surname AS driver_name, s.duration AS pit_stop_time, r.name AS race_name, c.name AS circuit_name, c.location AS circuit_location FROM scope AS s JOIN drivers AS d ON d.driverid = s.driverid JOIN races AS r ON r.raceid = s.raceid JOIN circuits AS c ON c.circuitid = r.circuitid WHERE s.milliseconds = (SELECT MIN(milliseconds) FROM scope)"
    tags: ["challenging", "formula_1"]
  - name: "bird-279"
    prompt: "I'm profiling the oldest driver ever to win a Formula 1 race. Please identify the winning driver with the earliest date of birth - if two winning drivers share that birth date, use the one whose full name (forename then surname) comes first alphabetically. For that driver, return his full name (forename then surname), his nationality, the name and date of the first race he won (the earliest date; if two of his wins share that date, the one whose race name comes first alphabetically), and the total number of races he started over his entire career. A win means finishing in position 1 in a race. The career covers every race in the database, from 1950 through 2017. Return a single row."
    expected_sql: "WITH winner AS (SELECT d.driverid, d.forename, d.surname, d.nationality FROM drivers AS d WHERE EXISTS(SELECT 1 FROM results AS res WHERE res.driverid = d.driverid AND res.position = 1) ORDER BY d.dob ASC NULLS FIRST, d.forename ASC NULLS FIRST, d.surname ASC NULLS FIRST LIMIT 1) SELECT w.forename || ' ' || w.surname AS full_name, w.nationality, (SELECT r.name FROM results AS res JOIN races AS r ON r.raceid = res.raceid WHERE res.driverid = w.driverid AND res.position = 1 ORDER BY r.date ASC NULLS FIRST, r.name ASC NULLS FIRST LIMIT 1) AS first_win_race, (SELECT r.date FROM results AS res JOIN races AS r ON r.raceid = res.raceid WHERE res.driverid = w.driverid AND res.position = 1 ORDER BY r.date ASC NULLS FIRST, r.name ASC NULLS FIRST LIMIT 1) AS first_win_date, (SELECT COUNT(DISTINCT res.raceid) FROM results AS res WHERE res.driverid = w.driverid) AS races_started FROM winner AS w"
    tags: ["challenging", "formula_1"]
  - name: "bird-280"
    prompt: "Across the history of the Canadian Grand Prix, how many runnings of the race have had at least one car retire with an accident? Please note that a crash in which the driver was killed is recorded as its own status and should not count as an accident here. I just need the single number of runnings, nothing else."
    expected_sql: "SELECT COUNT(DISTINCT t1.raceid) FROM results AS t1 INNER JOIN races AS t2 ON t1.raceid = t2.raceid INNER JOIN status AS t3 ON t1.statusid = t3.statusid WHERE t3.status = 'Accident' AND t2.name = 'Canadian Grand Prix'"
    tags: ["challenging", "formula_1"]
  - name: "bird-281"
    prompt: "For the 2017 Italian Grand Prix, which driver set the second-fastest time in the second qualifying session (Q2), and which constructor did he drive for that weekend? By second-fastest I mean the driver whose Q2 time comes next after the quickest one, counting every driver who took part in that session. If two drivers tie on Q2 time, the one who started the race higher up the grid counts as the faster of the two. Please give me the driver's forename, the driver's surname, and the constructor name."
    expected_sql: "WITH t AS (SELECT d.driverid, d.forename, d.surname, co.name AS constructor, q.q2, q.position, CASE WHEN (SUBSTRING(CAST(q.q2 AS TEXT) FROM 1 FOR POSITION(':' IN q.q2) - 1)) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((SUBSTRING(CAST(q.q2 AS TEXT) FROM 1 FOR POSITION(':' IN q.q2) - 1)) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END AS mins, CASE WHEN (SUBSTRING(CAST(q.q2 AS TEXT) FROM POSITION(':' IN q.q2) + 1)) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((SUBSTRING(CAST(q.q2 AS TEXT) FROM POSITION(':' IN q.q2) + 1)) AS TEXT) FROM '^[[:space:]]*[+-]?([0-9]+([.][0-9]*)?|[.][0-9]+)([eE][+-]?[0-9]+)?'), '0') AS DOUBLE PRECISION) END AS secs FROM qualifying AS q JOIN races AS r ON r.raceid = q.raceid JOIN drivers AS d ON d.driverid = q.driverid JOIN constructors AS co ON co.constructorid = q.constructorid WHERE r.year = 2017 AND r.name = 'Italian Grand Prix' AND NOT q.q2 IS NULL AND q.q2 <> '') SELECT forename, surname, constructor FROM t ORDER BY mins ASC NULLS FIRST, secs ASC NULLS FIRST, position ASC NULLS FIRST, driverid ASC NULLS FIRST LIMIT 1 OFFSET 1"
    tags: ["challenging", "formula_1"]
  - name: "bird-282"
    prompt: "I'm writing a season review piece and need the outright quickest Q2 time of the 2017 Formula One season – the fastest single Q2 time set at any race that year. Please give me the surname of the driver who set it and the name of the race where it was set. If two drivers share that fastest Q2 time, list every one of them along with the race names."
    expected_sql: "WITH t AS (SELECT d.surname AS surname, r.name AS race_name, q.driverid AS driverid, q.q2 AS q2 FROM qualifying AS q JOIN drivers AS d ON d.driverid = q.driverid JOIN races AS r ON r.raceid = q.raceid WHERE r.year = 2017 AND CAST(q.q2 AS TEXT) LIKE '%:%.%'), m AS (SELECT MIN(q2) AS q2 FROM t) SELECT t.surname, t.race_name FROM t JOIN m ON m.q2 = t.q2 ORDER BY t.driverid ASC NULLS FIRST"
    tags: ["challenging", "formula_1"]
  - name: "bird-283"
    prompt: "I'm writing a race report and need to name the pole-sitter by their permanent race number. Who set the fastest Q3 qualifying time at the 2017 Italian Grand Prix (the race named 'Italian Grand Prix' in the 2017 season)? Please give me just that driver's permanent number. If two or more drivers share that fastest time, give me the numbers of all of them and nothing else."
    expected_sql: "SELECT d.number FROM qualifying AS q JOIN races AS r ON r.raceid = q.raceid JOIN drivers AS d ON d.driverid = q.driverid WHERE r.name = 'Italian Grand Prix' AND r.year = 2017 AND NOT q.q3 IS NULL AND q.q3 <> '' AND q.q3 = (SELECT MIN(q2.q3) FROM qualifying AS q2 JOIN races AS r2 ON r2.raceid = q2.raceid WHERE r2.name = 'Italian Grand Prix' AND r2.year = 2017 AND NOT q2.q3 IS NULL AND q2.q3 <> '')"
    tags: ["challenging", "formula_1"]
  - name: "bird-284"
    prompt: "For the 2017 Italian Grand Prix, who set the fastest lap time in Q3 (the final qualifying session), and what was that time? Give me the driver code along with the fastest Q3 time. If two or more drivers tie for the fastest Q3 time, list every tied driver."
    expected_sql: "SELECT t2.code, t1.q3 FROM qualifying AS t1 INNER JOIN drivers AS t2 ON t2.driverid = t1.driverid WHERE t1.raceid = (SELECT raceid FROM races WHERE year = 2017 AND name = 'Italian Grand Prix') AND t1.q3 <> '' AND t1.q3 = (SELECT MIN(q3) FROM qualifying WHERE raceid = (SELECT raceid FROM races WHERE year = 2017 AND name = 'Italian Grand Prix') AND q3 <> '')"
    tags: ["challenging", "formula_1"]
  - name: "bird-285"
    prompt: "I'm writing a report on the 2017 Italian Grand Prix (the one held in the 2017 season). Could you tell me the nationality of the driver who set the fastest time in Q3, the final part of qualifying? If several drivers share the same fastest Q3 time, please give each of their nationalities."
    expected_sql: "SELECT d.nationality FROM qualifying AS q JOIN races AS r ON r.raceid = q.raceid JOIN drivers AS d ON d.driverid = q.driverid WHERE r.year = 2017 AND r.name = 'Italian Grand Prix' AND NOT q.q3 IS NULL AND q.q3 <> '' AND q.q3 = (SELECT MIN(q2.q3) FROM qualifying AS q2 JOIN races AS r2 ON r2.raceid = q2.raceid WHERE r2.year = 2017 AND r2.name = 'Italian Grand Prix' AND NOT q2.q3 IS NULL AND q2.q3 <> '')"
    tags: ["challenging", "formula_1"]
  - name: "bird-286"
    prompt: "Which Chinese Grand Prix edition from the 2000s (2000–2009 seasons) had the earliest scheduled local start time? Give me the season year of that edition and the runner-up's time gap to the winner (the runner-up being the driver classified second at the finish). If several editions share the earliest scheduled local start time, use the most recent one."
    expected_sql: "SELECT r.year, res.time AS runner_up_gap FROM races AS r JOIN results AS res ON res.raceid = r.raceid WHERE r.name = 'Chinese Grand Prix' AND r.year BETWEEN 2000 AND 2009 AND res.positionorder = 2 AND NOT r.time IS NULL AND r.time = (SELECT MIN(r2.time) FROM races AS r2 WHERE r2.name = 'Chinese Grand Prix' AND r2.year BETWEEN 2000 AND 2009 AND NOT r2.time IS NULL) ORDER BY r.year DESC NULLS LAST LIMIT 1"
    tags: ["challenging", "formula_1"]
  - name: "bird-287"
    prompt: "I'm writing a qualifying report. Can you give me the driver codes of all drivers who set a time in the third qualifying session at the 2017 Italian Grand Prix? One row per driver who set such a time, and please list the codes in alphabetical order. Nothing else needed."
    expected_sql: "SELECT d.code FROM qualifying AS q JOIN races AS r ON r.raceid = q.raceid JOIN drivers AS d ON d.driverid = q.driverid WHERE r.year = 2017 AND r.name = 'Italian Grand Prix' AND NOT q.q3 IS NULL AND q.q3 <> '' ORDER BY d.code NULLS FIRST"
    tags: ["challenging", "formula_1"]
  - name: "bird-288"
    prompt: "I'm writing about how the Canadian Grand Prix moved to early-evening starts. Could you find the editions of the Canadian Grand Prix from 2007 through 2017 (both years included) that began at 17:00 local time or earlier - a race that began exactly at 17:00 counts. For each one, give me the race year, the winner's forename, the winner's surname, and the winner's finish time. The winner is the single driver classified first at the finish. Nothing else, please."
    expected_sql: "SELECT r.year, d.forename, d.surname, res.time AS finish_time FROM races AS r JOIN results AS res ON res.raceid = r.raceid AND res.positionorder = 1 JOIN drivers AS d ON d.driverid = res.driverid WHERE r.name = 'Canadian Grand Prix' AND r.year BETWEEN 2007 AND 2017 AND CAST(r.time AS TIME) <= TIME '17:00' ORDER BY r.year NULLS FIRST"
    tags: ["challenging", "formula_1"]
  - name: "bird-289"
    prompt: "I'm writing a retrospective on the 2017 Italian Grand Prix at Monza. For the Q3 session of that race's qualifying, can you give me the permanent career race number and surname of every driver whose Q3 lap time was strictly faster than 1 minute 38.000 seconds? I want all drivers under that mark, not just the fastest, and no particular order. Note that by permanent career race number I mean the number a driver carries throughout his career, not a one-off entry number for that weekend."
    expected_sql: "WITH mark(t) AS (SELECT '1' || ':' || '38.000') SELECT d.number, d.surname FROM qualifying AS q INNER JOIN races AS r ON r.raceid = q.raceid INNER JOIN drivers AS d ON d.driverid = q.driverid WHERE r.year = 2017 AND r.name = 'Italian Grand Prix' AND CAST(q.q3 AS TEXT) LIKE '%:%' AND q.q3 < (SELECT t FROM mark) ORDER BY d.number NULLS FIRST"
    tags: ["challenging", "formula_1"]
  - name: "bird-290"
    prompt: "Across all seasons in the database, which circuit's Grand Prix started earliest in the day, and which started latest? I'd like the circuit reference name of the earliest one, the circuit reference name of the latest one, and the gap between those two start times in seconds. Include every season, and if several circuits share the earliest start time, list them all - same for the latest."
    expected_sql: "WITH per_circuit AS (SELECT c.circuitref AS circuitref, MIN(CASE WHEN (EXTRACT(EPOCH FROM CAST(r.time AS TIME))) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((EXTRACT(EPOCH FROM CAST(r.time AS TIME))) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END) AS earliest_start_seconds, MAX(CASE WHEN (EXTRACT(EPOCH FROM CAST(r.time AS TIME))) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((EXTRACT(EPOCH FROM CAST(r.time AS TIME))) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END) AS latest_start_seconds FROM races AS r JOIN circuits AS c ON c.circuitid = r.circuitid WHERE NOT r.time IS NULL GROUP BY c.circuitref) SELECT STRING_AGG(circuitref, ', ') AS earliest_circuitref, (SELECT STRING_AGG(circuitref, ', ') FROM per_circuit WHERE latest_start_seconds = (SELECT MAX(latest_start_seconds) FROM per_circuit)) AS latest_circuitref, (SELECT MAX(latest_start_seconds) - MIN(earliest_start_seconds) FROM per_circuit) AS gap_seconds FROM per_circuit WHERE earliest_start_seconds = (SELECT MIN(earliest_start_seconds) FROM per_circuit)"
    tags: ["challenging", "formula_1"]
  - name: "bird-291"
    prompt: "I'm looking into fastest race laps recorded by drivers born in the 1980s. Can you tell me which three drivers born between 1980 and 1990 reached the highest single fastest-lap speed at any point in their career? I'd like their first and last names, ranked from the highest career-high speed down, and if two drivers are tied on that speed, list the one born earlier first, and then the one whose last name comes first alphabetically. Please give me just the three names, nothing else."
    expected_sql: "SELECT d.forename, d.surname FROM drivers AS d JOIN results AS r ON r.driverid = d.driverid WHERE SUBSTRING(CAST(d.dob AS TEXT) FROM 1 FOR 4) BETWEEN '1980' AND '1990' AND NOT r.fastestlapspeed IS NULL GROUP BY d.driverid, d.forename, d.surname, d.dob ORDER BY MAX(CASE WHEN (r.fastestlapspeed) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((r.fastestlapspeed) AS TEXT) FROM '^[[:space:]]*[+-]?([0-9]+([.][0-9]*)?|[.][0-9]+)([eE][+-]?[0-9]+)?'), '0') AS DOUBLE PRECISION) END) DESC NULLS LAST, d.dob NULLS FIRST, d.surname NULLS FIRST LIMIT 3"
    tags: ["challenging", "formula_1"]
  - name: "bird-292"
    prompt: "For the 2017 Italian Grand Prix, I need the list of drivers who were eliminated after the first qualifying session. Give me one row per eliminated driver with their reference name, ordered by their first-segment time from slowest to fastest. If two eliminated drivers have the same first-segment time, list the one with the lower driverId first."
    expected_sql: "SELECT d.driverref FROM qualifying AS q JOIN races AS r ON r.raceid = q.raceid JOIN drivers AS d ON d.driverid = q.driverid WHERE r.name = 'Italian Grand Prix' AND r.year = 2017 AND NOT q.q1 IS NULL AND (q.q2 IS NULL OR q.q2 = '') ORDER BY q.q1 DESC NULLS LAST, d.driverid NULLS FIRST"
    tags: ["challenging", "formula_1"]
  - name: "bird-293"
    prompt: "For my retrospective on the 1962 British Grand Prix – the race named 'British Grand Prix' in the 1962 season – how many drivers withdrew from that race? I just need a single whole number."
    expected_sql: "SELECT COUNT(DISTINCT x.driverid) AS num_withdrawn_drivers FROM results AS x JOIN races AS r ON r.raceid = x.raceid JOIN status AS s ON s.statusid = x.statusid WHERE r.name = 'British Grand Prix' AND r.year = 1962 AND s.status = 'Withdrew'"
    tags: ["challenging", "formula_1"]
  - name: "bird-294"
    prompt: "For the 1957 British Grand Prix, what percentage of the drivers who took part in the race were classified finishers, rounded to two decimals? By classified finisher I mean a driver whose race record shows them finishing the race, whether on the lead lap or one or more laps behind the winner. I just need the one percentage figure."
    expected_sql: "SELECT ROUND(CAST(100.0 * COUNT(DISTINCT CASE WHEN NOT x.position IS NULL THEN x.driverid END) / NULLIF(COUNT(DISTINCT x.driverid), 0) AS DECIMAL), 2) AS finisher_percentage FROM races AS r JOIN results AS x ON x.raceid = r.raceid WHERE r.year = 1957 AND r.name = 'British Grand Prix'"
    tags: ["challenging", "formula_1"]
