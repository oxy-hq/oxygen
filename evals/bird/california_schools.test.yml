# Generated by `bird.py gen-cases`; do not edit by hand.
name: "bird-california_schools"
target: california_schools.agentic.yml
settings:
  runs: 1
  grader: execution
  database: bird_california_schools
cases:
  - name: "bird-0"
    prompt: "Among schools with a school-level SAT excellence rate above 0.3, what is the highest ages-5-17 free-meal eligibility rate?"
    expected_sql: "SELECT MAX(1.0 * f.\"Free Meal Count (Ages 5-17)\" / NULLIF(f.\"Enrollment (Ages 5-17)\", 0)) FROM frpm AS f JOIN satscores AS s ON s.cds = f.cdscode WHERE s.rtype = 'S' AND s.numtsttakr > 0 AND f.\"Enrollment (Ages 5-17)\" > 0 AND 1.0 * s.numge1500 / NULLIF(s.numtsttakr, 0) > 0.3"
    tags: ["moderate", "california_schools"]
  - name: "bird-1"
    prompt: "For locally funded schools whose K-12 minus ages-5-17 enrollment difference exceeds the average such difference among locally funded schools, list each school's directory-listed name and DOC type."
    expected_sql: "SELECT s.school, s.doctype FROM frpm AS f JOIN schools AS s ON f.cdscode = s.cdscode WHERE s.fundingtype = 'Locally funded' AND (f.\"Enrollment (K-12)\" - f.\"Enrollment (Ages 5-17)\") > (SELECT AVG(f2.\"Enrollment (K-12)\" - f2.\"Enrollment (Ages 5-17)\") FROM frpm AS f2 JOIN schools AS s2 ON f2.cdscode = s2.cdscode WHERE s2.fundingtype = 'Locally funded') ORDER BY s.cdscode NULLS FIRST"
    tags: ["challenging", "california_schools"]
  - name: "bird-2"
    prompt: "For the five schools with ownership code 66 and the largest K-12 free-or-reduced-price meal counts, give each school's K-12 eligible meal rate rounded to six decimal places."
    expected_sql: "SELECT ROUND(CAST(1.0 * f.\"FRPM Count (K-12)\" / NULLIF(NULLIF(f.\"Enrollment (K-12)\", 0), 0) AS DECIMAL), 6) FROM frpm AS f JOIN schools AS s ON s.cdscode = f.cdscode WHERE s.soc = '66' AND NOT f.\"FRPM Count (K-12)\" IS NULL AND f.\"Enrollment (K-12)\" > 0 ORDER BY f.\"FRPM Count (K-12)\" DESC NULLS LAST, s.cdscode NULLS FIRST LIMIT 5"
    tags: ["moderate", "california_schools"]
  - name: "bird-4"
    prompt: "What are the mailing street address and name of the school with the seventh-highest recorded average mathematics score?"
    expected_sql: "SELECT sc.mailstreet, sc.school FROM satscores AS sat JOIN schools AS sc ON sc.cdscode = sat.cds WHERE sat.rtype = 'S' AND NOT sat.avgscrmath IS NULL ORDER BY sat.avgscrmath DESC NULLS LAST, sat.cds NULLS FIRST LIMIT 1 OFFSET 6"
    tags: ["simple", "california_schools"]
  - name: "bird-5"
    prompt: "How many non-charter schools in Los Angeles County have a K-12 free-meal percentage below 0.18%?"
    expected_sql: "SELECT COUNT(t2.school) FROM frpm AS t1 INNER JOIN schools AS t2 ON t1.cdscode = t2.cdscode WHERE t2.county = 'Los Angeles' AND t2.charter = 0 AND CASE WHEN (t1.\"Free Meal Count (K-12)\") IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((t1.\"Free Meal Count (K-12)\") AS TEXT) FROM '^[[:space:]]*[+-]?([0-9]+([.][0-9]*)?|[.][0-9]+)([eE][+-]?[0-9]+)?'), '0') AS DOUBLE PRECISION) END * 100 / NULLIF(t1.\"Enrollment (K-12)\", 0) < 0.18"
    tags: ["challenging", "california_schools"]
  - name: "bird-6"
    prompt: "Which schools served a grade span of Kindergarten to 9th grade in the county of Los Angeles and what is its Percent (%) Eligible FRPM (Ages 5-17)?"
    expected_sql: "SELECT t2.school, t1.\"FRPM Count (Ages 5-17)\" * 100 / NULLIF(t1.\"Enrollment (Ages 5-17)\", 0) FROM frpm AS t1 INNER JOIN schools AS t2 ON t1.cdscode = t2.cdscode WHERE t2.county = 'Los Angeles' AND t2.gsserved = 'K-9'"
    tags: ["moderate", "california_schools"]
  - name: "bird-7"
    prompt: "What is the Percent (%) Eligible Free (K-12) in the school administered by an administrator whose first name is Alusine. List the district code of the school."
    expected_sql: "SELECT t1.\"Free Meal Count (K-12)\" * 100 / NULLIF(t1.\"Enrollment (K-12)\", 0), t1.\"District Code\" FROM frpm AS t1 INNER JOIN schools AS t2 ON t1.cdscode = t2.cdscode WHERE t2.admfname1 = 'Alusine'"
    tags: ["moderate", "california_schools"]
  - name: "bird-8"
    prompt: "List the distinct available administrator email addresses for public intermediate/middle schools in San Bernardino city and county, in a unified school district, opened during 2009 or 2010."
    expected_sql: "WITH matched AS (SELECT admemail1, admemail2, admemail3 FROM schools WHERE county = 'San Bernardino' AND city = 'San Bernardino' AND doctype = 'Unified School District' AND soctype = 'Intermediate/Middle Schools (Public)' AND opendate >= '2009-01-01' AND opendate < '2011-01-01') SELECT admemail1 AS email FROM matched WHERE NOT admemail1 IS NULL AND TRIM(CAST(admemail1 AS TEXT)) <> '' UNION SELECT admemail2 AS email FROM matched WHERE NOT admemail2 IS NULL AND TRIM(CAST(admemail2 AS TEXT)) <> '' UNION SELECT admemail3 AS email FROM matched WHERE NOT admemail3 IS NULL AND TRIM(CAST(admemail3 AS TEXT)) <> '' ORDER BY email NULLS FIRST"
    tags: ["challenging", "california_schools"]
  - name: "bird-9"
    prompt: "I'm comparing three high schools in Alameda County and want to focus on the one with the biggest student body. The schools have these CDS codes: 1751010130583, 1612910137588, and 1611760134270. Which of these three schools has the highest enrollment of students aged 5-17? Please give me the 5-digit NCES school identification number for that school. If two or more of them tie for the highest enrollment, give me the NCES identification number of each tied school."
    expected_sql: "SELECT t1.ncesschool FROM schools AS t1 INNER JOIN frpm AS t2 ON t1.cdscode = t2.cdscode WHERE CASE WHEN (t2.cdscode) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((t2.cdscode) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END IN (1751010130583, 1612910137588, 1611760134270) AND t2.\"Enrollment (Ages 5-17)\" = (SELECT MAX(f.\"Enrollment (Ages 5-17)\") FROM frpm AS f WHERE CASE WHEN (f.cdscode) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((f.cdscode) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END IN (1751010130583, 1612910137588, 1611760134270))"
    tags: ["challenging", "california_schools"]
  - name: "bird-10"
    prompt: "I'm profiling the High Tech High charter network in San Diego. For charter number 756, what is the average number of SAT test takers per school across all of its schools with a San Diego mailing city? Count every school regardless of operational status, and treat a school with no SAT record as having zero test takers. Round the average to two decimals."
    expected_sql: "SELECT ROUND(CAST(SUM(COALESCE(sc.numtsttakr, 0)) * 1.0 / NULLIF(COUNT(*), 0) AS DECIMAL), 2) AS avg_sat_test_takers_per_school FROM schools AS s LEFT JOIN satscores AS sc ON sc.cds = s.cdscode WHERE CASE WHEN (s.charternum) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((s.charternum) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END = 756 AND s.mailcity = 'San Diego'"
    tags: ["challenging", "california_schools"]
  - name: "bird-11"
    prompt: "Following up on the SAT participation review: among the currently operating high schools in the district with NCES identification number 0613360 that had no SAT test takers, which one begins serving students at the earliest grade? Please give me each such school's name and grade span served. Note that a high school must actually enroll students through grade 12-offering grade 12 without enrollment doesn't count. A school with no SAT record counts as having zero SAT test takers and should be included; only exclude schools with a positive number of SAT test takers. Compare starting grades as school grades-preschool comes before kindergarten, which comes before grade 1-and use the lowest grade the school actually serves, not just what it offers. If several schools tie at the earliest grade, list them all alphabetically by school name."
    expected_sql: "WITH cohort AS (SELECT s.school AS school_name, s.gsserved AS grade_span_served, CASE WHEN SUBSTRING(CAST(s.gsserved AS TEXT) FROM 1 FOR POSITION('-' IN s.gsserved || '-') - 1) = 'P' THEN -1 WHEN SUBSTRING(CAST(s.gsserved AS TEXT) FROM 1 FOR POSITION('-' IN s.gsserved || '-') - 1) = 'K' THEN 0 ELSE CASE WHEN (SUBSTRING(CAST(s.gsserved AS TEXT) FROM 1 FOR POSITION('-' IN s.gsserved || '-') - 1)) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((SUBSTRING(CAST(s.gsserved AS TEXT) FROM 1 FOR POSITION('-' IN s.gsserved || '-') - 1)) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END END AS start_rank FROM schools AS s LEFT JOIN satscores AS t ON s.cdscode = t.cds WHERE s.ncesdist = '0613360' AND s.statustype = 'Active' AND CAST(s.gsserved AS TEXT) LIKE '%12' AND COALESCE(t.numtsttakr, 0) = 0) SELECT school_name, grade_span_served FROM cohort WHERE start_rank = (SELECT MIN(start_rank) FROM cohort) ORDER BY school_name NULLS FIRST"
    tags: ["challenging", "california_schools"]
  - name: "bird-12"
    prompt: "I'm profiling schools run directly by the California State Board of Education. Which of those schools has the highest average SAT reading score? If several tie for the highest, give me all of them. For each school, I need its name and its full mailing street address - the complete address, not an abbreviated one. Only include schools the State Board runs directly, and the score must be the school's own result, not a district-wide figure."
    expected_sql: "SELECT s.school, s.mailstreet FROM satscores AS t JOIN schools AS s ON t.cds = s.cdscode WHERE s.doctype = 'State Board of Education' AND NOT t.sname IS NULL AND NOT t.avgscrread IS NULL AND t.avgscrread = (SELECT MAX(t2.avgscrread) FROM satscores AS t2 JOIN schools AS s2 ON t2.cds = s2.cdscode WHERE s2.doctype = 'State Board of Education' AND NOT t2.sname IS NULL AND NOT t2.avgscrread IS NULL)"
    tags: ["challenging", "california_schools"]
  - name: "bird-13"
    prompt: "I'm trying to verify where a school I was told about is located. It's a high school in Alameda County with Breakfast Provision 2 status, serving grades 9 through 12, and its identification number is 1611920113902. What city is this school in?"
    expected_sql: "SELECT s.city FROM schools AS s INNER JOIN frpm AS f ON s.cdscode = f.cdscode WHERE CASE WHEN (s.cdscode) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((s.cdscode) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END = 1611920113902 AND f.\"NSLP Provision Status\" = 'Breakfast Provision 2' AND s.county = 'Alameda' AND f.\"Low Grade\" = '9' AND f.\"High Grade\" = '12' AND s.eilcode = 'HS'"
    tags: ["challenging", "california_schools"]
  - name: "bird-14"
    prompt: "I'm reviewing NSLP Provision 2 schools. Can you give me the name and city of every high school (educational instruction level code HS) whose meal-program status is exactly Provision 2 and whose lowest grade served is above ninth grade? One row per school, ordered by school name. Note: only the status named Provision 2 counts-the breakfast and lunch variants are separate statuses and shouldn't be included."
    expected_sql: "SELECT t2.school AS school, t2.city AS city FROM frpm AS t1 INNER JOIN schools AS t2 ON t1.cdscode = t2.cdscode WHERE t1.\"NSLP Provision Status\" = 'Provision 2' AND t2.eilcode = 'HS' AND CASE WHEN (t1.\"Low Grade\") IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((t1.\"Low Grade\") AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END > 9 ORDER BY t2.school NULLS FIRST"
    tags: ["challenging", "california_schools"]
  - name: "bird-15"
    prompt: "I'm profiling California's statewide benefit charter networks. Among the schools run by a statewide benefit charter network, which single school had the highest number of SAT test takers who scored 1500 or above? Please give me that school's name and its phone number. If several schools tie for the highest count, list every tied school with its phone number."
    expected_sql: "SELECT s.school AS school_name, s.phone AS phone FROM satscores AS t INNER JOIN schools AS s ON t.cds = s.cdscode WHERE s.doctype = 'Statewide Benefit Charter' AND t.rtype = 'S' AND t.numge1500 = (SELECT MAX(t2.numge1500) FROM satscores AS t2 INNER JOIN schools AS s2 ON t2.cds = s2.cdscode WHERE s2.doctype = 'Statewide Benefit Charter' AND t2.rtype = 'S')"
    tags: ["challenging", "california_schools"]
  - name: "bird-16"
    prompt: "I'm looking at a directly-funded charter high school in California with CDS code 1611190130609. Could you tell me its average SAT math score and how many students took the SAT there? Just that one school's figures. If the school with that CDS code turns out not to be directly funded, then there's no answer."
    expected_sql: "SELECT t1.avgscrmath AS average_math_score, t1.numtsttakr AS number_of_test_takers FROM satscores AS t1 INNER JOIN frpm AS t2 ON t1.cds = t2.cdscode WHERE CASE WHEN (t1.cds) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((t1.cds) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END = 1611190130609 AND t2.\"Charter Funding Type\" = 'Directly funded'"
    tags: ["challenging", "california_schools"]
  - name: "bird-17"
    prompt: "I'm looking at SAT participation in Contra Costa County. How many schools in the county had more SAT test takers than the school with CDS code 7618040730051? That school is itself a Contra Costa County school, so I just want the count of schools strictly ahead of it by number of SAT test takers, based on the SAT results snapshot in the data. A single number is all I need."
    expected_sql: "SELECT COUNT(*) AS school_count FROM satscores WHERE cname = 'Contra Costa' AND NOT sname IS NULL AND numtsttakr > (SELECT numtsttakr FROM satscores WHERE CASE WHEN (cds) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((cds) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END = 7618040730051)"
    tags: ["challenging", "california_schools"]
  - name: "bird-18"
    prompt: "I'm comparing schools in San Francisco. How many public schools with a San Francisco mailing city had an average total SAT score of at least 1500? Please count only schools whose district type is 'Unified School District', 'High School District', 'Elementary School District', or 'County Office of Education (COE)' - exclude any other district type. I just need the single count of qualifying schools."
    expected_sql: "SELECT COUNT(*) AS n FROM satscores AS t1 INNER JOIN schools AS t2 ON t1.cds = t2.cdscode WHERE t2.mailcity = 'San Francisco' AND t2.doctype IN ('Unified School District', 'High School District', 'Elementary School District', 'County Office of Education (COE)') AND (t1.avgscrread + t1.avgscrmath + t1.avgscrwrite) >= 1500"
    tags: ["challenging", "california_schools"]
  - name: "bird-19"
    prompt: "What is the lowest grade level at which any school in our district begins serving students? If several schools tie at the lowest grade, just report that single grade level for the whole district. Our district is NCES district ID 0632640."
    expected_sql: "SELECT t1.\"Low Grade\" AS lowest_grade FROM frpm AS t1 INNER JOIN schools AS t2 ON t1.cdscode = t2.cdscode WHERE t2.ncesdist = '0632640' ORDER BY (t1.\"Low Grade\" = 'P') DESC NULLS LAST, (t1.\"Low Grade\" = 'K') DESC NULLS LAST, CASE WHEN (t1.\"Low Grade\") IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((t1.\"Low Grade\") AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END NULLS FIRST, t1.\"Low Grade\" NULLS FIRST LIMIT 1"
    tags: ["challenging", "california_schools"]
  - name: "bird-20"
    prompt: "I'm reviewing administrator coverage across Amador and Madera counties, and I want to see which administrator first names actually cover the most schools. For the two administrator first names whose holders run the most schools across the two counties (ranking names by the number of schools their holders run, with the alphabetically earlier name ranking higher if two names run equally many schools), please give me one row per public school district in those two counties and per those two first names, showing the district name, the first name, and the number of schools in that district run by an administrator with that first name - including every public school district, even ones where that's zero. Every administrator listed for a school counts, not just the first-listed one. A public school district means a unified school district, an elementary school district, a high school district, or a county office of education, and only Amador and Madera counties are in scope."
    expected_sql: "WITH scope AS (SELECT cdscode, district, admfname1 AS fn FROM schools WHERE county IN ('Amador', 'Madera') AND doctype IN ('Unified School District', 'Elementary School District', 'High School District', 'County Office of Education (COE)') AND NOT admfname1 IS NULL UNION SELECT cdscode, district, admfname2 FROM schools WHERE county IN ('Amador', 'Madera') AND doctype IN ('Unified School District', 'Elementary School District', 'High School District', 'County Office of Education (COE)') AND NOT admfname2 IS NULL UNION SELECT cdscode, district, admfname3 FROM schools WHERE county IN ('Amador', 'Madera') AND doctype IN ('Unified School District', 'Elementary School District', 'High School District', 'County Office of Education (COE)') AND NOT admfname3 IS NULL), ranked AS (SELECT fn, COUNT(DISTINCT cdscode) AS schools_run FROM scope GROUP BY fn ORDER BY schools_run DESC NULLS LAST, fn ASC NULLS FIRST LIMIT 2), districts AS (SELECT DISTINCT district FROM schools WHERE county IN ('Amador', 'Madera') AND doctype IN ('Unified School District', 'Elementary School District', 'High School District', 'County Office of Education (COE)')) SELECT d.district AS district_name, r.fn AS first_name, (SELECT COUNT(DISTINCT s.cdscode) FROM scope AS s WHERE s.district = d.district AND s.fn = r.fn) AS school_count FROM districts AS d CROSS JOIN ranked AS r ORDER BY d.district NULLS FIRST, r.fn NULLS FIRST"
    tags: ["challenging", "california_schools"]
  - name: "bird-21"
    prompt: "For the 2014-2015 academic year, what was the average number of enrolled students aged 5 to 17 eligible for free or reduced price meals per Youth Authority school? Count every Youth Authority school regardless of its status (active, closed, or merged), and treat a Youth Authority school with no meal-program record as zero. Please give me just that one number, rounded to two decimal places."
    expected_sql: "SELECT ROUND(CAST(SUM(COALESCE(t1.\"FRPM Count (Ages 5-17)\", 0.0)) * 1.0 / NULLIF(COUNT(t2.cdscode), 0) AS DECIMAL), 2) AS avg_frpm_ages_5_17 FROM schools AS t2 LEFT JOIN frpm AS t1 ON t1.cdscode = t2.cdscode WHERE CAST(t2.soctype AS TEXT) LIKE '%Youth Authority%'"
    tags: ["challenging", "california_schools"]
  - name: "bird-22"
    prompt: "I have a school's CDS code from a separate list of Alameda County schools on Breakfast Provision 2, and I need to confirm which school it is. For the school with CDS code 1612590136051, please give me the school name and the educational instruction level name. This CDS code identifies exactly one school, so return only that school."
    expected_sql: "SELECT s.school, s.eilname FROM schools AS s INNER JOIN frpm AS f ON s.cdscode = f.cdscode WHERE f.\"NSLP Provision Status\" = 'Breakfast Provision 2' AND f.\"County Name\" = 'Alameda' AND CASE WHEN (s.cdscode) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((s.cdscode) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END = 1612590136051"
    tags: ["challenging", "california_schools"]
  - name: "bird-23"
    prompt: "I'm looking at the schools that the State Board of Education directly runs or charters. Which individual school among them had the most students score at least 1500 on the SAT? Please give me that school's name and its administrator's email address. If two schools tie on that count, list both."
    expected_sql: "SELECT t2.school, t2.admemail1 FROM satscores AS t1 INNER JOIN schools AS t2 ON t1.cds = t2.cdscode WHERE t2.doctype = 'State Board of Education' AND t1.rtype = 'S' AND t1.numge1500 = (SELECT MAX(t3.numge1500) FROM satscores AS t3 INNER JOIN schools AS t4 ON t3.cds = t4.cdscode WHERE t4.doctype = 'State Board of Education' AND t3.rtype = 'S')"
    tags: ["challenging", "california_schools"]
  - name: "bird-24"
    prompt: "We're relocating to far Northern California and want to know how far north California's middle schools reach. A middle school means a school serving the middle grades, the level between elementary school and high school — count it as a middle school if either its school type or its school name marks it as serving the middle grades, so a junior high school whose name says 'Middle' counts. Include both open and closed schools. Please tell me which middle school is located furthest north in California, along with its school type (the value of the field named 'School Type'), its school name, and its latitude in degrees. If several middle schools tie for the highest latitude, list all of them."
    expected_sql: "SELECT t1.\"School Type\", t1.\"School Name\", t2.latitude FROM frpm AS t1 INNER JOIN schools AS t2 ON t1.cdscode = t2.cdscode WHERE (CAST(t1.\"School Type\" AS TEXT) LIKE '%Middle%' OR CAST(t1.\"School Name\" AS TEXT) LIKE '%Middle%') AND t2.latitude = (SELECT MAX(t2b.latitude) FROM frpm AS t1b INNER JOIN schools AS t2b ON t1b.cdscode = t2b.cdscode WHERE CAST(t1b.\"School Type\" AS TEXT) LIKE '%Middle%' OR CAST(t1b.\"School Name\" AS TEXT) LIKE '%Middle%')"
    tags: ["challenging", "california_schools"]
  - name: "bird-25"
    prompt: "I'm working on a story about campuses Los Angeles County opened during 2007 and the SAT participation they drew. What was the average number of SAT test takers per school across Los Angeles County schools that opened during 2007 and are run by a school district? Please give me that single number, rounded to two decimals. A few things to keep in mind: a county office of education counts as the school district for the schools it runs; \"opened during 2007\" means the opening date falls in calendar year 2007; and a school with no SAT record counts as zero test takers."
    expected_sql: "SELECT ROUND(CAST(SUM(COALESCE(sat.numtsttakr, 0)) * 1.0 / NULLIF(COUNT(*), 0) AS DECIMAL), 2) AS avg_sat_test_takers FROM schools AS s LEFT JOIN satscores AS sat ON sat.cds = s.cdscode WHERE s.county = 'Los Angeles' AND EXTRACT(YEAR FROM CAST(s.opendate AS TIMESTAMP)) = '2007' AND (CAST(s.doctype AS TEXT) ILIKE '%school district%' OR CAST(s.doctype AS TEXT) ILIKE '%county office of education%')"
    tags: ["challenging", "california_schools"]
  - name: "bird-26"
    prompt: "I'm reviewing charter school funding models and want to compare the directly funded and locally funded charters that are currently in operation. For each of the two funding categories, please give me: (1) the number of charter schools currently in operation, counting only schools the directory lists as active (open), not closed or merged; (2) total 2014-2015 K-12 enrollment; (3) the average percentage of students eligible for free or reduced-price meals, on a 0-100 scale, rounded to two decimals; and (4) the average combined SAT score (reading + math + writing) across schools that have reported scores, rounded to two decimals. Note that schools without SAT results should still count in the school count, enrollment total, and meal-eligibility average. Please give me these figures grouped by funding category."
    expected_sql: "SELECT s.fundingtype AS funding_category, COUNT(*) AS operating_charter_schools, SUM(f.\"Enrollment (K-12)\") AS total_k12_enrollment, ROUND(CAST(AVG(f.\"Percent (%) Eligible FRPM (K-12)\") * 100 AS DECIMAL), 2) AS avg_frpm_percentage, ROUND(CAST(AVG(sat.avgscrread + sat.avgscrmath + sat.avgscrwrite) AS DECIMAL), 2) AS avg_combined_sat FROM schools AS s LEFT JOIN frpm AS f ON f.cdscode = s.cdscode LEFT JOIN satscores AS sat ON sat.cds = s.cdscode WHERE s.charter = 1 AND s.statustype = 'Active' AND s.fundingtype IN ('Directly funded', 'Locally funded') GROUP BY s.fundingtype ORDER BY funding_category NULLS FIRST"
    tags: ["challenging", "california_schools"]
  - name: "bird-27"
    prompt: "Among California's state special schools, which one begins enrolling students at the latest grade level? Please give me: the school's name, the earliest grade level covered by its K-12 enrollment, its K-12 enrollment, and how many SAT test takers it had. In the grade-level codes, P means pre-kindergarten and K means kindergarten, and grades progress from pre-kindergarten to kindergarten to grades 1 through 12 — so a school starting at grade 1 starts later than one starting at kindergarten. If a state special school has no SAT record, still consider it a candidate and report it as having 0 SAT test takers. If two schools start at the same grade level, prefer the one with the larger K-12 enrollment; if still tied, the one whose name comes first alphabetically. The data is for the 2014-2015 school year."
    expected_sql: "SELECT s.school AS school_name, f.\"Low Grade\" AS starting_grade, f.\"Enrollment (K-12)\" AS k12_enrollment, COALESCE(t.numtsttakr, 0) AS sat_test_takers FROM schools AS s JOIN frpm AS f ON f.cdscode = s.cdscode LEFT JOIN satscores AS t ON t.cds = s.cdscode WHERE s.doctype = 'State Special Schools' ORDER BY CASE f.\"Low Grade\" WHEN 'P' THEN 0 WHEN 'K' THEN 1 ELSE CASE WHEN (f.\"Low Grade\") IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((f.\"Low Grade\") AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END + 1 END DESC NULLS LAST, f.\"Enrollment (K-12)\" DESC NULLS LAST, s.school ASC NULLS FIRST LIMIT 1"
    tags: ["challenging", "california_schools"]
  - name: "bird-28"
    prompt: "I'm putting together a brief on SAT participation among California's larger public schools. How many individual named school sites in the state with a K-12 enrollment over 500 and a highest grade served of 8 or below had no SAT test takers? I just need the school_count, a single whole number. Please count a school as an individual school site with a name - district and county offices of education are not schools. Include every qualifying school site statewide even if it shows no SAT results at all; such a site simply had no test takers. By highest grade served I mean the top grade level the school serves, as a grade number from 1 through 12."
    expected_sql: "SELECT COUNT(*) AS school_count FROM schools AS s JOIN frpm AS f ON f.cdscode = s.cdscode LEFT JOIN satscores AS t ON t.cds = s.cdscode WHERE NOT s.school IS NULL AND f.\"Enrollment (K-12)\" > 500 AND CASE WHEN (f.\"High Grade\") IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((f.\"High Grade\") AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END BETWEEN 1 AND 8 AND COALESCE(t.numtsttakr, 0) = 0"
    tags: ["challenging", "california_schools"]
  - name: "bird-29"
    prompt: "I'm studying charter schools run by county offices of education. Using the K-12 school meal program records, for the charter schools these county offices operate, broken down by charter funding type (directly funded and locally funded only), I'd like to know: how many are currently operating, their total K-12 enrollment, and their total number of FRPM-eligible K-12 students. A school counts as currently operating only if its status is Active. Please give me one row per funding type, with directly funded first."
    expected_sql: "SELECT f.\"Charter Funding Type\" AS funding_type, COUNT(*) AS active_charter_schools, SUM(f.\"Enrollment (K-12)\") AS total_k12_enrollment, SUM(f.\"FRPM Count (K-12)\") AS total_frpm_students FROM frpm AS f INNER JOIN schools AS s ON f.cdscode = s.cdscode WHERE f.\"Charter School (Y/N)\" = 1 AND f.\"District Type\" = 'County Office of Education (COE)' AND f.\"Charter Funding Type\" IN ('Directly funded', 'Locally funded') AND s.statustype = 'Active' GROUP BY f.\"Charter Funding Type\" ORDER BY CASE f.\"Charter Funding Type\" WHEN 'Directly funded' THEN 1 ELSE 2 END NULLS FIRST"
    tags: ["challenging", "california_schools"]
  - name: "bird-30"
    prompt: "I'm documenting now-closed California schools whose students performed best on the SAT writing section, and I need the runner-up. Among schools whose status is Closed (not Active, Merged or Pending), and which have an average SAT writing score, can you tell me which school had the second-highest average SAT writing score? By second-highest I mean the best score strictly below the highest – if several schools share that score, please list them all. For each school, give me its name, its own district and county, and its average SAT writing score."
    expected_sql: "WITH j AS (SELECT t2.school AS school, t2.district AS district, t2.county AS county, t1.avgscrwrite AS avgscrwrite FROM satscores AS t1 INNER JOIN schools AS t2 ON t1.cds = t2.cdscode WHERE t2.statustype = 'Closed' AND NOT t1.avgscrwrite IS NULL AND NOT t1.sname IS NULL) SELECT school, district, county, avgscrwrite FROM j WHERE avgscrwrite = (SELECT MAX(avgscrwrite) FROM j WHERE avgscrwrite < (SELECT MAX(avgscrwrite) FROM j))"
    tags: ["challenging", "california_schools"]
  - name: "bird-31"
    prompt: "I'm a parent looking at high schools in California, and I want to know how often a school that's still open has no seniors taking the SAT at all. How many currently open public high schools in California had zero students take the SAT? By 'currently open' I mean the school's status is Active, not closed or merged. By 'high school' I mean a school whose educational instruction level is High School. Please count a school that has no SAT record at all as having zero test takers. I just want that one number."
    expected_sql: "SELECT COUNT(*) AS zero_taker_open_high_schools FROM schools AS sc LEFT JOIN satscores AS s ON sc.cdscode = s.cds WHERE sc.statustype = 'Active' AND sc.eilname = 'High School' AND COALESCE(s.numtsttakr, 0) = 0"
    tags: ["challenging", "california_schools"]
  - name: "bird-32"
    prompt: "I'm planning a targeted meal-support pilot and want to compare one school against similar schools in our county. The county I mean is the one where Fremont High (CDS code 1612590125716) is located - please identify the county by that CDS code, not by the school name. For that county, please look at all K-12 schools with more than 500 free meals and fewer than 700 FRPM meals, and give me back: the county name; the number of schools; the average free-meal percentage and the average FRPM percentage, both on a 0-100 scale with each school's own percentage rounded to 2 decimals before averaging; the number of charter schools and the number of non-charter schools (charter vs. non-charter per the charter indicator in the frpm data); and the average SAT score, where a school's SAT score is the sum of its three SAT section averages, counted only for schools that actually have SAT records, with no SAT record meaning the school is simply excluded from that average. Please round the reported averages to 2 decimals."
    expected_sql: "WITH targetcounty AS (SELECT \"County Name\" AS countyname FROM frpm WHERE CASE WHEN (cdscode) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((cdscode) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END = 1612590125716), cohort AS (SELECT f.cdscode, ROUND(CAST(f.\"Free Meal Count (K-12)\" / NULLIF(f.\"Enrollment (K-12)\", 0) * 100 AS DECIMAL), 2) AS freepct, ROUND(CAST(f.\"FRPM Count (K-12)\" / NULLIF(f.\"Enrollment (K-12)\", 0) * 100 AS DECIMAL), 2) AS frpmpct, f.\"Charter School (Y/N)\" AS charterflag, sd.avgscrread + sd.avgscrmath + sd.avgscrwrite AS satscore FROM frpm AS f JOIN targetcounty AS t ON f.\"County Name\" = t.countyname LEFT JOIN satscores AS sd ON f.cdscode = sd.cds WHERE f.\"Free Meal Count (K-12)\" > 500 AND f.\"FRPM Count (K-12)\" < 700) SELECT (SELECT countyname FROM targetcounty) AS county_name, COUNT(*) AS school_count, ROUND(CAST(AVG(freepct) AS DECIMAL), 2) AS avg_free_meal_pct, ROUND(CAST(AVG(frpmpct) AS DECIMAL), 2) AS avg_frpm_pct, SUM(CASE WHEN charterflag = 1 THEN 1 ELSE 0 END) AS charter_count, SUM(CASE WHEN charterflag = 0 THEN 1 ELSE 0 END) AS non_charter_count, ROUND(CAST(AVG(satscore) AS DECIMAL), 2) AS avg_sat_score FROM cohort"
    tags: ["challenging", "california_schools"]
  - name: "bird-33"
    prompt: "I'm studying the 1980 growth of public schooling in San Diego County. What was the average number of schools per month that opened in San Diego County in 1980 under a school district's jurisdiction? I need just that single number. Please average over all 12 months of 1980 (months with no openings count as zero), and give me the exact average without rounding."
    expected_sql: "SELECT CASE WHEN (COUNT(*)) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((COUNT(*)) AS TEXT) FROM '^[[:space:]]*[+-]?([0-9]+([.][0-9]*)?|[.][0-9]+)([eE][+-]?[0-9]+)?'), '0') AS DOUBLE PRECISION) END / NULLIF(12, 0) AS monthly_average FROM schools WHERE county = 'San Diego' AND EXTRACT(YEAR FROM CAST(opendate AS TIMESTAMP)) = '1980' AND doctype IN ('Elementary School District', 'High School District', 'Unified School District')"
    tags: ["challenging", "california_schools"]
  - name: "bird-34"
    prompt: "Among California schools whose students have an average SAT Math score above 400, what percentage offer virtual instruction, either exclusively or in part? Please give me a single percentage value rounded to one decimal place."
    expected_sql: "SELECT ROUND(CAST(100.0 * SUM(CASE WHEN s.virtual IN ('F', 'P') THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0) AS DECIMAL), 1) AS pct FROM satscores AS sat JOIN schools AS s ON sat.cds = s.cdscode WHERE sat.rtype = 'S' AND sat.avgscrmath > 400"
    tags: ["challenging", "california_schools"]
  - name: "bird-35"
    prompt: "A parent is asking about a school and could only give me the CDS code 1612590137943. Can you look up that school and give me its name, county, district, and city; its K-12 enrollment; the number of K-12 students eligible for free or reduced price meals and the percentage eligible (report the percentage exactly as it appears, without rounding); and the SAT results - number of test takers, average reading score, average math score, average writing score, and the number of test takers whose total score is at least 1500?"
    expected_sql: "SELECT s.school AS school_name, s.county AS county, s.district AS district, s.city AS city, f.\"Enrollment (K-12)\" AS enrollment_k12, f.\"FRPM Count (K-12)\" AS frpm_count, f.\"Percent (%) Eligible FRPM (K-12)\" AS pct_eligible_frpm, sat.numtsttakr AS num_sat_takers, sat.avgscrread AS avg_reading, sat.avgscrmath AS avg_math, sat.avgscrwrite AS avg_writing, sat.numge1500 AS num_ge_1500 FROM schools AS s JOIN frpm AS f ON f.cdscode = s.cdscode LEFT JOIN satscores AS sat ON sat.cds = s.cdscode WHERE CASE WHEN (s.cdscode) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((s.cdscode) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END = 1612590137943"
    tags: ["challenging", "california_schools"]
  - name: "bird-36"
    prompt: "I'm putting together a profile of Alameda County high schools, focusing on economic disadvantage among schools that serve up through 12th grade. Among those schools, can you tell me which one has the highest free meal rate? For each school you identify, give me one line with: the school name, its free meal rate to 4 decimal places, whether it is a charter school (Yes/No/Unknown), the grades it serves, and its SAT performance level (Below Average, Average, Above Average, or No SAT Data). Please use the school's grade span of enrollment from the school directory (the GSserved field of the schools table) both to decide whether it serves up through 12th grade and for the grades-it-serves column-do not use the free-meal program record's Low Grade/High Grade for either. If several schools tie for the highest free meal rate, list every one of them."
    expected_sql: "WITH cohort AS (SELECT f.\"School Name\" AS school_name, f.\"Free Meal Count (K-12)\" * 1.0 / NULLIF(f.\"Enrollment (K-12)\", 0) AS free_rate, sc.charter, sc.gsserved, s.avgscrread, s.avgscrmath, s.avgscrwrite FROM frpm AS f LEFT JOIN schools AS sc ON sc.cdscode = f.cdscode LEFT JOIN satscores AS s ON s.cds = f.cdscode WHERE f.\"County Name\" = 'Alameda' AND RIGHT(CAST(sc.gsserved AS TEXT), 2) = '12') SELECT school_name, ROUND(CAST(free_rate AS DECIMAL), 4) AS highest_free_meal_rate, CASE WHEN charter = 1 THEN 'Yes' WHEN charter = 0 THEN 'No' ELSE 'Unknown' END AS is_charter, gsserved AS grades_served, CASE WHEN avgscrread IS NULL THEN 'No SAT Data' WHEN avgscrread + avgscrmath + avgscrwrite < 1200 THEN 'Below Average' WHEN avgscrread + avgscrmath + avgscrwrite <= 1500 THEN 'Average' ELSE 'Above Average' END AS sat_performance FROM cohort WHERE free_rate = (SELECT MAX(f2.\"Free Meal Count (K-12)\" * 1.0 / NULLIF(f2.\"Enrollment (K-12)\", 0)) FROM frpm AS f2 JOIN schools AS s2 ON s2.cdscode = f2.cdscode WHERE f2.\"County Name\" = 'Alameda' AND RIGHT(CAST(s2.gsserved AS TEXT), 2) = '12')"
    tags: ["challenging", "california_schools"]
  - name: "bird-37"
    prompt: "Could you pull a full profile for the school with CDS code 7618040113118? I need its name, phone number, website, average SAT reading, math and writing scores, whether it is a charter school, its K-12 enrollment for the 2014-2015 academic year, and the percentage of its students eligible for free or reduced price meals on a 0-100 scale rounded to two decimal places. Alongside that, please find the highest average SAT math score achieved by any active school with at least 10 SAT test takers – if several schools tie for the highest, just give me that single score – and how far below that highest score this school's math score falls."
    expected_sql: "WITH benchmark AS (SELECT MAX(t.avgscrmath) AS topmath FROM satscores AS t INNER JOIN schools AS s ON s.cdscode = t.cds WHERE s.statustype = 'Active' AND t.numtsttakr >= 10) SELECT s.school AS \"School Name\", s.phone AS \"Phone Number\", s.website AS website, t.avgscrread AS \"Average SAT Reading Score\", t.avgscrmath AS \"Average SAT Math Score\", t.avgscrwrite AS \"Average SAT Writing Score\", f.\"Charter School (Y/N)\" AS \"Charter School Status\", f.\"Enrollment (K-12)\" AS \"K-12 Enrollment (2014-2015)\", ROUND(CAST(f.\"Percent (%) Eligible FRPM (K-12)\" * 100 AS DECIMAL), 2) AS \"Percent Eligible Free/Reduced Price Meals\", b.topmath AS \"Highest Average Math Score\", b.topmath - t.avgscrmath AS \"Gap Below Highest Math Score\" FROM schools AS s INNER JOIN satscores AS t ON t.cds = s.cdscode LEFT JOIN frpm AS f ON f.cdscode = s.cdscode AND f.\"Academic Year\" = '2014-2015' CROSS JOIN benchmark AS b WHERE CASE WHEN (s.cdscode) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((s.cdscode) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END = 7618040113118"
    tags: ["challenging", "california_schools"]
  - name: "bird-38"
    prompt: "I'm mapping where exclusively virtual schools are concentrated. For the five counties with the most exclusively virtual schools - if several counties tie with the fifth-highest count, include all of them - please give me for each county: the county name, how many exclusively virtual schools it has, and the name of the exclusively virtual school in that county with the highest average SAT reading score. If several schools tie for the highest average reading score in a county, list each of them. If none of the county's exclusively virtual schools has a reported reading average, show 'None' as the school name."
    expected_sql: "WITH virtual_counts AS (SELECT county, COUNT(*) AS virtual_schools FROM schools WHERE virtual = 'F' GROUP BY county), top_counties AS (SELECT county, virtual_schools FROM virtual_counts WHERE virtual_schools >= (SELECT MIN(virtual_schools) FROM (SELECT virtual_schools FROM virtual_counts ORDER BY virtual_schools DESC NULLS LAST, county NULLS FIRST LIMIT 5) AS __photo_derived_1)), best AS (SELECT s.county, s.school, RANK() OVER (PARTITION BY s.county ORDER BY sat.avgscrread DESC NULLS LAST) AS r FROM schools AS s JOIN satscores AS sat ON s.cdscode = sat.cds WHERE s.virtual = 'F' AND NOT sat.avgscrread IS NULL) SELECT t.county, t.virtual_schools, COALESCE(b.school, 'None') AS school FROM top_counties AS t LEFT JOIN best AS b ON b.county = t.county AND b.r = 1 ORDER BY t.virtual_schools DESC NULLS LAST, t.county NULLS FIRST"
    tags: ["challenging", "california_schools"]
  - name: "bird-39"
    prompt: "I'm comparing online-only schooling options. I'd like to know, for Santa Barbara County and for the county that contains the school with CDS code 1100170109835 (which identifies one school), how many exclusive-virtual schools are in each county. Please give me each county's name with its number of exclusive-virtual schools, listing the county with the larger number first, or alphabetically by county name if they tie."
    expected_sql: "WITH target AS (SELECT county FROM schools WHERE CASE WHEN (cdscode) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((cdscode) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END = 1100170109835), cands AS (SELECT county FROM target UNION SELECT 'Santa Barbara') SELECT c.county AS county, (SELECT COUNT(*) FROM schools AS s WHERE s.county = c.county AND s.virtual = 'F') AS num FROM cands AS c ORDER BY num DESC NULLS LAST, c.county NULLS FIRST"
    tags: ["challenging", "california_schools"]
  - name: "bird-40"
    prompt: "I'm studying how concentrated economic need relates to SAT outcomes in California public schools. Among regular, non-charter schools with more than 100 K-12 students, I'd like two extremes plus one benchmark school: the school with the largest count of FRPM-eligible students, the school with the smallest FRPM share (the proportion of its K-12 enrollment that is FRPM-eligible – smallest by that share, not the raw count), and the school with CDS code 4615150435602 from my notes. If a school answers more than one part, report it once per part, and label each row with which part it answers ('largest FRPM-eligible count', 'smallest FRPM share', or 'the CDS code from my notes', in that order). Include ties. For each school, please give: school name, county, city, full mailing address as four columns (mailing street, mailing city, mailing state, mailing ZIP), website, K-12 enrollment, FRPM-eligible student count, FRPM share, average total SAT score (reading + math + writing) among its SAT takers, percentage of its SAT takers scoring 1500 or more, opening date, and status ('closed' if a closing date is recorded, otherwise 'open'). Nothing else, please."
    expected_sql: "WITH cohort AS (SELECT f.cdscode, f.\"School Name\" AS schoolname, f.\"FRPM Count (K-12)\" AS frpmcount, f.\"Enrollment (K-12)\" AS enrollment, f.\"FRPM Count (K-12)\" * 1.0 / NULLIF(f.\"Enrollment (K-12)\", 0) AS frpmshare, CASE WHEN (f.cdscode) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((f.cdscode) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END AS code_num FROM frpm AS f WHERE f.\"Charter School (Y/N)\" = 0 AND f.\"Enrollment (K-12)\" > 100) SELECT 'largest FRPM-eligible count' AS requestpart, c.schoolname AS schoolname, s.county AS county, s.city AS city, s.mailstreet AS mailingstreet, s.mailcity AS mailingcity, s.mailstate AS mailingstate, s.mailzip AS mailingzip, s.website AS website, c.enrollment AS enrollment, c.frpmcount AS frpmcount, c.frpmshare AS frpmshare, t.avgscrread + t.avgscrmath + t.avgscrwrite AS avgtotalsat, CAST(t.numge1500 * 100.0 AS DOUBLE PRECISION) / NULLIF(NULLIF(t.numtsttakr, 0), 0) AS pct1500plus, s.opendate AS opendate, CASE WHEN NOT s.closeddate IS NULL THEN 'closed' ELSE 'open' END AS schoolstatus FROM cohort AS c JOIN schools AS s ON c.code_num = CASE WHEN (s.cdscode) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((s.cdscode) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END LEFT JOIN satscores AS t ON c.code_num = CASE WHEN (t.cds) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((t.cds) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END WHERE c.frpmcount = (SELECT MAX(x.frpmcount) FROM cohort AS x) UNION ALL SELECT 'smallest FRPM share', c.schoolname, s.county, s.city, s.mailstreet, s.mailcity, s.mailstate, s.mailzip, s.website, c.enrollment, c.frpmcount, c.frpmshare, t.avgscrread + t.avgscrmath + t.avgscrwrite, CAST(t.numge1500 * 100.0 AS DOUBLE PRECISION) / NULLIF(NULLIF(t.numtsttakr, 0), 0), s.opendate, CASE WHEN NOT s.closeddate IS NULL THEN 'closed' ELSE 'open' END FROM cohort AS c JOIN schools AS s ON c.code_num = CASE WHEN (s.cdscode) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((s.cdscode) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END LEFT JOIN satscores AS t ON c.code_num = CASE WHEN (t.cds) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((t.cds) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END WHERE c.frpmshare = (SELECT MIN(x.frpmshare) FROM cohort AS x) UNION ALL SELECT 'the CDS code from my notes', c.schoolname, s.county, s.city, s.mailstreet, s.mailcity, s.mailstate, s.mailzip, s.website, c.enrollment, c.frpmcount, c.frpmshare, t.avgscrread + t.avgscrmath + t.avgscrwrite, CAST(t.numge1500 * 100.0 AS DOUBLE PRECISION) / NULLIF(NULLIF(t.numtsttakr, 0), 0), s.opendate, CASE WHEN NOT s.closeddate IS NULL THEN 'closed' ELSE 'open' END FROM cohort AS c JOIN schools AS s ON c.code_num = CASE WHEN (s.cdscode) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((s.cdscode) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END LEFT JOIN satscores AS t ON c.code_num = CASE WHEN (t.cds) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((t.cds) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END WHERE c.code_num = 4615150435602"
    tags: ["challenging", "california_schools"]
  - name: "bird-41"
    prompt: "I'm auditing FRPM enrollment reporting and need to contact some elementary and middle schools. Please list the name and street address of every named school whose K-12 enrollment exceeds its enrollment of students aged 5-17 by more than 30 students, and whose highest grade of enrollment is grade 8 or below. Kindergarten counts as grade 8 or below. Give me one row per school; any order is fine."
    expected_sql: "SELECT s.school, s.street FROM schools AS s JOIN frpm AS f ON f.cdscode = s.cdscode WHERE NOT s.school IS NULL AND f.\"Enrollment (K-12)\" - f.\"Enrollment (Ages 5-17)\" > 30 AND (f.\"High Grade\" = 'K' OR (f.\"High Grade\" = CAST(CASE WHEN (f.\"High Grade\") IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((f.\"High Grade\") AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END AS TEXT) AND CASE WHEN (f.\"High Grade\") IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((f.\"High Grade\") AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END <= 8)) ORDER BY s.cdscode NULLS FIRST"
    tags: ["challenging", "california_schools"]
  - name: "bird-42"
    prompt: "I'm auditing high-school-level campuses that draw enrollments beyond their surrounding school-age population. Can you give me a list of schools where the K-12 enrollment exceeds the ages-5-17 enrollment by more than 30, limited to schools whose lowest served grade is grade 9 or a later grade (a school's lowest served grade being the low end of the grade range reported in the same enrollment record as its K-12 and ages-5-17 counts)? For each school, I just need the school name and street address. Please order the results by the school's CDS code, smallest first."
    expected_sql: "SELECT s.school, s.street FROM schools AS s JOIN frpm AS f ON f.cdscode = s.cdscode WHERE NOT s.school IS NULL AND f.\"Enrollment (K-12)\" - f.\"Enrollment (Ages 5-17)\" > 30 AND CASE WHEN (f.\"Low Grade\") IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((f.\"Low Grade\") AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END BETWEEN 9 AND 12 ORDER BY s.cdscode NULLS FIRST"
    tags: ["challenging", "california_schools"]
  - name: "bird-43"
    prompt: "I'm researching where high SAT performance coexists with concentrated poverty, to help target college-access support by county. For the 2014-15 academic year, for each county, how many schools had both a K-12 free-meal eligibility rate above 0.1 and at least one SAT taker scoring 1500 or higher on the school's own SAT record? Please list only counties that have at least one such school, with the county name and the number of its qualifying schools, sorted from most such schools to fewest, and alphabetically by county name when counties tie."
    expected_sql: "SELECT s.cname AS county, COUNT(*) AS qualifying_schools FROM satscores AS s JOIN frpm AS f ON f.cdscode = s.cds WHERE s.rtype = 'S' AND s.numge1500 > 0 AND f.\"Enrollment (K-12)\" > 0 AND 1.0 * f.\"Free Meal Count (K-12)\" / NULLIF(f.\"Enrollment (K-12)\", 0) > 0.1 GROUP BY s.cname ORDER BY qualifying_schools DESC NULLS LAST, county ASC NULLS FIRST"
    tags: ["challenging", "california_schools"]
  - name: "bird-44"
    prompt: "I have a school on file with CDS code 1611430131177. Find the school in the same county as that school whose own SAT record shows the most students scoring at least 1500 (not a district-wide roll-up). If two schools tie on that count, use the one with the smaller CDS code. Send me that school's administrator's first and last name."
    expected_sql: "SELECT s.admfname1, s.admlname1 FROM satscores AS x JOIN schools AS s ON s.cdscode = x.cds JOIN frpm AS f ON f.cdscode = x.cds WHERE x.rtype = 'S' AND s.county = (SELECT county FROM schools WHERE CASE WHEN (cdscode) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((cdscode) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END = 1611430131177) ORDER BY x.numge1500 DESC NULLS LAST, CASE WHEN (f.\"School Code\") IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((f.\"School Code\") AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END NULLS FIRST LIMIT 1"
    tags: ["challenging", "california_schools"]
  - name: "bird-45"
    prompt: "I'm working on a story about the largest schools in the state with the worst SAT excellence rates. Among schools where at least 700 students took the SAT, can you find the school with the lowest SAT excellence rate? If several schools tie for the lowest rate, go with the one with the smallest school code. I just need that school's street, city, ZIP code and state so I can visit and request an interview."
    expected_sql: "SELECT s.street, s.city, s.zip, s.state FROM satscores AS sat JOIN schools AS s ON s.cdscode = sat.cds LEFT JOIN frpm AS f ON f.cdscode = sat.cds WHERE sat.rtype = 'S' AND NOT sat.numge1500 IS NULL AND sat.numtsttakr >= 700 ORDER BY 1.0 * sat.numge1500 / NULLIF(sat.numtsttakr, 0) ASC NULLS FIRST, CASE WHEN (f.\"School Code\") IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((f.\"School Code\") AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END ASC NULLS FIRST LIMIT 1"
    tags: ["challenging", "california_schools"]
  - name: "bird-46"
    prompt: "I'm planning reviews of Provision 2 meal programs under the NSLP and want to see which cities concentrate magnet schools under that provision. For each city that has at least one, can you give me the number of the city's magnet schools that run a Provision 2 meal program? Use the city where the school is located, not its mailing city. Also, if a school's NSLP entry lists multiple provision types, don't count it as running Provision 2."
    expected_sql: "SELECT s.city AS city, COUNT(*) AS magnet_schools FROM frpm AS f JOIN schools AS s ON f.cdscode = s.cdscode WHERE s.magnet = 1 AND CAST(f.\"NSLP Provision Status\" AS TEXT) LIKE '%Provision 2%' GROUP BY s.city ORDER BY magnet_schools DESC NULLS LAST, city NULLS FIRST"
    tags: ["challenging", "california_schools"]
  - name: "bird-47"
    prompt: "I'm preparing a mailing campaign and need a list of public high schools in Los Angeles County that have more than 500 free or reduced-price meal recipients ages 5-17. By public high schools I mean every public high-school category in the meal program report - regular high schools, continuation high schools, and high schools in single-school districts - not just regular ones; middle and junior high schools don't count. For each school, please give me the school name exactly as listed in the school directory, plus the campus (physical) street address - not a mailing or post-office address - along with the city, state and ZIP code, each as a separate field. Schools sharing a name are separate schools, so one row per school. Please sort the list by school name."
    expected_sql: "SELECT s.school AS school_name, s.street, s.city, s.state, s.zip FROM frpm AS f JOIN schools AS s ON f.cdscode = s.cdscode WHERE f.\"County Name\" = 'Los Angeles' AND CAST(f.\"School Type\" AS TEXT) LIKE '%High School%' AND CAST(f.\"School Type\" AS TEXT) NOT LIKE '%Junior%' AND f.\"FRPM Count (Ages 5-17)\" > 500 ORDER BY s.school COLLATE \"C\" NULLS FIRST, s.cdscode NULLS FIRST"
    tags: ["challenging", "california_schools"]
  - name: "bird-48"
    prompt: "I'd like to compare SAT participation across counties in California that run magnet schools under Provision 2 of the National School Lunch Program. For every county with at least one Provision 2 magnet school, can you give me the county name and the total number of SAT test takers from those schools? Please include every such county even if the total is 0, and list them in any order."
    expected_sql: "SELECT s.county AS county, SUM(COALESCE(sc.numtsttakr, 0)) AS total_sat_test_takers FROM schools AS s INNER JOIN frpm AS f ON s.cdscode = f.cdscode LEFT JOIN satscores AS sc ON sc.cds = s.cdscode WHERE s.magnet = 1 AND f.\"NSLP Provision Status\" = 'Provision 2' GROUP BY s.county ORDER BY total_sat_test_takers DESC NULLS LAST, s.county NULLS FIRST"
    tags: ["challenging", "california_schools"]
