name: driver_directory
description: |
  Drivers on their own: names, reference names (driverRef), three-letter
  codes (or none), car numbers, nationality, date of birth.
  Each topic joins ONE fact table to its lookups (races -> circuits /
  seasons, drivers, constructors, status) to avoid fan-out; the race, driver
  and constructor entities mean the same thing in every topic. Questions that
  combine two fact tables (e.g. results with qualifying, lap times with pit
  stops, standings with results) are not answerable in one model query:
  query each topic separately or fall back to SQL on the bird_formula_1
  tables (results, qualifying, laptimes, pitstops, driverstandings,
  constructorstandings, constructorresults, races, circuits, seasons,
  drivers, constructors, status), joining on raceid / driverid /
  constructorid.
base_view: drivers
views:
  - drivers
