# Generated by `bird.py gen-cases`; do not edit by hand.
name: "bird-debit_card_specializing"
target: debit_card_specializing.agentic.yml
settings:
  runs: 1
  grader: execution
  database: bird_debit_card_specializing
cases:
  - name: "bird-149"
    prompt: "For each of the SME, LAM, and KAM segments, identify the CZK customer with the lowest total recorded consumption in 2013, breaking a tie by smaller customer ID. What are the differences between those customers' 2013 totals in SME minus LAM, LAM minus KAM, and KAM minus SME order? Round each to two decimals."
    expected_sql: "WITH annual AS (SELECT c.segment, c.customerid, SUM(CAST(y.consumption AS DOUBLE PRECISION)) AS total FROM customers AS c JOIN yearmonth AS y ON y.customerid = c.customerid WHERE c.currency = 'CZK' AND y.date BETWEEN '201301' AND '201312' AND NOT y.consumption IS NULL AND c.segment IN ('SME', 'LAM', 'KAM') GROUP BY c.segment, c.customerid), ranked AS (SELECT segment, total, ROW_NUMBER() OVER (PARTITION BY segment ORDER BY total NULLS FIRST, customerid NULLS FIRST) AS rn FROM annual), chosen AS (SELECT MAX(CASE WHEN segment = 'SME' THEN total END) AS sme, MAX(CASE WHEN segment = 'LAM' THEN total END) AS lam, MAX(CASE WHEN segment = 'KAM' THEN total END) AS kam FROM ranked WHERE rn = 1) SELECT ROUND(CAST(sme - lam AS DECIMAL), 2), ROUND(CAST(lam - kam AS DECIMAL), 2), ROUND(CAST(kam - sme AS DECIMAL), 2) FROM chosen"
    tags: ["challenging", "debit_card_specializing"]
  - name: "bird-150"
    prompt: "Among EUR-paying customers in the SME, LAM, and KAM segments, which segments had the highest and lowest percentage increase in total consumption from 2012 to 2013? Return each extreme segment and its increase percentage, rounded to two decimal places; include ties."
    expected_sql: "WITH annual AS (SELECT c.segment, SUM(CASE WHEN SUBSTRING(CAST(y.date AS TEXT) FROM 1 FOR 4) = '2012' THEN y.consumption ELSE 0 END) AS total_2012, SUM(CASE WHEN SUBSTRING(CAST(y.date AS TEXT) FROM 1 FOR 4) = '2013' THEN y.consumption ELSE 0 END) AS total_2013 FROM customers AS c JOIN yearmonth AS y ON c.customerid = y.customerid WHERE c.currency = 'EUR' AND c.segment IN ('SME', 'LAM', 'KAM') AND SUBSTRING(CAST(y.date AS TEXT) FROM 1 FOR 4) IN ('2012', '2013') GROUP BY c.segment), rates AS (SELECT segment, ROUND(CAST(100.0 * (total_2013 - total_2012) / NULLIF(NULLIF(total_2012, 0), 0) AS DECIMAL), 2) AS increase_pct FROM annual WHERE total_2012 > 0), ranked AS (SELECT segment, increase_pct, RANK() OVER (ORDER BY increase_pct DESC NULLS LAST) AS highest_rank, RANK() OVER (ORDER BY increase_pct ASC NULLS FIRST) AS lowest_rank FROM rates) SELECT segment, increase_pct FROM ranked WHERE highest_rank = 1 OR lowest_rank = 1 ORDER BY increase_pct DESC NULLS LAST, segment NULLS FIRST"
    tags: ["challenging", "debit_card_specializing"]
  - name: "bird-151"
    prompt: "For the customer who paid 634.8 on 2012-08-25, what is the relative change in annual consumption from 2012 to 2013, calculated as (2013 total - 2012 total) / 2012 total and rounded to four decimal places?"
    expected_sql: "SELECT ROUND(CAST(CAST(1.0 * (SUM(CASE WHEN SUBSTRING(CAST(ym.date AS TEXT) FROM 1 FOR 4) = '2013' THEN ym.consumption ELSE 0 END) - SUM(CASE WHEN SUBSTRING(CAST(ym.date AS TEXT) FROM 1 FOR 4) = '2012' THEN ym.consumption ELSE 0 END)) / NULLIF(NULLIF(SUM(CASE WHEN SUBSTRING(CAST(ym.date AS TEXT) FROM 1 FOR 4) = '2012' THEN ym.consumption ELSE 0 END), 0), 0) AS DECIMAL(20, 8)) AS DECIMAL), 4) FROM yearmonth AS ym WHERE ym.customerid = (SELECT t.customerid FROM transactions_1k AS t WHERE t.date = '2012-08-25' AND CAST(t.price AS DECIMAL(12, 2)) = 634.80)"
    tags: ["challenging", "debit_card_specializing"]
  - name: "bird-152"
    prompt: "How many customers who pay in EUR and had gas consumption in 2012 also had gas consumption in 2013? I just need a single number: the count of such customers. By 2012 and 2013 I mean those calendar years, and gas consumption in any month of the year counts."
    expected_sql: "SELECT COUNT(*) AS customers FROM (SELECT customerid FROM yearmonth WHERE SUBSTRING(CAST(date AS TEXT) FROM 1 FOR 4) = '2012' AND customerid IN (SELECT customerid FROM customers WHERE currency = 'EUR') INTERSECT SELECT customerid FROM yearmonth WHERE SUBSTRING(CAST(date AS TEXT) FROM 1 FOR 4) = '2013') AS __photo_derived_1"
    tags: ["challenging", "debit_card_specializing"]
  - name: "bird-153"
    prompt: "I'm reviewing our 2012 performance and want to see which client segments hold our small-scale customers. For each client segment, can you tell me how many customers had total consumption below 30,000 over the whole of 2012? Please count only customers who used their cards at some point during 2012, and treat 30,000 as a strict limit - someone at exactly 30,000 doesn't count. I just need the client segment and the number of such customers per segment."
    expected_sql: "WITH yearly AS (SELECT customerid, SUM(consumption) AS total_consumption FROM yearmonth WHERE date >= '201201' AND date <= '201212' GROUP BY customerid HAVING SUM(consumption) < 30000) SELECT c.segment AS segment, COUNT(*) AS customers FROM yearly AS y INNER JOIN customers AS c ON c.customerid = y.customerid GROUP BY c.segment ORDER BY c.segment NULLS FIRST"
    tags: ["challenging", "debit_card_specializing"]
  - name: "bird-154"
    prompt: "I'm reviewing 2013 uptake and want to know the genuinely active cardholder base in each client segment. For each client segment, how many of that segment's customers consumed any fuel at all during the calendar year 2013? I just need the client segment and the number of customers who consumed fuel in 2013, nothing else."
    expected_sql: "SELECT c.segment AS segment, COUNT(DISTINCT y.customerid) AS customers_with_fuel_2013 FROM customers AS c INNER JOIN yearmonth AS y ON c.customerid = y.customerid WHERE y.date BETWEEN '201301' AND '201312' AND y.consumption > 0 GROUP BY c.segment ORDER BY c.segment NULLS FIRST"
    tags: ["challenging", "debit_card_specializing"]
  - name: "bird-155"
    prompt: "I want to gauge how spread out our high-value fuelling activity in the Czech Republic was over the recorded window. How many whole minutes elapsed from the first to the last fuel transaction at gas stations in the Czech Republic with a price over 1000? Please round down to whole minutes."
    expected_sql: "SELECT (EXTRACT(EPOCH FROM CAST(MAX(date || ' ' || time) AS TIMESTAMP)) - EXTRACT(EPOCH FROM CAST(MIN(date || ' ' || time) AS TIMESTAMP))) / NULLIF((5 * 13 - 5), 0) AS minutes FROM transactions_1k AS t1 INNER JOIN gasstations AS t2 ON t1.gasstationid = t2.gasstationid WHERE t2.country = 'CZE' AND t1.price > 1000"
    tags: ["challenging", "debit_card_specializing"]
  - name: "bird-156"
    prompt: "I'm preparing a loyalty review of our steadily active customers in 2013. For each currency, I'd like to know how many customers bought fuel in every month from January through November 2013, with both January and November included. Please give me the currency and that customer count. If several currencies tie, list them all – no ranking needed."
    expected_sql: "WITH RECURSIVE months(m) AS (SELECT '201301' UNION ALL SELECT CAST(CASE WHEN (m) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((m) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END + 1 AS TEXT) FROM months WHERE m < '201311'), steady AS (SELECT customerid FROM yearmonth WHERE date BETWEEN '201301' AND '201311' AND consumption > 0 GROUP BY customerid HAVING COUNT(DISTINCT date) = (SELECT COUNT(*) FROM months)) SELECT c.currency, COUNT(*) AS customers FROM steady AS s JOIN customers AS c ON c.customerid = s.customerid GROUP BY c.currency"
    tags: ["challenging", "debit_card_specializing"]
  - name: "bird-157"
    prompt: "I'm putting together currency-specific pricing proposals and need a sense of typical quarterly fuel consumption. Among customers who have fuel consumption recorded in the second quarter of 2013 (April, May and June 2013), what is the average amount of fuel consumed over the whole quarter by an EUR-paying customer, and the same average for a CZK-paying customer? Please round both averages to two decimal places. By EUR-paying / CZK-paying I mean a customer whose account currency is EUR / CZK."
    expected_sql: "WITH q2 AS (SELECT customerid, SUM(consumption) AS total FROM yearmonth WHERE date BETWEEN '201304' AND '201306' GROUP BY customerid) SELECT ROUND(CAST(AVG(CASE WHEN c.currency = 'EUR' THEN q2.total END) AS DECIMAL), 2) AS eur_avg_quarter, ROUND(CAST(AVG(CASE WHEN c.currency = 'CZK' THEN q2.total END) AS DECIMAL), 2) AS czk_avg_quarter FROM customers AS c JOIN q2 ON q2.customerid = c.customerid"
    tags: ["challenging", "debit_card_specializing"]
  - name: "bird-158"
    prompt: "I want to see how much our busiest month grew from 2012 to 2013. What was the difference between our peak monthly total consumption in 2013 and our peak monthly total consumption in 2012, in consumption units, rounded to the nearest whole number? By total consumption in a calendar month I mean the consumption of the whole customer base that month, and the peak of a year is the calendar month with the highest total consumption in that year."
    expected_sql: "SELECT ROUND(CAST((SELECT SUM(CAST(consumption AS DOUBLE PRECISION)) FROM yearmonth WHERE SUBSTRING(CAST(date AS TEXT) FROM 1 FOR 4) = '2013' GROUP BY SUBSTRING(CAST(date AS TEXT) FROM 5 FOR 2) ORDER BY SUM(CAST(consumption AS DOUBLE PRECISION)) DESC NULLS LAST LIMIT 1) - (SELECT SUM(CAST(consumption AS DOUBLE PRECISION)) FROM yearmonth WHERE SUBSTRING(CAST(date AS TEXT) FROM 1 FOR 4) = '2012' GROUP BY SUBSTRING(CAST(date AS TEXT) FROM 5 FOR 2) ORDER BY SUM(CAST(consumption AS DOUBLE PRECISION)) DESC NULLS LAST LIMIT 1) AS DECIMAL), 0) AS difference"
    tags: ["challenging", "debit_card_specializing"]
  - name: "bird-159"
    prompt: "I'm reviewing customer 15621's fuel spending on the fleet card in 2013. What was their average fuel consumption per month, counting only the months in which they actually purchased fuel? Give me the single average value rounded to two decimal places."
    expected_sql: "SELECT ROUND(CAST(SUM(consumption) / NULLIF(COUNT(*), 0) AS DECIMAL), 2) AS average_monthly_consumption FROM yearmonth WHERE customerid = 15621 AND date BETWEEN '201301' AND '201312' AND consumption > 0"
    tags: ["challenging", "debit_card_specializing"]
  - name: "bird-160"
    prompt: "I want to compare how much a typical Czech-koruna-billed client spent versus a euro-billed client during 2012, to see whether the two currency segments behave differently. Please give me the difference between the average 2012 consumption of a CZK-paying customer and the average 2012 consumption of an EUR-paying customer, with the EUR average subtracted from the CZK average. Only include customers who had consumption in 2012 in each average, and the period is calendar year 2012. Just send me that one number, rounded to the nearest whole unit."
    expected_sql: "WITH per_customer AS (SELECT customerid, SUM(consumption) AS tot_2012 FROM yearmonth WHERE SUBSTRING(CAST(date AS TEXT) FROM 1 FOR 4) = '2012' GROUP BY customerid) SELECT ROUND(CAST(AVG(CASE WHEN c.currency = 'CZK' THEN p.tot_2012 END) - AVG(CASE WHEN c.currency = 'EUR' THEN p.tot_2012 END) AS DECIMAL), 0) AS diff FROM customers AS c JOIN per_customer AS p ON c.customerid = p.customerid"
    tags: ["challenging", "debit_card_specializing"]
  - name: "bird-161"
    prompt: "I'm sizing a premium offer for our heaviest corporate fuel buyers ahead of renewals. How many KAM-segment customers paying in CZK had total fuel consumption above 1 million (1,000,000) in calendar year 2013? I just need that number of customers."
    expected_sql: "SELECT COUNT(*) AS customer_count FROM (SELECT t2.customerid FROM customers AS t1 INNER JOIN yearmonth AS t2 ON t1.customerid = t2.customerid WHERE t1.currency = 'CZK' AND t1.segment = 'KAM' AND CAST(t2.date AS TEXT) LIKE '2013%' GROUP BY t2.customerid HAVING SUM(t2.consumption) > 1000000) AS __photo_derived_1"
    tags: ["challenging", "debit_card_specializing"]
  - name: "bird-162"
    prompt: "For my February 2013 activity report: how many SME customers actually purchased gas in February 2013? Please give me just a single whole number - the count of SME customers who consumed gas during the calendar month of February 2013 (Feb 1-28, 2013)."
    expected_sql: "SELECT COUNT(DISTINCT t2.customerid) AS sme_gas_customers FROM customers AS t1 INNER JOIN yearmonth AS t2 ON t1.customerid = t2.customerid WHERE t1.segment = 'SME' AND t2.date = '201302' AND t2.consumption > 0"
    tags: ["challenging", "debit_card_specializing"]
