# Generated by `bird.py gen-cases`; do not edit by hand.
name: "bird-semantic-financial"
target: financial.semantic.agentic.yml
settings:
  runs: 1
  grader: execution
  database: bird_financial
cases:
  - name: "bird-194"
    prompt: "Among female clients living in the district with the lowest average salary, give the account IDs of the oldest client and the difference between the highest and lowest district-average salaries."
    expected_sql: "WITH oldest AS (SELECT c.client_id FROM client AS c JOIN district AS d ON d.district_id = c.district_id WHERE c.gender = 'F' AND d.a11 = (SELECT MIN(a11) FROM district) ORDER BY c.birth_date NULLS FIRST, c.client_id NULLS FIRST LIMIT 1) SELECT DISTINCT a.account_id, (SELECT MAX(a11) - MIN(a11) FROM district) FROM oldest AS o JOIN disp AS x ON x.client_id = o.client_id JOIN account AS a ON a.account_id = x.account_id ORDER BY a.account_id NULLS FIRST"
    tags: ["challenging", "financial"]
  - name: "bird-195"
    prompt: "In which district did the female client born on 1976-01-29 open her account?"
    expected_sql: "SELECT DISTINCT d.a2 FROM client AS c JOIN disp AS x ON x.client_id = c.client_id JOIN account AS a ON a.account_id = x.account_id JOIN district AS d ON d.district_id = a.district_id WHERE c.gender = 'F' AND c.birth_date = '1976-01-29' ORDER BY d.a2 NULLS FIRST"
    tags: ["simple", "financial"]
  - name: "bird-196"
    prompt: "Among south Bohemia districts, in the one with the largest population, what percentage of resident clients are male? Round to two decimals."
    expected_sql: "WITH chosen AS (SELECT district_id FROM district WHERE a3 = 'south Bohemia' ORDER BY CASE WHEN (a4) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((a4) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END DESC NULLS LAST, district_id NULLS FIRST LIMIT 1) SELECT ROUND(CAST(100.0 * SUM(CASE WHEN c.gender = 'M' THEN 1 ELSE 0 END) / NULLIF(NULLIF(COUNT(*), 0), 0) AS DECIMAL), 2) FROM client AS c JOIN chosen AS d ON d.district_id = c.district_id"
    tags: ["challenging", "financial"]
  - name: "bird-197"
    prompt: "For the account associated with the loan dated 1993-07-05, what was the percentage increase in its recorded balance from 1993-03-22 to 1998-12-27?"
    expected_sql: "SELECT CASE WHEN ((SUM(CASE WHEN t3.date = '1998-12-27' THEN t3.balance ELSE 0 END) - SUM(CASE WHEN t3.date = '1993-03-22' THEN t3.balance ELSE 0 END))) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST(((SUM(CASE WHEN t3.date = '1998-12-27' THEN t3.balance ELSE 0 END) - SUM(CASE WHEN t3.date = '1993-03-22' THEN t3.balance ELSE 0 END))) AS TEXT) FROM '^[[:space:]]*[+-]?([0-9]+([.][0-9]*)?|[.][0-9]+)([eE][+-]?[0-9]+)?'), '0') AS DOUBLE PRECISION) END * 100 / NULLIF(SUM(CASE WHEN t3.date = '1993-03-22' THEN t3.balance ELSE 0 END), 0) FROM loan AS t1 INNER JOIN account AS t2 ON t1.account_id = t2.account_id INNER JOIN trans AS t3 ON t3.account_id = t2.account_id WHERE t1.date = '1993-07-05'"
    tags: ["challenging", "financial"]
  - name: "bird-198"
    prompt: "For accounts opened from 1995 through 2000 in East Bohemia districts, list each account ID and its statement-issuance frequency."
    expected_sql: "SELECT t1.account_id, t1.frequency FROM account AS t1 INNER JOIN district AS t2 ON t1.district_id = t2.district_id WHERE t2.a3 = 'east Bohemia' AND EXTRACT(YEAR FROM CAST(t1.date AS TIMESTAMP)) BETWEEN '1995' AND '2000'"
    tags: ["moderate", "financial"]
  - name: "bird-199"
    prompt: "For branch districts of accounts with loans still running in debt and recorded unemployment rates in both 1995 and 1996, list each district and the percentage change in its unemployment rate from 1995 to 1996, rounded to two decimal places."
    expected_sql: "SELECT DISTINCT d.a2, ROUND(CAST(100.0 * (CAST(d.a13 AS DECIMAL(10, 2)) - CAST(d.a12 AS DECIMAL(10, 2))) / NULLIF(NULLIF(CAST(d.a12 AS DECIMAL(10, 2)), 0), 0) AS DECIMAL), 2) FROM loan AS l JOIN account AS a ON l.account_id = a.account_id JOIN district AS d ON a.district_id = d.district_id WHERE l.status = 'D' AND d.a12 <> 0 AND NOT d.a13 IS NULL ORDER BY d.a2 NULLS FIRST"
    tags: ["challenging", "financial"]
  - name: "bird-200"
    prompt: "For each account-disposition type other than OWNER found in districts with average salary above 8000 and at most 9000, give the type and the number of distinct associated accounts."
    expected_sql: "SELECT d.type, COUNT(DISTINCT a.account_id) FROM district AS x JOIN account AS a ON a.district_id = x.district_id JOIN disp AS d ON d.account_id = a.account_id WHERE d.type <> 'OWNER' AND x.a11 > 8000 AND x.a11 <= 9000 GROUP BY d.type ORDER BY d.type NULLS FIRST"
    tags: ["challenging", "financial"]
  - name: "bird-201"
    prompt: "For loans dated in 1996 and 1997 across accounts owned by male clients, what was the percentage growth in total loan amount from 1996 to 1997?"
    expected_sql: "SELECT CASE WHEN ((SUM(CASE WHEN EXTRACT(YEAR FROM CAST(t1.date AS TIMESTAMP)) = '1997' THEN t1.amount ELSE 0 END) - SUM(CASE WHEN EXTRACT(YEAR FROM CAST(t1.date AS TIMESTAMP)) = '1996' THEN t1.amount ELSE 0 END))) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST(((SUM(CASE WHEN EXTRACT(YEAR FROM CAST(t1.date AS TIMESTAMP)) = '1997' THEN t1.amount ELSE 0 END) - SUM(CASE WHEN EXTRACT(YEAR FROM CAST(t1.date AS TIMESTAMP)) = '1996' THEN t1.amount ELSE 0 END))) AS TEXT) FROM '^[[:space:]]*[+-]?([0-9]+([.][0-9]*)?|[.][0-9]+)([eE][+-]?[0-9]+)?'), '0') AS DOUBLE PRECISION) END * 100 / NULLIF(SUM(CASE WHEN EXTRACT(YEAR FROM CAST(t1.date AS TIMESTAMP)) = '1996' THEN t1.amount ELSE 0 END), 0) FROM loan AS t1 INNER JOIN account AS t2 ON t1.account_id = t2.account_id INNER JOIN disp AS t3 ON t3.account_id = t2.account_id INNER JOIN client AS t4 ON t4.client_id = t3.client_id WHERE t4.gender = 'M' AND t3.type = 'OWNER'"
    tags: ["challenging", "financial"]
  - name: "bird-202"
    prompt: "How often does account 3 receive statements, and what is the recorded payment-purpose code for its scheduled payments totaling 3,539?"
    expected_sql: "SELECT t1.frequency, t2.k_symbol FROM account AS t1 INNER JOIN (SELECT account_id, k_symbol, SUM(amount) AS total_amount FROM \"order\" GROUP BY account_id, k_symbol) AS t2 ON t1.account_id = t2.account_id WHERE t1.account_id = 3 AND t2.total_amount = 3539"
    tags: ["challenging", "financial"]
  - name: "bird-203"
    prompt: "We're reviewing our first month of operations. Looking at the districts where we opened at least one account during that first month, which district had the largest population, and how many inhabitants does it have? If several districts tie for the largest population, list all of them with their populations."
    expected_sql: "WITH first_month AS (SELECT TO_CHAR(CAST(MIN(date) AS TIMESTAMP), 'YYYY-MM') AS ym FROM account), first_month_districts AS (SELECT DISTINCT district_id FROM account WHERE TO_CHAR(CAST(date AS TIMESTAMP), 'YYYY-MM') = (SELECT ym FROM first_month)), cohort AS (SELECT d.a2 AS district_name, CASE WHEN (d.a4) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((d.a4) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END AS inhabitants FROM district AS d JOIN first_month_districts AS f ON d.district_id = f.district_id) SELECT district_name, inhabitants FROM cohort WHERE inhabitants = (SELECT MAX(inhabitants) FROM cohort)"
    tags: ["challenging", "financial"]
  - name: "bird-204"
    prompt: "As part of a data-quality review for a segment report, I need to know how much of the recorded transaction activity for one of our segments has no payment purpose noted. How many transactions are there, over the whole recorded history, on the accounts held by male customers born between 1974 and 1976 (birth years 1974, 1975 and 1976), for which no payment purpose is noted? Please give me just that single number."
    expected_sql: "SELECT COUNT(*) AS txn_count FROM trans AS t WHERE (t.k_symbol IS NULL OR TRIM(CAST(t.k_symbol AS TEXT)) = '') AND t.account_id IN (SELECT d.account_id FROM disp AS d INNER JOIN client AS c ON d.client_id = c.client_id WHERE c.gender = 'M' AND EXTRACT(YEAR FROM CAST(c.birth_date AS TIMESTAMP)) BETWEEN '1974' AND '1976')"
    tags: ["challenging", "financial"]
  - name: "bird-205"
    prompt: "Among the bank's five most populous districts (the five with the largest numbers of inhabitants), which carries the heaviest active-lending burden relative to the account base it serves? For each of those five districts, please give me the district name and the average active loan per account, rounded to the nearest whole koruna. An active loan is a running loan contract with status 'C' (repaid OK so far) or status 'D' (client in debt). The average should be taken over every account held in the district, not just accounts with loans, and accounts and their loans count toward the district of the branch that holds the account, not the client's district. If several districts tie for the highest average, list them all."
    expected_sql: "WITH populous AS (SELECT district_id FROM district ORDER BY CASE WHEN (a4) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((a4) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END DESC NULLS LAST LIMIT 5), per_district AS (SELECT d.a2 AS district_name, SUM(CASE WHEN l.status IN ('C', 'D') THEN l.amount ELSE 0 END) * 1.0 / NULLIF(COUNT(a.account_id), 0) AS raw_avg FROM district AS d JOIN account AS a ON a.district_id = d.district_id LEFT JOIN loan AS l ON l.account_id = a.account_id WHERE d.district_id IN (SELECT district_id FROM populous) GROUP BY d.district_id, d.a2) SELECT district_name, ROUND(CAST(raw_avg AS DECIMAL), 0) AS avg_active_loan_per_account FROM per_district ORDER BY raw_avg DESC NULLS LAST, district_name NULLS FIRST"
    tags: ["challenging", "financial"]
  - name: "bird-206"
    prompt: "For our 1995 year-end loan review: which of the bank's regions has the largest total approved amount among loans that were still being repaid on 31 December 1995, and what is that total? Only count loans approved on or before that day whose repayment term still covers that day; loans approved after it don't count yet. A loan's term includes both its approval day and its last day. If several regions tie for the largest total, list every tied region with the total. Just give me the region name and the single total figure."
    expected_sql: "WITH ends AS (SELECT d.a3 AS region, l.amount, DATE(CAST(CASE WHEN (SUBSTRING(CAST(l.date AS TEXT) FROM 1 FOR 4)) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((SUBSTRING(CAST(l.date AS TEXT) FROM 1 FOR 4)) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END + (CASE WHEN (SUBSTRING(CAST(l.date AS TEXT) FROM 6 FOR 2)) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((SUBSTRING(CAST(l.date AS TEXT) FROM 6 FOR 2)) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END - 1 + l.duration) / NULLIF(12, 0) AS TEXT) || '-' || RIGHT(CAST('0' || ((CASE WHEN (SUBSTRING(CAST(l.date AS TEXT) FROM 6 FOR 2)) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((SUBSTRING(CAST(l.date AS TEXT) FROM 6 FOR 2)) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END - 1 + l.duration) % 12 + 1) AS TEXT), 2) || '-' || SUBSTRING(CAST(l.date AS TEXT) FROM 9 FOR 2)) AS end_date FROM loan AS l JOIN account AS a ON l.account_id = a.account_id JOIN district AS d ON a.district_id = d.district_id WHERE l.date <= '1995-12-31'), totals AS (SELECT region, SUM(amount) AS total_amount, RANK() OVER (ORDER BY SUM(amount) DESC NULLS LAST) AS rnk FROM ends WHERE end_date >= '1995-12-31' GROUP BY region) SELECT region, total_amount FROM totals WHERE rnk = 1"
    tags: ["challenging", "financial"]
  - name: "bird-207"
    prompt: "I'd like to know how many customer accounts based in North Bohemia as of the end of 1995 have had at least one transaction with partner bank AB at some point in their history. Please give me just that count as a single integer."
    expected_sql: "SELECT COUNT(DISTINCT a.account_id) AS qualifying_accounts FROM district AS d JOIN account AS a ON d.district_id = a.district_id JOIN trans AS t ON a.account_id = t.account_id WHERE d.a3 = 'north Bohemia' AND a.date <= '1995-12-31' AND t.bank = 'AB'"
    tags: ["challenging", "financial"]
  - name: "bird-208"
    prompt: "I'm profiling our East Bohemia branch districts that serve younger clients for a youth-product campaign. A district counts as serving a client when the client holds an account at a branch located in that district - it's the branch location that matters, not the client's home district. For the East Bohemia districts that serve at least one client born in the 1980s (birth years 1980 through 1989), please give me: the average of those districts' average salaries, rounded to two decimal places, and the number of such districts."
    expected_sql: "SELECT ROUND(CAST(AVG(x.a11) AS DECIMAL), 2) AS avg_salary, COUNT(*) AS district_count FROM (SELECT DISTINCT t1.district_id, t1.a11 FROM district AS t1 INNER JOIN account AS t2 ON t1.district_id = t2.district_id INNER JOIN disp AS t3 ON t2.account_id = t3.account_id INNER JOIN client AS t4 ON t3.client_id = t4.client_id WHERE t1.a3 = 'east Bohemia' AND EXTRACT(YEAR FROM CAST(t4.birth_date AS TIMESTAMP)) BETWEEN '1980' AND '1989') AS x"
    tags: ["challenging", "financial"]
  - name: "bird-209"
    prompt: "I'm planning a card-offer mailing and want to gauge how affluent the home districts of certain clients are. Please give me one number: the average, over the districts where these clients live, of each district's average salary, rounded to two decimal places. The clients are account owners in central Bohemia who hold no credit card for their account. Two things to keep in mind: a client's district is the one recorded with the client, not the district of the account's branch; and a client counts as holding a card for an account if a card is linked to any disposition of that account, not just their own."
    expected_sql: "WITH qualified AS (SELECT DISTINCT c.district_id FROM disp AS d JOIN client AS c ON c.client_id = d.client_id JOIN district AS dist ON c.district_id = dist.district_id WHERE d.type = 'OWNER' AND dist.a3 = 'central Bohemia' AND NOT EXISTS(SELECT 1 FROM card AS ca JOIN disp AS cd ON ca.disp_id = cd.disp_id WHERE cd.account_id = d.account_id)) SELECT ROUND(CAST(AVG(a11) AS DECIMAL), 2) AS average_salary FROM district WHERE district_id IN (SELECT district_id FROM qualified)"
    tags: ["challenging", "financial"]
  - name: "bird-210"
    prompt: "I'm preparing for a client review and want to gauge how indebted our older customers' accounts are, including accounts that never took any loans. Could you give me the average number of loans per account among accounts whose owner was born before 1950? By 'born before 1950' I mean a birth date earlier than 1 January 1950, and all loans should count regardless of when they were approved. Please give me the average rounded to two decimal places, and nothing else."
    expected_sql: "WITH owner AS (SELECT t2.account_id, t1.birth_date FROM client AS t1 INNER JOIN disp AS t2 ON t1.client_id = t2.client_id WHERE t2.type = 'OWNER') SELECT ROUND(CAST(CASE WHEN (COUNT(t3.loan_id)) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((COUNT(t3.loan_id)) AS TEXT) FROM '^[[:space:]]*[+-]?([0-9]+([.][0-9]*)?|[.][0-9]+)([eE][+-]?[0-9]+)?'), '0') AS DOUBLE PRECISION) END / NULLIF(COUNT(DISTINCT t4.account_id), 0) AS DECIMAL), 2) AS average_loans_per_account FROM owner AS t4 LEFT JOIN loan AS t3 ON t4.account_id = t3.account_id WHERE t4.birth_date < '1950-01-01'"
    tags: ["challenging", "financial"]
  - name: "bird-211"
    prompt: "I'm putting together a periodic report on large payments made by a specific customer cohort, split by what the payment was for. Among payments over $4000 (strictly more than $4000) made from the accounts of male customers born between 1974 and 1976, I need two figures: how many were household payments, and how many were made for a purpose other than household payment. A few rules to keep in mind: born between 1974 and 1976 means the birth year is 1974, 1975 or 1976; a customer's accounts are the ones they hold a disposition on; payments are the individual transactions executed on the account, not standing payment orders; a payment counts as other-purpose only if it has a recorded purpose different from household payment, and a payment with no purpose recorded counts in neither bucket."
    expected_sql: "SELECT COUNT(DISTINCT CASE WHEN t.k_symbol = 'SIPO' THEN t.trans_id END) AS household_payments, COUNT(DISTINCT CASE WHEN NOT t.k_symbol IS NULL AND TRIM(CAST(t.k_symbol AS TEXT)) <> '' AND t.k_symbol <> 'SIPO' THEN t.trans_id END) AS other_purpose_payments FROM trans AS t JOIN disp AS d ON d.account_id = t.account_id JOIN client AS c ON c.client_id = d.client_id WHERE c.gender = 'M' AND CASE WHEN (EXTRACT(YEAR FROM CAST(c.birth_date AS TIMESTAMP))) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((EXTRACT(YEAR FROM CAST(c.birth_date AS TIMESTAMP))) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END BETWEEN 1974 AND 1976 AND t.amount > 4000"
    tags: ["challenging", "financial"]
  - name: "bird-212"
    prompt: "I want to find out whether our borrowing households from larger population centres transact differently from local ones. For every account at the Prachatice branch that has taken at least one loan, please give me: the account number, the account opening date, the total amount ever borrowed, how many outside bank counterparties the account has transacted with over its entire history, the owner's home district, the population of that district, and a rank of these borrowing households by home-district population from largest to smallest. Note that a counterparty means a particular bank account at another institution, identified by that account number, not by the bank code, and only transfers to or from another bank count — handling cash at our own branch does not involve a counterparty. A household's home district is the district its owner client is registered in, which is not necessarily Prachatice. For the ranking: largest population first, ties share the same rank and the next rank after a tie is skipped, and among households whose home districts have the same population, list the smaller account number first."
    expected_sql: "WITH borrowers AS (SELECT a.account_id, a.date AS opening_date, (SELECT SUM(l.amount) FROM loan AS l WHERE l.account_id = a.account_id) AS total_borrowed FROM account AS a WHERE a.district_id = (SELECT district_id FROM district WHERE a2 = 'Prachatice') AND a.account_id IN (SELECT account_id FROM loan)), owners AS (SELECT d.account_id, c.district_id AS home_district_id FROM disp AS d JOIN client AS c ON c.client_id = d.client_id WHERE d.type = 'OWNER'), counterparties AS (SELECT account_id, COUNT(DISTINCT account) AS cnt FROM trans WHERE account > 0 GROUP BY account_id) SELECT bo.account_id, bo.opening_date, bo.total_borrowed, COALESCE(cp.cnt, 0) AS counterparty_count, hd.a2 AS home_district, CASE WHEN (hd.a4) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((hd.a4) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END AS home_population, RANK() OVER (ORDER BY CASE WHEN (hd.a4) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((hd.a4) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END DESC NULLS LAST) AS population_rank FROM borrowers AS bo LEFT JOIN counterparties AS cp ON cp.account_id = bo.account_id LEFT JOIN owners AS o ON o.account_id = bo.account_id LEFT JOIN district AS hd ON hd.district_id = o.home_district_id ORDER BY population_rank ASC NULLS FIRST, bo.account_id ASC NULLS FIRST"
    tags: ["challenging", "financial"]
  - name: "bird-213"
    prompt: "I'm profiling our gold-card customers for a regional campaign, split by gender. For women first, then men, look at gold-card holders whose card's account has an average balance over 1,000. Among the branch districts holding those accounts, keep only the districts with over 100,000 inhabitants. For each gender, tell me: the number of those districts; which of them has the most inhabitants, with its inhabitants figure - if two districts tie, list both, one row per district; the average salary across those districts, rounded to two decimals; and the average ratio of urban inhabitants across those districts, rounded to two decimals. Nothing else. Please note: 'over' means strictly greater than, and an account's average balance is the mean of its balances after each transaction."
    expected_sql: "WITH gold_holder AS (SELECT d.account_id, cl.gender FROM card AS c JOIN disp AS d ON c.disp_id = d.disp_id JOIN client AS cl ON d.client_id = cl.client_id WHERE c.type = 'gold' AND d.type = 'OWNER'), acct_bal AS (SELECT account_id, AVG(balance) AS avg_balance FROM trans GROUP BY account_id), holder_district AS (SELECT DISTINCT gh.gender, a.district_id FROM gold_holder AS gh JOIN account AS a ON gh.account_id = a.account_id JOIN acct_bal AS ab ON ab.account_id = a.account_id AND ab.avg_balance > 1000), big AS (SELECT hd.gender, di.a2 AS name, CASE WHEN (di.a4) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((di.a4) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END AS inhabitants, di.a11 AS salary, di.a10 AS urban FROM holder_district AS hd JOIN district AS di ON hd.district_id = di.district_id WHERE CASE WHEN (di.a4) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((di.a4) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END > 100000), ranked AS (SELECT gender, name, inhabitants, COUNT(*) OVER (PARTITION BY gender) AS district_count, ROUND(CAST(AVG(salary) OVER (PARTITION BY gender) AS DECIMAL), 2) AS avg_district_salary, ROUND(CAST(AVG(urban) OVER (PARTITION BY gender) AS DECIMAL), 2) AS avg_urban_ratio, RANK() OVER (PARTITION BY gender ORDER BY inhabitants DESC NULLS LAST) AS rnk FROM big) SELECT gender, district_count, name AS largest_district_name, inhabitants AS largest_district_inhabitants, avg_district_salary, avg_urban_ratio FROM ranked WHERE rnk = 1 ORDER BY CASE gender WHEN 'F' THEN 1 ELSE 2 END NULLS FIRST, name NULLS FIRST"
    tags: ["challenging", "financial"]
  - name: "bird-214"
    prompt: "I'm preparing a partner-bank negotiation and want to focus on our big-city clients. Please tell me, for 1998 (1 January through 31 December 1998), where the money went from gold credit card clients' accounts held at branches in large districts. Specifically: for accounts whose owner has a gold credit card, and whose branch is located in a district with at least 250,000 inhabitants, look at their outgoing payments (debit transactions, type VYDAJ). I need a ranking of the recipient bank and counter-account pairs by the total amount paid. If two pairs tie for the largest total, list both. For each pair, give me: the recipient bank code, the recipient counter-account number, the number of outgoing payments, and the total amount paid."
    expected_sql: "WITH gold_accounts AS (SELECT d.account_id FROM card AS c JOIN disp AS d ON c.disp_id = d.disp_id WHERE c.type = 'gold' AND d.type = 'OWNER'), outgoing AS (SELECT t.bank AS bank, t.account AS account, COUNT(*) AS n_payments, SUM(t.amount) AS total_amount FROM trans AS t JOIN account AS a ON a.account_id = t.account_id JOIN district AS di ON di.district_id = a.district_id WHERE t.account_id IN (SELECT account_id FROM gold_accounts) AND t.type = 'VYDAJ' AND t.date >= '1998-01-01' AND t.date <= '1998-12-31' AND t.account > 0 AND CASE WHEN (di.a4) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((di.a4) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END >= 250000 GROUP BY t.bank, t.account) SELECT bank, account, n_payments, total_amount FROM outgoing WHERE total_amount = (SELECT MAX(total_amount) FROM outgoing) ORDER BY bank NULLS FIRST, account NULLS FIRST"
    tags: ["challenging", "financial"]
  - name: "bird-215"
    prompt: "I'm reviewing what the money leaving our Pisek district branch's accounts is actually used for. What percentage of the total amount of outgoing payments that state a payment purpose went to household bill payments (SIPO)? Please give me a single percentage value, rounded to two decimals. Note this should be based only on payments that state a purpose, not all outgoing payments, and should consider the full transaction history."
    expected_sql: "SELECT ROUND(CAST(SUM(CASE WHEN t.k_symbol = 'SIPO' THEN t.amount ELSE 0 END) * 100.0 / NULLIF(SUM(t.amount), 0) AS DECIMAL), 2) AS sipo_percentage_of_purposed_outgoing_payments FROM trans AS t JOIN account AS a ON t.account_id = a.account_id JOIN district AS d ON a.district_id = d.district_id WHERE d.a2 = 'Pisek' AND t.type = 'VYDAJ' AND NOT t.k_symbol IS NULL AND TRIM(CAST(t.k_symbol AS TEXT)) <> ''"
    tags: ["challenging", "financial"]
  - name: "bird-216"
    prompt: "I'm planning a regional campaign for female customers who hold a credit card and a loan, and I need a demographic profile per region. For each region, please give me: the region, the average district salary of the districts where these female clients live, and the average 1996 district unemployment rate of those same districts – both averages rounded to 2 decimal places. I also want the name of the most populous district among those districts in each region, so I know where to focus local advertising. A few rules: count only female clients who own the account (disposition type OWNER) and who have at least one credit card and at least one loan on that account. 'Most populous' means the district with the largest number of inhabitants; if two tie, take the one whose name comes first alphabetically. One row per region, and include every region that has at least one such client – nothing else."
    expected_sql: "WITH cohort AS (SELECT DISTINCT c.district_id FROM client AS c JOIN disp AS d ON d.client_id = c.client_id AND d.type = 'OWNER' WHERE c.gender = 'F' AND d.disp_id IN (SELECT disp_id FROM card) AND d.account_id IN (SELECT account_id FROM loan)) SELECT di.a3 AS region, ROUND(CAST(AVG(di.a11) AS DECIMAL), 2) AS average_district_salary, ROUND(CAST(AVG(di.a13) AS DECIMAL), 2) AS average_unemployment_rate_1996, (SELECT di2.a2 FROM district AS di2 WHERE di2.district_id IN (SELECT district_id FROM cohort) AND di2.a3 = di.a3 ORDER BY CASE WHEN (di2.a4) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((di2.a4) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END DESC NULLS LAST, di2.a2 NULLS FIRST LIMIT 1) AS most_populous_district FROM district AS di WHERE di.district_id IN (SELECT district_id FROM cohort) GROUP BY di.a3 ORDER BY di.a3 NULLS FIRST"
    tags: ["challenging", "financial"]
  - name: "bird-217"
    prompt: "I'm reviewing our presence in central Bohemia. Please tell me: the names of the three most populous districts of central Bohemia (largest by inhabitants), the number of crimes committed in 1996 in each of them, the average 1996 crime count across those three districts, the average 1996 crime count across all districts in the country, and the difference between the three-district average and the overall average (three-district average minus overall average). Rank districts by inhabitants, breaking ties by district name alphabetically (ignoring accents). Round all averages and the difference to 2 decimal places. The overall average should cover every district in the country, whether or not it has any accounts."
    expected_sql: "WITH ranked AS (SELECT d.a2 AS district_name, CASE WHEN (d.a4) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((d.a4) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END AS inhabitants, d.a16 AS crimes_1996 FROM district AS d WHERE d.a3 = 'central Bohemia' ORDER BY CASE WHEN (d.a4) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((d.a4) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END DESC NULLS LAST, d.a2 NULLS FIRST LIMIT 3) SELECT r.district_name, r.crimes_1996, ROUND(CAST((SELECT AVG(crimes_1996) FROM ranked) AS DECIMAL), 2) AS avg_crimes_top3_1996, ROUND(CAST((SELECT AVG(a16) FROM district) AS DECIMAL), 2) AS avg_crimes_all_districts_1996, ROUND(CAST((SELECT AVG(crimes_1996) FROM ranked) - (SELECT AVG(a16) FROM district) AS DECIMAL), 2) AS difference FROM ranked AS r ORDER BY r.inhabitants DESC NULLS LAST, r.district_name NULLS FIRST"
    tags: ["challenging", "financial"]
  - name: "bird-218"
    prompt: "For planning region-targeted card offers, I need to look at the smallest markets behind each credit card type. For each credit card type (gold, classic and junior), which home district of the clients holding that type has the fewest inhabitants, and how many inhabitants does that district have? Please include all three card types, and if several districts tie for the fewest inhabitants, list them all."
    expected_sql: "WITH holder_districts AS (SELECT DISTINCT cd.type AS card_type, cl.district_id FROM card AS cd JOIN disp AS dp ON dp.disp_id = cd.disp_id JOIN client AS cl ON cl.client_id = dp.client_id), ranked AS (SELECT hd.card_type, ds.a2 AS district_name, CASE WHEN (ds.a4) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((ds.a4) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END AS inhabitants, RANK() OVER (PARTITION BY hd.card_type ORDER BY CASE WHEN (ds.a4) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((ds.a4) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END NULLS FIRST) AS rnk FROM holder_districts AS hd JOIN district AS ds ON ds.district_id = hd.district_id) SELECT card_type, district_name, inhabitants FROM ranked WHERE rnk = 1 ORDER BY card_type NULLS FIRST"
    tags: ["challenging", "financial"]
  - name: "bird-219"
    prompt: "I'm reviewing how our branches performed in 1996, and I'd like a picture of the money standing in accounts opened during that year, across the region that Litomerice belongs to (the region as given in the district table's region field).\n\nFor each district in that region where at least one account was opened in 1996 (openings counted by account creation date within the calendar year 1996), please give me:\n- the district name,\n- the number of accounts opened in 1996,\n- the average end-of-1996 balance of those accounts,\nwith rows ordered by district name.\n\nAlso give me:\n- the region-wide average end-of-1996 balance, taken across all those accounts (not as the mean of the district averages),\n- the district with the highest average end-of-1996 balance; if two districts tie, name the one that comes first alphabetically.\n\nBy end-of-1996 balance I mean the balance after the account's last transaction dated on or before 1996-12-31; transactions dated 1997 or later don't count, and if several transactions fall on that last date, the one with the highest transaction id is the one that matters. Please round all averages to two decimals."
    expected_sql: "WITH region AS (SELECT a3 AS r FROM district WHERE a2 = 'Litomerice'), op AS (SELECT a.account_id, a.district_id FROM account AS a JOIN district AS d ON d.district_id = a.district_id WHERE d.a3 = (SELECT r FROM region) AND a.date >= '1996-01-01' AND a.date < '1997-01-01'), lastd AS (SELECT t.account_id, MAX(t.date) AS md FROM trans AS t WHERE t.date <= '1996-12-31' AND t.account_id IN (SELECT account_id FROM op) GROUP BY t.account_id), lastt AS (SELECT l.account_id, MAX(t.trans_id) AS mt FROM lastd AS l JOIN trans AS t ON t.account_id = l.account_id AND t.date = l.md GROUP BY l.account_id), eb AS (SELECT x.account_id, tr.balance AS bal FROM lastt AS x JOIN trans AS tr ON tr.trans_id = x.mt), rd AS (SELECT d.a2 AS district_name, COUNT(*) AS accounts_opened_in_1996, AVG(e.bal) AS raw_avg FROM op AS o JOIN district AS d ON d.district_id = o.district_id JOIN eb AS e ON e.account_id = o.account_id GROUP BY d.district_id, d.a2) SELECT rd.district_name, rd.accounts_opened_in_1996, ROUND(CAST(rd.raw_avg AS DECIMAL), 2) AS average_end_of_1996_balance, (SELECT ROUND(CAST(AVG(bal) AS DECIMAL), 2) FROM eb) AS region_average_end_of_1996_balance, (SELECT district_name FROM rd ORDER BY raw_avg DESC NULLS LAST, district_name ASC NULLS FIRST LIMIT 1) AS district_with_highest_average_end_of_1996_balance FROM rd ORDER BY rd.district_name NULLS FIRST"
    tags: ["challenging", "financial"]
  - name: "bird-220"
    prompt: "I want to check whether our biggest short-term loans cluster in populous branch districts and how well-off those areas are. Looking at 24-month loans on accounts with weekly statement issuance, take the ten largest loans ranked by approved amount from highest to lowest — if two loans have the same amount, the one with the smaller loan id ranks first, and ranking continues consecutively after a tie. The district of a loan is the district where the branch managing the loan account is located. Among the districts those ten loans come from, I need: the district with the most inhabitants (if two districts tie on inhabitants, the one with the smaller district id counts as more populous), that district's number of inhabitants, and the average salary across those districts rounded to two decimals."
    expected_sql: "WITH ranked AS (SELECT l.loan_id, a.district_id, ROW_NUMBER() OVER (ORDER BY l.amount DESC NULLS LAST, l.loan_id ASC NULLS FIRST) AS rn FROM loan AS l JOIN account AS a ON a.account_id = l.account_id WHERE l.duration = 24 AND a.frequency = 'POPLATEK TYDNE'), top10 AS (SELECT * FROM ranked WHERE rn <= 10), districts AS (SELECT d.district_id, d.a2 AS district_name, CASE WHEN (d.a4) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((d.a4) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END AS inhabitants, d.a11 AS avg_salary FROM district AS d JOIN (SELECT DISTINCT district_id FROM top10) AS t ON t.district_id = d.district_id) SELECT (SELECT district_name FROM districts ORDER BY inhabitants DESC NULLS LAST, district_id ASC NULLS FIRST LIMIT 1) AS most_populous_district, (SELECT inhabitants FROM districts ORDER BY inhabitants DESC NULLS LAST, district_id ASC NULLS FIRST LIMIT 1) AS inhabitants, (SELECT ROUND(CAST(AVG(avg_salary) AS DECIMAL), 2) FROM districts) AS avg_district_salary"
    tags: ["challenging", "financial"]
  - name: "bird-221"
    prompt: "For every district with at least 100,000 inhabitants that has withdrawal transactions, can you show me the district name, region, population, total amount withdrawn in the district, withdrawals per inhabitant (rounded to 2 decimals), the district's rank by withdrawals per inhabitant (highest first), and the average standing-order debit per account held in the district (rounded to 2 decimals)? I want to compare withdrawal pressure and the standing-order burden side by side across our major districts. Please rank all qualifying districts, not just the top few, using competition ranking so tied districts share a rank and the next rank is skipped (e.g. 1, 1, 3). The whole transaction history on record is in scope. For the average standing-order debit per account, every account held in the district counts, including ones with no standing orders – those simply bring no debits."
    expected_sql: "WITH wd AS (SELECT a.district_id, SUM(t.amount) AS total FROM trans AS t JOIN account AS a ON t.account_id = a.account_id WHERE t.type = 'VYDAJ' GROUP BY a.district_id), acct AS (SELECT district_id, COUNT(*) AS n_accounts FROM account GROUP BY district_id), so AS (SELECT a.district_id, SUM(o.amount) AS so_total FROM account AS a LEFT JOIN \"order\" AS o ON o.account_id = a.account_id GROUP BY a.district_id) SELECT d.a2 AS district_name, d.a3 AS region, CASE WHEN (d.a4) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((d.a4) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END AS population, wd.total AS total_withdrawn, ROUND(CAST(wd.total / NULLIF(CASE WHEN (d.a4) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((d.a4) AS TEXT) FROM '^[[:space:]]*[+-]?([0-9]+([.][0-9]*)?|[.][0-9]+)([eE][+-]?[0-9]+)?'), '0') AS DOUBLE PRECISION) END, 0) AS DECIMAL), 2) AS withdrawals_per_inhabitant, RANK() OVER (ORDER BY wd.total / NULLIF(CASE WHEN (d.a4) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((d.a4) AS TEXT) FROM '^[[:space:]]*[+-]?([0-9]+([.][0-9]*)?|[.][0-9]+)([eE][+-]?[0-9]+)?'), '0') AS DOUBLE PRECISION) END, 0) DESC NULLS LAST) AS per_inhabitant_rank, ROUND(CAST(so.so_total * 1.0 / NULLIF(acct.n_accounts, 0) AS DECIMAL), 2) AS avg_standing_order_debit_per_account FROM district AS d JOIN wd ON wd.district_id = d.district_id JOIN acct ON acct.district_id = d.district_id JOIN so ON so.district_id = d.district_id WHERE CASE WHEN (d.a4) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((d.a4) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END >= 100000 ORDER BY per_inhabitant_rank NULLS FIRST, district_name NULLS FIRST"
    tags: ["challenging", "financial"]
  - name: "bird-222"
    prompt: "I'm preparing a client review for client 3541. For each account this client can access, I need one row with: the account id, the date the account was opened, its frequency, the name and region of the district where the account is held, whether that district is the client's home district (Yes/No), that district's average salary, the loan repayment status (none if there's no loan), the loan amount (0 if no loan), the number of transactions over the account's whole recorded history, total income, total expense, net balance, the number of clients whose home district lies in that region, the name of the most populous district in that region, that district's number of inhabitants, and the account district's population rank within its region. Order the rows by number of transactions, most first, with ties broken by ascending account id. The client's home district is the district recorded for the client, and population means number of inhabitants. For ranks, the most populous district is rank 1; districts with equal population share a rank and the next rank skips."
    expected_sql: "WITH acct AS (SELECT d.account_id, a.date AS opened, a.frequency AS freq, a.district_id AS branch_district, c.district_id AS home_district FROM client AS c JOIN disp AS d ON d.client_id = c.client_id JOIN account AS a ON a.account_id = d.account_id WHERE c.client_id = 3541), stats AS (SELECT ac.account_id, ac.opened, ac.freq, ac.branch_district, ac.home_district, COUNT(t.trans_id) AS transaction_count, SUM(CASE WHEN t.type = 'PRIJEM' THEN t.amount ELSE 0 END) AS total_income, SUM(CASE WHEN t.type = 'VYDAJ' THEN t.amount ELSE 0 END) AS total_expense FROM acct AS ac LEFT JOIN trans AS t ON t.account_id = ac.account_id GROUP BY ac.account_id, ac.opened, ac.freq, ac.branch_district, ac.home_district), ranked AS (SELECT district_id, a3 AS region, a2 AS district_name, CASE WHEN (a4) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((a4) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END AS inhabitants, RANK() OVER (PARTITION BY a3 ORDER BY CASE WHEN (a4) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((a4) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END DESC NULLS LAST) AS pop_rank FROM district) SELECT s.account_id, s.opened AS opening_date, s.freq AS frequency, bd.a2 AS district_where_held, bd.a3 AS region, CASE WHEN bd.district_id = s.home_district THEN 'Yes' ELSE 'No' END AS is_client_home_district, bd.a11 AS district_avg_salary, COALESCE(l.status, 'none') AS loan_status, COALESCE(l.amount, 0) AS loan_amount, s.transaction_count, s.total_income, s.total_expense, s.total_income - s.total_expense AS net_balance, (SELECT COUNT(DISTINCT c2.client_id) FROM client AS c2 JOIN district AS d2 ON d2.district_id = c2.district_id WHERE d2.a3 = bd.a3) AS clients_home_district_in_region, mp.district_name AS most_populous_district, mp.inhabitants AS most_populous_inhabitants, rk.pop_rank AS population_rank_in_region FROM stats AS s JOIN district AS bd ON bd.district_id = s.branch_district JOIN ranked AS rk ON rk.district_id = bd.district_id JOIN ranked AS mp ON mp.region = bd.a3 AND mp.pop_rank = 1 LEFT JOIN loan AS l ON l.account_id = s.account_id ORDER BY s.transaction_count DESC NULLS LAST, s.account_id ASC NULLS FIRST"
    tags: ["challenging", "financial"]
  - name: "bird-223"
    prompt: "I'm doing a lending review by account-opening year for my region. For accounts opened in the central Bohemia region from 1 January 1996 onward, broken down by the calendar year of the account creation date (as a text string like '1996', not an integer), I need: the number of accounts opened that year in the region, the total amount lent on those accounts, and the average across the districts of the amount lent per account opened in that district, rounded to two decimals. An account with no loan counts as having lent nothing."
    expected_sql: "WITH cba AS (SELECT a.account_id, a.district_id, EXTRACT(YEAR FROM CAST(a.date AS TIMESTAMP)) AS y FROM account AS a INNER JOIN district AS d ON a.district_id = d.district_id WHERE d.a3 = 'central Bohemia' AND a.date >= '1996-01-01'), branch AS (SELECT cba.y, cba.district_id, SUM(COALESCE(l.amount, 0)) * 1.0 / NULLIF(COUNT(DISTINCT cba.account_id), 0) AS lent_per_account FROM cba LEFT JOIN loan AS l ON l.account_id = cba.account_id GROUP BY cba.y, cba.district_id) SELECT yt.y AS opening_year, yt.accounts_opened, yl.total_lent, ROUND(CAST(b.avg_lent AS DECIMAL), 2) AS avg_amount_lent_per_account FROM (SELECT y, COUNT(DISTINCT account_id) AS accounts_opened FROM cba GROUP BY y) AS yt INNER JOIN (SELECT y, SUM(l.amount) AS total_lent FROM cba LEFT JOIN loan AS l ON l.account_id = cba.account_id GROUP BY y) AS yl ON yl.y = yt.y INNER JOIN (SELECT y, AVG(lent_per_account) AS avg_lent FROM branch GROUP BY y) AS b ON b.y = yt.y ORDER BY yt.y NULLS FIRST"
    tags: ["challenging", "financial"]
  - name: "bird-224"
    prompt: "For a regional risk review, I need to look at our largest 24-month loans. Please find the ten loans with the largest approved amount among loans with a 24-month duration on accounts that have weekly statement issuance. For each of these ten loans, give me: the district of the branch servicing the account, the approved amount, the approval date, and the account balance at the end of the day the loan was approved. Two rules: if two loans have the same approved amount, the one approved earlier counts as larger; and if several transactions share that last day, the one with the higher transaction id counts as the later one. List the results from the largest approved amount down."
    expected_sql: "WITH top_loans AS (SELECT l.loan_id, l.account_id, l.amount, l.date AS loan_date, d.a2 AS district_name FROM loan AS l JOIN account AS a ON a.account_id = l.account_id JOIN district AS d ON d.district_id = a.district_id WHERE l.duration = 24 AND a.frequency = 'POPLATEK TYDNE' ORDER BY l.amount DESC NULLS LAST, l.date ASC NULLS FIRST, l.loan_id ASC NULLS FIRST LIMIT 10) SELECT district_name, amount AS approved_amount, loan_date AS approval_date, (SELECT t.balance FROM trans AS t WHERE t.account_id = top_loans.account_id AND t.date <= top_loans.loan_date ORDER BY t.date DESC NULLS LAST, t.trans_id DESC NULLS LAST LIMIT 1) AS balance_at_approval FROM top_loans ORDER BY approved_amount DESC NULLS LAST"
    tags: ["challenging", "financial"]
  - name: "bird-225"
    prompt: "I'm putting together a review of our first credit card wave and need a profile of every client who was issued a credit card in 1994 (issue date falling in calendar year 1994). For each such client, please include: client id, gender, birth date, card type, age at card issue (the card's issue year minus the client's birth year), number of loans on their account, total amount borrowed, borrower classification, district name, district average salary, and their age rank within gender. Use these classifications: Young borrower if there's at least one loan on the account and age at card issue is under 30; Mature borrower if there's at least one loan and age at card issue is 30 or more; otherwise Non-borrower. The age rank within gender should be a standard competition rank - equal ages share a rank and the next rank is skipped (e.g. 1, 1, 3). Order the rows by client id."
    expected_sql: "WITH cohort AS (SELECT c.client_id, c.gender, c.birth_date, cd.type AS card_type, (CASE WHEN (EXTRACT(YEAR FROM CAST(cd.issued AS TIMESTAMP))) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((EXTRACT(YEAR FROM CAST(cd.issued AS TIMESTAMP))) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END - CASE WHEN (EXTRACT(YEAR FROM CAST(c.birth_date AS TIMESTAMP))) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((EXTRACT(YEAR FROM CAST(c.birth_date AS TIMESTAMP))) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END) AS age_at_issue, d.account_id, di.a2 AS district_name, di.a11 AS district_avg_salary FROM card AS cd JOIN disp AS d ON cd.disp_id = d.disp_id JOIN client AS c ON d.client_id = c.client_id JOIN district AS di ON c.district_id = di.district_id WHERE EXTRACT(YEAR FROM CAST(cd.issued AS TIMESTAMP)) = '1994') SELECT co.client_id, co.gender, co.birth_date, co.card_type, co.age_at_issue, COUNT(l.loan_id) AS loan_count, COALESCE(SUM(l.amount), 0) AS total_borrowed, CASE WHEN COUNT(l.loan_id) > 0 AND co.age_at_issue < 30 THEN 'Young borrower' WHEN COUNT(l.loan_id) > 0 THEN 'Mature borrower' ELSE 'Non-borrower' END AS borrower_category, co.district_name, co.district_avg_salary, RANK() OVER (PARTITION BY co.gender ORDER BY co.age_at_issue NULLS FIRST) AS age_rank_within_gender FROM cohort AS co LEFT JOIN loan AS l ON co.account_id = l.account_id GROUP BY co.client_id, co.gender, co.birth_date, co.card_type, co.age_at_issue, co.district_name, co.district_avg_salary ORDER BY co.client_id NULLS FIRST"
    tags: ["challenging", "financial"]
  - name: "bird-226"
    prompt: "I'm reviewing branches in the north Moravia region ahead of a client meeting. For each branch there, how many transactions dated on or before 14 October 1998 have no characterization recorded? A branch is the district the account belongs to, and the count should cover all of the branch's accounts' transactions. Please list only the top three branches by this count, with the branch name and its count, ranked first to third. If any branches tie on the count, order them alphabetically by branch name and keep three rows after that ordering."
    expected_sql: "WITH branch_counts AS (SELECT d.a2 AS branch_name, COUNT(*) AS unstated_transactions FROM trans AS t JOIN account AS a ON t.account_id = a.account_id JOIN district AS d ON a.district_id = d.district_id WHERE d.a3 = 'north Moravia' AND t.date <= '1998-10-14' AND (t.k_symbol IS NULL OR TRIM(CAST(t.k_symbol AS TEXT)) = '') GROUP BY d.a2) SELECT branch_name, unstated_transactions FROM branch_counts ORDER BY unstated_transactions DESC NULLS LAST, branch_name ASC NULLS FIRST LIMIT 3"
    tags: ["challenging", "financial"]
  - name: "bird-227"
    prompt: "The loan of 98832 approved on January 3rd, 1996 has one applicant account. For that account, list every counterparty it had paid before January 3rd, 1996. A counterparty means a specific account number at a specific bank, so give me one row per bank code and account number combination. For each counterparty I need the bank code, the account number, the number of outgoing payments made to them, and the total amount paid to them. Count only outgoing payments (VYDAJ, i.e. debits) made before January 3rd, 1996, and sort the counterparties by total amount paid, largest first."
    expected_sql: "SELECT t.bank AS bank_code, t.account AS counterparty_account, COUNT(*) AS payment_count, SUM(t.amount) AS total_paid FROM trans AS t WHERE t.account_id = (SELECT l.account_id FROM loan AS l WHERE l.date = '1996-01-03' AND l.amount = 98832) AND t.type = 'VYDAJ' AND t.date < '1996-01-03' AND t.account > 0 GROUP BY t.bank, t.account ORDER BY total_paid DESC NULLS LAST"
    tags: ["challenging", "financial"]
  - name: "bird-228"
    prompt: "For the year-end review of my branch at location 1: how many accounts that were on the branch's books as of 31 December 1995 hold an active loan contract? I want a single integer, nothing else. An account counts only if it belonged to the branch on that date, and only contracts that are still active by their repayment status count - statuses A and B are finished contracts and shouldn't be included."
    expected_sql: "SELECT COUNT(DISTINCT a.account_id) AS account_count FROM account AS a JOIN loan AS l ON l.account_id = a.account_id WHERE a.district_id = 1 AND a.date <= '1995-12-31' AND l.status IN ('C', 'D')"
    tags: ["challenging", "financial"]
  - name: "bird-229"
    prompt: "I'm closing the 1998 books for client 2823's account and need to reconcile the interest. What was the net interest on that account for calendar year 1998 (1 January through 31 December 1998) – interest credited minus penalty interest charged, with penalty interest entering as negative – as a single exact amount in CZK, not rounded? Please include everything credited or charged over the year; the client's account is one account, regardless of the disposition it carries."
    expected_sql: "SELECT SUM(CASE WHEN t.k_symbol = 'UROK' THEN t.amount ELSE -t.amount END) AS net_interest FROM trans AS t WHERE t.date BETWEEN '1998-01-01' AND '1998-12-31' AND CAST(t.k_symbol AS TEXT) LIKE '%UROK%' AND EXISTS(SELECT 1 FROM disp AS d WHERE d.account_id = t.account_id AND d.client_id = 2823)"
    tags: ["challenging", "financial"]
  - name: "bird-230"
    prompt: "I need to profile our three largest loans held by female clients. Please report for each of these loans: the client id, loan amount, duration in months, total payments, interest paid, loan status, the district and region of the branch where the loan's account is held, the account's transaction count and total deposits, an income category, the number of loans the bank has granted in that region, the average of the average salaries of that region's districts, and the client's completed age on 2026-10-09. A few notes: the three largest loans are the three highest approved loan amounts, and if amounts tie, include all tied loans. Total payments is the monthly payment times the duration, and interest paid is total payments minus the approved amount; round money figures to two decimals. The income category is High Income if total deposits exceed twice the loan amount, Medium Income if they exceed the loan amount, and Low Income otherwise. Loans in a region counts every loan the bank has granted in that region for all clients, not only female clients. The region's average salary is the average of the average salaries of the districts in that region, rounded to two decimals. For the age, use the completed age on 2026-10-09, subtracting one if the birthday hasn't occurred by that date."
    expected_sql: "WITH female_loans AS (SELECT c.client_id, c.birth_date, d.account_id, l.loan_id, l.amount, l.duration, l.payments, l.status, a.district_id, RANK() OVER (ORDER BY l.amount DESC NULLS LAST) AS rnk FROM client AS c JOIN disp AS d ON c.client_id = d.client_id AND d.type = 'OWNER' JOIN loan AS l ON d.account_id = l.account_id JOIN account AS a ON l.account_id = a.account_id WHERE c.gender = 'F'), region_loans AS (SELECT da.a3 AS region, COUNT(*) AS loans_in_region FROM loan AS l JOIN account AS a ON l.account_id = a.account_id JOIN district AS da ON a.district_id = da.district_id GROUP BY da.a3), region_salary AS (SELECT a3 AS region, ROUND(CAST(AVG(a11) AS DECIMAL), 2) AS avg_district_salary FROM district GROUP BY a3), acct_trans AS (SELECT account_id, COUNT(*) AS transaction_count, SUM(CASE WHEN type = 'PRIJEM' THEN amount ELSE 0 END) AS total_credits FROM trans GROUP BY account_id) SELECT fl.client_id, fl.amount AS loan_amount, fl.duration AS loan_duration_months, ROUND(CAST(fl.payments * fl.duration AS DECIMAL), 2) AS total_payments, ROUND(CAST(fl.payments * fl.duration - fl.amount AS DECIMAL), 2) AS interest_paid, fl.status AS loan_status, di.a2 AS branch_district, di.a3 AS region, at.transaction_count, at.total_credits AS total_deposits, CASE WHEN at.total_credits > fl.amount * 2 THEN 'High Income' WHEN at.total_credits > fl.amount THEN 'Medium Income' ELSE 'Low Income' END AS income_category, rl.loans_in_region, rs.avg_district_salary AS region_avg_district_salary, EXTRACT(YEAR FROM CAST('2026-10-09' AS TIMESTAMP)) - EXTRACT(YEAR FROM CAST(fl.birth_date AS TIMESTAMP)) - CASE WHEN TO_CHAR(CAST('2026-10-09' AS TIMESTAMP), 'MM-DD') < TO_CHAR(CAST(fl.birth_date AS TIMESTAMP), 'MM-DD') THEN 1 ELSE 0 END AS client_age FROM female_loans AS fl JOIN district AS di ON fl.district_id = di.district_id JOIN region_loans AS rl ON di.a3 = rl.region JOIN region_salary AS rs ON di.a3 = rs.region LEFT JOIN acct_trans AS at ON fl.account_id = at.account_id WHERE fl.rnk <= 3 ORDER BY fl.amount DESC NULLS LAST"
    tags: ["challenging", "financial"]
  - name: "bird-231"
    prompt: "I need to find out where our pre-1997 long-term mortgage exposure is concentrated geographically. Long-term means a loan duration of more than 24 months, and \"opened before 1997\" should exclude anything opened during 1997. Please tell me: for each region, which districts have at least one such account, and give me the region whose qualifying districts have the largest combined number of inhabitants. Along with the region's name, I want the number of those districts in it, their combined population, and the total number of those accounts in the region. If two regions tie on combined population, pick the one whose name comes first alphabetically."
    expected_sql: "WITH cohort AS (SELECT l.account_id, a.district_id FROM loan AS l JOIN account AS a ON l.account_id = a.account_id WHERE l.duration > 24 AND EXTRACT(YEAR FROM CAST(a.date AS TIMESTAMP)) < '1997'), region_districts AS (SELECT DISTINCT d.district_id, d.a3 AS region, CASE WHEN (d.a4) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((d.a4) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END AS population FROM district AS d JOIN cohort AS c ON d.district_id = c.district_id) SELECT r.region, COUNT(*) AS num_districts, SUM(r.population) AS total_population, (SELECT COUNT(*) FROM cohort AS c JOIN region_districts AS x ON c.district_id = x.district_id WHERE x.region = r.region) AS num_accounts FROM region_districts AS r GROUP BY r.region ORDER BY total_population DESC NULLS LAST, r.region ASC NULLS FIRST LIMIT 1"
    tags: ["challenging", "financial"]
  - name: "bird-232"
    prompt: "I'm putting together a market-coverage report on how our 1997 rollout of monthly-statement accounts reached large urban districts. For districts with at least 100,000 inhabitants that had at least one monthly-statement account opened during calendar year 1997, please give me: the total number of monthly-statement accounts opened in those districts during 1997, how many districts are involved, and the average salary across these qualifying districts rounded to two decimals."
    expected_sql: "WITH qualifying_districts AS (SELECT d.district_id, d.a11 FROM district AS d WHERE CASE WHEN (d.a4) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((d.a4) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END >= 100000 AND EXISTS(SELECT 1 FROM account AS a WHERE a.district_id = d.district_id AND a.frequency = 'POPLATEK MESICNE' AND a.date BETWEEN '1997-01-01' AND '1997-12-31')) SELECT (SELECT COUNT(*) FROM account AS a JOIN qualifying_districts AS q ON a.district_id = q.district_id WHERE a.frequency = 'POPLATEK MESICNE' AND a.date BETWEEN '1997-01-01' AND '1997-12-31') AS monthly_accounts_opened_1997, (SELECT COUNT(*) FROM qualifying_districts) AS district_count, (SELECT ROUND(CAST(AVG(a11) AS DECIMAL), 2) FROM qualifying_districts) AS avg_district_salary"
    tags: ["challenging", "financial"]
  - name: "bird-233"
    prompt: "I'd like to review the breadth of each gold-card account's external payment network. For every account that has a gold credit card, could you list: the account id, the district name and region of the branch, the total amount received, the total amount withdrawn, the number of loans taken, and the number of accounts at other banks that money was transferred to or received from? Then rank the accounts by that number of external counterparties. A few things to keep in mind: if accounts tie on the number, they share a rank and the next rank is not skipped; accounts with no external counterparty transfers should still be included and count as zero; and the totals and counts should cover the full recorded period."
    expected_sql: "WITH gold_accounts AS (SELECT d.account_id FROM disp AS d JOIN card AS c ON c.disp_id = d.disp_id WHERE c.type = 'gold' GROUP BY d.account_id), trans_stats AS (SELECT account_id, SUM(CASE WHEN type = 'PRIJEM' THEN amount ELSE 0 END) AS total_received, SUM(CASE WHEN type = 'VYDAJ' THEN amount ELSE 0 END) AS total_withdrawn, COUNT(DISTINCT CASE WHEN NOT bank IS NULL THEN account END) AS external_counterparty_accounts FROM trans GROUP BY account_id), loan_stats AS (SELECT account_id, COUNT(loan_id) AS loan_count FROM loan GROUP BY account_id) SELECT g.account_id, di.a2 AS district, di.a3 AS region, COALESCE(t.total_received, 0) AS total_received, COALESCE(t.total_withdrawn, 0) AS total_withdrawn, COALESCE(l.loan_count, 0) AS loan_count, COALESCE(t.external_counterparty_accounts, 0) AS external_counterparty_accounts, DENSE_RANK() OVER (ORDER BY COALESCE(t.external_counterparty_accounts, 0) DESC NULLS LAST) AS counterparty_rank FROM gold_accounts AS g JOIN account AS a ON a.account_id = g.account_id JOIN district AS di ON di.district_id = a.district_id LEFT JOIN trans_stats AS t ON t.account_id = g.account_id LEFT JOIN loan_stats AS l ON l.account_id = g.account_id ORDER BY counterparty_rank NULLS FIRST, g.account_id NULLS FIRST"
    tags: ["challenging", "financial"]
  - name: "bird-234"
    prompt: "I'm preparing our branch's annual customer review. For every account held at the Tabor branch as of 31 December 1996, I need a one-row profile per account, ordered among tied ranks by ascending account id, showing: the account id; the date the account was opened; the owner's gender and their age at 31 December 1996 in whole completed years; the number of credit cards issued to the account by 31 December 1996 (0 if none); the number of loans approved to the account by 31 December 1996 (0 if none); a loan standing label; the number of transactions on the account during 1997; the total money into the account during 1997; the total money out of the account during 1997; the peak balance reached on the account during 1997 (0 if none); and the account's rank by 1997 peak balance, highest first, with ties sharing a rank and the next rank skipped (e.g. 1, 1, 3). All 'as of' figures are taken at 31 December 1996; activity figures cover the calendar year 1997. A card or loan counts as held if it was issued or approved on or before 31 December 1996. The loan standing label is: 'no loan' if the account had no loans approved by 31 December 1996; otherwise 'defaulted' if any of its loans has repayment status B; otherwise 'repaying' if any has status C or D; otherwise 'paid off'. Money in is the sum of credit transaction amounts; money out is the sum of debit and cash-withdrawal transaction amounts. The account owner is the person with the 'OWNER' disposition on the account; other dispositions are just additional users. Nothing beyond these fields, please."
    expected_sql: "WITH cohort AS (SELECT a.account_id, a.date AS open_date FROM account AS a JOIN district AS d ON d.district_id = a.district_id WHERE d.a2 = 'Tabor' AND a.date <= '1996-12-31'), own AS (SELECT co.account_id, co.open_date, c.gender, c.birth_date FROM cohort AS co JOIN disp AS dp ON dp.account_id = co.account_id AND dp.type = 'OWNER' JOIN client AS c ON c.client_id = dp.client_id), cards96 AS (SELECT dp.account_id, COUNT(cd.card_id) AS n_cards FROM disp AS dp JOIN card AS cd ON cd.disp_id = dp.disp_id WHERE cd.issued <= '1996-12-31' GROUP BY dp.account_id), loans96 AS (SELECT l.account_id, COUNT(*) AS n_loans, SUM(CASE WHEN l.status = 'B' THEN 1 ELSE 0 END) AS n_bad, SUM(CASE WHEN l.status IN ('C', 'D') THEN 1 ELSE 0 END) AS n_run FROM loan AS l WHERE l.date <= '1996-12-31' GROUP BY l.account_id), t1997 AS (SELECT t.account_id, COUNT(*) AS n_trans, SUM(CASE WHEN t.type = 'PRIJEM' THEN t.amount ELSE 0 END) AS money_in, SUM(CASE WHEN t.type <> 'PRIJEM' THEN t.amount ELSE 0 END) AS money_out, MAX(t.balance) AS max_bal FROM trans AS t WHERE t.date BETWEEN '1997-01-01' AND '1997-12-31' GROUP BY t.account_id) SELECT o.account_id, o.open_date AS date_opened, o.gender AS owner_gender, 1996 - CASE WHEN (EXTRACT(YEAR FROM CAST(o.birth_date AS TIMESTAMP))) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((EXTRACT(YEAR FROM CAST(o.birth_date AS TIMESTAMP))) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END AS owner_age_at_end_1996, COALESCE(c.n_cards, 0) AS cards_by_end_1996, COALESCE(l.n_loans, 0) AS loans_by_end_1996, CASE WHEN COALESCE(l.n_loans, 0) = 0 THEN 'no loan' WHEN l.n_bad > 0 THEN 'defaulted' WHEN l.n_run > 0 THEN 'repaying' ELSE 'paid off' END AS loan_standing, COALESCE(t.n_trans, 0) AS trans_1997_count, COALESCE(t.money_in, 0) AS money_in_1997, COALESCE(t.money_out, 0) AS money_out_1997, COALESCE(t.max_bal, 0) AS max_balance_1997, RANK() OVER (ORDER BY COALESCE(t.max_bal, 0) DESC NULLS LAST) AS balance_rank FROM own AS o LEFT JOIN cards96 AS c ON c.account_id = o.account_id LEFT JOIN loans96 AS l ON l.account_id = o.account_id LEFT JOIN t1997 AS t ON t.account_id = o.account_id ORDER BY balance_rank NULLS FIRST, o.account_id NULLS FIRST"
    tags: ["challenging", "financial"]
  - name: "bird-235"
    prompt: "I'd like a district-by-district picture of where our classic-card-holding account owners send money outside the bank. For every district, give me: the district name, the number of clients who own an account and hold a classic credit card, the number of external accounts at other banks those clients paid through outgoing payments, and the total amount of those outgoing payments. A district means the district of the branch where the owned account is held — not the client's home district — and each client and every outgoing payment from the account they own counts toward that account's branch district. Include every district, even ones with no such clients or no such outgoing payments (show zeros). Use the whole recorded payment history. Order by total amount paid from highest to lowest, and alphabetically by district name when totals tie. Don't round the totals."
    expected_sql: "WITH holders AS (SELECT dp.client_id, dp.account_id, a.district_id FROM card AS c JOIN disp AS dp ON dp.disp_id = c.disp_id AND dp.type = 'OWNER' JOIN account AS a ON a.account_id = dp.account_id WHERE c.type = 'classic') SELECT d.a2 AS district, COUNT(DISTINCT h.client_id) AS classic_card_holders, COUNT(DISTINCT t.account) AS external_accounts_paid, COALESCE(SUM(t.amount), 0) AS total_amount_paid FROM district AS d LEFT JOIN holders AS h ON h.district_id = d.district_id LEFT JOIN trans AS t ON t.account_id = h.account_id AND t.type = 'VYDAJ' AND t.account > 0 GROUP BY d.district_id, d.a2 ORDER BY total_amount_paid DESC NULLS LAST, district ASC NULLS FIRST"
    tags: ["challenging", "financial"]
  - name: "bird-236"
    prompt: "I'm planning services for our older female customers. For the clients who are female and were born before 1930, please look at the branches that hold their accounts, and then the districts those branches are located in. What is the average salary of those districts? Round the result to 2 decimal places. Note: born before 1930 means calendar birth dates before 1 January 1930."
    expected_sql: "SELECT ROUND(CAST(AVG(d.a11) AS DECIMAL), 2) AS average_salary FROM district AS d WHERE d.district_id IN (SELECT a.district_id FROM account AS a JOIN disp AS x ON x.account_id = a.account_id JOIN client AS c ON c.client_id = x.client_id WHERE c.gender = 'F' AND c.birth_date < '1930-01-01')"
    tags: ["challenging", "financial"]
  - name: "bird-237"
    prompt: "I'm preparing a campaign for senior female clients and want a sense of the economic profile of their home districts. Could you tell me the average of the average salaries of the districts where our female clients born before 1950 live? Please give me just that single figure, rounded to two decimal places."
    expected_sql: "SELECT ROUND(CAST(AVG(t1.a11) AS DECIMAL), 2) AS average_salary FROM district AS t1 WHERE t1.district_id IN (SELECT t2.district_id FROM client AS t2 WHERE t2.gender = 'F' AND EXTRACT(YEAR FROM CAST(t2.birth_date AS TIMESTAMP)) < '1950')"
    tags: ["challenging", "financial"]
  - name: "bird-238"
    prompt: "I want to know whether our small, healthy loans are concentrated in richer or poorer districts before we decide where to grow the small-loan business. Please give me one number: the average district salary, rounded to two decimals, across the districts where the accounts holding these loans are located. The cohort is loans with an approved amount below 100,000 that are still running without issues."
    expected_sql: "SELECT ROUND(CAST(AVG(d.a11) AS DECIMAL), 2) AS average_district_salary FROM district AS d WHERE d.district_id IN (SELECT a.district_id FROM account AS a WHERE a.account_id IN (SELECT l.account_id FROM loan AS l WHERE l.amount < 100000 AND l.status = 'C'))"
    tags: ["challenging", "financial"]
  - name: "bird-239"
    prompt: "I'm studying how client age relates to branch location. For each of two client cohorts, I want the cohort label and the average salary across the districts where the branches holding that cohort's accounts are located, rounded to the nearest whole number. A client's cohort is based on birth date: born 1980 or later is the young cohort, born 1919 or earlier is the old cohort. Note the district of an account is the district of its branch, not the client's home district. Give me one row per cohort, young cohort first. Nothing else."
    expected_sql: "WITH cohort_districts AS (SELECT a.district_id, CASE WHEN c.birth_date >= '1980-01-01' THEN 'young' ELSE 'old' END AS cohort FROM client AS c JOIN disp AS d ON d.client_id = c.client_id JOIN account AS a ON a.account_id = d.account_id WHERE c.birth_date >= '1980-01-01' OR c.birth_date <= '1919-12-31' GROUP BY a.district_id, CASE WHEN c.birth_date >= '1980-01-01' THEN 'young' ELSE 'old' END) SELECT cohort, CASE WHEN (ROUND(AVG(x.a11))) IS NULL THEN NULL ELSE CAST(COALESCE(SUBSTRING(CAST((ROUND(AVG(x.a11))) AS TEXT) FROM '^[[:space:]]*[+-]?[0-9]+'), '0') AS BIGINT) END AS avg_salary FROM cohort_districts AS cd JOIN district AS x ON x.district_id = cd.district_id GROUP BY cohort ORDER BY CASE cohort WHEN 'young' THEN 1 ELSE 2 END NULLS FIRST"
    tags: ["challenging", "financial"]
