# ---------------------------------------------------------------------------
# Local Airhouse stack for the oxy ↔ Airhouse integration.
#
# Starts a self-contained Airhouse deployment (control plane + data plane +
# haproxy + Postgres + MinIO) using the published image — no Rust build of
# airhouse-internal required.
#
# Usage:
#   docker compose -f docker-compose.airhouse.yml up -d
#
#   export AIRHOUSE_BASE_URL=http://localhost:8080
#   export AIRHOUSE_ADMIN_TOKEN=airhouse-local-token
#   export AIRHOUSE_WIRE_HOST=localhost
#   export AIRHOUSE_WIRE_PORT=5445
#   cargo run -p oxy-server -- serve
#
# Verify connectivity:
#   curl -H 'Authorization: Bearer airhouse-local-token' \
#        http://localhost:8080/admin/v1/tenants
#   psql -h localhost -p 5445 -U alice -d demo   # password: alice
#
# Override the default Airhouse image tag (defaults to `0.1.48`). Use
# `main-latest` to track the newest main build, or pin to a commit:
#   AIRHOUSE_IMAGE_TAG=edge-abcdef0 docker compose -f docker-compose.airhouse.yml up -d
#
# Tear down (drops the local Postgres + MinIO volumes):
#   docker compose -f docker-compose.airhouse.yml down -v
#
# Mirrors airhouse-internal/docker-compose.demo.yml. Postgres binds 5433 and
# MinIO binds 9000/9001/9000-console so they don't clash with oxy's own
# embedded Postgres (5432).
# ---------------------------------------------------------------------------

x-airhouse-image: &airhouse-image
  image: ghcr.io/oxy-hq/airhouse:${AIRHOUSE_IMAGE_TAG:-0.1.48}

services:
  airhouse-postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: airhouse
      POSTGRES_USER: airhouse
      POSTGRES_PASSWORD: airhouse
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "5433:5432"
    volumes:
      - airhouse-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airhouse"]
      interval: 2s
      timeout: 5s
      retries: 10

  airhouse-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - airhouse-miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 10

  airhouse-createbucket:
    image: minio/mc
    depends_on:
      airhouse-minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set myminio http://airhouse-minio:9000 minioadmin minioadmin
        mc mb myminio/airhouse --ignore-existing
        mc mb myminio/oxy-compile-blobs --ignore-existing

  airhouse-createcpdb:
    image: postgres:18
    depends_on:
      airhouse-postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: airhouse
    entrypoint:
      - sh
      - -c
      - |
        psql -h airhouse-postgres -U airhouse -d airhouse -tc \
          "SELECT 1 FROM pg_database WHERE datname='airhouse_cp'" \
          | grep -q 1 \
          || psql -h airhouse-postgres -U airhouse -d airhouse -c "CREATE DATABASE airhouse_cp"

  airhouse-createoxydb:
    image: postgres:18
    depends_on:
      airhouse-postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: airhouse
    entrypoint:
      - sh
      - -c
      - |
        psql -h airhouse-postgres -U airhouse -d airhouse -tc \
          "SELECT 1 FROM pg_database WHERE datname='oxydb'" \
          | grep -q 1 \
          || psql -h airhouse-postgres -U airhouse -d airhouse -c "CREATE DATABASE oxydb"

  airhouse-cp:
    <<: *airhouse-image
    command: ["server", "--role=control"]
    depends_on:
      airhouse-postgres:
        condition: service_healthy
      airhouse-createcpdb:
        condition: service_completed_successfully
      airhouse-createbucket:
        condition: service_completed_successfully
    environment:
      AIRHOUSE_HOST: 0.0.0.0
      AIRHOUSE_HTTP_PORT: "8080"
      AIRHOUSE_LOG_FORMAT: json
      RUST_LOG: airhouse_server=info,airhouse_controlplane=info
      AIRHOUSE_CP_DATABASE_URL: postgres://airhouse:airhouse@airhouse-postgres:5432/airhouse_cp?sslmode=disable
      AIRHOUSE_CP_CATALOG_ADMIN_URL: postgres://airhouse:airhouse@airhouse-postgres:5432/airhouse?sslmode=disable
      AIRHOUSE_CP_ADMIN_TOKEN: airhouse-local-token
      S3_ENDPOINT: http://airhouse-minio:9000
      S3_BUCKET: airhouse
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  airhouse-dp:
    <<: *airhouse-image
    command: ["server", "--role=data"]
    depends_on:
      airhouse-cp:
        condition: service_healthy
    environment:
      AIRHOUSE_HOST: 0.0.0.0
      AIRHOUSE_PORT: "5446"
      AIRHOUSE_HTTP_PORT: "8081"
      AIRHOUSE_LOG_FORMAT: json
      RUST_LOG: airhouse_server=info
      AIRHOUSE_CP_DATABASE_URL: postgres://airhouse:airhouse@airhouse-postgres:5432/airhouse_cp?sslmode=disable
      S3_ENDPOINT: http://airhouse-minio:9000
      S3_BUCKET: airhouse
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      AIRHOUSE_MAX_CONCURRENT_QUERIES: "32"
      AIRHOUSE_PER_USER_MAX_CONCURRENT: "8"
      AIRHOUSE_QUERY_TIMEOUT_SECS: "120"
      AIRHOUSE_MEMORY_PER_SESSION_GB: "2"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  airhouse-haproxy:
    image: haproxy:2.9-alpine
    depends_on:
      airhouse-dp:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        cat > /tmp/haproxy.cfg <<'EOF'
        global
          maxconn 4096
          log stdout local0
        defaults
          log global
          mode tcp
          option tcplog
          timeout connect 5s
          timeout client 1h
          timeout server 1h
          timeout check 2s
        frontend pgwire
          bind *:5445
          default_backend dp
        backend dp
          balance leastconn
          option pgsql-check user healthcheck
          server dp1 airhouse-dp:5446 check inter 2000 fall 2 rise 2
        EOF
        exec haproxy -f /tmp/haproxy.cfg -W
    ports:
      - "5445:5445"
    restart: unless-stopped

  # Optional: pre-creates a `demo` tenant + `alice/alice` user so you can
  # `psql -h localhost -p 5445 -U alice -d demo` and verify wire connectivity
  # without going through oxy's provisioning flow. Oxy creates its own
  # per-workspace tenants on demand via POST /api/airhouse/me/provision.
  airhouse-bootstrap-tenant:
    image: curlimages/curl:8.10.1
    depends_on:
      airhouse-cp:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        AUTH='Authorization: Bearer airhouse-local-token'
        curl -fsS -X POST http://airhouse-cp:8080/admin/v1/tenants \
          -H "$$AUTH" -H 'Content-Type: application/json' \
          -d '{"id":"demo"}' \
          || echo "tenant 'demo' may already exist"
        curl -fsS -X POST http://airhouse-cp:8080/admin/v1/tenants/demo/users \
          -H "$$AUTH" -H 'Content-Type: application/json' \
          -d '{"username":"alice","password":"alice","role":"admin"}' \
          || echo "user 'alice' may already exist"
        echo
        echo "──────────────────────────────────────────────"
        echo "  Local Airhouse is ready."
        echo "  Admin API: http://localhost:8080 (token: airhouse-local-token)"
        echo "  Wire:      psql -h localhost -p 5445 -U alice -d demo  (pw: alice)"
        echo "──────────────────────────────────────────────"

volumes:
  airhouse-pgdata:
  airhouse-miniodata:
