packages:
  - web-app
  - sdk/typescript
  - sdk/vite-plugin
  - sdk/create-oxy-app
  - sdk/cli
  - sdk/setup-oxyc
overrides:
  # tsdown@0.22.4 pins rolldown-plugin-dts ^0.27.1, but 0.27.1 crashes on
  # TypeScript 7's native compiler API (reads useCaseSensitiveFileNames off
  # an undefined host). 0.27.2+ adds TS 7 to its peer range; pin to the fix.
  rolldown-plugin-dts: ^0.27.4
  # monaco-editor drags in dompurify <3.4.11, which has 13 moderate XSS
  # advisories (GHSA-v2wj-7wpq-c8vv et al). Pin the transitive dep past them.
  dompurify: '>=3.4.11'
peerDependencyRules:
  allowedVersions:
    '@typescript-eslint/parser>typescript': '7'
    '@typescript-eslint/eslint-plugin>typescript': '7'
    '@typescript-eslint/utils>typescript': '7'
    '@typescript-eslint/type-utils>typescript': '7'
    '@typescript-eslint/project-service>typescript': '7'
    '@typescript-eslint/tsconfig-utils>typescript': '7'
    '@typescript-eslint/typescript-estree>typescript': '7'
    vite-plugin-node-polyfills>vite: '8'
allowBuilds:
  '@sentry/cli': false
  '@swc/core': false
  '@tailwindcss/oxide': false
  esbuild: false
