retries = 2

# `oxy-server`'s `served_router_tests` build `api_router(..)` from the real
# surface seams (whether cloud mode serves `/orgs` is only visible there), so
# they are the same unscoped `cleanup_stale_runs` writer as `local_mode_router`
# above. Unit tests in `oxy-server`'s library (its binary's until decompose LT), which
# `shared_db_registry.rs` (integration groups only) does not scan: this entry is
# the only thing that serializes them.
[[profile.default.overrides]]
filter = "package(=oxy-server) & kind(lib) & test(/^served_router_tests::/)"
test-group = "serial-db"
retries = 2

# `oxy-server`'s `commands::serve_background::tests` run `serve`'s boot for real:
# the same router build as `served_router_tests` (the unscoped
# `cleanup_stale_runs`), plus the startup recovery pass and the latency worker
# over every workspace. The chat-listener test moved here from
# `served_router_tests` in decompose BL-W, when `api_router` stopped starting
# the boot jobs; pinned for the reason that module is.
[[profile.default.overrides]]
filter = "package(=oxy-server) & kind(lib) & test(/^commands::serve_background::tests::/)"
test-group = "serial-db"
retries = 2

# The router's own unit tests (`oxy-app`'s until the router went up into
# `oxy-server`, decompose LIFT, 2026-11-23) hold the same caller: three of
# `router::router_split_tests` build `api_router(..)` (the two local-mode
# checks and the external router's fallback), so each runs the unscoped
# `cleanup_stale_runs` against the shared `OXY_DATABASE_URL`. They were left
# ungrouped when their `/orgs` siblings moved to `oxy-server`, free to rewrite
# `agentic_runs` under the `agentic-runtime`/`agentic-pipeline` tests that own
# those rows.
#
# The module, not the three names. `shared_db_registry.rs` scans integration
# groups only, so nothing would notice a fourth `api_router(..)` test added
# here; pinning the module keeps the rule true when that happens, at the cost of
# serializing its two in-process tests, which run in milliseconds.
#
# Written without a parenthesised alternation on purpose: `shared_db_registry.rs`
# reads the first `package(=oxy-server)` override carrying one as the list of
# integration MODULES to check, and this is not that list.
[[profile.default.overrides]]
filter = "package(=oxy-server) & kind(lib) & test(/^router::router_split_tests::/)"
test-group = "serial-db"
retries = 2

# The other side of the writers above: the one in-source test that owns
# `agentic_runs` rows on the shared `OXY_DATABASE_URL` (`oxy-app`'s until the
# drivers moved up into `oxy-server`, decompose BL1, 2026-11-23; a unit test of
# its library now, since decompose LT, which `shared_db_registry.rs` does not scan either). It queues a Global
# procedure run in its own workspace and drives it with a stub executor, so
# anything else that drives or rewrites that row makes it fail at its deadline
# with "the run was never executed". Every test that builds `api_router(..)`
# with the in-process workers on is such a thing: at boot it runs the unscoped
# `cleanup_stale_runs` and a startup recovery pass over every workspace (cloud
# mode), then a latency worker that drives any workspace's pending Global run
# with a registry that has no stub. PR #4311's first CI run lost the run this
# way while `router_split_tests::local_router_mounts_workspace_routes_under_nil_uuid`
# booted 26 ms into it. Pinned by exact name, with no `retries`, because a
# retry would hide the next unscoped writer instead of naming it.
[[profile.default.overrides]]
filter = "package(=oxy-server) & kind(lib) & test(=drivers::recovery::procedure_run_tests::a_single_process_executes_the_run_it_queued)"
test-group = "serial-db"

# The same exposure from two other crates: lib tests that queue a Global run in
# a workspace of their own on the shared `OXY_DATABASE_URL`, each seeded with no
# `path`. The latency worker `commands::serve_background::tests` starts (cloud
# mode, above) retires exactly that run: `classify_workspace` in
# `crates/server/src/drivers/recovery.rs` takes a path-less workspace as
# unrunnable, and `retire_orphaned_runs` cancels its queue row and fails the
# run. A requeued check then reads `failed`/`cancelled` instead of
# `running`/`queued`, and a settle poll closes a row its claim still holds.
#
# Serialized here rather than fixed in the seed. A `path` closes the retire arm
# and opens the drive arm: `tick_cloud` goes on to `worker_project_ctx`, and
# `build_cloud_project_ctx_result` (`oxy-workspace-runtime`'s `driver_ctx.rs`)
# then either assembles a context from the working copy, on a node that can
# compile, so `drive_pending` claims the run with the real executor, or enqueues
# a lazy compile for the workspace. Either is the same race by another door. A
# database per test would remove it too, at a full migration chain per test;
# this pins 17 tests, 13 of them on the database. No `retries`, for the reason
# the pin above gives.
#
# Modules, not names, so a sibling that seeds the same way is covered:
# `analyze::transform_tests::a_check_queues_each_auto_build_once` does, through
# the same `seed_workspace`, and the audit that found the others missed it.
# One `test()` per module, with no parenthesised alternation: `oxy-api-previews`
# shares the integration harness, so `shared_db_registry.rs` reads the first
# `package(=oxy-api-previews)` block carrying one as its list of integration
# MODULES, and this is not that list.
[[profile.default.overrides]]
filter = "package(=oxy-api-previews) & kind(lib) & (test(/^analyze::tests::/) | test(/^analyze::requeue_tests::/) | test(/^analyze::transform_tests::/))"
test-group = "serial-db"

[[profile.default.overrides]]
filter = "package(=oxy-custom-apps) & kind(lib) & test(/^automation_run::settle::tests::/)"
test-group = "serial-db"
