[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-metric-monitoring) & binary(=integration)"
test-group = "db-per-test"
retries = 2

# `oxy-api-automations`' integration group: the tenant schedules test, rehomed
# from `oxy-api-custom-apps` with the schedule handlers (2026-11-15) — oxy-app's
# harness (`common::fresh_db`, its own database per test), same group.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-automations) & binary(=integration)"
test-group = "db-per-test"
retries = 2

# `oxy-api-airway`'s integration group: the lease routes' tests (2026-11-21, when
# `oxy airway leases | release-lease` became routes) take the shared harness
# (`common::test_db_with`, their own database per test); the admin-mount and
# route-role modules beside them open no database at all.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-airway) & binary(=integration)"
test-group = "db-per-test"
retries = 2

# `oxy-api-threads`' integration group: `chat_org_standing`, which moved out of
# oxy-app's `platform` binary with the chat handlers (2026-11-16) — oxy-app's
# harness (`common::fresh_db`, its own database per test), same group.
# `thread_role_guards` (from the `authz` binary) opens no database and stays
# ungrouped and fully parallel, as it was there.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-threads) & binary(=integration) & !test(/^(thread_role_guards)::/)"
test-group = "db-per-test"
retries = 2

# `oxy-api-workspaces`' integration group: `workspace_list`, rehomed from
# `oxy-api-tenancy`'s `org_default_workspace` with `list_workspaces`
# (2026-11-16) — the shared harness (`common::test_db`, its own database per
# test), same group. `meta_canary` and `workspace_details_fields` (from
# oxy-app's `routing` and `platform` binaries) open no database and stay
# ungrouped, as they were there.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-workspaces) & binary(=integration) & test(/^workspace_list::/)"
test-group = "db-per-test"
retries = 2

# `oxy-api-workspace-config`'s integration group: the tenant secrets tests,
# rehomed from `oxy-api-custom-apps` with the secrets handlers (2026-11-15) —
# the shared harness, same group.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-workspace-config) & binary(=integration)"
test-group = "db-per-test"
retries = 2

# `oxy-api-observability`'s integration group: `admin_staff_scope_llm_usage`,
# which moved out of oxy-app's `platform` binary with Admin → Metrics (admin
# split, PR 1) — the shared harness (`common::test_db_with`, its own database per
# test), same group.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-observability) & binary(=integration)"
test-group = "db-per-test"
retries = 2

# `oxy-api-workspace-health`'s integration group moved out of oxy-app's
# `platform` binary with the workspace-health surface (`admin_staff_scope`'s
# health cases, `workspace_health_history`) — same harness, same group.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-workspace-health) & binary(=integration)"
test-group = "db-per-test"
retries = 2

# `oxy-api-world-model`'s integration group: `world_model_cross_pod`, which moved
# out of oxy-app's `platform` binary with the live feed's read half — same harness
# (its own database per test, so the tailer's unfiltered poll sees only its rows),
# same group.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-world-model) & binary(=integration)"
test-group = "db-per-test"
retries = 2

# `oxy-server`'s integration binary: the API-token suite (`token_auth`), which
# drives the served flat tree and owns a database cloned from the per-run
# template (`common::test_db`, the shared harness by path), so it contends for
# the server, not a schema. `route_roles` (the surfaces' route-role tests, moved
# up from five surface crates in decompose TR) opens no database, so it is
# carved out as it was in each surface's override: full parallelism, no retries.
# `route_catalog` (`oxy-route-catalog`'s tests that build the real router, up
# from that crate's unit tests in decompose RT) opens no database either, so it
# is carved out the same way, as it ran there. So is `routing` (`oxy-app`'s
# routing tests that build the real router, up with it in decompose LIFT),
# which ran ungrouped in `oxy-app`'s `routing` binary. `local_mode_router` and
# `admin_guard_pins` are excluded for the opposite reason: they reach the SHARED
# database (below).
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-server) & binary(=integration) & !test(/^route_roles::/) & !test(/^route_catalog::/) & !test(/^routing::/) & !test(/^local_mode_router::/) & !test(/^admin_guard_pins::/)"
test-group = "db-per-test"
retries = 2

# `local_mode_router`, `oxy-app`'s `platform` binary's until the router went
# up into `oxy-server` (decompose LIFT, 2026-11-23): it calls `api_router(..)`,
# which builds `new_agentic_state`, which calls `establish_connection()` on the
# ambient `OXY_DATABASE_URL` and then `cleanup_stale_runs(&db)` — an UNSCOPED
# write that flips every `waiting_on_child*` row in `agentic_runs` to
# `failed`. It belongs with the shared-schema tests (see the `serial-db` note
# below), not in `db-per-test`: test groups are independent semaphores, so
# `db-per-test` would bound it against the others and not at all against the
# `agentic-runtime`/`agentic-pipeline` tests that own those rows.
# `admin_guard_pins` (the staff handlers with no extractor, pinned behind their
# section's guard) builds the same router, so it sits here for the same reason.
# `oxy-guards`' `shared_db_registry.rs` reads this alternation as oxy-server's
# list of shared-database modules (the first `package(=oxy-server)` override
# with one), so keep it the only one.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-server) & binary(=integration) & test(/^(local_mode_router|admin_guard_pins)::/)"
test-group = "serial-db"
retries = 2

# The drivers' two database tests, `oxy-app`'s `platform` binary's
# `periodic_claim` and `run_retention` until the drivers moved up into
# `oxy-server` (decompose BL1, 2026-11-23): unit tests of its library now (a bin
# until decompose LT gave it one: `kind(lib)`, not `kind(bin)`), each
# owning a fresh database (`oxy_test_utils::containers::fresh_db_url`), so they
# keep the group and retries they had under `platform`.
[[profile.default.overrides]]
filter = "package(=oxy-server) & kind(lib) & test(/^drivers::(periodic::claim|run_retention)::db_tests::/)"
test-group = "db-per-test"
retries = 2

# The frontline tests that moved out of oxy-app's `platform` binary with the
# `oxy-api-frontline` extraction. They `#[path]`-include the same
# `crates/test-utils/harness/mod.rs` harness (own database per test, cloned from the per-run
# template), so they keep the group they had. `frontline_device_guards` opens
# no database (the role guards, in-process), so it is carved out the way the
# `platform` override above carves out its modules: run at full parallelism,
# no retries.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-frontline) & !test(/^frontline_device_guards::/)"
test-group = "db-per-test"
retries = 2

# The operating-graph and work-item tests that moved out of oxy-app's `platform`
# binary with `oxy-api-operating-graph` (2026-11-14). Same harness, same group.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-operating-graph) & binary(=integration)"
test-group = "db-per-test"
retries = 2

# The tenancy tests that moved out of oxy-app's `platform` binary with the
# `oxy-api-tenancy` move — same harness, same group. The exception is
# `org_invitations` (from oxy-app's `authz` binary, decompose T-small): it calls
# `establish_connection()` on the shared database, so it is pinned into
# `serial-db` below with the other shared-schema tests.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-tenancy) & binary(=integration) & !test(/^(org_invitations)::/)"
test-group = "db-per-test"
retries = 2

# `oxy-api-identity`'s integration group: the user directory's staff-scope
# cases, which moved out of oxy-app's `platform` binary with the handlers
# (admin split, PR 5), use the shared harness by path (`common::test_db_with`,
# own database each), so they contend for the server, not a schema. The
# exception is `admin_membership_audit` (from oxy-app's `authz` binary): it
# calls `establish_connection()` on the shared database, so it is pinned
# into `serial-db` below with the other shared-schema tests.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-identity) & binary(=integration) & !test(/^(admin_membership_audit)::/)"
test-group = "db-per-test"
retries = 2

# `oxy-api-github`'s integration group: the installation-ownership tests drive
# the real GitHub routes against a database cloned from the per-run template
# (`common::test_db`, the shared harness by path), so they contend for the
# server, not a schema.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-github) & binary(=integration)"
test-group = "db-per-test"
retries = 2

# Some integration groups are mixed (oxy-app's `authz` and `platform` binaries
# were the first), and the difference is
# not cosmetic: these modules do NOT use `crates/test-utils/harness/mod.rs`. They reach
# the ambient shared `OXY_DATABASE_URL` with no per-test database, so they read
# and write the same `public` schema as the `serial-db` members above — which run
# `Migrator::up` on it. Running them in parallel is the `CREATE TABLE` /
# `pg_type_typname_nsp_index` race described at the top of this section, and
# serializing `oxy` against itself doesn't help if another package's tests are
# querying those tables mid-DDL.
#
# Two routes in:
#   * two call `oxy::database::client::establish_connection()` directly (now
#     `oxy-workspace-runtime`'s, which were oxy-app's `authz` binary's; and
#     the six that were the `slack` binary's, now `oxy-api-slack`'s,
#     `admin_membership_audit`, now `oxy-api-identity`'s, and
#     `org_invitations`, now `oxy-api-tenancy`'s, below);
#   * `local_mode_router`, `simulation_router` (now
#     `oxy-api-experiment`) and `staging_preview_cookie_retired` (now
#     `oxy-api-custom-apps`) call `api_router(..)`, which
#     reaches it through `new_agentic_state` and then runs `cleanup_stale_runs` —
#     an unscoped UPDATE over `agentic_runs`. That one is a writer, and the rows
#     it rewrites belong to the agentic-runtime/pipeline tests.
#
# They all skip when `OXY_DATABASE_URL` is unset, so a laptop run looks clean and
# only CI (ci.yaml sets it at the `test` jobs) would have shown it —
# and it would have shown up as a flake in agentic-runtime, not here.
#
# `oxy-guards`' `shared_db_registry.rs` fails the build if this list drifts from
# the set of modules that actually reach the shared database. Everything else in
# those binaries — the source-scanning boundary tests,
# `thread_role_guards` — stays ungrouped and fully parallel.
#
# The real fix is porting these onto `common::fresh_db()`; see
# `internal-docs/testing.md`. Until then they belong here.
[[profile.default.overrides]]
# `feature_flag_refresh` and `rollout_gates` (2026-11-27) load the flag cache
# through the process-wide `establish_connection`, as `serve` and `worker` do:
# the failed-load test drives it with a malformed `OXY_DATABASE_URL`, and the
# boot-call source check names it. Their databases are per-test, but the gate
# counts every module that names the shared connector, so they are pinned too.
filter = "kind(test) & package(=oxy-workspace-runtime) & binary(=integration) & test(/^(authz_loader_differential|audit_append_only|feature_flag_refresh|rollout_gates)::/)"
test-group = "serial-db"
retries = 2

# `oxy-api-tenancy`'s `org_invitations`, which was the `authz` binary's: it
# calls `establish_connection()` on the shared database (see the note above).
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-tenancy) & binary(=integration) & test(/^(org_invitations)::/)"
test-group = "serial-db"
retries = 2

