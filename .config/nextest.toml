# Nextest configuration
# See https://nexte.st/docs/configuration/
#
# A single profile governs test execution everywhere: local (`cargo nextest
# run`, `just test`) and CI both run nextest without `--profile`, so this
# `default` profile is always the one in effect. A separate CI-only nextest
# profile previously existed but was never selected, so its settings silently
# never applied — keep things unified here instead.

[profile.default]
# Reduce progress bar noise
status-level = "fail"
final-status-level = "fail"

# Show output only for failing tests
success-output = "never"
failure-output = "immediate"

retries = 0

# IMPORTANT: do NOT set `threads-required` at profile scope.
# `threads-required` is how many slots (out of the `test-threads` pool, which
# defaults to num-cpus) a *single* test reserves. Setting it to "num-cpus" here
# makes every test reserve the entire pool, so nextest runs the whole suite
# serially — one test at a time — both locally and in CI. If a specific test
# truly needs exclusive resources, scope it with a per-test override or a
# `[test-groups]` entry instead of serializing all ~2,900 tests.

# No package is left out of the default run, so local and CI run the same
# tests.
#
# `entity` and `migration` used to be left out, as "auto-generated, no
# meaningful test coverage". But the generated modules hold no tests: every
# test in both crates is hand-written, and filtered out here they ran nowhere,
# CI included. Each crate's tests are one unit-test binary that needs no
# database and runs in about a second.
#
# - `entity`: two of its tests guard the whole tree. `typed_column_guard`
#   checks that every Sea-ORM entity under `crates/` carries
#   `#[sea_orm::model]`, and `schema_guard` that every entity names a table the
#   migrator still creates. `typed_column_guard` sat red on `main` while 21
#   entities landed without the attribute. It walks every crate, so `entity` is
#   also an `always-test` package in .config/test-selection.toml; without that,
#   a PR adding an entity to `crates/oltp` would not select it.
# - `migration`: each test pins DDL that deployed databases depend on. They
#   render a migration's statement to a string and assert on it: `settings.id`
#   is `serial`, not an identity column; the agentic tables match their twins
#   in `crates/agentic/runtime`, which create the same tables `IF NOT EXISTS`,
#   so drift there is silent; the preview tables keep the CHECKs and partial
#   indexes their callers rely on. They read nothing outside their own crate,
#   so the dependency graph selects `migration` for any change to it, and it
#   needs no `always-test` entry.

# Per-test results and timings, which CI turns into each partition's job
# summary: failures, then the slowest tests (scripts/ci/nextest-summary.py).
# Lands in target/nextest/default/.
[profile.default.junit]
path = "junit.xml"

# ── Shared-resource serialization ────────────────────────────────────────────
# The whole suite was once serialized (via `threads-required = num-cpus`), which
# silently masked tests that share a *global* resource. With the suite running in
# parallel, those tests must be serialized explicitly instead.
#
# Scope these groups as tightly as the evidence supports. A group is a
# throughput ceiling, so every test swept into one that doesn't need it is pure
# wall-clock loss — the previous version of this file matched `kind(test)` across
# whole *packages*, which put all ~31 `oxy-app` integration binaries under
# `max-threads = 1` even though only a third of them ever opened a database.
#
# `serial-db` — one test at a time, across every matched binary. Everything else
# in the suite continues to run in parallel alongside it.
#
# Why these need it:
#   * `oxy` and the `agentic-*` integration tests migrate a SINGLE
#     shared Postgres (CI sets `OXY_DATABASE_URL` to one service container;
#     locally they reuse one testcontainer) against the same `public` schema, so
#     two concurrent runs race on `CREATE TABLE IF NOT EXISTS
#     seaql_migrations_*` (Postgres surfaces this as a duplicate-key error on
#     `pg_type_typname_nsp_index`). They also share run/queue/workflow rows, so a
#     background coordinator/sweeper in one test observes another test's rows
#     (seen as runs ending "failed" instead of "done", or the coordinator timing
#     out).
#   * The `oxy` sync tests used to drive the CLI against the same on-disk
#     example fixture (`.databases/...`), so one test's `--overwrite` deleted
#     files another asserted on. Since 2026-11-21 they render in memory (`oxyc
#     sync` does the writing) and no longer need the group for that.
#
# `db-per-test` — the `oxy-app` integration binaries that touch Postgres. These
# do NOT share a schema: `tests/common/mod.rs` gives every test its own database,
# cloned from a per-run template, and serializes the only genuinely shared step
# (building/cloning that template) behind a Postgres advisory lock rather than
# behind the whole test group. What's left to contend for is one Postgres
# server, so the cap is about not stampeding it, not about correctness.
#
# If this group ever goes flaky, drop `max-threads` to 1 before investigating —
# that restores the old behavior exactly.
[test-groups]
serial-db = { max-threads = 1 }
db-per-test = { max-threads = 4 }

[[profile.default.overrides]]
filter = "kind(test) & (package(=oxy) | package(=agentic-pipeline) | package(=agentic-runtime) | package(=agentic-connector) | package(=agentic-airway))"
test-group = "serial-db"
# Small retry budget scoped to ONLY the DB-backed serial tests. The suite runs
# with `--no-fail-fast`, so before this a single flaky DB/timing test (a
# migration race on the shared Postgres, a coordinator/sweeper observing another
# test's rows, a testcontainer cold-start) hard-failed the whole `test` job and
# forced a manual re-run of everything. A test that passes on retry is reported
# as flaky rather than failing the job; a genuinely-broken test still fails after
# exhausting its retries. Deliberately NOT set at profile scope — the fast,
# hermetic unit tests must stay `retries = 0` so a real regression can't hide
# behind a retry.
retries = 2

# `oxy-cameras`' integration group: every `smoke_e2e` test migrates a database
# of its own (`containers::fresh_db_url`), and `smoke_real_airhouse` is
# `#[ignore]` and does the same; nothing in the crate reaches the shared
# `OXY_DATABASE_URL`. It sat in `serial-db` with the packages above all the
# same, and by 2026-11-16 its 129 tests (~1.7s each, the migration chain) were
# the longest stretch of that one-at-a-time chain and the tail of every
# partition: the last ~25s of each ran nothing else
# (scripts/ci/nextest_timeline.py over that day's JUnit reports).
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-cameras)"
test-group = "db-per-test"
retries = 2

# `oxy-app`'s integration tests are grouped into one binary per domain
# (`tests/<domain>/main.rs`). The tests matched here reach Postgres through
# `tests/common/mod.rs`, so each owns its database and they contend for the
# server rather than for a schema.
#
# The grouping is per binary, coarser than the evidence strictly supports —
# `platform` carries source-scanning tests that never open a
# connection. That is a few tests' worth of parallelism, and it buys a rule that
# stays true when someone adds a harness-backed test to one of those files.
#
# `routing` is the sixth oxy-app binary and appears in NO group here, which is
# deliberate rather than an omission: route classification, router shape and the
# workspace-fs probe are all in-process, so the binary opens no database at all.
# `tests/authz/shared_db_registry.rs` scans it along with the rest and fails the
# build the day that stops being true.
#
# The exclusion is NOT in that category: `local_mode_router` calls
# `api_router(..)`, which builds `new_agentic_state`,
# which calls `establish_connection()` on the ambient `OXY_DATABASE_URL` and then
# `cleanup_stale_runs(&db)` — an UNSCOPED write that flips every
# `waiting_on_child*` row in `agentic_runs` to `failed`. It belongs with the
# shared-schema tests below, not here. Test groups are independent semaphores, so
# leaving it in `db-per-test` bounds it against the others and not at all
# against the `agentic-runtime`/`agentic-pipeline` tests that own those rows.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-app) & (binary(=airhouse) | binary(=platform)) & !test(/^(local_mode_router)::/)"
test-group = "db-per-test"
retries = 2

# `oxy-api-custom-apps`' integration group (the custom-app tests, which were oxy-app's
# `custom_apps` binary). The coarse rule is kept: the whole binary is `db-per-test`
# but the modules that do not use a per-test database, excluded here. `route_roles`
# keeps full parallelism; `public_routes`, `custom_app_functions_fixture` and
# `staging_preview_cookie_retired` are serialized below.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-custom-apps) & binary(=integration) & !test(/^(route_roles|public_routes|custom_app_functions_fixture|staging_preview_cookie_retired)::/)"
test-group = "db-per-test"
retries = 2

# `oxy-api-documents`' integration group moved out of oxy-app's `platform`
# binary with the code it tests, and includes the same `tests/common/mod.rs`
# harness by `#[path]` — every DB-backed module owns a database cloned from the
# per-run template, exactly as it did under `platform`. None reach the shared
# `OXY_DATABASE_URL`, so this is `db-per-test`, never `serial-db`.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-documents)"
test-group = "db-per-test"
retries = 2

# `oxy-api-experiment`'s integration group moved out of oxy-app's `platform`
# binary with the experiments context — same harness, same group. `route_roles`
# opens no database and is carved out like frontline's; `simulation_router`
# builds `api_router(..)` (the unscoped `cleanup_stale_runs` writer, see the
# `local_mode_router` note below) and keeps the `serial-db` seat it had under
# `platform`, in its own override further down.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-experiment) & binary(=integration) & !test(/^(route_roles|simulation_router)::/)"
test-group = "db-per-test"
retries = 2

# `oxy-api-notifications`' integration group moved out of oxy-app's `platform`
# binary with the notifications surface — same harness (`tests/common/mod.rs` by
# `#[path]`, own database per test), same group. `slack_notify_dm`, which was
# the `slack` binary's, reaches the shared `OXY_DATABASE_URL` directly and keeps
# its `serial-db` seat in its own override further down.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-notifications) & binary(=integration) & !test(/^(slack_notify_dm)::/)"
test-group = "db-per-test"
retries = 2

# `oxy-api-previews`' integration group moved out of oxy-app's `platform`
# binary with the previews surface (2026-11-14) — same harness, same group, as
# the preview modules were under `platform`.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-previews) & binary(=integration)"
test-group = "db-per-test"
retries = 2

# `oxy-api-admin`'s integration group: the task queue's staff-scope cases,
# which moved out of oxy-app's `platform` binary with the internal-jobs
# console (admin split, PR 7) — same harness (`common::test_db_with`, its own
# database per test), same group. No module reaches the shared database, so
# there is no `serial-db` pin.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-admin) & binary(=integration)"
test-group = "db-per-test"
retries = 2

# `oxy-api-billing`'s integration group: the weekly usage report's database
# cases, which moved out of oxy-app's `platform` binary with the report's
# surface (admin split, PR 8b) — same harness (`common::fresh_db`, its own
# database per test), same group as they had there. No module reaches the
# shared database, so there is no `serial-db` pin.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-billing) & binary(=integration)"
test-group = "db-per-test"
retries = 2

# `oxy-api-metric-monitoring`'s integration group: `anomaly_bulk_status`, which
# moved out of oxy-app's `platform` binary with the anomaly inbox (2026-11-15) —
# same harness (`common::fresh_db`, its own database per test), same group.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-metric-monitoring) & binary(=integration)"
test-group = "db-per-test"
retries = 2

# `oxy-api-automations`' integration group: the tenant schedules test, rehomed
# from `oxy-api-custom-apps` with the schedule handlers (2026-11-15) — oxy-app's
# harness (`common::fresh_db`, its own database per test), same group.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-automations) & binary(=integration)"
test-group = "db-per-test"
retries = 2

# `oxy-api-airway`'s integration group: the lease routes' tests (2026-11-21, when
# `oxy airway leases | release-lease` became routes) take oxy-app's harness
# (`common::test_db_with`, their own database per test); the admin-mount and
# route-role modules beside them open no database at all.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-airway) & binary(=integration)"
test-group = "db-per-test"
retries = 2

# `oxy-api-threads`' integration group: `chat_org_standing`, which moved out of
# oxy-app's `platform` binary with the chat handlers (2026-11-16) — oxy-app's
# harness (`common::fresh_db`, its own database per test), same group.
# `thread_role_guards` (from the `authz` binary) opens no database and stays
# ungrouped and fully parallel, as it was there.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-threads) & binary(=integration) & !test(/^(thread_role_guards)::/)"
test-group = "db-per-test"
retries = 2

# `oxy-api-workspaces`' integration group: `workspace_list`, rehomed from
# `oxy-api-tenancy`'s `org_default_workspace` with `list_workspaces`
# (2026-11-16) — oxy-app's harness (`common::test_db`, its own database per
# test), same group. `meta_canary` and `workspace_details_fields` (from
# oxy-app's `routing` and `platform` binaries) open no database and stay
# ungrouped, as they were there.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-workspaces) & binary(=integration) & test(/^workspace_list::/)"
test-group = "db-per-test"
retries = 2

# `oxy-api-workspace-config`'s integration group: the tenant secrets tests,
# rehomed from `oxy-api-custom-apps` with the secrets handlers (2026-11-15) —
# oxy-app's harness, same group.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-workspace-config) & binary(=integration)"
test-group = "db-per-test"
retries = 2

# `oxy-api-observability`'s integration group: `admin_staff_scope_llm_usage`,
# which moved out of oxy-app's `platform` binary with Admin → Metrics (admin
# split, PR 1) — oxy-app's harness (`common::test_db_with`, its own database per
# test), same group.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-observability) & binary(=integration)"
test-group = "db-per-test"
retries = 2

# `oxy-api-workspace-health`'s integration group moved out of oxy-app's
# `platform` binary with the workspace-health surface (`admin_staff_scope`'s
# health cases, `workspace_health_history`) — same harness, same group.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-workspace-health) & binary(=integration)"
test-group = "db-per-test"
retries = 2

# `oxy-api-world-model`'s integration group: `world_model_cross_pod`, which moved
# out of oxy-app's `platform` binary with the live feed's read half — same harness
# (its own database per test, so the tailer's unfiltered poll sees only its rows),
# same group.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-world-model) & binary(=integration)"
test-group = "db-per-test"
retries = 2

# `oxy-server`'s integration binary: the API-token suite (`token_auth`), which
# drives the served flat tree and owns a database cloned from the per-run
# template (`common::test_db`, `oxy-app`'s harness by path), so it contends for
# the server, not a schema.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-server) & binary(=integration)"
test-group = "db-per-test"
retries = 2

# The frontline tests that moved out of oxy-app's `platform` binary with the
# `oxy-api-frontline` extraction. They `#[path]`-include the same
# `tests/common/mod.rs` harness (own database per test, cloned from the per-run
# template), so they keep the group they had. `route_roles` and
# `frontline_device_guards` open no database (route classification and the
# role guards, in-process), so they are carved out the way the `platform`
# override above carves out its modules: run at full parallelism, no retries.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-frontline) & !test(/^(route_roles|frontline_device_guards)::/)"
test-group = "db-per-test"
retries = 2

# The operating-graph and work-item tests that moved out of oxy-app's `platform`
# binary with `oxy-api-operating-graph` (2026-11-14). Same harness, same group;
# `route_roles` opens no database and is carved out like frontline's.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-operating-graph) & binary(=integration) & !test(/^route_roles::/)"
test-group = "db-per-test"
retries = 2

# The tenancy tests that moved out of oxy-app's `platform` binary with the
# `oxy-api-tenancy` move — same harness, same group. The two `*_route_roles`
# modules open no database and are carved out like frontline's `route_roles`.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-tenancy) & binary(=integration) & !test(/^(onboarding_route_roles|admin_route_roles)::/)"
test-group = "db-per-test"
retries = 2

# `oxy-api-identity`'s integration group: the user directory's staff-scope
# cases, which moved out of oxy-app's `platform` binary with the handlers
# (admin split, PR 5), use oxy-app's harness by path (`common::test_db_with`,
# own database each), so they contend for the server, not a schema. The
# exception is `admin_membership_audit` (from oxy-app's `authz` binary): it
# calls `establish_connection()` on the shared database, so it is pinned
# into `serial-db` below with the other shared-schema tests.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-identity) & binary(=integration) & !test(/^(admin_membership_audit)::/)"
test-group = "db-per-test"
retries = 2

# `oxy-api-github`'s integration group: the installation-ownership tests drive
# the real GitHub routes against a database cloned from the per-run template
# (`common::test_db`, `oxy-app`'s harness by path), so they contend for the
# server, not a schema.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-github) & binary(=integration)"
test-group = "db-per-test"
retries = 2

# The `authz` and `platform` binaries are mixed, and the difference is
# not cosmetic: these modules do NOT use `tests/common/mod.rs`. They reach
# the ambient shared `OXY_DATABASE_URL` with no per-test database, so they read
# and write the same `public` schema as the `serial-db` members above — which run
# `Migrator::up` on it. Running them in parallel is the `CREATE TABLE` /
# `pg_type_typname_nsp_index` race described at the top of this section, and
# serializing `oxy` against itself doesn't help if oxy-app's tests are
# querying those tables mid-DDL.
#
# Two routes in:
#   * three call `oxy::database::client::establish_connection()` directly (and
#     the six that were the `slack` binary's, now `oxy-api-slack`'s, and
#     `admin_membership_audit`, now `oxy-api-identity`'s, below);
#   * `local_mode_router`, `simulation_router` (now
#     `oxy-api-experiment`) and `staging_preview_cookie_retired` (now
#     `oxy-api-custom-apps`) call `api_router(..)`, which
#     reaches it through `new_agentic_state` and then runs `cleanup_stale_runs` —
#     an unscoped UPDATE over `agentic_runs`. That one is a writer, and the rows
#     it rewrites belong to the agentic-runtime/pipeline tests.
#
# They all skip when `OXY_DATABASE_URL` is unset, so a laptop run looks clean and
# only CI (ci.yaml sets it at the `test` jobs) would have shown it —
# and it would have shown up as a flake in agentic-runtime, not here.
#
# `tests/authz/shared_db_registry.rs` fails the build if this list drifts from
# the set of modules that actually reach the shared database. Everything else in
# those binaries — the source-scanning boundary tests,
# `thread_role_guards` — stays ungrouped and fully parallel.
#
# The real fix is porting these onto `common::fresh_db()`; see
# `internal-docs/testing.md`. Until then they belong here.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-app) & (binary(=authz) | binary(=platform)) & test(/^(authz_loader_differential|org_invitations|audit_append_only|local_mode_router)::/)"
test-group = "serial-db"
retries = 2

# `oxy-api-slack`'s six shared-database modules, which were oxy-app's `slack`
# binary's: they call `establish_connection()` on the shared database (see the
# note above). `slack_app_home` and `slack_webhook_events` are in-process and
# stay parallel.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-slack) & binary(=integration) & test(/^(slack_resolution|slack_oauth_state|slack_oauth_install|slack_uninstall|slack_user_links|slack_cross_org_collision)::/)"
test-group = "serial-db"
retries = 2

# `oxy-api-identity`'s `admin_membership_audit`, which was the `authz`
# binary's: it calls `establish_connection()` on the shared database (see
# the note above).
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-identity) & binary(=integration) & test(/^(admin_membership_audit)::/)"
test-group = "serial-db"
retries = 2

# `oxy-api-experiment`'s `simulation_router`, which was `platform`'s: it builds
# `api_router(..)` and so is the same unscoped `cleanup_stale_runs` writer as
# `local_mode_router` above.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-experiment) & binary(=integration) & test(/^(simulation_router)::/)"
test-group = "serial-db"
retries = 2

# `oxy-api-notifications`' `slack_notify_dm`, which was the `slack` binary's:
# it calls `establish_connection()` on the shared database (see the note above).
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-notifications) & binary(=integration) & test(/^(slack_notify_dm)::/)"
test-group = "serial-db"
retries = 2

# The modules of `oxy-api-custom-apps`' integration binary that
# `shared_db_registry` reads as reaching the shared database: the one that builds
# `api_router(..)` (see the `local_mode_router` note above), and `public_routes` and
# `custom_app_functions_fixture`, which only name `flat_api_router()` (the scan
# matches `api_router(` as a substring). Pinned rather than weakening the scan.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-custom-apps) & binary(=integration) & test(/^(public_routes|custom_app_functions_fixture|staging_preview_cookie_retired)::/)"
test-group = "serial-db"
retries = 2

# `oxy-server`'s `served_router_tests` build `api_router(..)` from the real
# surface seams (whether cloud mode serves `/orgs` is only visible there), so
# they are the same unscoped `cleanup_stale_runs` writer as `local_mode_router`
# above. Unit tests in a binary, which
# `shared_db_registry.rs` (integration groups only) does not scan: this entry is
# the only thing that serializes them.
[[profile.default.overrides]]
filter = "package(=oxy-server) & kind(bin) & test(/^served_router_tests::/)"
test-group = "serial-db"
retries = 2

# `oxy-server`'s `commands::serve_background::tests` run `serve`'s boot for real:
# the same router build as `served_router_tests` (the unscoped
# `cleanup_stale_runs`), plus the startup recovery pass and the latency worker
# over every workspace. The chat-listener test moved here from
# `served_router_tests` in decompose BL-W, when `api_router` stopped starting
# the boot jobs; pinned for the reason that module is.
[[profile.default.overrides]]
filter = "package(=oxy-server) & kind(bin) & test(/^commands::serve_background::tests::/)"
test-group = "serial-db"
retries = 2

# `oxy-app`'s own unit tests hold the same caller: three of
# `server::router::router_split_tests` build `api_router(..)` (the two local-mode
# checks and the external router's fallback), so each runs the unscoped
# `cleanup_stale_runs` against the shared `OXY_DATABASE_URL`. They were left
# ungrouped when their `/orgs` siblings moved to `oxy-server`, free to rewrite
# `agentic_runs` under the `agentic-runtime`/`agentic-pipeline` tests that own
# those rows.
#
# The module, not the three names. `shared_db_registry.rs` scans integration
# groups only, so nothing would notice a fourth `api_router(..)` test added
# here; pinning the module keeps the rule true when that happens, at the cost of
# serializing its two in-process tests, which run in milliseconds.
#
# Written without a parenthesised alternation on purpose: `shared_db_registry.rs`
# reads the first `package(=oxy-app)` override carrying one as the list of
# integration MODULES to check, and this is not that list.
[[profile.default.overrides]]
filter = "package(=oxy-app) & kind(lib) & test(/^server::router::router_split_tests::/)"
test-group = "serial-db"
retries = 2

# The other side of the writers above: `oxy-app`'s one lib test that owns
# `agentic_runs` rows on the shared `OXY_DATABASE_URL`. It queues a Global
# procedure run in its own workspace and drives it with a stub executor, so
# anything else that drives or rewrites that row makes it fail at its deadline
# with "the run was never executed". Every test that builds `api_router(..)`
# with the in-process workers on is such a thing: at boot it runs the unscoped
# `cleanup_stale_runs` and a startup recovery pass over every workspace (cloud
# mode), then a latency worker that drives any workspace's pending Global run
# with a registry that has no stub. PR #4311's first CI run lost the run this
# way while `router_split_tests::local_router_mounts_workspace_routes_under_nil_uuid`
# booted 26 ms into it. Pinned by exact name, with no `retries`, because a
# retry would hide the next unscoped writer instead of naming it.
[[profile.default.overrides]]
filter = "package(=oxy-app) & kind(lib) & test(=server::router::recovery::procedure_run_tests::a_single_process_executes_the_run_it_queued)"
test-group = "serial-db"
