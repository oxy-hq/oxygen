# there is no `serial-db` pin.
[[profile.default.overrides]]
filter = "kind(test) & package(=oxy-api-admin) & binary(=integration)"
test-group = "db-per-test"
retries = 2

# `oxy-api-billing`'s integration group: the weekly usage report's database
