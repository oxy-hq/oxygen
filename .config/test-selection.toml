# Which packages a PR's Rust tests must cover. Read by scripts/ci/test-selection
# (the `test` task in .github/workflows/ci.yaml); `main` and dispatches always run
# the whole workspace.
#
# The dependency graph does most of the work: a changed file marks the package
# that owns it, a changed lockfile entry or feature set marks the packages that
# build it, and everything that depends on a marked package is tested too. A
# changed path that no package owns and no rule below claims marks EVERYTHING,
# so forgetting a rule costs a full run, never a skipped test.
#
# What the graph cannot see goes here. When a test starts reading a file outside
# its own crate (`include_str!("../../other/…")`, `#[path = "../../app/…"]`, a
# walk from CARGO_MANIFEST_DIR's parent), add the rule in the same PR. A test
# that is missed here still runs on `main`, so the failure lands one merge late
# rather than never.

# Tests that walk sources across the whole tree — authz and data-placement guards,
# audit call-site and one-door scans — so no dependency edge says when they are
# affected. Tested whenever anything is.
always-test = [
  "entity",                  # typed_column_guard walks crates/; schema_guard reads crates/migration
  "oxy-app",                 # data_placement walks every migrator
  "oxy-guards",              # authz_boundaries, no_dropped_partner_tables, shared_db_registry, …: it depends on nothing it scans
  "oxy-app-core",            # audit::call_sites_guard walks crates/
  "oxy-custom-apps",         # usage_reads walks crates/
  "oxy-migration-tolerance", # walks crates/ for migrators
  "oxy-airlayer-compat",     # one_door_guard + the "airlayer in one crate" manifest walk
]

# ── Files one crate reads from another crate's directory ─────────────────────
# `post-rule = "skip-rules"`: mark the reader, then still mark the package that
# owns the file.

# oxy-guards' scans read main.rs and lib.rs, the composition root (env_reads,
# app_scope_boundary; the first matching rule wins, so this one also carries the
# next rule's readers).
[[determinator.path-rule]]
globs = ["crates/server/src/main.rs", "crates/server/src/lib.rs"]
mark-changed = ["oxy-app", "oxy-guards", "oxy-api-custom-apps", "oxy-route-catalog"]
post-rule = "skip-rules"

# api-custom-apps and route-catalog tests scan crates/server/src, and
# route-catalog's build script walks its router (`SOURCE_DIRS`/`DOC_DIRS`:
# `crates/server/src/{router,admin}` since decompose LIFT). oxy-guards' scans
# read it too (`app_scope_boundary` reads `admin/mod.rs`; `handler_spawns`,
# `sentry_hub_scan` and the workspace-path scans walk `router/` and `admin/`),
# oxy-workspace-runtime's `rollout_gates` reads `commands/{serve,worker}.rs` and
# `cli/commands/compile.rs` (up from oxy-app in decompose CLI), and its
# `workspace_context_tests` include_str!s
# `router/middlewares/local_context.rs`.
[[determinator.path-rule]]
globs = ["crates/server/src/**"]
mark-changed = ["oxy-api-custom-apps", "oxy-route-catalog", "oxy-app", "oxy-guards", "oxy-workspace-runtime"]
post-rule = "skip-rules"

# oxy-route-catalog's build script reads every api-* crate's routes (it depends
# normally only on oxy-app-core, so nothing else marks it).
[[determinator.path-rule]]
globs = ["crates/api-*/src/**"]
mark-changed = ["oxy-route-catalog"]
post-rule = "skip-rules"

# ...and oxy-app's sources (`DOC_DIRS`), which it reads with no dependency at
# all: none since decompose RC, and no dev-dependency since decompose RT (its
# router-building tests went up to oxy-server). The router itself, the
# `SOURCE_DIRS` entry this rule was for, is `crates/server/src/router` since
# decompose LIFT (the rule above). oxy-workspace-runtime stays marked for
# `airhouse_duckdb`'s in-source scan, which walks `crates/app/src`; its
# `rollout_gates` read of `cli/commands/compile.rs` left with the CLI (decompose
# CLI) and is covered by the `crates/server/src/**` rule above.
[[determinator.path-rule]]
globs = ["crates/app/src/**"]
mark-changed = ["oxy-route-catalog", "oxy-workspace-runtime"]
post-rule = "skip-rules"

# The shared DB test harness is a plain directory no crate compiles: every
# integration group below `#[path]`-includes it (decompose HAR moved it here
# from oxy-app's `tests/common`), so the graph sees none of them. Keep this list
# in step with the includers (`grep -rl test-utils/harness crates/*/tests`).
[[determinator.path-rule]]
globs = ["crates/test-utils/harness/**"]
mark-changed = [
  "oxy-app",
  "oxy-server",
  "oxy-api-admin",
  "oxy-api-airway",
  "oxy-api-automations",
  "oxy-api-billing",
  "oxy-api-custom-apps",
  "oxy-api-documents",
  "oxy-api-experiment",
  "oxy-api-frontline",
  "oxy-api-github",
  "oxy-api-identity",
  "oxy-api-metric-monitoring",
  "oxy-api-notifications",
  "oxy-api-observability",
  "oxy-api-operating-graph",
  "oxy-api-previews",
  "oxy-api-tenancy",
  "oxy-api-threads",
  "oxy-api-workspace-config",
  "oxy-api-workspace-health",
  "oxy-api-workspaces",
  "oxy-api-world-model",
  "oxy-workspace-runtime",
]
post-rule = "skip-rules"

# oxy-auth's token store tests include_str! the api_tokens migration; oxy-auth
# does not depend on `migration`.
[[determinator.path-rule]]
globs = ["crates/migration/src/**"]
mark-changed = ["oxy-auth"]
post-rule = "skip-rules"

# ── Files outside any package ────────────────────────────────────────────────

# api-custom-apps include_str!s the create-oxy-app templates and the TS SDK
# contracts it checks for drift.
[[determinator.path-rule]]
globs = ["sdk/**"]
mark-changed = ["oxy-api-custom-apps"]

# web-app is the `oxy-web` package (changelog only), but its built dist/ is
# embedded into oxy-app by include_dir!, so a frontend change reaches every test
# binary that links oxy-app.
[[determinator.path-rule]]
globs = ["web-app/**"]
mark-changed = ["oxy-app"]
post-rule = "skip-rules"

# The demo workspace is compiled into oxy-project through a symlink the graph
# cannot see: crates/project/demo_project (the workspace creator's
# include_dir!). Without this rule a demo edit selected the whole workspace
# (PR #3824); with it, oxy-project and its dependents (oxy-app among them).
[[determinator.path-rule]]
globs = ["demo_project/**"]
mark-changed = ["oxy-project"]

# api-custom-apps checks these two docs against the code. The rest of
# internal-docs/ is prose no test reads (`internal-docs/**` below), and most PRs
# touch it.
[[determinator.path-rule]]
globs = [
  "internal-docs/data-placement.md",
  "internal-docs/customer-apps-functions.md",
]
mark-changed = ["oxy-api-custom-apps"]

# The selector and the CI that runs it: a change here has to prove itself on
# the whole suite. (Listed before `scripts/**` and `.github/**`, which skip.)
[[determinator.path-rule]]
globs = [
  "scripts/ci/test-selection/**",
  ".github/workflows/ci.yaml",
  ".github/actions/**",
]
mark-changed = "all"

# oxy-app's fleet_routes_table reads it.
[[determinator.path-rule]]
globs = ["scripts/fleet-routes.tsv"]
mark-changed = ["oxy-app"]

# Read by no Rust test: other scripts and workflows, agent guidance, docs.
[[determinator.path-rule]]
globs = [
  "scripts/**",
  ".github/**",
  ".claude/**",
  "docs/**",
  "internal-docs/**",
  "*.md",
  "**/CLAUDE.md",
  "**/AGENTS.md",
]
mark-changed = []
