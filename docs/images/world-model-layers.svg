<svg viewBox="0 0 1560 720" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <linearGradient id="physicsFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d3b2e"/>
      <stop offset="1" stop-color="#0a2c23"/>
    </linearGradient>
    <linearGradient id="controlFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26246b"/>
      <stop offset="1" stop-color="#1c1a4e"/>
    </linearGradient>
  </defs>

  <!-- Outer container -->
  <rect x="20" y="20" width="1520" height="680" rx="28" fill="#0b0f1a" stroke="#2b3446" stroke-width="2"/>
  <text x="780" y="78" text-anchor="middle" fill="#e5e7eb" font-size="34" font-weight="700">World Model</text>

  <!-- ===================== Physics layer ===================== -->
  <rect x="64" y="112" width="620" height="560" rx="20" fill="url(#physicsFill)" stroke="#10b981" stroke-width="2"/>
  <text x="374" y="168" text-anchor="middle" fill="#6ee7b7" font-size="27" font-weight="700">Physics layer</text>
  <text x="374" y="200" text-anchor="middle" fill="#a7f3d0" font-size="17">What the business is</text>

  <!-- Semantic model -->
  <rect x="112" y="232" width="524" height="100" rx="12" fill="#0b1220" stroke="#134e3a" stroke-width="1.5"/>
  <text x="374" y="276" text-anchor="middle" fill="#f1f5f9" font-size="21" font-weight="600">Semantic model</text>
  <text x="374" y="306" text-anchor="middle" fill="#7d8ea6" font-size="15">measures and dimensions, compiled to correct SQL</text>

  <!-- Metric tree -->
  <rect x="112" y="356" width="524" height="100" rx="12" fill="#0b1220" stroke="#134e3a" stroke-width="1.5"/>
  <text x="374" y="400" text-anchor="middle" fill="#f1f5f9" font-size="21" font-weight="600">Metric tree</text>
  <text x="374" y="430" text-anchor="middle" fill="#7d8ea6" font-size="15">arithmetic identities + the qualitative driver map</text>

  <!-- Entity graph -->
  <rect x="112" y="480" width="524" height="100" rx="12" fill="#0b1220" stroke="#134e3a" stroke-width="1.5"/>
  <text x="374" y="524" text-anchor="middle" fill="#f1f5f9" font-size="21" font-weight="600">Entity graph</text>
  <text x="374" y="554" text-anchor="middle" fill="#7d8ea6" font-size="15">objects, automatic joins, hierarchy</text>

  
  <!-- ===================== Control layer ===================== -->
  <rect x="876" y="112" width="620" height="560" rx="20" fill="url(#controlFill)" stroke="#6366f1" stroke-width="2"/>
  <text x="1186" y="168" text-anchor="middle" fill="#a5b4fc" font-size="27" font-weight="700">Control layer</text>
  <text x="1186" y="200" text-anchor="middle" fill="#c7d2fe" font-size="17">What the business does</text>

  <!-- Controls box -->
  <rect x="924" y="232" width="524" height="160" rx="12" fill="#0b1220" stroke="#3f3c8f" stroke-width="1.5"/>
  <text x="1186" y="274" text-anchor="middle" fill="#f1f5f9" font-size="21" font-weight="600">Controls (versioned)</text>
  <text x="1186" y="302" text-anchor="middle" fill="#7d8ea6" font-size="15">criteria + action</text>
  <!-- computation chips -->
  <rect x="952" y="322" width="146" height="44" rx="10" fill="#141a2e" stroke="#4f4c9e" stroke-width="1.2"/>
  <text x="1025" y="350" text-anchor="middle" fill="#c7d2fe" font-size="16">anomaly</text>
  <rect x="1113" y="322" width="146" height="44" rx="10" fill="#141a2e" stroke="#4f4c9e" stroke-width="1.2"/>
  <text x="1186" y="350" text-anchor="middle" fill="#c7d2fe" font-size="16">opportunity</text>
  <rect x="1274" y="322" width="146" height="44" rx="10" fill="#141a2e" stroke="#4f4c9e" stroke-width="1.2"/>
  <text x="1347" y="350" text-anchor="middle" fill="#c7d2fe" font-size="16">trigger</text>

  <!-- act → measure arrow -->
  <line x1="1186" y1="392" x2="1186" y2="436" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1204" y="420" fill="#94a3b8" font-size="14">act, then measure</text>

  <!-- Feedback loop panel -->
  <rect x="924" y="444" width="524" height="196" rx="12" fill="#171208" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="1186" y="480" text-anchor="middle" fill="#fbbf24" font-size="18" font-weight="700">Feedback loop</text>

  <rect x="944" y="500" width="152" height="116" rx="10" fill="#0b1220" stroke="#3b3323" stroke-width="1.2"/>
  <text x="1020" y="540" text-anchor="middle" fill="#f1f5f9" font-size="17" font-weight="600">Forecasts</text>
  <text x="1020" y="566" text-anchor="middle" fill="#7d8ea6" font-size="13">expected values,</text>
  <text x="1020" y="586" text-anchor="middle" fill="#7d8ea6" font-size="13">with envelopes</text>

  <line x1="1096" y1="558" x2="1122" y2="558" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <rect x="1124" y="500" width="152" height="116" rx="10" fill="#0b1220" stroke="#3b3323" stroke-width="1.2"/>
  <text x="1200" y="540" text-anchor="middle" fill="#f1f5f9" font-size="17" font-weight="600">Evaluation</text>
  <text x="1200" y="566" text-anchor="middle" fill="#7d8ea6" font-size="13">backtests, pre/post,</text>
  <text x="1200" y="586" text-anchor="middle" fill="#7d8ea6" font-size="13">priced firings</text>

  <line x1="1276" y1="558" x2="1302" y2="558" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <rect x="1304" y="500" width="124" height="116" rx="10" fill="#0b1220" stroke="#3b3323" stroke-width="1.2"/>
  <text x="1366" y="540" text-anchor="middle" fill="#f1f5f9" font-size="17" font-weight="600">Calibration</text>
  <text x="1366" y="566" text-anchor="middle" fill="#7d8ea6" font-size="13">tune drivers</text>
  <text x="1366" y="586" text-anchor="middle" fill="#7d8ea6" font-size="13">to truth</text>

  <!-- ===================== Cross-layer arrows ===================== -->
  <!-- Physics feeds controls -->
  <line x1="684" y1="300" x2="872" y2="300" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="778" y="284" text-anchor="middle" fill="#cbd5e1" font-size="15">criteria read</text>

  <!-- Feedback updates physics -->
  <path d="M 924 560 C 830 560, 760 540, 690 520" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
  <text x="780" y="596" text-anchor="middle" fill="#fbbf24" font-size="15">updates</text>
  <text x="780" y="616" text-anchor="middle" fill="#fbbf24" font-size="15">the physics</text>

</svg>
