<svg viewBox="0 0 1560 640" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <linearGradient id="greenFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d3b2e"/>
      <stop offset="1" stop-color="#0a2c23"/>
    </linearGradient>
    <linearGradient id="indigoFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26246b"/>
      <stop offset="1" stop-color="#1c1a4e"/>
    </linearGradient>
    <linearGradient id="tealFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#083344"/>
      <stop offset="1" stop-color="#06262f"/>
    </linearGradient>
    <linearGradient id="purpleFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e1065"/>
      <stop offset="1" stop-color="#220c4d"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="1520" height="600" rx="28" fill="#0b0f1a" stroke="#2b3446" stroke-width="2"/>
  <text x="780" y="78" text-anchor="middle" fill="#e5e7eb" font-size="34" font-weight="700">Airhouse</text>

  <!-- Who connects -->
  <rect x="64" y="112" width="220" height="480" rx="20" fill="#0f1524" stroke="#475569" stroke-width="2"/>
  <text x="174" y="168" text-anchor="middle" fill="#e2e8f0" font-size="27" font-weight="700">Clients</text>
  <text x="174" y="200" text-anchor="middle" fill="#cbd5e1" font-size="17">Who connects</text>
  <rect x="88" y="224" width="172" height="170" rx="12" fill="#0b1220" stroke="#2b3446" stroke-width="1.5"/>
  <text x="174" y="293.4" text-anchor="middle" fill="#f1f5f9" font-size="18" font-weight="600">SQL clients</text>
  <text x="174" y="318.4" text-anchor="middle" fill="#7d8ea6" font-size="14">psql, drivers, BI</text>
  <text x="174" y="339.4" text-anchor="middle" fill="#7d8ea6" font-size="14">tools, agents, apps</text>
  <rect x="88" y="418" width="172" height="150" rx="12" fill="#0b1220" stroke="#2b3446" stroke-width="1.5"/>
  <text x="174" y="477.4" text-anchor="middle" fill="#f1f5f9" font-size="18" font-weight="600">Your platform</text>
  <text x="174" y="502.4" text-anchor="middle" fill="#7d8ea6" font-size="14">Oxygen, or</text>
  <text x="174" y="523.4" text-anchor="middle" fill="#7d8ea6" font-size="14">your backend</text>

  <!-- Airhouse server -->
  <rect x="384" y="112" width="520" height="480" rx="20" fill="url(#greenFill)" stroke="#10b981" stroke-width="2"/>
  <text x="644" y="168" text-anchor="middle" fill="#6ee7b7" font-size="27" font-weight="700">Airhouse</text>
  <text x="644" y="200" text-anchor="middle" fill="#a7f3d0" font-size="17">Server and access control</text>
  <rect x="408" y="224" width="472" height="196" rx="12" fill="#0b1220" stroke="#134e3a" stroke-width="1.5"/>
  <text x="644" y="262" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="600">Data plane</text>
  <text x="644" y="288" text-anchor="middle" fill="#7d8ea6" font-size="14">checks every statement before it runs</text>
  <rect x="428" y="318" width="124" height="80" rx="10" fill="#141a2e" stroke="#1f6b52" stroke-width="1.2"/>
  <text x="490" y="352" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">Authenticate</text>
  <text x="490" y="376" text-anchor="middle" fill="#a7f3d0" font-size="13">password</text>
  <line x1="552" y1="358" x2="580" y2="358" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="582" y="318" width="124" height="80" rx="10" fill="#141a2e" stroke="#1f6b52" stroke-width="1.2"/>
  <text x="644" y="352" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">Authorize</text>
  <text x="644" y="376" text-anchor="middle" fill="#a7f3d0" font-size="13">role + limits</text>
  <line x1="706" y1="358" x2="734" y2="358" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="736" y="318" width="124" height="80" rx="10" fill="#141a2e" stroke="#1f6b52" stroke-width="1.2"/>
  <text x="798" y="352" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="600">Execute</text>
  <text x="798" y="376" text-anchor="middle" fill="#a7f3d0" font-size="13">on DuckDB</text>
  <rect x="408" y="444" width="472" height="124" rx="12" fill="#0b1220" stroke="#134e3a" stroke-width="1.5"/>
  <text x="644" y="482" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="600">Control plane</text>
  <text x="644" y="508" text-anchor="middle" fill="#7d8ea6" font-size="14">Admin API</text>
  <rect x="428" y="522" width="124" height="36" rx="10" fill="#141a2e" stroke="#1f6b52" stroke-width="1.2"/>
  <text x="490" y="545.04" text-anchor="middle" fill="#a7f3d0" font-size="14">databases</text>
  <rect x="582" y="522" width="124" height="36" rx="10" fill="#141a2e" stroke="#1f6b52" stroke-width="1.2"/>
  <text x="644" y="545.04" text-anchor="middle" fill="#a7f3d0" font-size="14">users &amp; roles</text>
  <rect x="736" y="522" width="124" height="36" rx="10" fill="#141a2e" stroke="#1f6b52" stroke-width="1.2"/>
  <text x="798" y="545.04" text-anchor="middle" fill="#a7f3d0" font-size="14">credentials</text>

  <!-- Storage, isolated per database -->
  <rect x="964" y="112" width="532" height="480" rx="20" fill="url(#indigoFill)" stroke="#6366f1" stroke-width="2"/>
  <text x="1230" y="168" text-anchor="middle" fill="#a5b4fc" font-size="27" font-weight="700">Your storage</text>
  <text x="1230" y="200" text-anchor="middle" fill="#c7d2fe" font-size="17">Open formats, your infrastructure</text>
  <rect x="988" y="224" width="484" height="344" rx="12" fill="#171208" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="1230" y="256" text-anchor="middle" fill="#fbbf24" font-size="18" font-weight="700">Each database is isolated</text>
  <rect x="1012" y="276" width="436" height="96" rx="12" fill="#0b1220" stroke="#3f3c8f" stroke-width="1.5"/>
  <text x="1230" y="318.9" text-anchor="middle" fill="#f1f5f9" font-size="18" font-weight="600">Catalog</text>
  <text x="1230" y="343.9" text-anchor="middle" fill="#7d8ea6" font-size="14">DuckLake metadata and snapshots, in Postgres</text>
  <rect x="1012" y="388" width="436" height="96" rx="12" fill="#0b1220" stroke="#3f3c8f" stroke-width="1.5"/>
  <text x="1230" y="430.9" text-anchor="middle" fill="#f1f5f9" font-size="18" font-weight="600">Table data</text>
  <text x="1230" y="455.9" text-anchor="middle" fill="#7d8ea6" font-size="14">Parquet files in S3-compatible storage</text>
  <text x="1230" y="520" text-anchor="middle" fill="#fcd34d" font-size="15">its own catalog, storage prefix,</text>
  <text x="1230" y="544" text-anchor="middle" fill="#fcd34d" font-size="15">users, and query limits</text>

  <!-- Flows -->
  <line x1="260" y1="300" x2="404" y2="300" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="332" y="286" text-anchor="middle" fill="#cbd5e1" font-size="13">SQL (Postgres)</text>
  <line x1="260" y1="470" x2="404" y2="470" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="332" y="456" text-anchor="middle" fill="#cbd5e1" font-size="13">provision</text>
  <line x1="404" y1="530" x2="264" y2="530" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
  <text x="332" y="552" text-anchor="middle" fill="#fbbf24" font-size="13">short-lived</text>
  <text x="332" y="570" text-anchor="middle" fill="#fbbf24" font-size="13">credentials</text>
  <line x1="880" y1="300" x2="1008" y2="324" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="944" y="290" text-anchor="middle" fill="#cbd5e1" font-size="13">metadata</text>
  <path d="M 880 392 C 940 392, 950 436, 1008 436" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="944" y="452" text-anchor="middle" fill="#cbd5e1" font-size="13">Parquet</text>

</svg>
