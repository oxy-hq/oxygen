<svg viewBox="0 0 1560 720" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <linearGradient id="greenFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d3b2e"/>
      <stop offset="1" stop-color="#0a2c23"/>
    </linearGradient>
    <linearGradient id="indigoFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26246b"/>
      <stop offset="1" stop-color="#1c1a4e"/>
    </linearGradient>
    <linearGradient id="tealFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#083344"/>
      <stop offset="1" stop-color="#06262f"/>
    </linearGradient>
    <linearGradient id="purpleFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e1065"/>
      <stop offset="1" stop-color="#220c4d"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="1520" height="680" rx="28" fill="#0b0f1a" stroke="#2b3446" stroke-width="2"/>
  <text x="780" y="78" text-anchor="middle" fill="#e5e7eb" font-size="34" font-weight="700">Airway</text>

  <!-- Sources -->
  <rect x="64" y="112" width="220" height="480" rx="20" fill="#0f1524" stroke="#475569" stroke-width="2"/>
  <text x="174" y="168" text-anchor="middle" fill="#e2e8f0" font-size="27" font-weight="700">Sources</text>
  <text x="174" y="200" text-anchor="middle" fill="#cbd5e1" font-size="17">Your systems</text>
  <rect x="88" y="224" width="172" height="52" rx="10" fill="#0b1220" stroke="#2b3446" stroke-width="1.5"/>
  <text x="174" y="255" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">POS &amp; commerce</text>
  <rect x="88" y="292" width="172" height="52" rx="10" fill="#0b1220" stroke="#2b3446" stroke-width="1.5"/>
  <text x="174" y="323" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">Accounting &amp; ERP</text>
  <rect x="88" y="360" width="172" height="52" rx="10" fill="#0b1220" stroke="#2b3446" stroke-width="1.5"/>
  <text x="174" y="391" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">Databases</text>
  <rect x="88" y="428" width="172" height="52" rx="10" fill="#0b1220" stroke="#2b3446" stroke-width="1.5"/>
  <text x="174" y="459" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">Files &amp; spreadsheets</text>
  <rect x="88" y="496" width="172" height="52" rx="10" fill="#0b1220" stroke="#2b3446" stroke-width="1.5"/>
  <text x="174" y="527" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">Public data &amp; APIs</text>

  <!-- Pipeline definition -->
  <rect x="340" y="112" width="300" height="480" rx="20" fill="url(#indigoFill)" stroke="#6366f1" stroke-width="2"/>
  <text x="490" y="168" text-anchor="middle" fill="#a5b4fc" font-size="27" font-weight="700">Pipeline</text>
  <text x="490" y="200" text-anchor="middle" fill="#c7d2fe" font-size="17">A file in your workspace</text>
  <rect x="364" y="224" width="252" height="130" rx="12" fill="#0b1220" stroke="#3f3c8f" stroke-width="1.5"/>
  <text x="490" y="273.7" text-anchor="middle" fill="#f1f5f9" font-size="19" font-weight="600">.airway.yml</text>
  <text x="490" y="298.7" text-anchor="middle" fill="#7d8ea6" font-size="14">source, destination,</text>
  <text x="490" y="319.7" text-anchor="middle" fill="#7d8ea6" font-size="14">and what to load</text>
  <rect x="364" y="370" width="252" height="100" rx="12" fill="#0b1220" stroke="#3f3c8f" stroke-width="1.5"/>
  <text x="490" y="404.4" text-anchor="middle" fill="#f1f5f9" font-size="18" font-weight="600">Secrets</text>
  <text x="490" y="429.4" text-anchor="middle" fill="#7d8ea6" font-size="14">referenced by name,</text>
  <text x="490" y="450.4" text-anchor="middle" fill="#7d8ea6" font-size="14">never stored in the file</text>
  <rect x="364" y="486" width="252" height="82" rx="12" fill="#0b1220" stroke="#3f3c8f" stroke-width="1.5"/>
  <text x="490" y="521.9" text-anchor="middle" fill="#f1f5f9" font-size="18" font-weight="600">Triggers</text>
  <text x="490" y="546.9" text-anchor="middle" fill="#7d8ea6" font-size="14">Run now, schedule, automation</text>

  <!-- Run -->
  <rect x="696" y="112" width="460" height="480" rx="20" fill="url(#tealFill)" stroke="#06b6d4" stroke-width="2"/>
  <text x="926" y="168" text-anchor="middle" fill="#67e8f9" font-size="27" font-weight="700">Run</text>
  <text x="926" y="200" text-anchor="middle" fill="#a5f3fc" font-size="17">Extract, then load</text>
  <rect x="720" y="224" width="412" height="84" rx="12" fill="#0b1220" stroke="#155e75" stroke-width="1.5"/>
  <text x="926" y="261.2" text-anchor="middle" fill="#f1f5f9" font-size="19" font-weight="600">Queue</text>
  <text x="926" y="286.2" text-anchor="middle" fill="#7d8ea6" font-size="14">one run at a time per pipeline</text>
  <rect x="720" y="332" width="412" height="84" rx="12" fill="#0b1220" stroke="#155e75" stroke-width="1.5"/>
  <text x="926" y="369.2" text-anchor="middle" fill="#f1f5f9" font-size="19" font-weight="600">Extract</text>
  <text x="926" y="394.2" text-anchor="middle" fill="#7d8ea6" font-size="14">only what changed since the cursor</text>
  <rect x="720" y="440" width="412" height="84" rx="12" fill="#0b1220" stroke="#155e75" stroke-width="1.5"/>
  <text x="926" y="477.2" text-anchor="middle" fill="#f1f5f9" font-size="19" font-weight="600">Load</text>
  <text x="926" y="502.2" text-anchor="middle" fill="#7d8ea6" font-size="14">new tables and columns are added, never dropped</text>
  <line x1="926" y1="308" x2="926" y2="328" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="926" y1="416" x2="926" y2="436" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Cursor: the one idea -->
  <rect x="696" y="612" width="460" height="64" rx="12" fill="#171208" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="926" y="640" text-anchor="middle" fill="#fbbf24" font-size="17" font-weight="700">Cursor, saved per workspace</text>
  <text x="926" y="662" text-anchor="middle" fill="#fcd34d" font-size="14">the next run, or a retry, resumes here</text>
  <line x1="1040" y1="524" x2="1040" y2="608" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="1052" y="572" text-anchor="start" fill="#fbbf24" font-size="13">advance</text>
  <path d="M 696 644 C 664 644, 664 374, 716 374" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="684" y="664" text-anchor="end" fill="#fbbf24" font-size="13">resume</text>

  <!-- Destination -->
  <rect x="1212" y="112" width="284" height="480" rx="20" fill="url(#greenFill)" stroke="#10b981" stroke-width="2"/>
  <text x="1354" y="168" text-anchor="middle" fill="#6ee7b7" font-size="27" font-weight="700">Destination</text>
  <text x="1354" y="200" text-anchor="middle" fill="#a7f3d0" font-size="17">Your warehouse</text>
  <rect x="1236" y="224" width="236" height="296" rx="12" fill="#0b1220" stroke="#134e3a" stroke-width="1.5"/>
  <text x="1354" y="346.5" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="600">Airhouse</text>
  <text x="1354" y="371.5" text-anchor="middle" fill="#7d8ea6" font-size="14">the usual choice;</text>
  <text x="1354" y="392.5" text-anchor="middle" fill="#7d8ea6" font-size="14">credentials are minted</text>
  <text x="1354" y="413.5" text-anchor="middle" fill="#7d8ea6" font-size="14">for each run</text>
  <rect x="1236" y="536" width="236" height="32" rx="12" fill="#0b1220" stroke="#134e3a" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="1354" y="556.5" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="600">or Postgres</text>

  <!-- Flows -->
  <line x1="284" y1="386" x2="336" y2="386" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="310" y="372" text-anchor="middle" fill="#cbd5e1" font-size="13">connect</text>
  <line x1="640" y1="266" x2="692" y2="266" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="666" y="252" text-anchor="middle" fill="#cbd5e1" font-size="13">submit</text>
  <line x1="1132" y1="482" x2="1232" y2="482" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1184" y="468" text-anchor="middle" fill="#cbd5e1" font-size="13">commit</text>

</svg>
