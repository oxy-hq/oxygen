<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 510' width='100%' role='img'><title>How to read the report's summary card</title><rect x='20' y='20' width='470' height='470' rx='8' fill='none' fill-opacity='1' stroke='#8792a2' stroke-opacity='0.6'/><rect x='40' y='40' width='120.19999999999999' height='20' rx='10' fill='#7b8494' fill-opacity='0.15'/><text x='100.1' y='54' font-size='11' fill='#7b8494' font-weight='600' text-anchor='middle' font-family='Inter, system-ui, sans-serif'>Registered result</text><rect x='168.2' y='40' width='107.0' height='20' rx='10' fill='#0d9488' fill-opacity='0.15'/><text x='221.7' y='54' font-size='11' fill='#0d9488' font-weight='600' text-anchor='middle' font-family='Inter, system-ui, sans-serif'>Strong evidence</text><rect x='283.2' y='40' width='107.0' height='20' rx='10' fill='#0d9488' fill-opacity='0.15'/><text x='336.7' y='54' font-size='11' fill='#0d9488' font-weight='600' text-anchor='middle' font-family='Inter, system-ui, sans-serif'>Compliance 100%</text><rect x='40' y='66' width='166.39999999999998' height='20' rx='10' fill='#7b8494' fill-opacity='0.15'/><text x='123.19999999999999' y='80' font-size='11' fill='#7b8494' font-weight='600' text-anchor='middle' font-family='Inter, system-ui, sans-serif'>Pre-trend: no divergence</text><text x='40' y='118' font-size='12' fill='#7b8494' font-weight='400' text-anchor='start' font-family='Inter, system-ui, sans-serif'>Gross effect</text><text x='40' y='156' font-size='36' fill='#0d9488' font-weight='700' text-anchor='start' font-family='Inter, system-ui, sans-serif'>+12.30</text><text x='190' y='156' font-size='12' fill='#7b8494' font-weight='400' text-anchor='start' font-family='Inter, system-ui, sans-serif'>per unit-day  (95% range 1.8 to 23.3)</text><text x='40' y='182' font-size='11' fill='#7b8494' font-weight='400' text-anchor='start' font-family='Inter, system-ui, sans-serif'>gross +12.30 per unit-day on order_value; substitution not</text><text x='40' y='198' font-size='11' fill='#7b8494' font-weight='400' text-anchor='start' font-family='Inter, system-ui, sans-serif'>excluded above … on full_price_value</text><rect x='40' y='216' width='104' height='58' rx='6' fill='none' fill-opacity='1' stroke='#8792a2' stroke-opacity='0.6'/><text x='48' y='236' font-size='10' fill='#7b8494' font-weight='400' text-anchor='start' font-family='Inter, system-ui, sans-serif'>Confidence</text><text x='48' y='258' font-size='11' fill='#0d9488' font-weight='600' text-anchor='start' font-family='Inter, system-ui, sans-serif'>Passes the 95% bar</text><rect x='152' y='216' width='104' height='58' rx='6' fill='none' fill-opacity='1' stroke='#8792a2' stroke-opacity='0.6'/><text x='160' y='236' font-size='10' fill='#7b8494' font-weight='400' text-anchor='start' font-family='Inter, system-ui, sans-serif'>Treated units</text><text x='160' y='258' font-size='11' fill='#0d9488' font-weight='600' text-anchor='start' font-family='Inter, system-ui, sans-serif'>16</text><rect x='264' y='216' width='104' height='58' rx='6' fill='none' fill-opacity='1' stroke='#8792a2' stroke-opacity='0.6'/><text x='272' y='236' font-size='10' fill='#7b8494' font-weight='400' text-anchor='start' font-family='Inter, system-ui, sans-serif'>Measured window</text><text x='272' y='258' font-size='11' fill='#0d9488' font-weight='600' text-anchor='start' font-family='Inter, system-ui, sans-serif'>28 days</text><rect x='376' y='216' width='104' height='58' rx='6' fill='none' fill-opacity='1' stroke='#8792a2' stroke-opacity='0.6'/><text x='384' y='236' font-size='10' fill='#7b8494' font-weight='400' text-anchor='start' font-family='Inter, system-ui, sans-serif'>Total over treated</text><text x='384' y='258' font-size='11' fill='#0d9488' font-weight='600' text-anchor='start' font-family='Inter, system-ui, sans-serif'>≈ $5,500</text><rect x='40' y='288' width='430' height='64' rx='6' fill='none' fill-opacity='1' stroke='#ea8a2e' stroke-opacity='0.6' stroke-dasharray='4 3'/><text x='52' y='308' font-size='11' fill='#7b8494' font-weight='600' text-anchor='start' font-family='Inter, system-ui, sans-serif'>Projection to untreated units   [Assumption]</text><text x='52' y='328' font-size='11' fill='#7b8494' font-weight='400' text-anchor='start' font-family='Inter, system-ui, sans-serif'>If the treated units&#x27; effect held at the 24 others…</text><rect x='40' y='364' width='430' height='40' rx='6' fill='none' fill-opacity='1' stroke='#8792a2' stroke-opacity='0.6'/><text x='52' y='389' font-size='11' fill='#7b8494' font-weight='400' text-anchor='start' font-family='Inter, system-ui, sans-serif'>Day by day, across the whole run  ▸ chart and table</text><rect x='40' y='414' width='430' height='30' rx='6' fill='none' fill-opacity='1' stroke='#8792a2' stroke-opacity='0.6'/><text x='52' y='434' font-size='11' fill='#7b8494' font-weight='400' text-anchor='start' font-family='Inter, system-ui, sans-serif'>Predicted against measured · Proposed slope</text><rect x='40' y='452' width='430' height='30' rx='6' fill='none' fill-opacity='1' stroke='#8792a2' stroke-opacity='0.6'/><text x='52' y='472' font-size='11' fill='#7b8494' font-weight='400' text-anchor='start' font-family='Inter, system-ui, sans-serif'>Details · 8 checks · All clear</text><circle cx='505' cy='50' r='11' fill='#ea8a2e'/><text x='505' y='54' font-size='12' fill='#ffffff' font-weight='700' text-anchor='middle' font-family='Inter, system-ui, sans-serif'>1</text><text x='524' y='47' font-size='11' fill='#7b8494' font-weight='400' text-anchor='start' font-family='Inter, system-ui, sans-serif'>Badges: is it a registered result, </text><text x='524' y='61' font-size='11' fill='#7b8494' font-weight='400' text-anchor='start' font-family='Inter, system-ui, sans-serif'>how strong is the evidence, did </text><text x='524' y='75' font-size='11' fill='#7b8494' font-weight='400' text-anchor='start' font-family='Inter, system-ui, sans-serif'>the change land, any warnings. </text><circle cx='505' cy='140' r='11' fill='#ea8a2e'/><text x='505' y='144' font-size='12' fill='#ffffff' font-weight='700' text-anchor='middle' font-family='Inter, system-ui, sans-serif'>2</text><text x='524' y='137' font-size='11' fill='#7b8494' font-weight='400' text-anchor='start' font-family='Inter, system-ui, sans-serif'>The headline: average change per </text><text x='524' y='151' font-size='11' fill='#7b8494' font-weight='400' text-anchor='start' font-family='Inter, system-ui, sans-serif'>unit per day, and the range the </text><text x='524' y='165' font-size='11' fill='#7b8494' font-weight='400' text-anchor='start' font-family='Inter, system-ui, sans-serif'>data cannot rule out. </text><circle cx='505' cy='245' r='11' fill='#ea8a2e'/><text x='505' y='249' font-size='12' fill='#ffffff' font-weight='700' text-anchor='middle' font-family='Inter, system-ui, sans-serif'>3</text><text x='524' y='242' font-size='11' fill='#7b8494' font-weight='400' text-anchor='start' font-family='Inter, system-ui, sans-serif'>The totals: exact arithmetic over </text><text x='524' y='256' font-size='11' fill='#7b8494' font-weight='400' text-anchor='start' font-family='Inter, system-ui, sans-serif'>the treated units, and the </text><text x='524' y='270' font-size='11' fill='#7b8494' font-weight='400' text-anchor='start' font-family='Inter, system-ui, sans-serif'>confidence bar. </text><circle cx='505' cy='320' r='11' fill='#ea8a2e'/><text x='505' y='324' font-size='12' fill='#ffffff' font-weight='700' text-anchor='middle' font-family='Inter, system-ui, sans-serif'>4</text><text x='524' y='317' font-size='11' fill='#7b8494' font-weight='400' text-anchor='start' font-family='Inter, system-ui, sans-serif'>The projection to units that were </text><text x='524' y='331' font-size='11' fill='#7b8494' font-weight='400' text-anchor='start' font-family='Inter, system-ui, sans-serif'>not treated. Always labelled an </text><text x='524' y='345' font-size='11' fill='#7b8494' font-weight='400' text-anchor='start' font-family='Inter, system-ui, sans-serif'>assumption. </text><circle cx='505' cy='384' r='11' fill='#ea8a2e'/><text x='505' y='388' font-size='12' fill='#ffffff' font-weight='700' text-anchor='middle' font-family='Inter, system-ui, sans-serif'>5</text><text x='524' y='381' font-size='11' fill='#7b8494' font-weight='400' text-anchor='start' font-family='Inter, system-ui, sans-serif'>The chart. The two groups should </text><text x='524' y='395' font-size='11' fill='#7b8494' font-weight='400' text-anchor='start' font-family='Inter, system-ui, sans-serif'>move together before the switch. </text><circle cx='505' cy='429' r='11' fill='#ea8a2e'/><text x='505' y='433' font-size='12' fill='#ffffff' font-weight='700' text-anchor='middle' font-family='Inter, system-ui, sans-serif'>6</text><text x='524' y='426' font-size='11' fill='#7b8494' font-weight='400' text-anchor='start' font-family='Inter, system-ui, sans-serif'>What it teaches the World Model, </text><text x='524' y='440' font-size='11' fill='#7b8494' font-weight='400' text-anchor='start' font-family='Inter, system-ui, sans-serif'>and the slope it can propose. </text><circle cx='505' cy='467' r='11' fill='#ea8a2e'/><text x='505' y='471' font-size='12' fill='#ffffff' font-weight='700' text-anchor='middle' font-family='Inter, system-ui, sans-serif'>7</text><text x='524' y='464' font-size='11' fill='#7b8494' font-weight='400' text-anchor='start' font-family='Inter, system-ui, sans-serif'>The checks: cannibalisation, </text><text x='524' y='478' font-size='11' fill='#7b8494' font-weight='400' text-anchor='start' font-family='Inter, system-ui, sans-serif'>promised size, compliance, </text><text x='524' y='492' font-size='11' fill='#7b8494' font-weight='400' text-anchor='start' font-family='Inter, system-ui, sans-serif'>pre-trend, randomisation. </text></svg>