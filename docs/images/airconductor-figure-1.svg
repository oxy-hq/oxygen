<svg viewBox="0 0 1560 720" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <linearGradient id="greenFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d3b2e"/>
      <stop offset="1" stop-color="#0a2c23"/>
    </linearGradient>
    <linearGradient id="indigoFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26246b"/>
      <stop offset="1" stop-color="#1c1a4e"/>
    </linearGradient>
    <linearGradient id="tealFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#083344"/>
      <stop offset="1" stop-color="#06262f"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="1520" height="680" rx="28" fill="#0b0f1a" stroke="#2b3446" stroke-width="2"/>
  <text x="780" y="78" text-anchor="middle" fill="#e5e7eb" font-size="34" font-weight="700">Airconductor</text>

  <!-- Triggers -->
  <rect x="64" y="112" width="220" height="480" rx="20" fill="#0f1524" stroke="#475569" stroke-width="2"/>
  <text x="174" y="168" text-anchor="middle" fill="#e2e8f0" font-size="27" font-weight="700">Triggers</text>
  <text x="174" y="200" text-anchor="middle" fill="#cbd5e1" font-size="17">What starts work</text>
  <rect x="88" y="224" width="172" height="62" rx="10" fill="#0b1220" stroke="#2b3446" stroke-width="1.5"/>
  <text x="174" y="261" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">Run now</text>
  <rect x="88" y="302" width="172" height="62" rx="10" fill="#0b1220" stroke="#2b3446" stroke-width="1.5"/>
  <text x="174" y="339" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">Automation step</text>
  <rect x="88" y="380" width="172" height="188" rx="10" fill="#0b1220" stroke="#2b3446" stroke-width="1.5"/>
  <text x="174" y="428" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="600">Scheduler</text>
  <text x="174" y="456" text-anchor="middle" fill="#7d8ea6" font-size="13">schedules, monitor</text>
  <text x="174" y="475" text-anchor="middle" fill="#7d8ea6" font-size="13">scans, pre-aggregation</text>
  <text x="174" y="510" text-anchor="middle" fill="#7d8ea6" font-size="13">each due time</text>
  <text x="174" y="529" text-anchor="middle" fill="#7d8ea6" font-size="13">fires once</text>

  <!-- Queue -->
  <rect x="340" y="112" width="300" height="480" rx="20" fill="url(#indigoFill)" stroke="#6366f1" stroke-width="2"/>
  <text x="490" y="168" text-anchor="middle" fill="#a5b4fc" font-size="27" font-weight="700">Queue</text>
  <text x="490" y="200" text-anchor="middle" fill="#c7d2fe" font-size="17">In Oxygen's Postgres</text>
  <rect x="364" y="224" width="252" height="130" rx="12" fill="#0b1220" stroke="#3f3c8f" stroke-width="1.5"/>
  <text x="490" y="273.7" text-anchor="middle" fill="#f1f5f9" font-size="19" font-weight="600">Recorded first</text>
  <text x="490" y="298.7" text-anchor="middle" fill="#7d8ea6" font-size="14">every task is a row</text>
  <text x="490" y="319.7" text-anchor="middle" fill="#7d8ea6" font-size="14">before anything runs it</text>
  <rect x="364" y="370" width="252" height="198" rx="12" fill="#0b1220" stroke="#3f3c8f" stroke-width="1.5"/>
  <text x="490" y="440" text-anchor="middle" fill="#f1f5f9" font-size="18" font-weight="600">Wake</text>
  <text x="490" y="465" text-anchor="middle" fill="#7d8ea6" font-size="14">a notification wakes an</text>
  <text x="490" y="486" text-anchor="middle" fill="#7d8ea6" font-size="14">idle worker in milliseconds;</text>
  <text x="490" y="507" text-anchor="middle" fill="#7d8ea6" font-size="14">a 10-second poll catches</text>
  <text x="490" y="528" text-anchor="middle" fill="#7d8ea6" font-size="14">anything missed</text>

  <!-- Workers -->
  <rect x="696" y="112" width="460" height="480" rx="20" fill="url(#tealFill)" stroke="#06b6d4" stroke-width="2"/>
  <text x="926" y="168" text-anchor="middle" fill="#67e8f9" font-size="27" font-weight="700">Workers</text>
  <text x="926" y="200" text-anchor="middle" fill="#a5f3fc" font-size="17">Claim, run, record</text>
  <rect x="720" y="224" width="198" height="84" rx="12" fill="#0b1220" stroke="#155e75" stroke-width="1.5"/>
  <text x="819" y="259" text-anchor="middle" fill="#f1f5f9" font-size="17" font-weight="600">Inside oxy serve</text>
  <text x="819" y="284" text-anchor="middle" fill="#7d8ea6" font-size="14">the default</text>
  <rect x="934" y="224" width="198" height="84" rx="12" fill="#0b1220" stroke="#155e75" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="1033" y="259" text-anchor="middle" fill="#f1f5f9" font-size="17" font-weight="600">oxy worker fleet</text>
  <text x="1033" y="284" text-anchor="middle" fill="#7d8ea6" font-size="14">to scale out</text>
  <rect x="720" y="332" width="412" height="84" rx="12" fill="#0b1220" stroke="#155e75" stroke-width="1.5"/>
  <text x="926" y="369.2" text-anchor="middle" fill="#f1f5f9" font-size="19" font-weight="600">Run</text>
  <text x="926" y="394.2" text-anchor="middle" fill="#7d8ea6" font-size="14">a heartbeat every 15 seconds while it works</text>
  <rect x="720" y="440" width="412" height="84" rx="12" fill="#0b1220" stroke="#155e75" stroke-width="1.5"/>
  <text x="926" y="477.2" text-anchor="middle" fill="#f1f5f9" font-size="19" font-weight="600">Record</text>
  <text x="926" y="502.2" text-anchor="middle" fill="#7d8ea6" font-size="14">each finished step is saved with the run</text>
  <line x1="926" y1="308" x2="926" y2="328" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="926" y1="416" x2="926" y2="436" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Recovery: the one idea -->
  <rect x="696" y="612" width="460" height="64" rx="12" fill="#171208" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="926" y="640" text-anchor="middle" fill="#fbbf24" font-size="17" font-weight="700">Recovery, in about 90 seconds</text>
  <text x="926" y="662" text-anchor="middle" fill="#fcd34d" font-size="14">a stopped worker's task returns to the queue</text>
  <line x1="1040" y1="524" x2="1040" y2="608" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="1052" y="572" text-anchor="start" fill="#fbbf24" font-size="13">heartbeat stops</text>
  <path d="M 696 644 C 600 644, 490 644, 490 598" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="608" y="632" text-anchor="middle" fill="#fbbf24" font-size="13">requeue</text>

  <!-- Work -->
  <rect x="1212" y="112" width="284" height="480" rx="20" fill="url(#greenFill)" stroke="#10b981" stroke-width="2"/>
  <text x="1354" y="168" text-anchor="middle" fill="#6ee7b7" font-size="27" font-weight="700">Work</text>
  <text x="1354" y="200" text-anchor="middle" fill="#a7f3d0" font-size="17">What runs here</text>
  <rect x="1236" y="224" width="236" height="62" rx="10" fill="#0b1220" stroke="#134e3a" stroke-width="1.5"/>
  <text x="1354" y="261" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="600">Airway loads</text>
  <rect x="1236" y="302" width="236" height="62" rx="10" fill="#0b1220" stroke="#134e3a" stroke-width="1.5"/>
  <text x="1354" y="339" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="600">Automation steps</text>
  <rect x="1236" y="380" width="236" height="62" rx="10" fill="#0b1220" stroke="#134e3a" stroke-width="1.5"/>
  <text x="1354" y="417" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="600">Scheduled agents</text>
  <rect x="1236" y="458" width="236" height="62" rx="10" fill="#0b1220" stroke="#134e3a" stroke-width="1.5"/>
  <text x="1354" y="495" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="600">Pre-aggregation refreshes</text>

  <!-- Flows -->
  <line x1="284" y1="386" x2="336" y2="386" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="310" y="372" text-anchor="middle" fill="#cbd5e1" font-size="13">enqueue</text>
  <line x1="640" y1="266" x2="692" y2="266" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="666" y="252" text-anchor="middle" fill="#cbd5e1" font-size="13">claim</text>
  <line x1="1132" y1="374" x2="1232" y2="374" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1184" y="360" text-anchor="middle" fill="#cbd5e1" font-size="13">run</text>

</svg>
