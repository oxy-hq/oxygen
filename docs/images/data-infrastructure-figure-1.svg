<svg viewBox="0 0 1560 720" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <linearGradient id="greenFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d3b2e"/>
      <stop offset="1" stop-color="#0a2c23"/>
    </linearGradient>
    <linearGradient id="indigoFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26246b"/>
      <stop offset="1" stop-color="#1c1a4e"/>
    </linearGradient>
    <linearGradient id="tealFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#083344"/>
      <stop offset="1" stop-color="#06262f"/>
    </linearGradient>
    <linearGradient id="purpleFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e1065"/>
      <stop offset="1" stop-color="#220c4d"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="1520" height="680" rx="28" fill="#0b0f1a" stroke="#2b3446" stroke-width="2"/>
  <text x="780" y="78" text-anchor="middle" fill="#e5e7eb" font-size="34" font-weight="700">Data Infrastructure</text>

  <!-- Sources -->
  <rect x="64" y="112" width="230" height="480" rx="20" fill="#0f1524" stroke="#475569" stroke-width="2"/>
  <text x="179" y="168" text-anchor="middle" fill="#e2e8f0" font-size="27" font-weight="700">Sources</text>
  <text x="179" y="200" text-anchor="middle" fill="#cbd5e1" font-size="17">Your systems</text>
  <rect x="88" y="224" width="182" height="52" rx="10" fill="#0b1220" stroke="#2b3446" stroke-width="1.5"/>
  <text x="179" y="255" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">POS &amp; commerce</text>
  <rect x="88" y="292" width="182" height="52" rx="10" fill="#0b1220" stroke="#2b3446" stroke-width="1.5"/>
  <text x="179" y="323" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">Accounting &amp; ERP</text>
  <rect x="88" y="360" width="182" height="52" rx="10" fill="#0b1220" stroke="#2b3446" stroke-width="1.5"/>
  <text x="179" y="391" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">Databases</text>
  <rect x="88" y="428" width="182" height="52" rx="10" fill="#0b1220" stroke="#2b3446" stroke-width="1.5"/>
  <text x="179" y="459" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">Files &amp; spreadsheets</text>
  <rect x="88" y="496" width="182" height="52" rx="10" fill="#0b1220" stroke="#2b3446" stroke-width="1.5"/>
  <text x="179" y="527" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">Public data &amp; APIs</text>

  <!-- Airway -->
  <rect x="350" y="112" width="270" height="480" rx="20" fill="url(#tealFill)" stroke="#06b6d4" stroke-width="2"/>
  <text x="485" y="168" text-anchor="middle" fill="#67e8f9" font-size="27" font-weight="700">Airway</text>
  <text x="485" y="200" text-anchor="middle" fill="#a5f3fc" font-size="17">1 · Load</text>
  <rect x="374" y="224" width="222" height="150" rx="12" fill="#0b1220" stroke="#155e75" stroke-width="1.5"/>
  <text x="485" y="283.7" text-anchor="middle" fill="#f1f5f9" font-size="19" font-weight="600">Pipelines</text>
  <text x="485" y="308.7" text-anchor="middle" fill="#7d8ea6" font-size="14">one .airway.yml file</text>
  <text x="485" y="329.7" text-anchor="middle" fill="#7d8ea6" font-size="14">per source</text>
  <rect x="374" y="398" width="222" height="150" rx="12" fill="#0b1220" stroke="#155e75" stroke-width="1.5"/>
  <text x="485" y="457.7" text-anchor="middle" fill="#f1f5f9" font-size="19" font-weight="600">Incremental runs</text>
  <text x="485" y="482.7" text-anchor="middle" fill="#7d8ea6" font-size="14">each run, and any retry,</text>
  <text x="485" y="503.7" text-anchor="middle" fill="#7d8ea6" font-size="14">resumes from a cursor</text>

  <!-- Warehouse, shaped by Airform -->
  <rect x="676" y="112" width="420" height="480" rx="20" fill="url(#greenFill)" stroke="#10b981" stroke-width="2"/>
  <text x="886" y="168" text-anchor="middle" fill="#6ee7b7" font-size="27" font-weight="700">Warehouse</text>
  <text x="886" y="200" text-anchor="middle" fill="#a7f3d0" font-size="17">Airhouse, or your own</text>
  <rect x="700" y="224" width="372" height="84" rx="12" fill="#0b1220" stroke="#134e3a" stroke-width="1.5"/>
  <text x="886" y="261.2" text-anchor="middle" fill="#f1f5f9" font-size="19" font-weight="600">Raw tables</text>
  <text x="886" y="286.2" text-anchor="middle" fill="#7d8ea6" font-size="14">as the source shaped them</text>
  <rect x="700" y="344" width="372" height="112" rx="12" fill="url(#purpleFill)" stroke="#a855f7" stroke-width="1.5"/>
  <text x="886" y="380" text-anchor="middle" fill="#d8b4fe" font-size="21" font-weight="700">Airform</text>
  <text x="886" y="404" text-anchor="middle" fill="#e9d5ff" font-size="14">2 · Shape</text>
  <text x="886" y="432" text-anchor="middle" fill="#c4b5fd" font-size="14">version-controlled SQL models</text>
  <rect x="700" y="492" width="372" height="76" rx="12" fill="#0b1220" stroke="#134e3a" stroke-width="1.5"/>
  <text x="886" y="535.7" text-anchor="middle" fill="#f1f5f9" font-size="19" font-weight="600">Clean, tested tables</text>
  <line x1="886" y1="308" x2="886" y2="340" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="886" y1="456" x2="886" y2="488" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- World Model -->
  <rect x="1152" y="112" width="344" height="480" rx="20" fill="url(#indigoFill)" stroke="#6366f1" stroke-width="2"/>
  <text x="1324" y="168" text-anchor="middle" fill="#a5b4fc" font-size="27" font-weight="700">World Model</text>
  <text x="1324" y="200" text-anchor="middle" fill="#c7d2fe" font-size="17">3 · Model</text>
  <rect x="1176" y="224" width="296" height="150" rx="12" fill="#0b1220" stroke="#3f3c8f" stroke-width="1.5"/>
  <text x="1324" y="283.7" text-anchor="middle" fill="#f1f5f9" font-size="19" font-weight="600">Semantic model</text>
  <text x="1324" y="308.7" text-anchor="middle" fill="#7d8ea6" font-size="14">measures defined once,</text>
  <text x="1324" y="329.7" text-anchor="middle" fill="#7d8ea6" font-size="14">compiled to correct SQL</text>
  <rect x="1176" y="398" width="296" height="150" rx="12" fill="#0b1220" stroke="#3f3c8f" stroke-width="1.5"/>
  <text x="1324" y="457.7" text-anchor="middle" fill="#f1f5f9" font-size="19" font-weight="600">Agents &amp; custom apps</text>
  <text x="1324" y="482.7" text-anchor="middle" fill="#7d8ea6" font-size="14">answer and act on the same</text>
  <text x="1324" y="503.7" text-anchor="middle" fill="#7d8ea6" font-size="14">numbers; apps write facts back</text>

  <!-- Flow -->
  <line x1="294" y1="386" x2="346" y2="386" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="320" y="372" text-anchor="middle" fill="#cbd5e1" font-size="13">extract</text>
  <line x1="620" y1="266" x2="672" y2="266" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="646" y="252" text-anchor="middle" fill="#cbd5e1" font-size="13">load</text>
  <line x1="1072" y1="530" x2="1148" y2="530" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 1176 440 C 1124 440, 1128 290, 1076 290" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="1124" y="372" text-anchor="middle" fill="#cbd5e1" font-size="13">app</text>
  <text x="1124" y="388" text-anchor="middle" fill="#cbd5e1" font-size="13">facts</text>
  <text x="1110" y="516" text-anchor="middle" fill="#cbd5e1" font-size="13">query</text>

  <!-- The one idea: a single version-controlled workspace -->
  <rect x="350" y="612" width="1146" height="64" rx="12" fill="#171208" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="923" y="650" text-anchor="middle" fill="#fbbf24" font-size="16" font-weight="600">One workspace: every pipeline, model, and metric is a version-controlled file, deployed through Git</text>

</svg>
