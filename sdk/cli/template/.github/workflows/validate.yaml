# Validate __NAME__'s semantic model on every pull request.
#
# `oxyc compile` is the gate. It asks the oxy deployment that serves this
# workspace to compile the branch — the commit GitHub has for it, as the
# workspace's registered subdirectory — into a STAGING revision, waits for the
# answer, and fails the job when any file recorded a failure. A staging
# revision is never promoted and nothing a customer sees reads it, so this
# changes nothing anyone is served.
#
# It replaced a job that installed the Rust `oxy`, booted a throwaway Postgres,
# ran `oxy migrate`, INSERTed a `workspaces` row with psql and ran
# `oxy compile --json` over the checkout. That compiled what was on the runner,
# with whatever compiler the pin named; this compiles what the deployment will
# compile, with its compiler, and needs no database, no checkout and no
# installer script.
#
# What this gate catches and what it does not: see "What CI checks" in README.md.

name: validate

on:
  pull_request:
  # Also on a push to the default branch, and the reason is not belt-and-braces.
  # With `pull_request` alone this gate never ran at all on the workflow this
  # template actually ships with: a scaffolded repo starts unprotected, work
  # goes straight to main, and the compile check sat there being triggered by
  # nothing. It stays useful once PRs are required too — a merge is a push, and
  # a branch protected today can be unprotected tomorrow.
  #
  # Deliberately no `paths:` filter. A compile reads the whole workspace, and a
  # filter that missed a path would skip validation silently, which is worse
  # than compiling on a README change.
  push:
    branches: [main]

# This gate never writes to the repository, so it does not need a token that
# can. Stated explicitly because the DEFAULT is whatever the repo or org is set
# to, which for many repos is read/write on every scope.
permissions:
  contents: read

env:
  # The `@oxy-hq/cli` (`oxyc`) this job installs, exactly. `oxyc compile`
  # exists from 0.13.0; an older pin has no such command.
  OXYC_VERSION: "0.13.0"

  # WHERE THE OXY WORKSPACE IS, relative to the repo root.
  #
  #   .     the repo IS the workspace — every repo `oxyc new` scaffolds
  #   oxy   the repo CONTAINS one — the shape of every repo that was imported
  #
  # Substituted at render time from `__WORKSPACE__`. The deployment already
  # knows the subdirectory it registered and compiles that; this is only used
  # to anchor a failure annotation (a workspace-relative path) on the right
  # file of the repo.
  OXY_WORKSPACE: "__WORKSPACE__"

jobs:
  compile:
    name: oxyc compile
    runs-on: ubuntu-latest

    # `id-token: write` lets this job ask GitHub for a signed statement of what
    # it is — this repository, this workflow file, this environment — which
    # oxyc trades for a fifteen-minute token acting as the org's service
    # account. No secret is stored anywhere.
    permissions:
      contents: read
      id-token: write

    # The environment the trust policy names. Trust policies must name one
    # unless the org's token policy says otherwise, because without it anyone
    # who can push a branch can mint. Create the trust policy for
    # `.github/workflows/validate.yaml` with environment `validate` (see
    # "What CI checks" in README.md).
    environment: validate

    env:
      # The ID of the oxy workspace this repo is registered as — the one a
      # branch is compiled for. Repository variable; from the workspace's
      # settings page in Oxygen. Unset: the job says so and passes (the day-one
      # state of a scaffold, before the repo is registered).
      OXY_WORKSPACE_ID: ${{ vars.OXY_WORKSPACE_ID }}
      # The ID of the org service account the OIDC exchange acts as, from
      # Organization settings -> API access. Its trust policy needs a workspace
      # grant on OXY_WORKSPACE_ID; `viewer` is enough — a compile check needs
      # no editor standing, and the account gains nothing else from it.
      OXY_SERVICE_ACCOUNT: ${{ vars.OXY_SERVICE_ACCOUNT }}
      # The fallback, as in publish.yaml: a stored token wins when it is set,
      # and no OIDC token is requested. Leave it unset to use trusted access.
      OXY_TOKEN: ${{ secrets.OXY_TOKEN }}
      # Which deployment: `production` unless the repository variable says
      # otherwise. OXY_TARGET, when set, is an explicit base URL and overrides it.
      OXY_ENV: ${{ vars.OXY_ENV }}
      OXY_TARGET: ${{ vars.OXY_TARGET }}
      # The branch the deployment compiles. On a pull request that is the head
      # branch (`github.ref_name` would be `<n>/merge`, which GitHub's API does
      # not serve as a branch); on a push, the pushed branch.
      BRANCH: ${{ github.head_ref || github.ref_name }}
      # The commit this run is about, to say so when the branch has moved on.
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check this repo is set up for the gate
        id: setup
        run: |
          set -euo pipefail
          if [ -z "${OXY_WORKSPACE_ID:-}" ]; then
            echo "::notice::not checked: no OXY_WORKSPACE_ID repository variable, so there is no oxy workspace to compile this branch for. Set it (and OXY_SERVICE_ACCOUNT, with a trust policy) once the repo is registered — see 'What CI checks' in README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${OXY_TOKEN:-}" ] && [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            # A pull request from a fork gets no OIDC token, by GitHub's design:
            # a fork's code must not be able to act as this repo.
            echo "::notice::not checked: GitHub issued this run no OIDC token (a pull request from a fork gets none) and no OXY_TOKEN secret is set. The branch is checked when it reaches this repository."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${OXY_TOKEN:-}" ] && [ -z "${OXY_SERVICE_ACCOUNT:-}" ]; then
            echo "::error::OXY_WORKSPACE_ID is set but OXY_SERVICE_ACCOUNT is not: trusted access needs the ID of the service account to act as. Set the repository variable, or an OXY_TOKEN secret as the fallback." >&2
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Install the pinned oxyc CLI
        if: steps.setup.outputs.ready == 'true'
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/oxyc" --no-audit --no-fund "@oxy-hq/cli@$OXYC_VERSION"
          echo "$RUNNER_TEMP/oxyc/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Verify the oxyc CLI
        if: steps.setup.outputs.ready == 'true'
        run: |
          set -euo pipefail
          # A version other than the pin means PATH found a different oxyc first.
          have="$(oxyc --version)"
          if [ "$have" != "$OXYC_VERSION" ]; then
            echo "::error::oxyc $have is on PATH, not the pinned $OXYC_VERSION." >&2
            exit 1
          fi
          echo "oxyc $have (pin $OXYC_VERSION)"

      - name: Compile the branch
        if: steps.setup.outputs.ready == 'true'
        run: |
          set -euo pipefail
          # An unset secret arrives as an EMPTY variable; oxyc treats the two
          # alike, and unsetting it says which path this run takes.
          if [ -z "${OXY_TOKEN:-}" ]; then
            unset OXY_TOKEN
            echo "authenticating with this job's GitHub OIDC token as service account $OXY_SERVICE_ACCOUNT"
          else
            unset OXY_SERVICE_ACCOUNT
            echo "authenticating with the OXY_TOKEN secret (the fallback path)"
          fi
          where=(--env "${OXY_ENV:-production}")
          if [ -n "${OXY_TARGET:-}" ]; then where=(--target "$OXY_TARGET"); fi

          status=0
          oxyc compile "$BRANCH" --workspace "$OXY_WORKSPACE_ID" "${where[@]}" --wait --json \
            >"$RUNNER_TEMP/compile.json" || status=$?

          # `--json` prints the report whenever the compile ran to an answer,
          # failed or not. Empty means oxyc stopped before that — not signed
          # in, not allowed, no such branch — and said why on stderr above.
          if [ ! -s "$RUNNER_TEMP/compile.json" ]; then
            echo "::error::oxyc compile stopped before the compile answered (exit $status) — the lines above say why." >&2
            exit "$status"
          fi

          # The paths are workspace-relative; anchor each on the repo's file.
          # An empty `failures` array is the green case and jq exits 0 for it.
          prefix=""
          if [ "$OXY_WORKSPACE" != "." ]; then prefix="$OXY_WORKSPACE/"; fi
          jq -r --arg prefix "$prefix" \
            '.failures[] | "::error file=\($prefix)\(.path)::[\(.kind)] \(.message)"' \
            "$RUNNER_TEMP/compile.json"
          jq -r '"compile: status=\(.status) sha=\(.git_sha) seen=\(.file_count_seen // "?") compiled=\(.file_count_compiled // "?") failed=\(.file_count_failed // "?")"' \
            "$RUNNER_TEMP/compile.json"

          # The deployment compiles the branch as GitHub has it NOW, which can
          # be a later commit than the one this run was started for.
          sha="$(jq -r '.git_sha' "$RUNNER_TEMP/compile.json")"
          if [ "$sha" != "$EXPECTED_SHA" ]; then
            echo "::warning::compiled $BRANCH at $sha, not $EXPECTED_SHA: the branch moved on after this run started. The newer run checks the newer commit."
          fi

          exit "$status"
