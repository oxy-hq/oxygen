# The split fleet, reproduced locally.
#
# The point of this file is one line: `ide` mounts a state volume and the
# `serve` containers do not. Everything else — same image, same env, same
# Postgres row — is deliberately identical, because the bug class this exists to
# catch is "code asked whether it HAS a handle to the workspace, when it needed
# to ask whether the FILES are here", and the only thing that makes those two
# answers differ is whether the directory is on the machine.
#
# In production that difference is a PVC mounted on the ide pod and absent on
# the serve pods. Here it is a named volume. Nothing is stubbed: the workspace
# path lives in Postgres as an absolute path under OXY_STATE_DIR, the ide has
# it, the replicas do not, and every process runs the same binary.
#
#   docker compose -f docker-compose.fleet.yml up -d --build
#   curl localhost:3000/api/health          # a replica answers
#   docker compose -f docker-compose.fleet.yml logs serve | grep "owns no working copy"
#
# Two replicas, not one: a single replica cannot catch "it worked because the
# request happened to land on the instance holding the state".

name: oxy-fleet

x-oxy-common: &oxy-common
  image: oxy-fleet:local
  environment: &oxy-env
    OXY_DATABASE_URL: postgresql://admin:password@postgres:5432/oxy
    # Emails render to the browser instead of hitting SES. Both are required —
    # magic-link auth and custom-app ctx.email.send read different flags.
    MAGIC_LINK_LOCAL_TEST: "true"
    OXY_APP_EMAIL_LOCAL_TEST: "1"
    OXY_GLOBAL_ADMINS: e2e@oxy.tech
    OXY_OWNER: e2e@oxy.tech
    # The routing middleware under test (`enforce_role`, with its IdeOnly
    # self-proxy) wraps only the PUBLIC surface, so a harness that drives the
    # auth-disabled internal port bypasses the thing it came to check. Driving
    # the public port needs a real session, and dev sign-in is the one way in
    # that costs no OAuth round trip. Same address as OWNER/GLOBAL_ADMINS above,
    # so signing in lands an org owner rather than a second identity to seed.
    # TWO identities on purpose. `e2e@oxy.tech` is OXY_OWNER above, i.e. staff —
    # and staff reach is not standing: the SPA bounces a Global Owner off every
    # tenant workspace URL into /admin until they open an assume-role session.
    # So a browser flow signed in as staff never reaches the surface it came to
    # test; it lands on the admin console and times out waiting for a testid that
    # was never going to render. `member@oxy.tech` is an ordinary org owner that
    # `oxy seed` creates, with no platform standing, and it is what workspace-
    # scoped flows must sign in as. It is seeded as an owner of the Local org at
    # bootstrap time but is absent from OXY_OWNER/OXY_GLOBAL_ADMINS above, which
    # is exactly what "org owner without platform standing" means.
    # The first entry stays the default.
    OXY_DEV_LOGIN_EMAILS: e2e@oxy.tech,flow@oxy.local
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    RUST_LOG: ${RUST_LOG:-info}
    # ── The custom-app build store, and why this file needs one ─────────────
    # `custom_apps_build_store.rs:48-52` picks its backend at call time: S3 when
    # OXY_CUSTOMER_APPS_S3_BUCKET is set, otherwise the local filesystem under
    # OXY_STATE_DIR. Without the bucket, `oxy seed`'s app deploy writes the
    # bundle to whichever node ran it — the `ide`, the only node with a state
    # volume — and the replicas then answer `GET /customer-apps/local/
    # oxy-starter/` with a bare 404 while the ide answers 200. Measured on this
    # fixture before this bucket existed: :3000 404 serve@…, :3001 404 serve@…,
    # :3010 200 ide@… . That is a hole in the FIXTURE, not the split-fleet
    # contract it exists to test — a real deployment always has a bucket, and
    # `put_build` even refuses the filesystem backend outright once OXY_ROLE is
    # anything but `all` ("single-node only", same file). MinIO closes it, which
    # is what lets `customer-apps-oxy-starter-fleet` reach its assertions at all.
    # ── One encryption key for the whole fleet ──────────────────────────────
    # `secrets/encryption.rs:62-95` reads OXY_ENCRYPTION_KEY first and only
    # falls through to `$OXY_STATE_DIR/encryption_key.txt` — which it GENERATES
    # when absent. Each replica has its own empty state volume, so every node
    # minted a different key and a secret written through one was undecryptable
    # on the others. Measured on this fixture before this line existed:
    # `GET /secrets/{id}/value` -> serve-1 200, serve-2 500, ide 500, and the
    # three key files hashed 51c67be9 / ae2454ff / 4375aba1. Same shape as the
    # bucket above: a hole in the FIXTURE, since a real multi-pod deployment
    # shares this via config. Fixed value because the fixture is disposable and
    # nothing here is a real secret.
    OXY_ENCRYPTION_KEY: ZmxlZXQtZml4dHVyZS1rZXktbm90LWEtcmVhbC1zZWM=
    # ── The runtime-artifact mirror ─────────────────────────────────────────
    # `app/cache.rs:57-70`: a replica has no locally-written app-data cache, so
    # it reads through to the S3 mirror — and `blob_store.rs:78-83` returns
    # `None` when this var is unset, which makes both the mirror WRITE and the
    # read-through no-ops. Measured before this line: `GET /apps/{p}/data-cached`
    # -> ide 200 with 2323 bytes, both replicas 404 with 0. Without it the
    # harness asserts cross-node agreement on a route whose sharing mechanism is
    # switched off, so the assertion could only ever pass by accident.
    OXY_COMPILE_BLOB_S3_BUCKET: oxy-compile-blobs
    OXY_CUSTOMER_APPS_S3_BUCKET: oxy-customer-apps
    # Storage for the per-app private silo (`storage.read/write` capability).
    # Same bucket is fine — the two live under different key prefixes.
    OXY_CUSTOMER_APPS_STORAGE_S3_BUCKET: oxy-customer-apps
    # Path-style addressing kicks in from AWS_ENDPOINT_URL alone
    # (`s3_client()`, custom_apps_build_store.rs:163-174) — no extra flag.
    AWS_ENDPOINT_URL: http://minio:9000
    AWS_ACCESS_KEY_ID: minioadmin
    AWS_SECRET_ACCESS_KEY: minioadmin
    AWS_REGION: us-east-1
  depends_on:
    postgres:
      condition: service_healthy
    createbucket:
      condition: service_completed_successfully
  healthcheck:
    # bash's /dev/tcp, not curl: the runtime image ships neither curl nor wget,
    # so a curl healthcheck reports a perfectly healthy process as unhealthy and
    # compose then refuses to start anything that depends on it.
    # `CMD`, not `CMD-SHELL`: the latter runs /bin/sh, which is dash on Debian,
    # and /dev/tcp is a bash builtin. And bash rather than curl because the
    # runtime image ships neither curl nor wget — a curl probe reports a
    # perfectly healthy process as unhealthy, and compose then refuses to start
    # everything downstream of it.
    test:
      - CMD
      - bash
      - -c
      - "exec 3<>/dev/tcp/127.0.0.1/3000 && printf 'GET /api/health HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q 200"
    interval: 5s
    timeout: 3s
    retries: 40
    start_period: 30s

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: oxy
      PGDATA: /var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "admin", "-d", "oxy"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The shared object store every node reads custom-app bundles from. It is the
  # one piece of production shape this file was missing: two stateless replicas
  # can only serve an app whose bytes live somewhere neither of them owns.
  #
  # NO HOST PORT ON PURPOSE. The Airhouse dev stack (docker-compose.airhouse.yml)
  # publishes its own MinIO on :9000, and so does `oxy start --enterprise`'s
  # ClickHouse; binding either here makes this fleet refuse to start on any
  # machine already running one. Nothing outside the compose network needs to
  # reach this, so it publishes nothing at all and the clash cannot happen.
  minio:
    # Chainguard's build of MinIO (RELEASE.2026-09-22T19-25-18Z), pinned by
    # digest: upstream stopped publishing images, and its Docker Hub and
    # quay.io repositories are gone. It carries `mc` too, so the bucket job
    # below uses the same image.
    image: cgr.dev/chainguard/minio@sha256:4692462f35d97d7e82c30371d82f057703c5d9489bcae726010594c812f2d285
    # The upstream image ran as root and this one does not; root keeps a data
    # volume written by the old image readable.
    user: "0:0"
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 20

  # `--ignore-existing` is what makes bringing the fleet up twice a no-op rather
  # than an error, which is the same property scripts/seed-fixtures.sh needs.
  createbucket:
    image: cgr.dev/chainguard/minio@sha256:4692462f35d97d7e82c30371d82f057703c5d9489bcae726010594c812f2d285
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set fleet http://minio:9000 minioadmin minioadmin
        mc mb fleet/oxy-customer-apps --ignore-existing
        mc mb fleet/oxy-compile-blobs --ignore-existing

  # The single stateful node. Holds the working copy, serves every IdeOnly
  # route, and is what the replicas proxy to.
  ide:
    <<: *oxy-common
    build:
      context: .
      dockerfile: Dockerfile.fleet
      secrets: [gh_token]
      target: runtime
    environment:
      <<: *oxy-env
      OXY_ROLE: ide
    volumes:
      - ide-state:/var/lib/oxy/data        # ← HAS the workspace
    # Exposed only so the harness can drive setup against the node that owns the
    # files. Playwright still points at a replica; nothing under test talks here.
    ports:
      - "3010:3000"
      - "3011:3001"
    command: ["oxy", "serve", "--enterprise", "--port", "3000", "--host", "0.0.0.0", "--internal-host", "0.0.0.0"]

  # Stateless replicas. No volume: /var/lib/oxy/data is an empty anonymous
  # volume per container, so the absolute path Postgres reports for the
  # workspace does not exist here — exactly a serve pod without the PVC.
  serve:
    <<: *oxy-common
    environment:
      <<: *oxy-env
      OXY_ROLE: serve
      # The ide's PUBLIC port, which is what production points at
      # (`ide_proxy.rs`: "e.g. http://oxy-dev-oxy-app-ide:80"). The proxy KEEPS
      # `Cookie` and `Authorization` across the hop, so the caller's identity
      # survives and the ide authorizes the person who actually made the request.
      #
      # This used to point at :3001, the auth-DISABLED internal port, back when
      # the harness drove the replicas' internal ports too. That hop silently
      # replaces the caller with `internal@localhost` (`internal_auth_middleware`)
      # — so every proxied request ran as a principal the caller never had, and
      # any workspace that principal is not a member of answered 403.
      OXY_IDE_UPSTREAM: http://ide:3000
    depends_on:
      postgres:
        condition: service_healthy
      ide:
        condition: service_healthy
    # Both ports per replica. The browser flows drive the auth-disabled INTERNAL
    # port (3001) in cloud mode — see `runner/backend.ts` — so exposing only the
    # public one would leave the harness pointing at the ide by default, which
    # is the whole thing this file exists to avoid.
    ports:
      - "3000-3001:3000"                   # public,   one host port per replica
      - "3020-3021:3001"                   # internal, one host port per replica
    deploy:
      replicas: 2

volumes:
  ide-state:
  minio-data:

secrets:
  gh_token:
    environment: GH_TOKEN
